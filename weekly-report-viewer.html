  &lt;script&gt;
    (()=&gt;{
      const root=document.getElementById(&#x27;weekly-report-reader&#x27;);
      const pages=root.querySelector(&#x27;#rr-pages&#x27;);
      const reportData={
        &#x27;深圳分公司&#x27;:{group:&#x27;子公司&#x27;,reporter:&#x27;陈昊&#x27;,modules:[[&#x27;本周业务热点&#x27;,&#x27;1. 完成重点产业客户尽调及综合服务方案沟通；\n2. 推进区域重点项目储备，本周新增有效线索6项；\n3. 完成分公司经营数据复核及风险事项排查。&#x27;],[&#x27;业务赋能工具&#x27;,&#x27;1. 上线重点客户跟踪台账；\n2. 优化项目协同清单和到期提醒。&#x27;],[&#x27;下周重点工作&#x27;,&#x27;1. 推进重点项目立项；\n2. 完成客户走访及专项培训。&#x27;]]},
        &#x27;资产管理部&#x27;:{group:&#x27;总部业务部门&#x27;,reporter:&#x27;李明&#x27;,modules:[[&#x27;本周核心产出&#x27;,&#x27;1. 完成两只产品月度运作分析；\n2. 推进重点组合策略调整与风险复核；\n3. 完成机构客户沟通材料。&#x27;],[&#x27;政策宣导&#x27;,&#x27;1. 组织学习资管业务新规；\n2. 完成制度差异梳理。&#x27;],[&#x27;下周重点工作&#x27;,&#x27;1. 完成产品定期报告；\n2. 推进新增策略评审。&#x27;]]},
        &#x27;信息技术部&#x27;:{group:&#x27;总部支持服务部门&#x27;,reporter:&#x27;张晨&#x27;,modules:[[&#x27;本周核心产出&#x27;,&#x27;1. 完成统一数据平台一期功能验收；\n2. 完成移动办公门户新版发布。&#x27;],[&#x27;系统优化&#x27;,&#x27;1. 优化批量导入流程；\n2. 提升高频页面响应速度。&#x27;],[&#x27;下周重点工作&#x27;,&#x27;1. 推进试运行问题闭环；\n2. 开展分支机构用户培训。&#x27;]]}

      let queryReporter=&#x27;张晨&#x27;;

      const esc=value=&gt;String(value).replaceAll(&#x27;&amp;&#x27;,&#x27;&amp;amp;&#x27;).replaceAll(&#x27;&lt;&#x27;,&#x27;&amp;lt;&#x27;).replaceAll(&#x27;&gt;&#x27;,&#x27;&amp;gt;&#x27;).replaceAll(&#x27;&quot;&#x27;,&#x27;&amp;quot;&#x27;);
      const watermark=()=&gt;&#x27;&lt;div class=&quot;rr-watermarks&quot;&gt;&#x27;+Array.from({length:15},()=&gt;&#x27;&lt;span&gt;某某某&lt;/span&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;
      const frame=(content,page)=&gt;&#x27;&lt;section class=&quot;rr-doc-page&quot;&gt;&lt;div class=&quot;rr-page-header&quot;&gt;&lt;span class=&quot;rr-logo-text&quot;&gt;某某某某期货&lt;/span&gt;&lt;span class=&quot;rr-secret&quot;&gt;内部资料、请勿外传&lt;/span&gt;&lt;/div&gt;&#x27;+watermark()+&#x27;&lt;div class=&quot;rr-doc-content&quot;&gt;&#x27;+content+&#x27;&lt;/div&gt;&lt;div class=&quot;rr-page-footer&quot;&gt;— &#x27;+page+&#x27; —&lt;/div&gt;&lt;/section&gt;&#x27;;
      const modulesHtml=item=&gt;item.modules.map((module,index)=&gt;&#x27;&lt;section class=&quot;rr-module&quot;&gt;&lt;h3 class=&quot;rr-module-title&quot;&gt;&#x27;+cn(index)+&#x27;、&#x27;+esc(module[0])+&#x27;&lt;/h3&gt;&lt;p class=&quot;rr-body&quot;&gt;&#x27;+esc(module[1])+&#x27;&lt;/p&gt;&lt;/section&gt;&#x27;).join(&#x27;&#x27;);
      const likeHtml=(branch,count)=&gt;&#x27;&lt;div class=&quot;rr-like-row&quot;&gt;&lt;button class=&quot;rr-like&quot; type=&quot;button&quot; data-dept=&quot;&#x27;+esc(branch)+&#x27;&quot;&gt;♡ 点赞 &lt;span&gt;&#x27;+count+&#x27;&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&#x27;;
      const deptPage=(branch,page)=&gt;{const item=reportData[branch]||{group:root.querySelector(&#x27;#rr-group&#x27;).value,reporter:queryReporter,modules:reportData[&#x27;信息技术部&#x27;].modules};return frame(&#x27;&lt;div class=&quot;rr-group-heading&quot;&gt;&#x27;+(groupNumber[item.group]||&#x27;一&#x27;)+&#x27;、&#x27;+esc(item.group)+&#x27;&lt;/div&gt;&lt;h1 class=&quot;rr-dept-title&quot;&gt;&#x27;+esc(branch)+&#x27;7月第3周报告&lt;/h1&gt;&lt;div class=&quot;rr-report-meta&quot;&gt;&lt;div&gt;报告人：&#x27;+esc(item.reporter)+&#x27;&lt;/div&gt;&lt;div&gt;报告日期：2026年7月17日&lt;/div&gt;&lt;/div&gt;&#x27;+modulesHtml(item)+likeHtml(branch,8+page),page);};

          const cover=&#x27;&lt;h1 class=&quot;rr-cover-title&quot;&gt;2026年7月第3周周报&lt;/h1&gt;&lt;div class=&quot;rr-cover-period&quot;&gt;（7月13日—7月17日）&lt;/div&gt;&lt;div class=&quot;rr-issue&quot;&gt;【2026年第26期，总第355期】&lt;/div&gt;&lt;h2 class=&quot;rr-toc-title&quot;&gt;目录&lt;/h2&gt;&lt;div class=&quot;rr-toc&quot;&gt;&lt;div class=&quot;rr-toc-row&quot;&gt;&lt;span class=&quot;rr-toc-name&quot;&gt;一、子公司&lt;/span&gt;&lt;span class=&quot;rr-dots&quot;&gt;&lt;/span&gt;&lt;span&gt;2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rr-toc-row&quot;&gt;&lt;span class=&quot;rr-toc-name&quot;&gt;　深圳分公司7月第3周报告&lt;/span&gt;&lt;span class=&quot;rr-dots&quot;&gt;&lt;/span&gt;&lt;span&gt;2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rr-toc-row&quot;&gt;&lt;span class=&quot;rr-toc-name&quot;&gt;二、总部业务部门&lt;/span&gt;&lt;span class=&quot;rr-dots&quot;&gt;&lt;/span&gt;&lt;span&gt;3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rr-toc-row&quot;&gt;&lt;span class=&quot;rr-toc-name&quot;&gt;　资产管理部7月第3周报告&lt;/span&gt;&lt;span class=&quot;rr-dots&quot;&gt;&lt;/span&gt;&lt;span&gt;3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rr-toc-row&quot;&gt;&lt;span class=&quot;rr-toc-name&quot;&gt;三、总部支持服务部门&lt;/span&gt;&lt;span class=&quot;rr-dots&quot;&gt;&lt;/span&gt;&lt;span&gt;4&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rr-toc-row&quot;&gt;&lt;span class=&quot;rr-toc-name&quot;&gt;　信息技术部7月第3周报告&lt;/span&gt;&lt;span class=&quot;rr-dots&quot;&gt;&lt;/span&gt;&lt;span&gt;4&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
          pages.innerHTML=frame(cover,1)+deptPage(&#x27;深圳分公司&#x27;,2)+deptPage(&#x27;资产管理部&#x27;,3)+deptPage(&#x27;信息技术部&#x27;,4);
        }else{
          pages.innerHTML=deptPage(branch,1);
        }
        bindLikes();
      };
      const applyQuery=search=&gt;{const params=new URLSearchParams(search||&#x27;&#x27;);queryReporter=params.get(&#x27;reporter&#x27;)||&#x27;张晨&#x27;;[[&#x27;rr-year&#x27;,&#x27;year&#x27;],[&#x27;rr-month&#x27;,&#x27;month&#x27;],[&#x27;rr-week&#x27;,&#x27;week&#x27;],[&#x27;rr-group&#x27;,&#x27;group&#x27;],[&#x27;rr-branch&#x27;,&#x27;branch&#x27;]].forEach(pair=&gt;{const value=params.get(pair[1]);const field=root.querySelector(&#x27;#&#x27;+pair[0]);if(value&amp;&amp;[...field.options].some(option=&gt;option.value===value||option.textContent===value))field.value=value;});render();};
      window.addEventListener(&#x27;message&#x27;,event=&gt;{if(event.data&amp;&amp;event.data.type===&#x27;preview-query&#x27;)applyQuery(event.data.search);});
      root.querySelector(&#x27;#rr-query&#x27;).addEventListener(&#x27;click&#x27;,render);
      root.querySelector(&#x27;#rr-reset&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{root.querySelector(&#x27;#rr-year&#x27;).value=&#x27;2026&#x27;;root.querySelector(&#x27;#rr-month&#x27;).value=&#x27;7&#x27;;root.querySelector(&#x27;#rr-week&#x27;).value=&#x27;3&#x27;;root.querySelector(&#x27;#rr-group&#x27;).value=&#x27;全公司&#x27;;root.querySelector(&#x27;#rr-branch&#x27;).value=&#x27;-&#x27;;render();});

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
