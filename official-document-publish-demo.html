<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>国泰君安期货有限公司公文发布稿</title>
  <style>
    :root {
      --blue: #0868c9;
      --blue-dark: #0755a8;
      --blue-soft: #edf5ff;
      --ink: #202b3c;
      --muted: #78869a;
      --line: #dfe5ec;
      --label: #f5f7f9;
      --danger: #d64545;
    }
    * { box-sizing: border-box; }
    html { background: #eef2f5; }
    body {
      margin: 0;
      min-width: 320px;
      background: linear-gradient(180deg, #f0f3f6 0%, #eaf0f5 100%);
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
    }
    button, input, select, textarea { font: inherit; }
    .page {
      width: 100%;
      max-width: 1920px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 106px;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(215, 222, 231, .7), 0 14px 34px rgba(34, 57, 88, .08);
    }
    .page-header {
      min-height: 106px;
      display: grid;
      place-items: center;
      padding: 24px 18px 18px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .page-header h1 {
      margin: 0;
      color: var(--blue);
      font-size: 31px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
    }
    .main-tabs {
      display: flex;
      min-height: 70px;
      padding-left: 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .tab {
      position: relative;
      min-width: 116px;
      padding: 23px 26px 19px;
      color: #202b3c;
      font-size: 19px;
      cursor: pointer;
      text-align: center;
    }
    .tab.active { color: var(--blue); font-weight: 600; }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: -1px;
      height: 3px;
      background: var(--blue);
    }
    .badge {
      display: inline-grid;
      min-width: 28px;
      height: 28px;
      margin-left: 4px;
      padding: 0 7px;
      place-items: center;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      vertical-align: middle;
    }
    .form-shell { width: 100%; }
    .row-2, .row-1 {
      display: grid;
      border-bottom: 1px solid var(--line);
    }
    .row-2 { grid-template-columns: 280px minmax(0, 1fr) 280px minmax(0, 1fr); }
    .row-1 { grid-template-columns: 280px minmax(0, 1fr); }
    .label {
      display: flex;
      min-height: 66px;
      align-items: center;
      justify-content: flex-end;
      padding: 14px 18px;
      background: var(--label);
      border-right: 1px solid var(--line);
      color: #27364b;
      font-size: 18px;
      text-align: right;
      white-space: nowrap;
    }
    .value {
      min-width: 0;
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border-right: 1px solid var(--line);
      background: #fff;
    }
    .value:last-child { border-right: 0; }
    .req { margin-right: 4px; color: var(--danger); }
    .q-icon {
      display: inline-grid;
      width: 21px;
      height: 21px;
      margin-right: 4px;
      place-items: center;
      border: 2px solid #3d9af5;
      border-radius: 50%;
      color: #3d9af5;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
    }
    input[type="text"], select, textarea {
      width: 100%;
      height: 48px;
      padding: 7px 14px;
      border: 1px solid #d5dde7;
      border-radius: 7px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-size: 17px;
    }
    input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(8, 104, 201, .11); }
    input[readonly] { background: #f4f6f8; color: #617089; }
    select {
      appearance: none;
      padding-right: 40px;
      background-image: linear-gradient(45deg, transparent 50%, #9ba8b9 50%), linear-gradient(135deg, #9ba8b9 50%, transparent 50%);
      background-position: calc(100% - 19px) 20px, calc(100% - 12px) 20px;
      background-size: 8px 8px, 8px 8px;
      background-repeat: no-repeat;
    }
    .short-control { width: 190px; max-width: 100%; }
    .radio-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 25px;
    }
    .radio-group label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #29384c;
      font-size: 17px;
      cursor: pointer;
      white-space: nowrap;
    }
    .radio-group input[type="radio"] { width: 21px; height: 21px; accent-color: var(--blue); }
    .field-hidden { display: none !important; }

    /* 印章名称多选下拉 */
    .seal-field { position: relative; width: 100%; max-width: 420px; }
    .seal-select {
      position: relative;
      display: flex;
      min-height: 48px;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      padding: 5px 42px 5px 12px;
      border: 2px solid #9ec9f2;
      border-radius: 7px;
      background: #fff;
      cursor: pointer;
    }
    .seal-select:focus-within, .seal-select.open { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(8, 104, 201, .11); }
    .seal-placeholder { color: #a7b1bf; font-size: 16px; }
    .seal-caret {
      position: absolute;
      right: 15px;
      top: 50%;
      color: #8b99aa;
      font-size: 18px;
      transform: translateY(-50%);
    }
    .seal-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      border-radius: 5px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 15px;
    }
    .seal-tag button {
      padding: 0;
      border: 0;
      background: transparent;
      color: #7491b7;
      cursor: pointer;
      font-size: 19px;
      line-height: 1;
    }
    .seal-panel {
      position: absolute;
      z-index: 20;
      top: calc(100% + 5px);
      left: 0;
      display: none;
      width: 100%;
      max-height: 338px;
      overflow-y: auto;
      padding: 7px 0;
      border: 1px solid #d4dce6;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(29, 58, 95, .18);
    }
    .seal-panel.show { display: block; }
    .seal-item {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 42px;
      padding: 7px 13px;
      color: #29384c;
      font-size: 17px;
      cursor: pointer;
    }
    .seal-item:hover { background: #f4f8fd; }
    .seal-item input { width: 20px; height: 20px; accent-color: var(--blue); }
    .seal-item.no-seal { border-top: 1px solid #edf0f3; color: #5a6574; }
    .notice {
      display: none;
      margin-left: 5px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #fff4df;
      color: #b97600;
      font-size: 13px;
      white-space: nowrap;
    }
    .notice.show { display: inline-block; }
    textarea { min-height: 115px; height: 115px; resize: vertical; }
    .guide {
      padding: 16px 25px;
      border-top: 1px solid var(--line);
      background: #fbfcfe;
      color: var(--muted);
      font-size: 15px;
    }
    .guide a { color: var(--blue); text-decoration: none; }

    /* 固定底部工具栏 */
    .toolbar {
      position: fixed;
      z-index: 50;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: center;
      gap: 5px;
      min-height: 98px;
      padding: 9px 14px 7px;
      overflow-x: auto;
      border-top: 1px solid #d8e1eb;
      background: rgba(255,255,255,.98);
      box-shadow: 0 -8px 20px rgba(35, 59, 92, .08);
    }
    .tool-btn {
      display: inline-flex;
      min-width: 90px;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--blue);
      cursor: pointer;
      font-size: 15px;
      white-space: nowrap;
    }
    .tool-btn:hover { background: var(--blue-soft); color: var(--blue-dark); }
    .tool-icon { display: grid; width: 37px; height: 37px; place-items: center; }
    .tool-icon svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .toast {
      position: fixed;
      z-index: 100;
      top: 26px;
      left: 50%;
      max-width: calc(100vw - 28px);
      padding: 11px 18px;
      border-radius: 8px;
      background: #303540;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
      transition: opacity .18s;
    }
    .toast.show { opacity: .95; }
    .toast.err { background: var(--danger); }
    .toast.ok { background: var(--blue); }
    @media (max-width: 900px) {
      .row-2 { grid-template-columns: 160px minmax(0, 1fr) 160px minmax(0, 1fr); }
      .row-1 { grid-template-columns: 160px minmax(0, 1fr); }
      .label { font-size: 15px; }
      .value { padding-left: 10px; padding-right: 10px; }
      .page-header h1 { font-size: 25px; }
      .toolbar { justify-content: flex-start; }
    }
    @media (max-width: 640px) {
      .page { padding-bottom: 98px; }
      .page-header { min-height: 88px; padding: 22px 14px 18px; }
      .page-header h1 { font-size: 22px; text-align: center; }
      .main-tabs { min-height: 58px; padding-left: 0; }
      .tab { min-width: auto; padding: 18px 16px 15px; font-size: 16px; }
      .row-2, .row-1 { grid-template-columns: 112px minmax(0, 1fr); }
      .row-2 > .label:nth-child(3), .row-2 > .value:nth-child(4) { grid-column: 1 / -1; }
      .row-2 > .label:nth-child(3) { border-top: 1px solid var(--line); }
      .row-2 > .value:nth-child(4) { border-top: 1px solid var(--line); }
      .label { min-height: 58px; padding: 10px 9px; font-size: 12px; }
      .value { min-height: 58px; padding: 8px 9px; }
      input[type="text"], select { height: 40px; padding: 5px 9px; font-size: 14px; }
      .radio-group { gap: 12px; }
      .radio-group label { gap: 5px; font-size: 14px; }
      .radio-group input[type="radio"] { width: 17px; height: 17px; }
      .seal-field { max-width: none; }
      .seal-item { font-size: 15px; }
      .toolbar { min-height: 88px; justify-content: flex-start; }
      .tool-btn { min-width: 78px; font-size: 12px; }
      .tool-icon, .tool-icon svg { width: 29px; height: 29px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>国泰君安期货有限公司公文发布稿</h1>
    </header>

    <nav class="main-tabs" aria-label="页面标签">
      <div class="tab active">审批单</div>
      <div class="tab">正文</div>
      <div class="tab">附件<span class="badge">0</span></div>
    </nav>

    <form id="documentForm" class="form-shell" autocomplete="off">
      <div class="row-2">
        <div class="label"><span class="req">*</span>发起单位：</div>
        <div class="value"><select class="short-control" id="department"><option>信息技术部</option><option>综合管理部</option><option>财务部</option></select></div>
        <div class="label">发布日期：</div>
        <div class="value"><input type="text" id="publishDate" readonly value=""></div>
      </div>
      <div class="row-2">
        <div class="label"><span class="req">*</span>文件类型：</div>
        <div class="value"><select class="short-control" id="documentType"><option>公司发文</option><option>部门发文</option><option>内部通知</option></select></div>
        <div class="label"><span class="req">*</span>是否规章制度：</div>
        <div class="value"><div class="radio-group"><label><input type="radio" name="isPolicy" value="是">是</label><label><input type="radio" name="isPolicy" value="否" checked>否</label></div></div>
      </div>
      <div class="row-2">
        <div class="label">文件字号：</div>
        <div class="value"><input type="text" id="documentNumber"></div>
        <div class="label"><span class="req">*</span>密级：</div>
        <div class="value"><select class="short-control" id="securityLevel"><option>一般</option><option>秘密</option><option>机密</option></select></div>
      </div>
      <div class="row-1">
        <div class="label"><span class="req">*</span>缓急：</div>
        <div class="value"><select class="short-control" id="urgency"><option>一般</option><option>紧急</option><option>特急</option></select></div>
      </div>
      <div class="row-1">
        <div class="label"><span class="q-icon">?</span><span class="req">*</span>会签分类：</div>
        <div class="value"><select id="signCategory"><option value=""></option><option>人工流转</option><option>系统流转</option></select></div>
      </div>
      <div class="row-1">
        <div class="label"><span class="req">*</span>文件名：</div>
        <div class="value"><input type="text" id="fileName"></div>
      </div>
      <div class="row-2">
        <div class="label"><span class="q-icon">?</span><span class="req">*</span>印章名称：</div>
        <div class="value">
          <div class="seal-field">
            <div class="seal-select" id="sealSelect" tabindex="0" aria-haspopup="listbox" aria-expanded="false">
              <span class="seal-placeholder" id="sealPlaceholder">请选择印章名称</span>
              <span class="seal-caret">⌄</span>
            </div>
            <div class="seal-panel" id="sealPanel" role="listbox" aria-label="印章名称选项"></div>
          </div>
        </div>
        <div class="label" id="sealTypeLabel"><span class="req">*</span>申请用印类型：</div>
        <div class="value" id="sealTypeCell">
          <div class="radio-group"><label><input type="radio" name="sealType" value="物理印章" checked>物理印章</label><label><input type="radio" name="sealType" value="电子印章">电子印章</label></div>
        </div>
      </div>
      <div class="row-1">
        <div class="label"><span class="q-icon">?</span><span class="req">*</span>是否有前序审批流程：</div>
        <div class="value"><div class="radio-group"><label><input type="radio" name="hasPrevious" value="是">是</label><label><input type="radio" name="hasPrevious" value="否">否</label></div></div>
      </div>
      <div class="row-1">
        <div class="label">主题词：</div>
        <div class="value"><input type="text" id="keywords"></div>
      </div>
      <div class="row-2">
        <div class="label"><span class="req">*</span>主送：</div>
        <div class="value"><input type="text" id="primaryRecipient"></div>
        <div class="label"><span class="req">*</span>份数：</div>
        <div class="value"><input type="text" id="primaryCopies" inputmode="numeric"></div>
      </div>
      <div class="row-2">
        <div class="label">抄报：</div>
        <div class="value"><input type="text" id="reportedRecipient"></div>
        <div class="label">份数：</div>
        <div class="value"><input type="text" id="reportedCopies" inputmode="numeric"></div>
      </div>
      <div class="row-2">
        <div class="label">抄送：</div>
        <div class="value"><input type="text" id="ccRecipient"></div>
        <div class="label">份数：</div>
        <div class="value"><input type="text" id="ccCopies" inputmode="numeric"></div>
      </div>
      <div class="row-1">
        <div class="label">正文标题：</div>
        <div class="value"><input type="text" id="bodyTitle"></div>
      </div>
      <div class="row-1">
        <div class="label">备注：</div>
        <div class="value"><textarea id="remark"></textarea></div>
      </div>
    </form>
    <div class="guide">指引及模板：<a href="#" id="guideLink">查看</a></div>
  </main>

  <div class="toolbar" aria-label="流程工具栏">
    <button type="button" class="tool-btn" data-action="close"><span class="tool-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8"></circle><path d="M12 6v6l3.5 2"></path></svg></span><span>关闭</span></button>
    <button type="button" class="tool-btn" data-action="save"><span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"></path><path d="M8 4v6h8V4M8 20v-6h8v6"></path></svg></span><span>保存</span></button>
    <button type="button" class="tool-btn" data-action="submit"><span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M12 18V5"></path><path d="m7 10 5-5 5 5"></path><path d="M5 19h14"></path></svg></span><span>提交</span></button>
    <button type="button" class="tool-btn" data-action="upload"><span class="tool-icon"><svg viewBox="0 0 24 24"><path d="m8 12 5.7-5.7a3 3 0 0 1 4.2 4.2l-7.3 7.3a4.2 4.2 0 0 1-5.9-5.9l7.1-7.1"></path></svg></span><span>上传附件</span></button>
    <button type="button" class="tool-btn" data-action="track"><span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M6 4h12v4H6zM6 16h12v4H6zM12 8v8M9 12h6"></path></svg></span><span>流程跟踪</span></button>
    <button type="button" class="tool-btn" data-action="flow"><span class="tool-icon"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="5" rx="1"></rect><rect x="3" y="16" width="6" height="5" rx="1"></rect><rect x="15" y="16" width="6" height="5" rx="1"></rect><path d="M12 8v4M6 16v-2h12v2"></path></svg></span><span>流程图</span></button>
    <button type="button" class="tool-btn" data-action="print"><span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M7 9V4h10v5M6 18H4V10h16v8h-2"></path><path d="M7 14h10v6H7zM17 12h.01"></path></svg></span><span>OA打印</span></button>
    <button type="button" class="tool-btn" data-action="history"><span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6"></path><path d="M4 4v4.6h4.6M12 7v5l3 2"></path></svg></span><span>正文历史</span></button>
    <button type="button" class="tool-btn" data-action="void"><span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M8 10v7M12 10v7M16 10v7M7 7l1 13h8l1-13"></path></svg></span><span>文件作废</span></button>
    <button type="button" class="tool-btn" data-action="error"><span class="tool-icon"><svg viewBox="0 0 24 24"><path d="m12 4 9 16H3z"></path><path d="M12 9v5M12 17h.01"></path></svg></span><span>错误报告</span></button>
    <button type="button" class="tool-btn" data-action="circulate"><span class="tool-icon"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2"></circle><circle cx="18" cy="6" r="2"></circle><circle cx="18" cy="18" r="2"></circle><path d="m8 11 8-4M8 13l8 4"></path></svg></span><span>传阅</span></button>
    <button type="button" class="tool-btn" data-action="guide"><span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h14"></path><circle cx="3" cy="5" r=".8" fill="currentColor"></circle><circle cx="3" cy="12" r=".8" fill="currentColor"></circle><circle cx="3" cy="19" r=".8" fill="currentColor"></circle></svg></span><span>流程介绍</span></button>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const SEAL_LIST = [
      { id: "company", name: "公司公章" },
      { id: "branch", name: "分支机构公章" },
      { id: "legal", name: "法定代表人名章" },
      { id: "executive", name: "高管签名(章)" },
      { id: "finance", name: "财务负责人名章" },
      { id: "branchLeader", name: "分支机构负责人名章" },
      { id: "contract", name: "公司合同专用章" },
      { id: "business", name: "公司业务专用章" },
      { id: "subsidiary", name: "子公司印章" },
      { id: "other", name: "其他" },
      { id: "noSeal", name: "无需用印", noSeal: true }
    ];
    let selectedSeals = [];
    const $sealSelect = document.getElementById("sealSelect");
    const $sealPanel = document.getElementById("sealPanel");
    const $sealPlaceholder = document.getElementById("sealPlaceholder");
    const $sealTypeCell = document.getElementById("sealTypeCell");
    const $sealTypeLabel = document.getElementById("sealTypeLabel");
    const $toast = document.getElementById("toast");

    function showToast(message, type = "ok") {
      $toast.textContent = message;
      $toast.className = `toast show ${type}`;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { $toast.className = "toast"; }, 2300);
    }
    function hasNoSeal() { return selectedSeals.includes("noSeal"); }
    function updateSealTypeVisibility() {
      const hidden = hasNoSeal();
      $sealTypeCell.classList.toggle("field-hidden", hidden);
      $sealTypeLabel.classList.toggle("field-hidden", hidden);
      $sealTypeCell.setAttribute("aria-hidden", String(hidden));
      $sealTypeLabel.setAttribute("aria-hidden", String(hidden));
    }
    function renderSealPanel() {
      $sealPanel.innerHTML = SEAL_LIST.map(seal => `
        <label class="seal-item ${seal.noSeal ? "no-seal" : ""}" data-id="${seal.id}" role="option" aria-selected="${selectedSeals.includes(seal.id)}">
          <input type="checkbox" ${selectedSeals.includes(seal.id) ? "checked" : ""} aria-label="${seal.name}">
          <span>${seal.name}</span>
        </label>
      `).join("");
      $sealPanel.querySelectorAll(".seal-item").forEach(item => {
        item.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
          const id = item.dataset.id;
          if (selectedSeals.includes(id)) {
            selectedSeals = selectedSeals.filter(value => value !== id);
          } else if (id === "noSeal") {
            selectedSeals = ["noSeal"];
          } else {
            selectedSeals = selectedSeals.filter(value => value !== "noSeal");
            selectedSeals.push(id);
          }
          renderSealTags();
          renderSealPanel();
          updateSealTypeVisibility();
          $sealPanel.classList.add("show");
          $sealSelect.classList.add("open");
          $sealSelect.setAttribute("aria-expanded", "true");
        });
      });
    }
    function renderSealTags() {
      $sealSelect.querySelectorAll(".seal-tag").forEach(tag => tag.remove());
      $sealPlaceholder.style.display = selectedSeals.length ? "none" : "inline";
      const caret = $sealSelect.querySelector(".seal-caret");
      selectedSeals.forEach(id => {
        const seal = SEAL_LIST.find(item => item.id === id);
        const tag = document.createElement("span");
        tag.className = "seal-tag";
        tag.append(document.createTextNode(seal.name));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `移除${seal.name}`);
        remove.addEventListener("click", event => {
          event.stopPropagation();
          selectedSeals = selectedSeals.filter(value => value !== id);
          renderSealTags();
          renderSealPanel();
          updateSealTypeVisibility();
        });
        tag.append(remove);
        $sealSelect.insertBefore(tag, caret);
      });
    }
    function closeSealPanel() {
      $sealPanel.classList.remove("show");
      $sealSelect.classList.remove("open");
      $sealSelect.setAttribute("aria-expanded", "false");
    }
    $sealSelect.addEventListener("click", event => {
      if (event.target.closest("button")) return;
      const show = !$sealPanel.classList.contains("show");
      if (show) {
        $sealPanel.classList.add("show");
        $sealSelect.classList.add("open");
        $sealSelect.setAttribute("aria-expanded", "true");
      } else closeSealPanel();
    });
    $sealSelect.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); $sealSelect.click(); }
      if (event.key === "Escape") closeSealPanel();
    });
    document.addEventListener("click", event => {
      if (!$sealSelect.contains(event.target) && !$sealPanel.contains(event.target)) closeSealPanel();
    });

    const today = new Date();
    document.getElementById("publishDate").value = [today.getFullYear(), String(today.getMonth() + 1).padStart(2, "0"), String(today.getDate()).padStart(2, "0")].join("-");
    document.getElementById("documentForm").addEventListener("submit", event => event.preventDefault());
    document.querySelectorAll(".tool-btn").forEach(button => {
      button.addEventListener("click", () => {
        const action = button.dataset.action;
        if (action === "submit") {
          if (!selectedSeals.length) return showToast("请选择印章名称", "err");
          showToast(hasNoSeal() ? "已提交：无需用印" : "公文发布稿已提交（demo）", "ok");
          return;
        }
        if (action === "save") return showToast("草稿已保存（demo）", "ok");
        showToast(`${button.textContent.trim()}已触发（demo）`, "ok");
      });
    });
    document.getElementById("guideLink").addEventListener("click", event => { event.preventDefault(); showToast("指引及模板已触发（demo）", "ok"); });
    renderSealPanel();
    renderSealTags();
    updateSealTypeVisibility();
  </script>
</body>
</html>
