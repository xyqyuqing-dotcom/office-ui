<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面试官评分｜人力资源管理</title>
  <style>
    :root { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; font-size: 16px; color: #26384d; background: #f7f9fc; }
    * { box-sizing: border-box; }
    body { min-width: 640px; margin: 0; background: #f7f9fc; overflow-x: hidden; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar { position: relative; z-index: 2; height: 68px; display: flex; align-items: center; padding: 0 20px 0 24px; border-bottom: 1px solid #e7ebf0; background: linear-gradient(109deg,#fff 0%,#f8fbff 56%,#edf5fe 100%); overflow: hidden; }
    .topbar::after { position: absolute; content: ""; inset: 0 0 0 auto; width: 42%; pointer-events: none; opacity: .36; background: repeating-linear-gradient(138deg,transparent 0 13px,rgba(100,151,213,.16) 14px 15px); mask-image: linear-gradient(90deg,transparent,#000 30%); }
    .brand { position: relative; z-index: 1; color: #5799f4; font-size: 20px; letter-spacing: .2px; white-space: nowrap; text-decoration: none; }
    .topnav { position: absolute; z-index: 1; left: 50%; transform: translateX(-50%); height: 100%; display: flex; align-items: stretch; gap: 26px; }
    .topnav a, .topnav button { position: relative; display: flex; align-items: center; padding: 0 12px; border: 0; color: #788493; background: transparent; text-decoration: none; font-size: 16px; white-space: nowrap; }
    .topnav a:hover, .topnav button:hover { color: #338cf4; }
    .topnav a.active, .topnav button.active { color: #338cf4; font-weight: 600; }
    .topnav a.active::after, .topnav button.active::after { position: absolute; content: ""; left: 50%; bottom: 0; width: 22px; height: 4px; border-radius: 4px 4px 0 0; background: #338cf4; transform: translateX(-50%); }
    .user-actions { position: relative; z-index: 1; display: flex; align-items: center; gap: 14px; margin-left: auto; color: #8491a0; font-size: 15px; white-space: nowrap; }
    .user-icon { display: inline-grid; width: 20px; height: 20px; place-items: center; color: #8290a0; }
    .user-icon svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; }
    .avatar-small { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: linear-gradient(145deg,#425c79,#c78668); font-size: 15px; }
    .page { min-height: calc(100vh - 68px); margin: 0; padding: 24px 30px 42px; }
    .filters { min-height: 98px; display: flex; align-items: center; gap: 26px; padding: 18px 24px; border: 1px solid #edf0f4; border-radius: 10px; background: #fff; box-shadow: 0 2px 10px rgba(30,50,70,.035); }
    .filter-group { display: flex; flex: 0 0 auto; align-items: center; gap: 14px; }
    .filter-group label { color: #324458; font-size: 16px; white-space: nowrap; }
    .filter-control { height: 44px; width: 310px; padding: 0 14px; border: 1px solid #d9e1eb; border-radius: 7px; outline: none; color: #34475d; background: #fff; font-size: 16px; }
    .filter-control:focus { border-color: #82b3f8; box-shadow: 0 0 0 3px rgba(51,140,244,.1); }
    select.filter-control { appearance: none; padding-right: 36px; background: linear-gradient(45deg,transparent 50%,#8e9aaa 50%) calc(100% - 18px) 17px/7px 7px no-repeat,linear-gradient(135deg,#8e9aaa 50%,transparent 50%) calc(100% - 13px) 17px/7px 7px no-repeat,#fff; }
    input[type="date"].filter-control { width: 310px; }
    .filter-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 17px; border: 1px solid #dce2e9; border-radius: 7px; color: #445467; background: #fff; font-size: 15px; white-space: nowrap; }
    .btn:hover { border-color: #a9cafa; color: #287bd6; }
    .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .workspace { display: grid; grid-template-columns: minmax(360px,.34fr) minmax(0,1fr); gap: 20px; margin-top: 22px; align-items: stretch; }
    .candidate-list { display: flex; flex-direction: column; gap: 14px; padding: 22px; border: 1px solid #edf0f4; border-radius: 10px; background: #fff; min-height: 680px; }
    .candidate-card { width: 100%; min-height: 112px; padding: 18px 18px 17px; border: 1px solid #e7ebf0; border-radius: 14px; color: #34465a; background: #fff; text-align: left; box-shadow: 0 2px 4px rgba(32,48,68,.045); transition: border-color .15s,background .15s,box-shadow .15s; }
    .candidate-card:hover { border-color: #bfd5fb; }
    .candidate-card.active { border-color: #94baff; background: #f5f9ff; box-shadow: 0 2px 8px rgba(51,140,244,.09); }
    .candidate-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .candidate-name { min-width: 0; color: #273a50; font-size: 20px; font-weight: 600; }
    .candidate-order { color: #718097; }
    .candidate-card-badges { display: flex; flex: 0 0 auto; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 7px; }
    .type-pill { display: inline-flex; align-items: center; min-height: 36px; padding: 6px 14px; border-radius: 7px; font-size: 16px; white-space: nowrap; }
    .type-pill.recruit { color: #397fcd; background: #edf5ff; }
    .type-pill.transfer { color: #7665bc; background: #f2f0ff; }
    .type-pill.observation { color: #318263; background: #eef8f3; }
    .type-pill.regularization { color: #a66b27; background: #fff5e9; }
    .score-status { flex: 0 0 auto; padding: 8px 15px; border-radius: 22px; color: #8793a1; background: #f1f3f6; font-size: 16px; }
    .score-status.done { color: #27865f; background: #eaf7f0; }
    .candidate-subtitle { color: #7c899a; font-size: 15px; line-height: 1.55; }
    .candidate-empty { margin: auto; color: #98a4b2; font-size: 16px; text-align: center; line-height: 1.8; }
    .score-panel { min-width: 0; padding: 28px 30px 26px; border: 1px solid #edf0f4; border-radius: 10px; background: #fff; box-shadow: 0 2px 10px rgba(30,50,70,.025); }
    .person-heading { display: flex; align-items: flex-start; gap: 18px; min-height: 98px; }
    .avatar-large { flex: 0 0 76px; width: 76px; height: 76px; display: grid; place-items: center; border: 3px solid #f0f2f6; border-radius: 50%; color: #fff; background: linear-gradient(145deg,#99a5b5,#d7a389); font-size: 27px; font-weight: 600; }
    .person-summary { min-width: 0; padding-top: 2px; }
    .person-name-line { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .person-name-line h1 { margin: 0; color: #1f2e40; font-size: 27px; font-weight: 650; }
    .person-meta { margin-top: 9px; color: #788596; font-size: 17px; line-height: 1.55; }
    .score-report-link { padding: 0; border: 0; color: #2878e5; background: transparent; font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .resume-box { display: grid; grid-template-columns: 230px minmax(0,1fr); align-items: start; gap: 24px; margin-top: 22px; padding: 20px; border: 1px solid #e8edf4; border-radius: 9px; color: #36485c; background: #fcfcfd; }
    .resume-actions { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); align-items: stretch; gap: 12px; }
    .resume-btn { min-width: 0; min-height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; border: 1px solid #8fb5ff; border-radius: 9px; color: #2878e5; background: linear-gradient(180deg,#fff 0%,#f3f8ff 100%); box-shadow: 0 3px 10px rgba(51,140,244,.11); font-size: 16px; font-weight: 600; }
    .resume-btn:hover { border-color: #5d99f3; background: #edf5ff; box-shadow: 0 5px 14px rgba(51,140,244,.16); }
    .resume-btn svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .resume-summary { display: flex; min-width: 0; flex-direction: column; justify-content: center; gap: 10px; }
    .resume-row { display: grid; grid-template-columns: 140px minmax(0,1fr); align-items: start; gap: 14px; padding: 10px 0; border-bottom: 1px solid #e9edf3; }
    .resume-row:last-child { border-bottom: 0; }
    .resume-label { color: #778596; font-size: 15px; font-weight: 600; }
    .resume-value { color: #36485c; font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; }
    .resume-entry { display: block; }
    .rotation-history { margin-top: 24px; overflow: hidden; border: 1px solid #e8edf4; border-radius: 9px; background: #fff; }
    .rotation-history-head { padding: 15px 18px 10px; }
    .rotation-history-title { margin: 0; color: #2878e5; font-size: 19px; font-weight: 600; }
    .rotation-table-wrap { overflow-x: auto; padding: 0 16px 14px; }
    .rotation-table { width: 100%; border: 1px solid #e4eaf1; border-collapse: separate; border-spacing: 0; border-radius: 7px; font-size: 15px; }
    .rotation-table th,.rotation-table td { padding: 13px 15px; border-bottom: 1px solid #e9edf2; text-align: left; white-space: nowrap; }
    .rotation-table th { color: #657488; background: #f7f9fb; font-weight: 600; }
    .rotation-table tr:last-child td { border-bottom: 0; }
    .rotation-table td:last-child,.rotation-table th:last-child { width: 96px; text-align: center; }
    .rotation-detail-button { padding: 0; border: 0; color: #2878e5; background: transparent; font-size: 15px; }
    .rotation-detail-button:hover { text-decoration: underline; }
    .rating-section { margin-top: 30px; }
    .section-title { margin: 0 0 16px; color: #34465a; font-size: 19px; font-weight: 600; }
    .grades { display: flex; flex-wrap: wrap; gap: 12px; }
    .grade-btn { min-width: 64px; min-height: 52px; padding: 0 15px; border: 1px solid #dce2e9; border-radius: 7px; color: #526174; background: #fff; font-size: 18px; transition: color .15s,border-color .15s,background .15s; }
    .grade-btn:hover { border-color: #8fb7f5; color: #287bd6; }
    .grade-btn.selected { border-color: #3989f5; color: #287bd6; background: #eef6ff; box-shadow: 0 0 0 2px rgba(51,140,244,.08); }
    .grade-help { margin: 14px 0 0; color: #8997a8; font-size: 14px; line-height: 1.7; }
    .comment-section { margin-top: 30px; }
    .comment-box { width: 100%; min-height: 140px; resize: vertical; padding: 14px 16px; border: 1px solid #dce2e9; border-radius: 8px; outline: none; color: #425164; background: #fff; font-size: 16px; line-height: 1.7; }
    .comment-box:focus { border-color: #88b8f7; box-shadow: 0 0 0 3px rgba(51,140,244,.09); }
    .comment-box::placeholder { color: #aab4bf; }
    .score-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
    .save-hint { color: #8997a8; font-size: 14px; }
    .btn.primary { border-color: #3488f4; color: #fff; background: #3488f4; box-shadow: 0 3px 8px rgba(51,140,244,.16); }
    .btn.primary:hover { background: #2378e6; }
    .empty-detail { display: grid; min-height: 520px; place-items: center; color: #9aa5b1; font-size: 14px; }
    .modal-backdrop { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(31,45,62,.38); }
    .modal-backdrop[hidden] { display: none; }
    .modal { width: min(680px,100%); max-height: min(80vh,720px); overflow: auto; border-radius: 10px; background: #fff; box-shadow: 0 18px 52px rgba(23,40,61,.25); }
    .modal.modal--large { width: min(1500px,calc(100vw - 48px)); height: min(94vh,1100px); max-height: 94vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal--large .modal-head { flex: 0 0 auto; padding: 20px 28px; }
    .modal--large .modal-head h2 { font-size: 22px; }
    .modal--large .modal-body { min-height: 0; flex: 1 1 auto; overflow: auto; padding: 24px 28px 32px; }
    .modal.modal--compact { width: min(780px,100%); max-height: min(80vh,720px); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid #edf0f4; }
    .modal-head h2 { margin: 0; font-size: 20px; }
    .modal-close { width: 40px; height: 40px; border: 0; border-radius: 5px; color: #8190a0; background: transparent; font-size: 26px; }
    .modal-close:hover { background: #f3f6f9; }
    .modal-body { padding: 20px 22px 24px; }
    .section-title-row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px; }
    .section-title-row .section-title { margin: 0; }
    .criteria-link { padding: 0; border: 0; color: #2878e5; background: transparent; font-size: 15px; font-weight: 500; }
    .criteria-link:hover { text-decoration: underline; }
    .criteria-table { width: 100%; border-collapse: collapse; color: #27384b; font-size: 15px; line-height: 1.65; }
    .criteria-table th,.criteria-table td { padding: 12px 13px; border: 1px solid #b8bec6; text-align: center; }
    .criteria-table th { background: #ffefad; font-size: 16px; }
    .criteria-table .criteria-description { min-width: 360px; text-align: left; }
    .criteria-table .criteria-note { min-width: 230px; text-align: left; }
    .criteria-scroll { overflow: auto; }
    .criteria-table .criteria-caution { background: #fff8df; }
    .criteria-table .criteria-fail { background: #fde9e8; }
    .resume-document { max-width: 1120px; margin: 0 auto; padding: 28px; border: 1px solid #d9e0e8; background: #fff; color: #24364b; box-shadow: 0 4px 18px rgba(37,58,81,.07); }
    .resume-document h3 { margin: 0 0 24px; text-align: center; font-size: 24px; }
    .resume-profile-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); border-top: 1px solid #b8c7d8; border-left: 1px solid #b8c7d8; }
    .resume-profile-grid div { min-height: 45px; display: flex; align-items: center; padding: 9px 12px; border-right: 1px solid #b8c7d8; border-bottom: 1px solid #b8c7d8; }
    .resume-profile-grid strong { width: 100px; flex: 0 0 100px; color: #52677e; font-weight: 500; }
    .resume-profile-grid .resume-photo { grid-column: span 1; grid-row: span 3; justify-content: center; color: #7890a8; background: #f1f6fa; font-size: 48px; }
    .resume-document h4 { margin: 24px 0 10px; padding: 9px 12px; color: #315d89; background: #eaf1f7; font-size: 16px; }
    .resume-data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .resume-data-table th,.resume-data-table td { padding: 10px; border: 1px solid #b8c7d8; text-align: left; }
    .resume-data-table th { background: #f5f8fb; }
    .original-resume { max-width: 1060px; margin: 0 auto; padding: 34px 42px; border: 1px solid #e2e8ef; background: #fff; box-shadow: 0 4px 18px rgba(37,58,81,.07); }
    .original-resume-head { display: flex; justify-content: space-between; gap: 28px; padding-bottom: 22px; border-bottom: 2px solid #367fd0; }
    .original-resume-head h3 { margin: 0 0 8px; color: #244d79; font-size: 27px; }
    .original-resume-head p { margin: 5px 0; color: #68798b; }
    .original-resume-section { margin-top: 24px; }
    .original-resume-section h4 { margin: 0 0 12px; color: #2878c8; font-size: 17px; }
    .original-resume-section p,.original-resume-section li { color: #536477; font-size: 15px; line-height: 1.85; }
    .report-banner { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 24px; border-radius: 10px; color: #fff; background: linear-gradient(110deg,#286fbd,#4a9be7); }
    .report-banner h3 { margin: 0 0 6px; font-size: 22px; }
    .report-banner p { margin: 0; opacity: .88; }
    .report-total { font-size: 38px; font-weight: 700; white-space: nowrap; }
    .report-stats { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; margin: 20px 0; }
    .report-stat { padding: 16px; border: 1px solid #e5ebf2; border-radius: 8px; background: #fbfcfe; }
    .report-stat span { display: block; color: #8794a3; font-size: 13px; }
    .report-stat strong { display: block; margin-top: 7px; color: #2d4056; font-size: 22px; }
    .report-chart { display: flex; height: 280px; align-items: end; gap: 12px; padding: 20px 18px 32px; border: 1px solid #e7ecf2; border-radius: 8px; background: repeating-linear-gradient(to top,#fff 0 54px,#edf1f6 55px 56px); }
    .report-bar { position: relative; flex: 1 1 0; min-width: 24px; border-radius: 5px 5px 0 0; background: #d9e0e8; }
    .report-bar.active { background: #1cbd8a; }
    .report-bar span { position: absolute; top: calc(100% + 8px); left: 50%; color: #718095; font-size: 12px; white-space: nowrap; transform: translateX(-50%); }
    .report-summary { margin-top: 18px; padding: 18px; border: 1px solid #e7ecf2; border-radius: 8px; color: #536477; line-height: 1.8; }
    .rotation-detail-view { min-height: 100%; display: flex; flex-direction: column; color: #45566b; }
    .rotation-profile { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 12px; padding: 16px; border: 1px solid #e8edf4; border-radius: 8px; background: #fbfcfe; }
    .rotation-profile div { min-width: 0; }
    .rotation-profile span { display: block; margin-bottom: 6px; color: #8997a8; font-size: 13px; }
    .rotation-profile strong { color: #34465a; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
    .rotation-detail-tabs { display: flex; gap: 28px; margin-top: 18px; border-bottom: 1px solid #e9edf3; }
    .rotation-detail-tab { padding: 12px 4px; border: 0; border-bottom: 3px solid transparent; color: #7d8a9b; background: transparent; font-size: 16px; }
    .rotation-detail-tab.active { border-bottom-color: #3488f4; color: #287bd6; font-weight: 600; }
    .rotation-log-layout { min-height: 520px; flex: 1 1 auto; display: grid; grid-template-columns: 290px minmax(0,1fr); margin-top: 16px; border: 1px solid #e8edf4; border-radius: 8px; overflow: hidden; }
    .rotation-log-sidebar { padding: 16px 12px; border-right: 1px solid #e8edf4; background: #fbfcfe; }
    .rotation-log-sidebar h3 { margin: 0 0 14px; color: #52647a; font-size: 16px; }
    .rotation-log-item { width: 100%; display: block; margin: 0 0 8px; padding: 12px; border: 1px solid transparent; border-radius: 7px; color: #46596e; background: transparent; text-align: left; }
    .rotation-log-item.active { border-color: #cfe1fa; background: #edf5ff; }
    .rotation-log-item strong { display: block; font-size: 14px; line-height: 1.5; }
    .rotation-log-item time { display: block; margin-top: 6px; color: #92a0ae; font-size: 12px; }
    .rotation-log-main { min-width: 0; padding: 22px; }
    .rotation-log-main h3 { margin: 0 0 8px; color: #34465a; font-size: 21px; }
    .rotation-log-date { color: #96a2af; font-size: 13px; }
    .rotation-log-copy { min-height: 180px; margin-top: 20px; padding: 20px; border: 1px solid #e8edf4; border-radius: 8px; background: #fcfdff; }
    .rotation-log-copy h4 { margin: 0 0 8px; color: #40566e; font-size: 16px; }
    .rotation-log-copy p { margin: 0 0 18px; color: #5a6c80; line-height: 1.8; }
    .rotation-rating-directions { display: flex; flex-direction: column; gap: 13px; margin-top: 16px; }
    .rotation-rating-card { padding: 15px 17px 16px; border: 1px solid #e8edf4; border-radius: 9px; background: #fff; }
    .rotation-rating-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .rotation-rating-head > div:first-child { display:flex;align-items:center;flex-wrap:wrap;gap:8px; }
    .rotation-rating-title { color: #3d5067; font-size: 16px; font-weight: 650; }
    .rotation-rating-privacy { color: #3975b5; font-size: 12px; }
    .rotation-rating-average { display: flex; align-items: baseline; gap: 6px; padding: 9px 12px; border: 1px solid #e5eef9; border-radius: 7px; color: #8795a6; background: #f7fbff; font-size: 12px; white-space: nowrap; }
    .rotation-rating-average strong { color: #d9912b; font-size: 21px; }
    .rotation-rating-items { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; margin-top: 12px; }
    .rotation-rating-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 62px; padding: 8px 10px; border: 1px solid #edf0f4; border-radius: 7px; background: #fbfcfe; }
    .rotation-rating-item strong { color: #45566b; font-size: 14px; }
    .rotation-evaluation-stars { display: flex; align-items: center; gap: 1px; white-space: nowrap; }
    .rotation-evaluation-star { display: inline-block; color: #dfe4ea; font-size: 22px; line-height: 1; }
    .rotation-evaluation-star.filled { color: #f3b746; }
    .rotation-evaluation-star.half { color: transparent; background: linear-gradient(90deg,#f3b746 50%,#dfe4ea 50%); background-clip: text; -webkit-background-clip: text; }
    .rotation-rating-value { min-width: 34px; color: #d28b27; font-size: 13px; font-weight: 600; text-align: right; }
    .rotation-rating-comment { display: block; margin-top: 12px; color: #526174; font-size: 13px; line-height: 1.7; }
    .rotation-rating-note { min-height: 56px; margin-top: 7px; padding: 11px 13px; border-left: 3px solid #d7e6f8; border-radius: 0 7px 7px 0; color: #3e4f63; background: #f7f9fc; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
    .rotation-rating-note.empty { color: #a0aab5; }
    .rotation-comments { margin-top: 20px; padding-top: 18px; border-top: 1px solid #edf0f4; }
    .rotation-comments h4 { margin: 0 0 10px; color: #4d6075; }
    .rotation-comment-sample { margin: 12px 0; padding: 13px 15px; border: 1px solid #edf0f4; border-radius: 7px; color: #5b6b7d; line-height: 1.65; }
    .rotation-comment-sample small { display: block; margin-bottom: 5px; color: #91a0af; }

    function buildScoreReport(person) {
      const score = Number(person.examScore || 90);
      const bars = [4,9,19,37,61,86,100,74,49,27];
      const active = Math.min(9,Math.floor(score / 10));
      const rank = Math.max(3,Math.round(763-7.6*score));
      const percentile = Math.max(1,Math.round(rank/578*100));
      return `<div class="score-report"><div class="report-banner"><div><h3>通用能力测试（主）成绩报告</h3><p>${escapeHtml(person.name)}　·　应聘岗位：${escapeHtml(person.position)}　·　考试日期：${escapeHtml(currentDateKey())}</p></div><div class="report-total">${score}<small style="font-size:16px;font-weight:500"> / 100分</small></div></div><h3 style="margin:24px 0 12px">考生信息</h3><div class="report-stats"><div class="report-stat"><span>本次得分</span><strong>${score}分</strong></div><div class="report-stat"><span>本次排名</span><strong>${rank} / 578</strong></div><div class="report-stat"><span>排名比率</span><strong>${percentile}%</strong></div><div class="report-stat"><span>本场中位数</span><strong>68分</strong></div></div><h3 style="margin:24px 0 12px">成绩分布</h3><div class="report-chart">${bars.map((height,i)=>`<div class="report-bar ${i===active?'active':''}" style="height:${height}%"><span>${i*10}–${i*10+10}</span></div>`).join('')}</div><div class="report-summary"><b>综合评价：</b><br>在本次考试中，考生总成绩为${score}分/100分，排名${rank}，排名前${percentile}%。<br>该考生在本次考试中无作弊情况。<br><br><b>成绩详情：</b><br>逻辑推理 ${Math.min(100,score+3)}分　·　语言理解 ${Math.max(0,score-4)}分　·　数字运算 ${Math.max(0,score-7)}分　·　资料分析 ${Math.min(100,score+1)}分</div></div>`;
    }
    function renderDetail() {
      const person = currentCandidates.find(candidate => candidate.id === currentCandidateId);
      const detail = $('candidateDetail');
      if (!person) {
        detail.innerHTML = '<div class="empty-detail">请选择面试人员</div>';
        return;
      }
      const record = ratingFor(person.id);
      detail.innerHTML = `<div class="person-heading">
        <div class="avatar-large" aria-hidden="true">${person.name.slice(0,1)}</div>
        <div class="person-summary"><div class="person-name-line"><h1>${person.name}</h1><span class="score-status ${record.grade && !record.draft ? 'done' : ''}">${ratingStatus(record)}</span></div><div class="person-meta">【${person.scene}】 ${person.department}-${person.position} ${person.genderAge}</div></div>
      </div>
      <div class="resume-box">
        <div class="resume-toolbar" aria-label="简历资料"><div class="resume-actions"><button class="resume-btn" type="button" data-resume="summary"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/><circle cx="12" cy="10" r="1.5"/></svg><span>简历</span></button><button class="resume-btn" type="button" data-resume="original"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/></svg><span>原简历</span></button></div></div>
        <div class="resume-summary"><div class="resume-row"><span class="resume-label">教育背景</span><span class="resume-value">${(Array.isArray(person.education) ? person.education : [person.education]).map(item => `<span class="resume-entry">${escapeHtml(item)}</span>`).join('')}</span></div><div class="resume-row"><span class="resume-label">工作经历</span><span class="resume-value">${(Array.isArray(person.experience) ? person.experience : [person.experience]).map(item => `<span class="resume-entry">${escapeHtml(item)}</span>`).join('')}</span></div></div>
      </div>
      ${person.scene.includes('招聘面试') ? `<section class="exam-summary" aria-label="笔试及AI面试成绩"><h2>笔试/AI面试成绩</h2><div class="exam-summary-value"><strong>${escapeHtml(person.examScore ?? '—')}<small>分</small></strong><button class="score-report-link" type="button" data-score-report>查看成绩报告 ›</button></div></section>` : ''}
      ${renderRotationHistory(person)}
      <section class="rating-section"><div class="section-title-row"><h2 class="section-title">面试评分</h2><button class="criteria-link" type="button" data-grade-criteria>评分细则</button></div><div class="grades">${gradeOptions.map(grade => `<button class="grade-btn ${record.grade === grade ? 'selected' : ''}" type="button" data-grade="${grade}" aria-pressed="${record.grade === grade}">${grade}</button>`).join('')}</div><p class="grade-help">1C-由面试评委会讨论是否淘汰，2C-/1D及以上淘汰（特殊情况可由评委会讨论条件性通过）</p></section>
      <section class="comment-section"><h2 class="section-title">评语</h2><textarea class="comment-box" id="commentBox" placeholder="请输入面试评语"></textarea><div class="score-footer"><span class="save-hint">评分与评语自动保存</span></div></section>`;
      $('commentBox').value = record.comment || '';
    }
    function renderPage() {
      renderInterviewerOptions($('interviewerSelect').value);
      renderCandidateList();
      renderDetail();
    }
    function updateCandidateStatus() {
      const record = ratingFor(currentCandidateId);
      const status = ratingStatus(record);
      const card = $('candidateList').querySelector(`[data-candidate-id="${currentCandidateId}"] .score-status`);
      if(card){const person=currentCandidates.find(person=>person.id===currentCandidateId),info=candidateScoreInfo(person);card.textContent=info.text;card.title=info.title;card.classList.toggle('done',info.done);card.classList.toggle('summary-score',info.aggregate)}
      const detailStatus = $('candidateDetail').querySelector('.person-name-line .score-status');
      if (detailStatus) {
        detailStatus.textContent = status;
        detailStatus.classList.toggle('done', Boolean(record.grade && !record.draft));
      }
    }
    function updateCurrentRating(changes){const key=ratingKey(currentCandidateId),previous=ratings[key]||{grade:'',comment:''};ratings[key]={grade:previous.grade,comment:previous.comment,...changes};persistRatings();updateCandidateStatus();}
    function showToast(message) {
      $('toast').textContent = message;
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200);
    }
    function showModal(title, content, size = 'large') {
      $('modalTitle').textContent = title;
      $('modalBody').innerHTML = content;
      $('modal').className = `modal modal--${size}`;
      $('modalBackdrop').hidden = false;
    }
    function closeModal() { $('modalBackdrop').hidden = true; }
    function viewResults(){
      resultsMode=true;
      const button=$('viewResults');button.textContent='查看结果';button.setAttribute('aria-pressed','true');renderCandidateList();
    }
    function resetResultsMode(){resultsMode=false;$('viewResults').textContent='查看结果';$('viewResults').setAttribute('aria-pressed','false')}
    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen?.();
      else document.documentElement.requestFullscreen?.();
    }
    document.addEventListener('fullscreenchange', () => { $('fullscreenLabel').textContent = document.fullscreenElement ? '退出全屏' : '全屏'; });
    $('interviewDate').addEventListener('change', () => { resetResultsMode();currentCandidateId = ''; renderPage(); });
    $('interviewerSelect').addEventListener('change', () => { currentCandidateId = ''; renderCandidateList(); renderDetail(); });
    $('candidateList').addEventListener('click', event => {
      const card = event.target.closest('[data-candidate-id]');
      if (!card) return;
      currentCandidateId = card.dataset.candidateId;
      renderCandidateList();
      renderDetail();
    });
    $('candidateDetail').addEventListener('click', event => {
      if (event.target.closest('[data-grade-criteria]')) { showModal('国君期货面试评分标准', buildGradeCriteria(), 'large'); return; }
      if (event.target.closest('[data-score-report]')) {
        const person = currentCandidates.find(candidate => candidate.id === currentCandidateId);
        if (person) showModal(`${person.name} · 成绩报告`, buildScoreReport(person), 'large');
        return;
      }
      const gradeButton = event.target.closest('[data-grade]');
      if (gradeButton) {
        const selected = ratingFor(currentCandidateId).grade === gradeButton.dataset.grade;
        updateCurrentRating({grade:selected ? '' : gradeButton.dataset.grade});
        renderDetail();
        return;
      }
      const rotationButton = event.target.closest('[data-rotation-detail]');
      if (rotationButton) {
        const person = currentCandidates.find(candidate => candidate.id === currentCandidateId);
        const index = Number(rotationButton.dataset.rotationDetail);
        const rotationRecord = person && person.rotationRecords && person.rotationRecords[index];
        if (person && rotationRecord) showRotationDetails(person, rotationRecord, index);
        return;
      }
      const resumeButton = event.target.closest('[data-resume]');
      if (resumeButton) {
        const person = currentCandidates.find(candidate => candidate.id === currentCandidateId);
        if (person) openResumeReader(resumeButton.dataset.resume,resumeButton);
        return;
      }

    });
    $('modalBody').addEventListener('click', event => {
      const logItem = event.target.closest('[data-rotation-log-index]');
      if (logItem && activeRotationDetail) {
        activeRotationDetail.logIndex = Number(logItem.dataset.rotationLogIndex);
        $('modalBody').innerHTML = renderRotationDetail();
        return;
      }
      const tab = event.target.closest('[data-rotation-tab]');
      if (tab && activeRotationDetail) {
        activeRotationDetail.tab = tab.dataset.rotationTab;
        $('modalBody').innerHTML = renderRotationDetail();
        return;
      }
      if (event.target.closest('[data-rotation-comment]') && activeRotationDetail) {
        const textarea = $('modalBody').querySelector('.rotation-comment-entry textarea');
        const text = textarea && textarea.value.trim();
        if (!text) { showToast('请输入评论内容'); return; }
        activeRotationDetail.comments.push({text,date:'2026-10-08'});
        $('modalBody').innerHTML = renderRotationDetail();
        showToast('评论已发布');
      }
    });
    $('candidateDetail').addEventListener('input', event => {
      if (event.target.id === 'commentBox') updateCurrentRating({comment:event.target.value});
    });
    $('viewResults').addEventListener('click', viewResults);
    $('fullscreenBtn').addEventListener('click', toggleFullscreen);
    $('modalClose').addEventListener('click', closeModal);
    $('modalBackdrop').addEventListener('click', event => { if (event.target === $('modalBackdrop')) closeModal(); });
    $('readerPrevious').addEventListener('click',()=>moveReaderCandidate(-1));
    $('readerNext').addEventListener('click',()=>moveReaderCandidate(1));
    $('readerClose').addEventListener('click',closeResumeReader);
    $('readerToggle').addEventListener('click',()=>{readerCollapsed=true;syncReaderScore();$('readerExpand').focus()});
    $('readerExpand').addEventListener('click',()=>{readerCollapsed=false;syncReaderScore();$('readerToggle').focus()});
    window.addEventListener('resize',()=>{if(!$('resumeReader').hidden)syncReaderScore()});
    $('readerCriteria').addEventListener('click',()=>{readerExtra=readerExtra==='criteria'?'':'criteria';renderReaderDocument()});
    $('readerComment').addEventListener('input',event=>{
      updateCurrentRating({comment:event.target.value});
      $('commentBox').value=event.target.value;
      syncReaderScore();
    });
    $('resumeReader').addEventListener('click',event=>{
      const tab=event.target.closest('[data-reader-tab]');
      if(tab){readerTab=tab.dataset.readerTab;readerExtra='';renderReaderDocument();return}
      const grade=event.target.closest('[data-reader-grade]');
      if(grade){updateCurrentRating({grade:ratingFor(currentCandidateId).grade===grade.dataset.readerGrade?'':grade.dataset.readerGrade});renderDetail();syncReaderScore();$('readerGrades').querySelector(`[data-reader-grade="${grade.dataset.readerGrade}"]`).focus();return}
      if(event.target.closest('#readerReport')){readerExtra=readerExtra==='report'?'':'report';renderReaderDocument();return}
      if(event.target.closest('[data-reader-back]')){readerExtra='';renderReaderDocument();return}
    });
    document.addEventListener('keydown', event => {
      if(event.key==='Escape'){
        if(!$('modalBackdrop').hidden)closeModal();
        else if(!$('resumeReader').hidden)closeResumeReader();
        return;
      }
      if($('resumeReader').hidden || !$('modalBackdrop').hidden)return;
      if(event.target.matches('[data-reader-tab]') && ['ArrowLeft','ArrowRight'].includes(event.key)){
        event.preventDefault();readerTab=readerTab==='original'?'summary':'original';readerExtra='';renderReaderDocument();$(readerTab==='original'?'readerOriginalTab':'readerSummaryTab').focus();return;
      }
      if(event.key==='Tab'){
        const controls=Array.from($('resumeReader').querySelectorAll('button:not(:disabled),textarea,[tabindex="0"]')).filter(node=>node.getClientRects().length && !node.closest('[inert]'));
        const first=controls[0],last=controls[controls.length-1];
        if(event.shiftKey && document.activeElement===first){event.preventDefault();last.focus()}
        else if(!event.shiftKey && document.activeElement===last){event.preventDefault();first.focus()}
      }
    });
    renderPage();
  </script>
</body>
</html>
