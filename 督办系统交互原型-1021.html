<script>
/* ============================================================
   V5.6 ①粘贴智能识别  ③驾驶舱带筛选跳转
   ============================================================ */
/* 驾驶舱色块 → 事项明细并带上对应筛选 */
function goListFilter(f){
  F.status='全部'; F.dept='全部'; F.imp='全部'; F.fb='全部'; F.favOnly=false; F.kw='';
  if(f){ Object.keys(f).forEach(function(k){ F[k]=f[k]; }); }
  if(location.hash==='#list'){ route(); } else { location.hash='#list'; }
}
/* 粘贴文本 → 要素解析（演示级启发式识别） */
function aiParseText(txt){
  var r = {};
  var lines = txt.split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  var nm = lines[0] || '';
  nm = nm.replace(/^[一二三四五六七八九十0-9]+[、.．]\s*/, '').replace(/^(关于|关于开展|关于做好)/, '').replace(/[，。；,;：:].*$/, '');
  if(nm.length > 40) nm = nm.slice(0, 40);
  r.name = nm;
  r.content = lines.length > 1 ? lines.slice(1).join('\n') : txt;
  var depts = Object.keys(DEPT_LEAD || {});
  var found = depts.filter(function(d){ return txt.indexOf(d) >= 0; });
  if(found.length){
    var lead = null;
    found.forEach(function(d){ if(!lead && new RegExp('(由|责成|请|牵头|主办|主责)' + d).test(txt)) lead = d; });
    r.lead = lead || found[0];
    r.assists = found.filter(function(d){ return d !== r.lead; });
  }
  var pHit = PEOPLE.filter(function(p){ return (p.r === 'person' || p.r === 'exec') && txt.indexOf(p.nm) >= 0; });
  if(pHit.length){
    var ex = pHit.filter(function(p){ return p.r === 'person'; })[0] || pHit[0];
    r.exec = ex.c;
    var mHit = PEOPLE.filter(function(p){ return p.r === 'mgr' && txt.indexOf(p.nm) >= 0; })[0];
    if(mHit) r.mgr = mHit.c;
  }
  r.imp = /(重点|重要|紧急|优先)/.test(txt) ? '重点' : '常规';
  var ds = [];
  var re = /(\d{4})\s*[-\/年.]\s*(\d{1,2})\s*[-\/月.]\s*(\d{1,2})/g, mm;
  while((mm = re.exec(txt))){ var d = new Date(+mm[1], +mm[2]-1, +mm[3]); if(!isNaN(d) && d.getFullYear() > 2000) ds.push(d); }
  var ym = txt.match(/(\d{4})\s*年?\s*(\d{1,2})\s*月底/);
  if(ym){ ds.push(new Date(+ym[1], +ym[2], 0)); }
  if(/年底|年末/.test(txt)){ ds.push(new Date(2026, 11, 31)); }
  if(ds.length){
    var mx = new Date(Math.max.apply(null, ds));
    r.deadline = mx.getFullYear() + '-' + String(mx.getMonth()+1).padStart(2,'0') + '-' + String(mx.getDate()).padStart(2,'0');
  }
  if(/每周/.test(txt)) r.cycle = '每周一反馈';
  else if(/双周|两周/.test(txt)) r.cycle = '每双周一反馈';
  else if(/每月/.test(txt)) r.cycle = '每月15日/30日反馈';
  else if(/季度/.test(txt)) r.cycle = '季度反馈';
  else if(/半年/.test(txt)) r.cycle = '半年度反馈';
  return r;
}
/* 兼容原生 select 与 combo（下拉被替换为输入框+hidden）的统一赋值 */
function aiSetField(id, v){
  var el = document.getElementById(id);
  if(!el || v === undefined || v === null || v === '') return false;
  if(el.tagName === 'SELECT'){
    var hit = Array.prototype.some.call(el.options, function(o){ return o.value === v || o.text === v; });
    if(!hit) return false;
    el.value = v;
    if(typeof el.onchange === 'function'){ try{ el.onchange.call(el); }catch(e){} }
    return true;
  }
  if(el.getAttribute && el.getAttribute('data-combo') === '1'){
    var wrap = el.closest ? el.closest('.combo') : null;
    var vis = wrap ? wrap.querySelector('.combo-in') : null;
    el.value = v;
    if(vis) vis.value = v;
    if(typeof el.onchange === 'function'){ try{ el.onchange.call(el); }catch(e){} }
    return true;
  }
  el.value = v;
  return true;
}
function aiParsePaste(){
  var ta = document.getElementById('aiPasteIn');
  var txt = ta ? ta.value : '';
  if(!txt.trim()){ toast('请先粘贴一段话'); return; }
  var nameEl = document.getElementById('f_name');
  if(!nameEl){ toast('请先切换到手动录入表单'); return; }
  var r = aiParseText(txt);
  var hits = [];
  try{
    if(r.name){ nameEl.value = r.name; hits.push('事项名称'); }
    if(r.content){ var c = document.getElementById('f_content'); if(c){ c.value = r.content; hits.push('待办内容'); } }
    /* 表单下拉已被 combo 组件替换，统一走 aiSetField 兼容原生 select 与 combo */
    if(r.lead && aiSetField('f_lead', r.lead)) hits.push('牵头部门');
    if(r.exec){ var ex = document.getElementById('f_exec'); if(ex){ ex.value = r.exec; refreshExecOptions(); hits.push('落实人'); } }
    if(r.mgr && aiSetField('f_leadMgr', r.mgr)) hits.push('牵头高管');
    if(r.deadline){ var dl = document.getElementById('f_deadline'); if(dl){ dl.value = r.deadline; hits.push('计划完成时间'); } }
    if(r.cycle && aiSetField('f_cycle', r.cycle)) hits.push('反馈周期');
    if(r.imp){ var chip = document.querySelector('#f_imp .chip[data-v="' + r.imp + '"]'); if(chip){ chipSingle(chip); hits.push('重要性'); } }
    if(r.assists && r.assists.length){
      Array.prototype.forEach.call(document.querySelectorAll('#f_assists .chip'), function(ch){
        if(r.assists.indexOf(ch.textContent.trim()) >= 0) ch.classList.add('on');
      });
      hits.push('配合部门');
    }
    cyclePreview();
  }catch(e){}
  var out = document.getElementById('aiParseOut');
  if(out){
    out.style.display = 'block';
    out.innerHTML = '<div class="ai-parse-ok"><i class="fas fa-circle-check"></i><span>AI 已识别并填入 <b>' + hits.length + '</b> 项要素' +
      (hits.length ? '：' + hits.map(esc).join('、') : '（未识别到明确要素，请手工填写）') +
      '。结果仅供预填，请逐项核对调整后再提交。</span></div>';
  }
  toast('AI 识别完成，已填入 ' + hits.length + ' 项，请核对调整');
}
function aiPasteClear(){
  var t = document.getElementById('aiPasteIn'); if(t) t.value = '';
  var o = document.getElementById('aiParseOut');
  if(o){ o.style.display = 'none'; o.innerHTML = ''; }
}
</script>

<script>
/* ============================================================
   V5.6d 各部门完成率（前三 + 后三，中间折叠）
   ============================================================ */
var FB_DEPT_RATE_OPEN = false;
function fbToggleDeptRate(){ FB_DEPT_RATE_OPEN = !FB_DEPT_RATE_OPEN; route(); }
function fbDeptRateHtml(){
  var map = {};
  visibleItems().forEach(function(it){
    var k = it.lead || '其他';
    map[k] = map[k] || {total:0, done:0};
    map[k].total++;
    if(it.status === '已完成') map[k].done++;
  });
  var arr = Object.keys(map).map(function(k){
    var v = map[k];
    return {dept:k, total:v.total, done:v.done, pct: Math.round(v.done/v.total*100)};
  }).sort(function(a,b){ return b.pct - a.pct || b.total - a.total; });
  if(!arr.length) return '';
  var n = arr.length;
  var fold = Math.max(0, n - 6);
  var rows = '';
  for(var i = 0; i < n; i++){
    if(n > 6 && !FB_DEPT_RATE_OPEN && i >= 3 && i < n - 3) continue;
    var x = arr[i];
    var mark = '';
    if(n > 6 && i < 3) mark = '<span class="tag green" style="margin-left:6px">前三</span>';
    if(n > 6 && i >= n - 3 && i >= 3) mark = '<span class="tag red" style="margin-left:6px">后三</span>';
    rows += '<div class="dept-row"><div class="nm" style="width:110px;flex:0 0 110px">' + esc(x.dept) + mark + '</div>' +
      '<div class="track"><i style="width:' + x.pct + '%"></i></div>' +
      '<div class="dnum">' + x.done + '/' + x.total + ' 项 · 完成率 ' + x.pct + '%</div></div>';
  }
  var foldBtn = fold > 0
    ? '<button class="btn sm ghost" style="margin-top:8px" onclick="fbToggleDeptRate()"><i class="fas fa-' + (FB_DEPT_RATE_OPEN ? 'angle-up' : 'angle-down') + '"></i> ' + (FB_DEPT_RATE_OPEN ? '收起中间 ' : '展开中间 ') + fold + ' 个部门</button>'
    : '';
  return '<div class="card fb-dept-rate"><div class="card-hd"><h3><i class="fas fa-chart-simple" style="color:var(--accent)"></i> 各部门完成率</h3>' +
    '<span class="hint">完成率 = 已结项 / 全部事项' + (fold > 0 ? ' · 仅显示前三与后三' : '') + '</span></div>' +

function nowText(){
  var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
/* 当前身份所在部门（作为配合部门）是否在该事项的配合部门里 */
function assistMyDept(it){
  var ds = userDepts();
  var hit = (it.assists||[]).filter(function(d){ return ds.indexOf(d) >= 0; })[0];
  return hit || '';
}
/* 仅部门负责人（exec）可将本部门承担的配合工作派发给本部门员工 */
function assistCanDispatch(it){
  return ROLE === 'exec' && !!assistMyDept(it) && it.status !== '已完成';
}
function assistDispatchOf(it, dept){
  var arr = (it && it.assistDispatch) ? it.assistDispatch : [];
  if(!dept) return arr[0] || null;
  return arr.filter(function(x){ return x.dept === dept; })[0] || null;
}
function openAssistDispatch(id){
  var it = ITEMS.filter(function(x){ return x.id === id; })[0];
  if(!it){ toast('事项不存在'); return; }
  var dept = assistMyDept(it);
  if(!dept){ toast('当前身份不在此事项的配合部门内'); return; }
  var staff = PEOPLE.filter(function(p){ return p.r === 'person' && p.dept === dept; });
  if(!staff.length){ toast('本部门暂无可派发的员工'); return; }
  var cur = assistDispatchOf(it, dept);
  openModal(
    '<div class="hd"><b><i class="fas fa-share-nodes" style="color:var(--accent)"></i> 派发配合工作 · '+esc(dept)+'</b><button class="x" onclick="closeModal()">✕</button></div>'+
    '<div class="bd">'+
      '<div class="ln-hero"><div class="ln-hero-ic"><i class="fas fa-handshake"></i></div><div>'+
        '<div class="ln-hero-t">'+esc(it.name)+'</div>'+
        '<div class="ln-hero-s">牵头部门：'+esc(it.lead)+' · 牵头落实人：'+esc(who(actualExec(it))||'—')+'　|　本部门作为<b>配合部门</b>，可将配合工作派发至本部门员工。派发结果同步给牵头部门负责人与落实人。</div></div></div>'+
      '<div class="frow"><div class="fcell"><label>派发至本部门员工 <span class="req">*</span></label>'+
        '<select id="asDispTo">'+staff.map(function(p){
          return '<option value="'+p.c+'"'+(cur&&cur.to===p.c?' selected':'')+'>'+esc(p.nm+' · '+p.title)+'</option>';
        }).join('')+'</select></div></div>'+
      '<div class="fcell full"><label>配合工作要求</label><textarea id="asDispNote" placeholder="请写明本部门需承担的配合事项、完成标准与时间…">'+esc(cur&&cur.note?cur.note:'')+'</textarea></div>'+
      '<div class="hint" style="margin-top:8px">派发后可在事项详情页「配合部门派发情况」中查看，牵头部门负责人与落实人同步可见。</div>'+
      '<div class="ft" style="margin-top:14px">'+
        '<button class="btn" onclick="closeModal()">取消</button>'+
        '<button class="btn primary" onclick="saveAssistDispatch(\''+id+'\')"><i class="fas fa-check"></i> 确认派发</button>'+
      '</div>'+
    '</div>');
}
function saveAssistDispatch(id){
  var it = ITEMS.filter(function(x){ return x.id === id; })[0];
  if(!it) return;
  var dept = assistMyDept(it);
  var to = (($('#asDispTo')||{}).value||'').trim();
  var note = (($('#asDispNote')||{}).value||'').trim();
  if(!to){ toast('请选择派发对象'); return; }
  var p = person(to);
  var headName = deptHeadOf(it);
  var execName = who(actualExec(it)) || '—';
  it.assistDispatch = (it.assistDispatch||[]).filter(function(x){ return x.dept !== dept; });
  it.assistDispatch.push({dept:dept, to:to, toName:(p?(p.nm||p.c):to), by:CUR, byName:who(CUR), time:nowText(), note:note});
  it.logs = it.logs || [];
  it.logs.push({t:nowText(), who:CUR, act:'配合事项派发',
    txt:'配合部门「'+dept+'」将配合工作派发至本部门员工 '+(p?(p.nm||p.c):to)+(note?'　工作要求：'+note:'')+'；已同步牵头部门负责人 '+headName+' 与落实人 '+execName});
  var box = document.getElementById('bellInbox');
  if(Array.isArray(box)){
    [headName, execName].forEach(function(n){
      if(n && n !== '—') box.push({icon:'fa-share-nodes', title:'配合部门已派发：'+it.name, sub:dept+' · 派发至 '+(p?(p.nm||p.c):to), itemId:it.id});
    });
  }
  closeModal(); route();
  toast('已派发至 '+who(to)+'，并同步给牵头部门负责人 '+headName+' 与落实人 '+execName);
}
/* 详情页展示「配合部门派发情况」（牵头部门负责人 / 落实人 / 配合部门均可见） */

          '<br><span style="color:var(--ink-3)">已同步牵头部门负责人 '+esc(deptHeadOf(it))+' 与落实人 '+esc(who(actualExec(it))||'—')+'</span></div>';

        '<span class="hint">配合部门负责人将配合工作派发至本部门员工 · 牵头部门负责人与落实人同步可见</span></div>'+

/* 配合事项卡：加派发按钮与已派发信息 */
(function(){
  var orig = renderAssist;
  window.renderAssist = function(){
    orig.apply(this, arguments);

    Array.prototype.forEach.call(c.querySelectorAll('.assist-card'), function(card){
      var btn = card.querySelector('[data-assist-btn]');
      if(!btn) return;
      var it = ITEMS.filter(function(x){ return x.id === btn.getAttribute('data-id'); })[0];
      if(!it) return;
      var dept = assistMyDept(it);
      var disp = assistDispatchOf(it, dept);
      if(disp){
        var tip = document.createElement('div');
        tip.className = 'assist-disp';
        tip.innerHTML = '<i class="fas fa-user-check"></i>本部门已派发至 <b>'+esc(disp.toName)+'</b>（'+esc(disp.byName)+' · '+esc(disp.time)+'）'+(disp.note?'　工作要求：'+esc(disp.note):'');
        var body = card.querySelector('.t-body');

<script>
/* ============================================================

/* 三种模板（Excel / Word / PPT）与手动录入统一的字段顺序：必填在前，选填在后 */
const IO_TPL_HEAD = ['事项名称*','待办事项内容*','牵头部门*','落实人*','反馈周期*','计划完成时间*',
                     '重要性','分管高管','配合部门','派发要求 / 首次派发说明','来源','提出时间'];
const IO_TPL_DEMO = ['示例：重点机构营业部摸排专项','完成 28 家营业部底稿复核并形成汇总清单','战略客户部','张三',
                     '每周一反馈','2026-12-31','重点','王总','人力资源部','请于每月 5 日前反馈进展','年度重点工作','2026-10-11'];
/* PPT 模板：与 Excel / Word 同表头，可直接在 PPT 表格中填写后导入 */
function buildImportTplPptx(){
  const grid = '<a:tblGrid>' + IO_TPL_HEAD.map(function(){ return '<a:gridCol w="900000"/>'; }).join('') + '</a:tblGrid>';
  const head = '<a:tr h="563880">' + IO_TPL_HEAD.map(function(t){ return pptCell(t.replace('*',''),'ctr',true); }).join('') + '</a:tr>';
  const rows = '<a:tr h="620000">' + IO_TPL_DEMO.map(function(d){ return pptCell(d,'ctr'); }).join('') + '</a:tr>'
             + '<a:tr h="620000">' + IO_TPL_HEAD.map(function(){ return pptCell('','ctr'); }).join('') + '</a:tr>'
             + '<a:tr h="620000">' + IO_TPL_HEAD.map(function(){ return pptCell('','ctr'); }).join('') + '</a:tr>';
  const slide = PPT_SLIDE_TPL.replace('@@TITLE@@', pptEsc('待办事项导入模板（与 Excel / Word 模板一致）'))
                             .replace('@@GRID@@', grid)
                             .replace('@@HEADROW@@', head)
                             .replace('@@ROWS@@', rows);
  const files = [];
  Object.keys(PPT_BASE).forEach(function(n){ files.push({name:n, data:pptB64(PPT_BASE[n])}); });
  files.push({name:'ppt/slides/slide1.xml', data:pptBytes(slide)});
  files.push({name:'ppt/slides/_rels/slide1.xml.rels', data:pptBytes(PPT_SLIDE_RELS_TPL)});
  files.push({name:'[Content_Types].xml', data:pptBytes(PPT_CT_TPL.replace('@@CT_SLIDES@@','<Override PartName="/ppt/slides/slide1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>'))});
  files.push({name:'ppt/_rels/presentation.xml.rels', data:pptBytes(PPT_PRES_RELS_TPL.replace('@@REL_SLIDES@@','<Relationship Id="rId10" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide1.xml"/>'))});
  files.push({name:'ppt/presentation.xml', data:pptBytes(PPT_PRESENTATION_TPL.replace('@@SLDIDS@@','<p:sldIdLst><p:sldId id="256" r:id="rId10"/></p:sldIdLst>'))});
  return zipStore(files);
}
/* 一键催办：复制企微催办文案（无剪贴板权限时弹窗供手动复制） */
function copyRemind(id){
  var it = ITEMS.filter(function(x){ return x.id === id; })[0];
  if(!it){ toast('事项不存在：' + id); return; }

    + '本期应反馈：' + (it.nextDue || '—') + '　当前状态：' + (it.status || '在途') + '\n'
    + '请您尽快登录盯盯喵提交进展反馈（本期落地执行情况 / 下期工作计划），谢谢配合。';
  var done = function(){
    toast('催办文案已复制，可直接粘贴到企业微信发送');
    it.logs = it.logs || [];
    it.logs.push({t:nowText(), who:CUR, act:'一键催办', txt:'已复制催办文案（企微），催办对象：' + execName});
  };
  var fallback = function(){
    try{
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok) return done();
    }catch(e){}

/* 各部门完成率：按角色差异化（督办管理人/公司领导=全部部门；分管高管=分管部门；部门负责人=各落实人；落实人=本人事项） */
function fbDeptRateHtml(){
  var base = visibleItems().slice();
  var roleLabel = '各部门完成率';
  var hint = '完成率 = 已结项 / 全部事项';
  var groupKey = function(it){ return it.lead || '其他'; };
  var nmW = 110;
  if(ROLE === 'mgr'){
    var ds = userDepts();
    base = base.filter(function(it){ return ds.indexOf(it.lead) >= 0; });
    roleLabel = '分管部门完成率';
    hint = '仅显示您分管的部门（' + ds.join('、') + '）';
  }else if(ROLE === 'exec'){
    var myDept = userDepts()[0] || '';
    base = base.filter(function(it){ return it.lead === myDept || actualDept(it) === myDept; });
    groupKey = function(it){ return who(actualExec(it)) || '待分配'; };
    roleLabel = '本部门各落实人完成率';
    hint = '按落实人统计（部门：' + myDept + '）';
    nmW = 96;
  }else if(ROLE === 'person'){
    base = base.filter(function(it){ return actualExec(it) === CUR || (it.chain || []).indexOf(CUR) >= 0; });
    groupKey = function(){ return '我的事项'; };
    roleLabel = '我的事项完成率';
    hint = '完成率 = 已结项 / 我名下全部事项';
  }
  var map = {};
  base.forEach(function(it){
    var k = groupKey(it);
    map[k] = map[k] || {total:0, done:0};
    map[k].total++;
    if(it.status === '已完成') map[k].done++;
  });
  var arr = Object.keys(map).map(function(k){
    var v = map[k];
    return {dept:k, total:v.total, done:v.done, pct: Math.round(v.done/v.total*100)};
  }).sort(function(a,b){ return b.pct - a.pct || b.total - a.total; });
  if(!arr.length) return '';
  var n = arr.length;
  var fold = (ROLE === 'admin' || ROLE === 'boss') ? Math.max(0, n - 6) : 0;
  var rows = '';
  for(var i = 0; i < n; i++){
    if(fold > 0 && !FB_DEPT_RATE_OPEN && i >= 3 && i < n - 3) continue;
    var x = arr[i];
    var mark = '';
    if(fold > 0 && i < 3) mark = '<span class="tag green" style="margin-left:6px">前三</span>';
    if(fold > 0 && i >= n - 3 && i >= 3) mark = '<span class="tag red" style="margin-left:6px">后三</span>';
    rows += '<div class="dept-row"><div class="nm" style="width:'+nmW+'px;flex:0 0 '+nmW+'px">' + esc(x.dept) + mark + '</div>' +
      '<div class="track"><i style="width:' + x.pct + '%"></i></div>' +
      '<div class="dnum">' + x.done + '/' + x.total + ' 项 · 完成率 ' + x.pct + '%</div></div>';
  }
  var foldBtn = fold > 0
    ? '<button class="btn sm ghost" style="margin-top:8px" onclick="fbToggleDeptRate()"><i class="fas fa-' + (FB_DEPT_RATE_OPEN ? 'angle-up' : 'angle-down') + '"></i> ' + (FB_DEPT_RATE_OPEN ? '收起中间 ' : '展开中间 ') + fold + ' 个部门</button>'
    : '';
  return '<div class="card fb-dept-rate"><div class="card-hd"><h3><i class="fas fa-chart-simple" style="color:var(--accent)"></i> ' + esc(roleLabel) + '</h3>' +
    '<span class="hint">' + esc(hint) + (fold > 0 ? ' · 仅显示前三与后三' : '') + '</span></div>' +
    '<div class="card-bd">' + rows + foldBtn + '</div></div>';
}
</script>

              meetingReviewTodoMe(it) || meetingOpenTodoMe(it) || meetingConclusionTodoMe(it));
  });
}

<script>
/* 批量标注关注 / 取消关注（V5.20） */
function selWatch(){
  if(!SEL.size){ toast('请先勾选事项'); return; }
  var n = 0;
  SEL.forEach(function(id){
    var it = ITEMS.filter(function(x){ return x.id === id; })[0];
    if(!it) return;
    it.favBy = it.favBy || {};
    if(!it.favBy[CUR]){ it.favBy[CUR] = nowText(); n++; }
    it.fav = Object.keys(it.favBy).length > 0;
  });
  route();
  toast(n ? '已关注选中的 ' + n + ' 项事项' : '选中事项均已在关注中');
}
function selUnwatch(){
  if(!SEL.size){ toast('请先勾选事项'); return; }
  var n = 0;
  SEL.forEach(function(id){
    var it = ITEMS.filter(function(x){ return x.id === id; })[0];
    if(!it || !it.favBy || !it.favBy[CUR]) return;
    delete it.favBy[CUR];
    it.fav = Object.keys(it.favBy).length > 0;
    n++;
  });
  route();
  toast(n ? '已取消关注选中的 ' + n + ' 项事项' : '选中事项均未在关注中');
}
</script>

function nbCsv(text){const rows=[],row=[];let cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row.splice(0));else row.length=0;cell='';}else cell+=c;}if(quoted)throw Error('CSV 引号未闭合，请检查文件');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;}

function nbFromText(text){const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),numbered=/^(?:[一二三四五六七八九十百\d]+[、.．)）]|[（(][一二三四五六七八九十\d]+[)）]|[-*]\s)/;let blocks=[];if(lines.filter(s=>numbered.test(s)).length>1){for(const s of lines){if(numbered.test(s))blocks.push(s);else if(blocks.length)blocks[blocks.length-1]+='\n'+s;}}else blocks=lines.filter(s=>s.length>6&&/完成|负责|提交|推进|落实|制定|形成|开展|建立|整改|反馈/.test(s));return blocks.map(txt=>{const p=aiParseText(txt);return {d:{...nvDefaults(),name:p.name||'',content:txt,lead:p.lead||'',exec:p.exec||'',deadline:p.deadline||'',cycle:txt.match(/每(?:双周|周|月|季度|年)[^，。；,\n]{0,16}反馈/)?.[0]||'',importance:p.imp||'常规',assists:p.assists||[]},quote:txt};});}

<script>
/* Priority review fixes: current-period feedback, calendar periods, global counts and close workflow. */
function rvDate(value){
  const s=String(value||'');
  if(!/^\d{4}-\d{2}-\d{2}/.test(s))return null;
  const d=new Date(s.slice(0,10)+'T00:00:00');
  return Number.isNaN(+d)||rvDateText(d)!==s.slice(0,10)?null:d;
}
function rvDateText(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function rvValidRecordTime(value){return !!rvDate(value)&&!Number.isNaN(+new Date(String(value).replace(' ','T')));}
function rvCycleMonths(it){
  const c=String(it?.cycle||'');
  if(/半年|半年度/.test(c))return 6;
  if(/季/.test(c))return 3;
  if(/月/.test(c))return 1;
  if(/每年|年度|年反馈/.test(c))return 12;
  return 0;
}
feedbackDays=function(it){
  const months=rvCycleMonths(it),end=rvDate(it?.nextDue);
  if(months&&end){
    const start=rvPeriodStart(it,end);
    return Math.round((end-start)/86400000)+1;
  }
  if(months)return months*30;
  return /双周|两周/.test(String(it?.cycle||''))?14:7;
};
function rvPeriodStart(it,end){
  const months=rvCycleMonths(it);
  return months?new Date(end.getFullYear(),Math.floor(end.getMonth()/months)*months,1):new Date(end.getFullYear(),end.getMonth(),end.getDate()-feedbackDays(it)+1);
}
feedbackWindow=function(it){
  const end=rvDate(it?.nextDue);
  if(!end)return {start:'—',end:'—',cutoff:'—',label:'—'};
  const start=rvDateText(rvPeriodStart(it,end)),finish=rvDateText(end);
  return {start,end:finish,cutoff:finish+' 12:00:00',label:start+' 至 '+finish+' · 截止 '+finish+' 12:00:00'};
};
function rvNextFeedbackDue(it,base){
  const next=new Date(base),months=rvCycleMonths(it);
  if(!months){next.setDate(next.getDate()+feedbackDays(it));return next;}
  const day=base.getDate(),last=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  const targetLast=new Date(base.getFullYear(),base.getMonth()+months+1,0).getDate();
  next.setDate(1);next.setMonth(base.getMonth()+months);next.setDate(day===last?targetLast:Math.min(day,targetLast));
  return next;
}
function rvCurrentReport(it){
  const period=Number(it?.periodNo||1),report=it?.fbReport;
  if(it?.feedback!=='已反馈')return null;
  if(report&&(!report.periodNo||Number(report.periodNo)===period))return report;
  return (it.feedbackHistory||[]).filter(h=>Number(h.periodNo)===period).slice(-1)[0]||null;
}
fbFeedback=function(it){
  const report=rvCurrentReport(it);
  return report?{cur:fbPickText(report.current,report.txt),nxt:fbPickText(report.next,report.np)}:{cur:'',nxt:''};
};
function rvFeedbackReviewBadge(it){
  let label='',tone='pending';
  if(it.feedbackReturn){
    label=({dept:'已退回 · 待部门重审',mgr:'已退回 · 待分管高管重审',admin:'已退回 · 待管理人重审'}[it.feedbackReturn.to]||'已退回 · 待落实人修改');
    tone='returned';
  }else if(it.feedback==='已反馈'){
    if(!rvCurrentReport(it))label='本期材料待核对';
    else{
      label=({dept:'部门负责人审核中',mgr:'分管高管审核中',admin:'督办管理人审核中',sync:'待领导审阅',done:'已审核'}[it.fbStage]||'待审核');
      if(it.fbStage==='done')tone='approved';
    }
  }
  return label?`<div class="x-feedback-review"><span class="x-review-state ${tone}">${esc(label)}</span></div>`:'';
}
function rvFeedbackCurrentText(it){
  const text=fbFeedback(it).cur;
  if(text)return text;
  if(it.feedbackReturn)return '待修改后重新提交';
  return it.feedback==='已反馈'?'暂无本期落实内容':'本期未反馈';
}
function rvNeedsFeedback(it){return feedbackFilterMatch(it,'未反馈');}
function rvNormalizeFeedbackReviewStages(){
  let changed=false;
  ITEMS.forEach(it=>{
    if(it.status==='已完成'||it.feedback!=='已反馈'||it.fbStage!=='dept')return;
    const executor=actualExec(it),reviewer=deptReviewer(it);
    if(!executor||executor!==reviewer)return;
    const stamp=nowRecordTime();
    const record=(it.feedbackHistory||[]).filter(h=>Number(h.periodNo)===Number(it.periodNo||1)).slice(-1)[0];
    if(record)record.deptAudit='跳过（落实人兼任部门负责人）';
    if(it.feedbackReturn?.to==='dept'){
      it.feedbackReturn.to='person';it.fbStage='';it.feedback='未反馈';it.fbReport=null;
      (it.logs||=[]).push({t:stamp,who:'系统',act:'退回反馈环节校正',txt:'落实人与部门负责人均为'+who(executor)+'，按原退回意见交落实人修改，避免退回到本人审核环节。'});
    }else{
      it.fbStage='mgr';if(record)record.mgrAudit='待审核';
      (it.fbApprovalLog||=[]).push({t:stamp,from:'系统',fromRole:'部门负责人环节',toRole:r5FeedbackRole(it),to:r5FeedbackReviewer(it)||'—',act:'跳过本人审核'});
      (it.logs||=[]).push({t:stamp,who:'系统',act:'反馈审核环节校正',txt:'落实人与部门负责人均为'+who(executor)+'，跳过本人审核，转'+r5FeedbackRole(it)+who(r5FeedbackReviewer(it))+'审核。原填报内容和提交时间保留。'});
    }
    it.xFeedbackSaved=true;changed=true;
  });
  if(changed)xSave();return changed;
}
const rvOriginalBackTargets=fbBackTargets;
fbBackTargets=function(it,lvl){return rvOriginalBackTargets(it,lvl).filter(target=>target.v!=='dept'||deptReviewer(it)!==actualExec(it));};
const rvOriginalCanDispatch=canDispatch;
canDispatch=function(it){return !!it&&it.feedback!=='已反馈'&&!it.fbStage&&rvOriginalCanDispatch(it);};
['fbAgree','fbBack','fbSaveEdit'].forEach(name=>{
  const action=window[name];if(typeof action!=='function')return;
  window[name]=function(id){
    const it=ITEMS.find(item=>item.id===id),before=it&&JSON.stringify([it.feedback,it.fbStage,it.fbReport,it.feedbackReturn,it.feedbackHistory,it.logs]);
    const result=action.apply(this,arguments);
    if(it&&before!==JSON.stringify([it.feedback,it.fbStage,it.fbReport,it.feedbackReturn,it.feedbackHistory,it.logs])){it.xFeedbackSaved=true;xSave();}
    return result;
  };
});
function rvIsOverdue(it){const end=rvDate(it?.deadline);return !!end&&end<rvDate(todayDateOnly());}
function rvIsDue(it){const end=rvDate(it?.deadline);return !!end&&!rvIsOverdue(it)&&fbWdUntil(it.deadline)<=10;}
fbBoardList=function(){return visibleItems().filter(it=>it.status!=='已完成');};
fbClosePending=function(it){
  return !!it&&!!it.closeRequest&&it.status!=='已完成'&&it.closeRequest.status!=='已退回'&&(
    ['dept','admin'].includes(it.closeStage)||(!it.closeStage&&['待审核','待部门负责人确认','督办管理人审核中'].includes(it.closeRequest?.status))
  );
};
fbCloseSource=function(it){
  if(it.closeStage==='dept')return '待部门负责人确认';
  if(it.closeStage==='admin')return '待督办管理人审核';
  return '已提交结项申请';
};
fbClosedDone=function(it){return !!it&&it.status==='已完成'&&!!it.closeRequest&&(it.closeStage==='done'||it.closeRequest.status==='已办结');};
function rvNeedsCloseApplication(it){return !!it?.completionReconcile&&it.status!=='已完成'&&!fbClosePending(it);}
function rvCompletionLabel(it){return fbClosedDone(it)?'已结项':rvNeedsCloseApplication(it)?'待申请结项':'';}
function rvCompletionBadge(it){const text=rvCompletionLabel(it);return text?`<div class="x-completion-meta">${esc(text)}</div>`:'';}
function rvNormalizeCompletionData(){
  ITEMS.forEach(it=>{
    if(it.status==='已完成'&&!fbClosedDone(it)){
      it.completionReconcile=it.completionReconcile||{previousStatus:it.status,reason:'原记录缺少正式结项申请'};
      it.status='在途';if(!it.closeRequest)it.closeStage='';rvPersistClose(it);
    }
  });
}
function rvEnterCloseStage(it,stage,stamp=nowRecordTime()){
  if(!it.closeRequest)return;
  Object.assign(it.closeRequest,{timerStage:stage,stageEnteredAt:stamp});
  if(stage==='admin')it.closeRequest.adminEnteredAt=stamp;
}
function rvPersistClose(it){it.xCloseSaved=true;xSave();}
function rvCloseAuditSync(){
  AUDITS=AUDITS.filter(a=>{const it=ITEMS.find(i=>i.id===(a.itemId||a.id));return fbClosePending(it)&&it.closeStage==='admin';});
  ITEMS.filter(it=>fbClosePending(it)&&it.closeStage==='admin').forEach(it=>{
    if(!AUDITS.some(a=>(a.itemId||a.id)===it.id))pushCloseAudit(it);
  });
}
fbCloseAutoSweep=function(){
  let changed=false;
  ITEMS.forEach(it=>{
    const req=it.closeRequest,stage=it.closeStage;
    if(it.status==='已完成'||!['dept','admin'].includes(stage)||!req||['已退回','已办结'].includes(req.status))return;
    const stamp=nowRecordTime();
    if(req.timerStage!==stage||!rvValidRecordTime(req.stageEnteredAt)){
      // Department time can be recovered from submission. Never reuse submission time for an unknown admin receipt.
      const entered=stage==='dept'&&rvValidRecordTime(req.time)?req.time:stage==='admin'&&rvValidRecordTime(req.adminEnteredAt)?req.adminEnteredAt:stamp;
      rvEnterCloseStage(it,stage,entered);rvPersistClose(it);changed=true;
    }
    if(fbWdBetween(req.stageEnteredAt,new Date())<10)return;
    if(stage==='dept'){
      it.closeStage='admin';it.flowStep=2;req.status='督办管理人审核中';
      rvEnterCloseStage(it,'admin',stamp);
      (it.logs||=[]).push({t:stamp,who:'系统',act:'结项流程流转',txt:'部门确认环节已满 10 个工作日，流转督办管理人审核；管理人环节从本次接收时间起算。'});
      pushCloseAudit(it);rvPersistClose(it);changed=true;return;
    }
    it.status='已完成';it.flowStep=4;it.closeStage='done';
    Object.assign(req,{status:'已办结',autoDoneAt:stamp,completedAt:stamp});
    (it.logs||=[]).push({t:stamp,who:'系统',act:'结项自动生效',txt:'督办管理人审核环节已满 10 个工作日，事项自动办结。'});
    notifyCloseCompleted(it);rvPersistClose(it);changed=true;
  });
  rvCloseAuditSync();return changed;
};
const rvOldNotifyClose=notifyCloseCompleted;
notifyCloseCompleted=function(it){
  if(it){it.closeRequest=it.closeRequest||{};it.closeRequest.completedAt=it.closeRequest.completedAt||it.closeRequest.autoDoneAt||nowRecordTime();}
  const result=rvOldNotifyClose.apply(this,arguments);
  if(it){rvCloseAuditSync();rvPersistClose(it);}
  return result;
};
// Existing permissions and action implementations stay authoritative; persist their successful state changes.
['submitClose','closeDeptPass','closeDeptReject','adminCloseReject','auditReject'].forEach(name=>{
  const action=window[name];
  window[name]=function(){
    const before=new Map(ITEMS.map(it=>[it.id,{stage:it.closeStage,time:it.closeRequest?.time,json:JSON.stringify([it.closeStage,it.closeRequest])}]));
    const result=action.apply(this,arguments);
    ITEMS.forEach(it=>{
      const prev=before.get(it.id);
      if(prev&&prev.json!==JSON.stringify([it.closeStage,it.closeRequest])){
        if(['dept','admin'].includes(it.closeStage)&&(it.closeStage!==prev.stage||it.closeRequest?.time!==prev.time))rvEnterCloseStage(it,it.closeStage);
        rvPersistClose(it);
      }
    });
    rvCloseAuditSync();return result;
  };
});
function rvCloseCompletedDate(it){
  const req=it.closeRequest||{};
  return req.completedAt||req.autoDoneAt||(it.logs||[]).filter(l=>/结项审核通过|结项确认|结项自动生效/.test(l.act||'')).slice(-1)[0]?.t||'';
}
const rvOldCloseRow=fbCloseRow;
fbCloseRow=function(it,kind){
  let row=rvOldCloseRow(it,kind);
  if(kind!=='closed')return row;
  // The original row mistook the application date for the completion date.
  const old=it.closeRequest?.time;
  if(old)row=row.replace('<span class="tag gray">'+esc(String(old).slice(0,10))+'</span>','');
  const actual=rvCloseCompletedDate(it);
  return row.replace('<span class="tag green">已结项</span>','<span class="tag green">已结项</span><span class="tag gray">'+(actual?'办结：'+esc(String(actual).slice(0,10)):'办结日期未登记')+'</span>');
};
const rvOldConfirmClose=fbConfirmClose;
fbConfirmClose=function(id){
  const it=ITEMS.find(it=>it.id===id);
  if(!fbClosePending(it)){toast('请先正式提交结项申请');return;}
  if(it.closeStage!=='admin'){toast('请先完成部门负责人确认，再由督办管理人审核');return;}
  return rvOldConfirmClose.apply(this,arguments);
};
const rvOldRollPeriod=rollPeriod;
rollPeriod=function(id){
  const it=ITEMS.find(i=>i.id===id),before=it?.periodNo;
  const result=rvOldRollPeriod.apply(this,arguments);
  if(it&&it.periodNo!==before){it.xFeedbackSaved=true;xSave();}
  return result;
};

// One set of mandatory task queues feeds the menu badge, tab counts and cards.
workflowAuditTodo=function(it){return !!it&&it.status!=='已完成'&&(
  fbTodoMe(it)||closeTodoMe(it)||closeAdminTodoMe(it)||meetingReviewTodoMe(it)
);};
myTaskAuditItems=function(){return visibleItems().filter(workflowAuditTodo);};
myTaskDispatchItems=function(){
  return visibleItems().filter(it=>it.status!=='已完成'&&(
    dispatchTodoMe(it)||canDispatch(it)||canSubmitFeedback(it)||meetingOpenTodoMe(it)||meetingConclusionTodoMe(it)||
    (canCurrentExecutorWorkflow(it)&&(it.closeRequest?.status==='已退回'||meetingLatest(it)?.status==='已退回'))
  ));
};
workflowTodoItems=function(){return [...new Map([...myTaskAuditItems(),...myTaskDispatchItems()].map(it=>[it.id,it])).values()];};
function rvTaskQueueHint(audit,handling){return audit.some(it=>handling.some(other=>other.id===it.id))?'同一事项可有不同待办，菜单数量按事项去重':'';}
let RV_TASK_EXPLICIT_TAB=false;
let RV_AUDIT_FOCUS_ID='';
function rvGoTaskAudit(id){
  const it=visibleItems().find(item=>item.id===id);
  if(!it||!workflowAuditTodo(it)){toast('该事项当前没有待您审核的内容');return false;}
  TODO_TAB='audit';RV_TASK_EXPLICIT_TAB=true;RV_AUDIT_FOCUS_ID=id;
  if(location.hash==='#todo')route();else go('todo');
  return true;
}
function rvListAuditEntry(it){return workflowAuditTodo(it)?`<button class="btn sm primary" onclick="event.stopPropagation();rvGoTaskAudit(${xQ(JSON.stringify(it.id))})"><i class="fas fa-user-check"></i> 去审核</button>`:'';}
const rvOldRenderTodo=renderTodo;
renderTodo=function(){
  rvNormalizeFeedbackReviewStages();
  const audit=myTaskAuditItems(),dispatch=myTaskDispatchItems();
  if(!RV_TASK_EXPLICIT_TAB){
    if(TODO_TAB==='audit'&&!audit.length&&dispatch.length)TODO_TAB='dispatch';
    if(TODO_TAB==='dispatch'&&!dispatch.length&&audit.length)TODO_TAB='audit';
  }
  RV_TASK_EXPLICIT_TAB=false;const result=rvOldRenderTodo.apply(this,arguments);
  if(RV_AUDIT_FOCUS_ID){
    const id=RV_AUDIT_FOCUS_ID;RV_AUDIT_FOCUS_ID='';
    requestAnimationFrame(()=>{const card=document.querySelector('[data-task-item='+JSON.stringify(id)+']');if(card){card.classList.add('rv-task-focus');card.scrollIntoView({block:'center',behavior:'smooth'});}});
  }
  return result;
};
const rvOldTaskPrimary=todoPrimaryState;
todoPrimaryState=function(it){
  if(meetingConclusionTodoMe(it))return {label:canSubmitFeedback(it)?'待填会议结论 · 待反馈':'待填写会议结论',cls:'amber'};
  if(meetingOpenTodoMe(it))return {label:canSubmitFeedback(it)?'待开专题会 · 待反馈':'待开专题会',cls:'amber'};
  if(it.closeRequest?.status==='已退回')return {label:'待修改结项申请',cls:'amber'};
  if(rvNeedsCloseApplication(it))return {label:'待申请结项',cls:'amber'};
  if(canSubmitFeedback(it))return {label:it.feedbackReturn?'待修改反馈':'待填写反馈',cls:'amber'};
  return rvOldTaskPrimary(it);
};
const rvOldAuditOps=fbAuditOps;
fbAuditOps=function(it){
  const ops=rvOldAuditOps(it);
  return ops.replace(/<button\b[\s\S]*?<\/button>/g,button=>/\b(?:fbAgree|openFbEdit|openFbBack|openFbBossReview|closeDeptPass|openCloseReject|adminClose|approveMeeting|openMeetingReject)\(/.test(button)?button:'');
};
function rvTaskStageLabel(it,tab){
  if(tab!=='audit')return todoPrimaryState(it).label;
  if(closeAdminTodoMe(it))return '待您审核 · 结项申请';
  if(closeTodoMe(it))return '待您确认 · 结项申请';
  if(meetingReviewTodoMe(it))return '待您审核 · 专题会申请';
  return fbTodoLabel(it)||'待您审核';
}
function rvTaskMeetingBrief(it){
  if(!meetingOpenTodoMe(it)&&!meetingConclusionTodoMe(it))return '';
  const mr=meetingLatest(it);if(!mr)return '';
  return `<div class="rv-meeting-brief"><b>专题会申请：</b>${esc(mr.reason||'—')}<br><b>拟汇报内容：</b>${esc(mr.script||'—')}<br><b>当前状态：</b>${esc(meetingStatusLabel(mr))}</div>`;
}

let RV_DRILL={kind:'',kw:''};
function rvDrillItems(kind,keyword=''){
  const base=kind==='closed'?visibleItems().filter(fbClosedDone):fbBoardList();
  const predicate={nofb:rvNeedsFeedback,due:rvIsDue,overdue:rvIsOverdue,closereq:fbClosePending,closed:fbClosedDone}[kind];
  let list=base.filter(predicate||(()=>true));
  const kw=keyword.trim().toLowerCase();
  if(kw)list=list.filter(it=>[it.name,it.id,it.lead,who(actualExec(it)),it.deadline,kind==='closed'?rvCloseCompletedDate(it):''].join(' ').toLowerCase().includes(kw));
  if(kind==='closed')return list.sort((a,b)=>String(rvCloseCompletedDate(b)).localeCompare(String(rvCloseCompletedDate(a)))||a.id.localeCompare(b.id));
  return fbSorted(list);
}
function rvDrillTitle(kind){return {nofb:'本期未反馈',due:'临期事项',overdue:'逾期事项',closereq:'结项审批',closed:'结项事项'}[kind]||'事项';}
function rvDrillHint(kind,total,count,kw){
  const scope=kind==='closed'?'按实际办结日倒序':kind==='closereq'?'仅含正式结项申请':kind==='due'?'不含已逾期':'当前可见范围';
  return scope+' · '+(kw.trim()?'匹配 '+count+' 项 / 共 '+total+' 项':'共 '+count+' 项');
}
function rvDrillRows(kind,list){return list.length?list.map(it=>kind==='nofb'?fbDrillRow(it):fbCloseRow(it,kind)).join(''):'<div class="drill-empty">暂无符合条件的事项</div>';}
const rvOldDrill=fbDrill,rvOldDrillFilter=fbDrillFilter;
fbDrill=function(kind){
  if(!['nofb','due','overdue','closereq','closed'].includes(kind)){RV_DRILL={kind:'',kw:''};return rvOldDrill(kind);}
  RV_DRILL={kind,kw:''};const list=rvDrillItems(kind);
  openModal(`<div class="hd"><b id="rvDrillTitle">${rvDrillTitle(kind)} · 明细下钻（${list.length}）</b><button class="x" onclick="closeModal()">✕</button></div><div class="bd"><div class="drill-top"><span class="hint" id="rvDrillHint">${rvDrillHint(kind,list.length,list.length,'')}</span><div class="drill-search"><i class="fas fa-magnifying-glass"></i><input id="drillKw" placeholder="搜索事项、落实人、部门${kind==='closed'?'、办结日期':''}" oninput="fbDrillFilter()"></div></div><div class="drill-list" id="rvDrillRows">${rvDrillRows(kind,list)}</div><div class="ft" style="margin-top:14px"><button class="btn" onclick="closeModal()">关闭</button><button class="btn" onclick="closeModal();go('list')">在事项明细中查看</button></div></div>`);
};

  const clock=Math.max(0,Math.min(width-timeWidth,(time??100)/100*width-timeWidth/2));

  if(width>0&&progress!==null&&time!==null&&separate)return {mode:'anchored',task,clock};
  const groupWidth=taskWidth+timeWidth+8;
  if(groupWidth>width)return {mode:'stacked',task:0,clock:Math.max(0,width-timeWidth)};
  const midpoint=((progress??time??50)+(time??progress??50))/200*width;

// Pure placement rule: prefer either side, then above/below, always inside viewport.
function xPeekPlacement(anchor,width,height,vw,vh){
  const pad=12,gap=10,w=Math.min(width,vw-pad*2),h=Math.min(height,vh-pad*2);
  let left,top;
  if(anchor.right+gap+w<=vw-pad){left=anchor.right+gap;top=anchor.top;}
  else if(anchor.left-gap-w>=pad){left=anchor.left-gap-w;top=anchor.top;}
  else{left=anchor.left+(anchor.width-w)/2;top=anchor.bottom+gap;if(top+h>vh-pad)top=anchor.top-gap-h;}
  return {left:Math.max(pad,Math.min(left,vw-pad-w)),top:Math.max(pad,Math.min(top,vh-pad-h)),width:w};
}

function p22SubmitChange(){const op=P22_PENDING;if(ROLE!=='admin'||!op||op.owner!==CUR||op.phase!=='edit')return;op.reason=$('#p22Reason')?.value.trim()||'';op.due=op.action==='date'?$('#p22Due')?.value||'':'';if(op.action==='date'&&!rvDate(op.due)){toast('请选择调整截止日期');return;}const rows=p22OpRows(op);if(!rows.length){toast('所选期次已发生变化，请重新选择');p22DismissChange();return;}if(rows.some(r=>r.generated)){p22ConfirmChange(rows);return;}p22ApplyChange(false);}
function p22ConfirmChange(rows){const op=P22_PENDING;if(!op)return;op.phase='confirm';op.stamp=p22OpStamp(rows);const generated=rows.filter(r=>r.generated),review=generated.filter(r=>r.p.data.fbReport||r.p.data.fbStage||r.p.data.feedbackReturn);openModal('<div class="hd"><b>确认'+(op.action==='date'?'调整已生成任务':'取消已生成任务')+'</b></div><div class="bd p22-manager"><p>所选期次中有 <b>'+generated.length+' 条</b>已生成任务'+(review.length?'，其中 '+review.length+' 条已提交、审核中或已退回':'')+'。</p><p>'+(op.action==='date'?'截止日期将统一改为 <b>'+esc(op.due)+'</b>，相关任务、提醒和逾期判断同步更新，已有反馈和审核记录保留。':'取消后将撤销这些期次未完成的填报、修改及审核任务；已有材料与审批记录保留。')+'</p>'+(op.action==='cancel'&&review.length?'<label class="p22-confirm-check"><input type="checkbox" id="p22ConfirmCancel">确认终止所选期次相关流程</label>':'')+'</div><div class="ft"><button class="btn" onclick="p22DismissChange()">暂不调整</button><button class="btn '+(op.action==='date'?'primary':'danger')+'" onclick="p22ApplyChange(true)">确认'+(op.action==='date'?'调整':'取消')+'</button></div>');}
function p22ApplyChange(confirmed=false){const op=P22_PENDING;if(ROLE!=='admin'||!op||op.owner!==CUR)return;if(op.action==='date'&&!rvDate(op.due))return;const rows=p22OpRows(op),generated=rows.filter(r=>r.generated);if(generated.length&&(!confirmed||op.phase!=='confirm'||op.stamp!==p22OpStamp(rows))){p22ConfirmChange(rows);return;}if(op.action==='cancel'&&generated.some(r=>r.p.data.fbReport||r.p.data.fbStage||r.p.data.feedbackReturn)&&!$('#p22ConfirmCancel')?.checked){toast('请确认终止相关流程');return;}
  return wfRunRecordedCommand('feedbackPeriodChange',function(){let count=0;rows.forEach(r=>{const it=r.it,p=r.p,stamp=nowRecordTime();if(!r.generated){const s=it.feedbackSchedule;s.adjustments||={};const change=s.adjustments[r.originalDue]||={due:r.originalDue};if(op.action==='date'){change.due=op.due;change.adjustedAt=stamp;change.adjustedBy=CUR;}else{change.cancelledAt=stamp;change.cancelledBy=CUR;}change.reason=op.reason;(change.changes||=[]).push({at:stamp,by:CUR,action:op.action,due:op.due,reason:op.reason});}else{
    if(op.action==='date'){p.data.nextDue=op.due;p.adjustedAt=stamp;p.adjustedBy=CUR;p.adjustReason=op.reason;}else{p.cancelledAt=stamp;p.cancelledBy=CUR;p.cancelReason=op.reason;(it.feedbackHistory||[]).filter(h=>Number(h.periodNo)===p.no).forEach(h=>{h.reviewSnapshot={...(h.reviewSnapshot||{}),outcome:'cancelled',cancelledAt:stamp};h.reviewFrozen=true;});(it.noticeEvents||[]).filter(n=>Number(n.payload?.periodNo)===p.no&&['feedback','supervisor'].includes(n.kind)&&!n.readAt).forEach(n=>{n.withdrawnAt=stamp;n.withdrawnReason='反馈期次已取消';});}(p.changes||=[]).push({at:stamp,by:CUR,action:op.action,due:op.due,reason:op.reason});if(Number(it.periodNo)===p.no)p22Apply(it,p.data);
    }(it.logs||=[]).push({t:stamp,who:CUR,act:op.action==='cancel'?'取消反馈期次':'调整反馈截止日期',txt:(p?'第'+p.no+'期':'原定 '+r.originalDue+' 排期')+'：'+(op.action==='date'?op.due+' 12:00':'已取消')+(op.reason?'；'+op.reason:'')});count++;});if(count&&op.action==='date'){P22_FILTER.dueFrom=op.due;P22_FILTER.dueTo=op.due;}P22_PENDING=null;xSave();closeModal();route();toast('已处理 '+count+' 条反馈期次');},this,[]);
}
function p22AddItems(){return p22EligibleItems(P22_NEW_FILTER).filter(it=>it.status!=='已完成');}
function p22AddForm(keep=false){if(ROLE!=='admin')return;p22FilterInit();let due='',reason='',selected=null;if(keep){due=$('#p22NewDue')?.value||'';reason=$('#p22NewReason')?.value||'';selected=new Set([...document.querySelectorAll('[name="p22NewItem"]:checked')].map(e=>e.value));P22_NEW_FILTER={closeFrom:$('#p22NewCloseFrom')?.value||'',closeTo:$('#p22NewCloseTo')?.value||''};if(P22_NEW_FILTER.closeFrom&&P22_NEW_FILTER.closeTo&&P22_NEW_FILTER.closeFrom>P22_NEW_FILTER.closeTo){toast('开始日期不能晚于结束日期');return;}}else P22_NEW_FILTER={closeFrom:P22_FILTER.closeFrom,closeTo:P22_FILTER.closeTo};const items=p22AddItems();openModal('<div class="hd"><b>新增一期反馈</b></div><div class="bd p22-manager"><label><span>反馈截止日期 <span class="p22-required">*</span></span><input type="date" id="p22NewDue" required value="'+xQ(due)+'"></label><label>说明（选填）<input id="p22NewReason" value="'+xQ(reason)+'" placeholder="例如：节后补充反馈"></label>'+p22DateRange('结项日期','p22NewClose',P22_NEW_FILTER.closeFrom,P22_NEW_FILTER.closeTo,'p22AddForm(true)')+'<p class="hint">有实际结项日期取实际，没有则取计划完成日期。仅未结项事项可新增。</p><label class="p22-confirm-check"><input type="checkbox" aria-label="全选可新增事项" onchange="p22AddToggleAll(this.checked)">全选当前结果（'+items.length+' 项）</label><div class="p22-new-scope">'+items.map(it=>{const c=p22Completion(it);return '<label><input type="checkbox" name="p22NewItem" value="'+it.id+'" '+(selected?.has(it.id)?'checked':'')+'>'+esc(it.name)+'<span class="hint">'+esc(c.date||'—')+'（'+(c.actual?'实际':'计划')+'）</span></label>';}).join('')+'</div><p class="hint">新增独立期次，不恢复已取消期次，不移动后续常规排期。</p></div><div class="ft"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="p22AddSelected()">新增一期</button></div>');}
function p22AddToggleAll(checked){const valid=new Set(p22AddItems().map(it=>it.id));document.querySelectorAll('[name="p22NewItem"]').forEach(el=>{if(valid.has(el.value))el.checked=checked;});}
function p22AddSelected(){if(ROLE!=='admin')return;const due=$('#p22NewDue')?.value||'',reason=$('#p22NewReason')?.value.trim()||'',valid=new Set(p22AddItems().map(it=>it.id)),ids=[...new Set([...document.querySelectorAll('[name="p22NewItem"]:checked')].map(el=>el.value).filter(id=>valid.has(id)))];if(!rvDate(due)||!ids.length){toast('请选择截止日期和事项');return;}return wfRunRecordedCommand('addFeedbackPeriod',function(){let count=0;ids.forEach(id=>{const it=xItem(id);if(!it||it.status==='已完成')return;p22Ensure(it);if(p22Rows(it,due).some(row=>!row.cancelledAt&&row.due===due)){toast('事项已有相同截止日期的期次：'+it.name);return;}p22NewPeriod(it,due,'extra',reason);count++;});xSave();closeModal();if(count){P22_FILTER.dueFrom=due;P22_FILTER.dueTo=due;}route();toast('已新增 '+count+' 条反馈期次');},this,[]);}


/* Final manual closure previews unfinished work; automatic closure keeps its existing timing. */
let C27_CLOSE_PENDING=null;
const C27_CLOSE_ACTIONS={adminClose,fbConfirmClose,auditPass};
function c27CloseImpact(it){
  const periods=it.feedbackPeriods?.length?it.feedbackPeriods:[{no:Number(it.periodNo||1),data:it}];
  const feedback=periods.filter(p=>!p.cancelledAt&&!p.data.feedbackArchive&&p.data.fbStage!=='done').map(p=>({no:p.no,due:p.data.nextDue||'',state:p.data.feedbackReturn?'待修改':p.data.fbStage?'审核中':'待填报'}));
  const meetings=(it.meetingRequests||[]).filter(m=>m.status&&!['已完成','已退回','随事项结项归档'].includes(m.status)).map(m=>({id:m.id,status:m.status}));
  return {feedback,meetings};
}
function c27CloseStamp(it,impact){return rrDigest({request:it.closeRequest,impact});}
function c27AskClose(id,command='adminClose'){
  const it=xItem(id);if(!it||ROLE!=='admin'||it.status==='已完成'||it.closeStage!=='admin'||!closeAdminTodoMe(it)){toast('该事项当前不在您的结项审核环节');return;}
  const impact=c27CloseImpact(it);C27_CLOSE_PENDING={id,command,owner:CUR,stamp:c27CloseStamp(it,impact)};
  const pending=[impact.feedback.length?'<b>'+impact.feedback.length+' 期反馈</b>':'',impact.meetings.length?'<b>'+impact.meetings.length+' 个专题会</b>':''].filter(Boolean);const count=pending.length?'尚有 '+pending.join('、')+'未结束。':'当前没有未结束的反馈或专题会。';
  const details=[...impact.feedback.map(p=>'第'+p.no+'期反馈'+(p.due?' · 截止 '+p.due:'')+' · '+p.state),...impact.meetings.map(m=>'专题会 · '+m.status)];
  openModal('<div class="hd"><b>确认办结</b><button class="x" aria-label="关闭" onclick="closeModal()">✕</button></div><div class="bd" data-close-impact="'+xQ(id)+'"><p style="margin:0 0 12px;font-weight:600">'+esc(it.name)+'</p><p>'+count+'</p>'+(details.length?'<ul style="margin:12px 0;padding-left:20px;line-height:1.9;max-height:220px;overflow:auto">'+details.map(text=>'<li>'+esc(text)+'</li>').join('')+'</ul>':'')+'<p>确认办结后，未结束的反馈和专题会将停止办理，按当前状态归档；后续不再生成反馈任务。已有材料与处理记录保留。</p></div><div class="ft"><button class="btn" onclick="closeModal()">暂不办结</button><button class="btn primary" onclick="c27ConfirmClose()">确认办结</button></div>');
}
function c27ConfirmClose(){
  const op=C27_CLOSE_PENDING,it=op&&xItem(op.id);if(!op||op.owner!==CUR||ROLE!=='admin'||!$('#modalMask')?.innerHTML.includes('data-close-impact="'+op.id+'"'))return;
  if(!it||it.status==='已完成'||it.closeStage!=='admin'||!closeAdminTodoMe(it)){closeModal();toast('办理状态已变化，请重新查看事项');return;}
  const impact=c27CloseImpact(it);if(op.stamp!==c27CloseStamp(it,impact)){c27AskClose(it.id,op.command);toast('办理情况已变化，请核对最新影响后确认');return;}
  const index=op.command==='auditPass'?AUDITS.findIndex(a=>(a.itemId||a.id)===it.id):-1;if(op.command==='auditPass'&&index<0){closeModal();toast('结项申请已变化，请重新查看事项');return;}
  closeModal();return C27_CLOSE_ACTIONS[op.command](op.command==='auditPass'?index:it.id);
}
adminClose=function(id){return c27AskClose(id,'adminClose');};
fbConfirmClose=function(id){return c27AskClose(id,'fbConfirmClose');};
auditPass=function(index){const audit=AUDITS[index];if(audit)return c27AskClose(audit.itemId||audit.id,'auditPass');};
const c27OldCloseModal=closeModal;
closeModal=function(){C27_CLOSE_PENDING=null;return c27OldCloseModal.apply(this,arguments);};

r3Initialize();
rvNormalizeCompletionData();
rvNormalizeFeedbackReviewStages();
wfReconcileAll();
rvCloseAuditSync();

</script>
