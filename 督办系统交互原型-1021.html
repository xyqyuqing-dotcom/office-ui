/* =========================================================
   导入 / 导出 中心
   —— 导出：Excel 清单（.csv）/ PPT 汇报版式（.pptx）
   —— 导入：Excel（.csv/.txt）/ Word（.docx）/ PPT（.pptx）
   导入统一走「解析 → 匹配确认 → 手工补填 → 确认 → 生成待办事项」
   ========================================================= */
let IO_TAB = 'export';
let IO_ROWS = [];      /* 解析出的原始行 */
let IO_DRAFT = [];     /* 每行匹配后的可编辑草稿 */
let IO_PICK = new Set();

/* ---------- 自动匹配：部门 / 人员 ---------- */
const DEPT_ALIAS = [
  {key:'人力资源部', names:['人力资源部','人力资源','人力','hr','HR']},
  {key:'战略客户部', names:['战略客户部','战略客户','战客']},
  {key:'综合部',     names:['综合部','综合','办公室']},
  {key:'技术部',     names:['技术部','技术','科技部']},
  {key:'资管部',     names:['资管部','资管','资产管理']}
];
const IO_CYCLES = ['每周一反馈','每双周一反馈','每月反馈','每月15日/30日反馈','每季度反馈'];
function ioMatchDept(text){
  const t = String(text||''); if(!t.trim()) return '';
  for(const g of DEPT_ALIAS){ for(const n of g.names){ if(t.indexOf(n)>=0) return g.key; } }
  const s = t.trim();
  for(const k of Object.keys(DEPT_LEAD)){ if(k.indexOf(s)>=0 || s.indexOf(k)>=0) return k; }
  return '';
}
function ioMatchPerson(text){
  const t = String(text||''); if(!t.trim()) return '';
  for(const p of PEOPLE){ if(p.nm && t.indexOf(p.nm)>=0) return p.c; }
  for(const p of PEOPLE){ if(p.c && new RegExp('(^|[^A-Za-z])'+p.c+'(?![A-Za-z])').test(t)) return p.c; }
  return '';
}
/* CSV：支持引号包裹与转义双引号 */
function ioParseCsv(text){
  const lines = String(text||'').replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  return lines.slice(1).map(ioSplitCsv).filter(r=>r.length>=2);
}
function ioSplitCsv(line){
  const out=[]; let cur=''; let q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else { if(c==='"') q=true; else if(c===','){ out.push(cur); cur=''; } else cur+=c; }
  }
  out.push(cur);
  return out.map(x=>String(x).trim());
}
/* ZIP：线性扫描 local header；deflate 用浏览器 DecompressionStream 解压 */
async function ioUnzipEntry(buf,name){
  const dv=new DataView(buf); let off=0;
  while(off+30<=buf.byteLength){
    if(dv.getUint32(off,true)!==0x04034b50) break;
    const method=dv.getUint16(off+8,true);
    const csize=dv.getUint32(off+18,true);
    const nlen=dv.getUint16(off+26,true);
    const elen=dv.getUint16(off+28,true);
    const nm=new TextDecoder().decode(new Uint8Array(buf,off+30,nlen));
    if(nm===name){
      const data=new Uint8Array(buf,off+30+nlen+elen,csize);
      if(method===0) return new TextDecoder().decode(data);
      if(typeof DecompressionStream==='undefined') throw new Error('当前浏览器不支持解压，请用最新版 Chrome / Edge');
      const ds=new DecompressionStream('deflate-raw');
      const stream=new Blob([data]).stream().pipeThrough(ds);
      return await new Response(stream).text();
    }
    off+=30+nlen+elen+csize;
  }
  return null;
}
/* 从 XML 提取表格：返回 [[单元格文本...], ...]（不含首行表头） */
function ioExtractTables(xml,rowTag,cellTag,textRe){
  const tables = xml.match(/<a:tbl>[\s\S]*?<\/a:tbl>|<w:tbl>[\s\S]*?<\/w:tbl>/g)||[];
  const out=[];
  tables.forEach(t=>{
    const rows=t.match(new RegExp('<'+rowTag+'[ >][\\s\\S]*?</'+rowTag+'>','g'))||[];
    rows.forEach((tr,ri)=>{
      if(ri===0) return;                       /* 首行为表头，跳过 */
      const cells=(tr.match(new RegExp('<'+cellTag+'[ >][\\s\\S]*?</'+cellTag+'>','g'))||[]).map(tc=>
        (tc.match(textRe)||[]).map(x=>x.replace(/<[^>]+>/g,'')).join('').trim()
      );
      if(cells.length>=2 && cells[0]) out.push(cells);
    });
  });
  return out;
}
/* ---------- 匹配结果 → 可编辑草稿 ---------- */
function ioBuildDraft(row){
  const r = (row||[]).map(x=>String(x==null?'':x).trim());
  const lead = ioMatchDept(r[2]) || ioMatchDept(r.join(' ')) || '综合部';
  return {
    name: r[0] || '',
    content: r[1] || '',
    lead: lead,
    exec: ioMatchPerson(r[3]) || ioMatchPerson(r.join(' ')) || (DEPT_LEAD[lead]||'TY'),
    cycle: r[4] ? ioPickCycle(r[4]) : '',
    deadline: r[5] || ioPickDate(r.join(' ')) || '',
    importance: /重点|重要/.test(r[6]||'') ? '重点' : '常规',
    leadMgr: r[7] || '',
    assists: String(r[8]||'').split(/[、,，]/).map(x=>x.trim()).filter(Boolean),
    launch: r[9] || '',
    source: r[10] || '导入',
    raisedAt: r[11] || ''
  };
}
function ioPickCycle(v){
  const s = String(v||'').trim();
  if(!s) return '每周一反馈';
  for(const c of IO_CYCLES){ if(s.indexOf(c.replace('一','').slice(0,2))>=0 || s===c) return c; }
  if(s.indexOf('双周')>=0) return '每双周一反馈';
  if(s.indexOf('周')>=0) return '每周一反馈';
  if(s.indexOf('季')>=0) return '每季度反馈';
  if(s.indexOf('月')>=0) return '每月反馈';
  return '每周一反馈';
}
function ioPickDate(v){
  const m = String(v||'').match(/(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})/);
  if(!m) return '';
  return m[1] + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[3]).padStart(2,'0');
}

/* ---------- 导入：文件 → 解析 → 预览草稿 ---------- */
async function ioPickFile(input){
  const f = input.files && input.files[0]; if(!f) return;
  const n = f.name.toLowerCase();
  try{
    let rows = [];
    if(n.endsWith('.docx')) rows = await ioParseDocx(f);
    else if(n.endsWith('.pptx')) rows = await ioParsePptx(f);
    else rows = await ioParseText(f);
    rows = (rows||[]).filter(r=>r && r.length>=2);
    if(!rows.length){ toast('未在文件中识别到事项行，请确认含表格且首行为表头'); return; }
    IO_ROWS = rows;
    IO_DRAFT = rows.map(ioBuildDraft);
    IO_PICK = new Set(rows.map((r,i)=>i));
    IO_TAB='import'; renderIOMenu();
    toast('已解析 '+rows.length+' 条事项，请核对后确认导入');
  }catch(e){ toast('解析失败：'+(e&&e.message||e)); }
}
async function ioParseDocx(file){
  const xml = await ioUnzipEntry(await file.arrayBuffer(), 'word/document.xml');
  if(!xml) throw new Error('无法读取文档内容');
  const t = ioExtractTables(xml,'w:tr','w:tc',/<w:t[^>]*>[\s\S]*?<\/w:t>/g);
  if(t.length) return t;
  /* 无表格：按段落回退，每行一条（跳过首行标题） */
  return String(xml).split('</w:p>').map(p=>
    (p.match(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)||[]).map(x=>x.replace(/<[^>]+>/g,'')).join('').trim()
  ).filter(Boolean).slice(1).map(x=>x.split(/[\t,，]/));
}
async function ioParsePptx(file){
  const buf = await file.arrayBuffer(); const rows = [];
  for(let i=1;i<=40;i++){
    const xml = await ioUnzipEntry(buf,'ppt/slides/slide'+i+'.xml');
    if(!xml) break;
    ioExtractTables(xml,'a:tr','a:tc',/<a:t>[\s\S]*?<\/a:t>/g).forEach(r=>rows.push(r));
  }
  return rows;
}
async function ioParseText(file){
  const txt = await file.text();
  return ioParseCsv(txt);
}

      assists: String(r[8]||'').split(/[、,，]/).map(x=>x.trim()).filter(Boolean),
      exec:exec,
      deadline:deadline, cycle:String(r[4]||'每周一反馈'), nextDue:deadline,
      source:String(r[10]||'导入'), raisedAt:String(r[11]||nowRecordTime().slice(0,10)),
      mgrs:Array.from(new Set([String(r[7]||''),DEPT_MGR[lead]||'DY','YZ'].filter(Boolean))),
      periodNo:1, firstRound:true, lastPlan:'', launch:String(r[9]||String(r[1]||name)),
      fbRank:0, fbOff:false, fbSummary:'',
      fbReport:null,
      status:'在途', feedback:'未反馈', lastReport:'—', lastReportAt:'', flowStep:0,
      logs:[{t:nowRecordTime().slice(0,10), who:CUR, act:'导入事项', txt:'由「导入 / 导出」批量导入：'+name}], comments:[]
    });
    n++;
  });
  IO_ROWS = []; IO_DRAFT = []; IO_PICK = new Set();
  closeModal(); route(); toast('已导入 '+n+' 条待办事项');
}

    a.href=URL.createObjectURL(new Blob(['﻿'+html],{type:'application/msword;charset=utf-8;'}));
    a.download='待办事项导入模板（Word）.doc'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    toast('已下载 Word 模板，填写后即可导入');
  }else{
    const blob = buildImportTplPptx();

    a.href=URL.createObjectURL(blob);
    a.download='待办事项导入模板（PPT）.pptx'; a.click();

  }
}

/* ---------- 事项看板：按条线分组的汇报版式（与 PPT 汇报稿一致） ---------- */
function fbPickText(a,b){ return [a,b].find(v=>v&&v!=='—')||''; }
function fbFeedback(it){
  const lf = it.fbReport || latestFeedback(it);
  if(!lf) return {cur:'', nxt:''};
  return {cur:fbPickText(lf.current,lf.txt), nxt:fbPickText(lf.next,lf.np)};
}
function fbGroups(list){
  const g = {};
  list.forEach(it=>{ const k = it.lead||'其他'; (g[k]=g[k]||[]).push(it); });
  return g;
}
/* 单张「条线」表：标题 + 5 列表格（事项名称/落实人/时间要求/本期落实情况/下期工作计划） */
/* 进展总结：手工覆盖值 → AI 总结中已确认的最新一条 */
function fbAiSummary(it){
  if(it.fbSummary && String(it.fbSummary).trim()) return String(it.fbSummary).trim();
  const all = (typeof AI!=='undefined' && AI.reports) ? AI.reports.filter(x=>x.scope==='item-detail'&&x.item===it.id&&x.saved) : [];
  if(!all.length) return '';
  const allowed = all.filter(aiReportAllowed);
  const r = (allowed.length?allowed:all).slice().reverse()[0];
  const body = (r.editedText!==null && r.editedText!==undefined) ? r.editedText : (r.polishedText||'');
  return body ? String(body).trim() : '';
}
/* 条线内排序（fbRank 升序，默认 0 保持原有次序） */
function fbSorted(items){ return items.slice().sort((a,b)=>(a.fbRank||0)-(b.fbRank||0)); }
function fbActiveList(){ return visibleItems().filter(i=>i.status!=='已完成' && !i.fbOff); }
/* 单张「条线」表：标题 + 六列表格 + 行操作（上移/下移/修改/删除） */
function fbGroupTable(key, items, index, total){
  const cn = ['一','二','三','四','五','六','七','八','九','十'];
  const owner = who(DEPT_LEAD[key]) || (items[0]&&who(items[0].mgrs&&items[0].mgrs[0])) || '—';
  const mgr = (items[0]&&items[0].mgrs&&items[0].mgrs.length) ? who(items[0].mgrs[0]) : '—';
  const canEdit = ROLE==='admin';
  const arr = fbSorted(items);
  const rows = arr.map((it, ri)=>{
    const fb = fbFeedback(it);
    const exec = who(actualExec(it)||it.exec)||'—';
    const due = esc(it.deadline||it.nextDue||'—');
    const sum = fbAiSummary(it);
    const upDis = ri===0, downDis = ri===arr.length-1;
    const ops = canEdit ? ('<div class="fb-ops">'+
      '<button class="mv" data-tip="上移" title="上移"'+(upDis?' disabled':'')+' onclick="fbMove(\''+it.id+'\',-1)"><i class="fas fa-arrow-up"></i></button>'+
      '<button class="mv" data-tip="下移" title="下移"'+(downDis?' disabled':'')+' onclick="fbMove(\''+it.id+'\',1)"><i class="fas fa-arrow-down"></i></button>'+
      '<button class="ed" data-tip="修改内容" title="修改内容" onclick="fbEditRow(\''+it.id+'\')"><i class="fas fa-pen-to-square"></i></button>'+
      '<button class="danger" data-tip="移出汇报表" title="移出汇报表" onclick="fbRemoveRow(\''+it.id+'\')"><i class="fas fa-trash-can"></i></button>'+
      '</div>') : '';
    return '<tr>'+
      '<td class="'+rdCls(it.id)+' fb-name" style="cursor:pointer" title="点击查看详情" onclick="goDetail(\''+it.id+'\')">'+rdDot(it.id)+esc(it.name)+'</td>'+
      '<td>'+esc(exec)+'</td>'+
      '<td>'+due+'</td>'+
      '<td'+(fb.cur?'':' class="fb-none"')+'>'+esc(fb.cur||'本期未反馈')+'</td>'+
      '<td'+(fb.nxt?'':' class="fb-none"')+'>'+esc(fb.nxt||'暂无下期计划')+'</td>'+
      '<td'+(sum?'':' class="fb-none"')+'>'+esc(sum||'暂无进展总结').replace(/\r?\n/g,'<br>')+'</td>'+
      (canEdit?'<td class="fb-td-ops">'+ops+'</td>':'')+
    '</tr>';
  }).join('');
  return '<div class="fb-group">'+
    '<div class="fb-gt"><span>'+(cn[index]||(index+1))+'、'+esc(key)+'条线（责任人：'+esc(owner)+'）</span>'+
    '<span class="cnt">分管：'+esc(mgr)+' · 共 '+arr.length+' 项</span></div>'+
    '<table class="fb-table">'+(canEdit?'<col class="fb-col-ops">':'')+'</colgroup>'+
    '<thead><tr><th>事项名称</th><th>进展总结</th><th>落实人</th><th>时间要求</th><th>本期落实情况</th><th>下期工作计划</th>'+(canEdit?'<th class="fb-th-ops">操作</th>':'')+'</tr></thead>'+
    '<tbody>'+rows+'</tbody></table>'+
    (canEdit?'<div class="fb-add"><button class="btn sm ghost" onclick="fbAddRow(\''+esc(key)+'\')"><i class="fas fa-plus"></i> 增加事项</button>'+
      '<span style="font-size:11.5px;color:var(--ink-3);margin-left:10px">可从其他条线调入，或恢复已移出的事项</span></div>':'')+
  '</div>';
}
/* 看板 HTML（页面展示用） */
function feedbackBoardHtml(list){
  const items = (list||[]).filter(i=>i.status!=='已完成' && !i.fbOff);
  if(!items.length) return '<div class="fb-board"><div class="card"><div class="card-hd"><h3><i class="fas fa-table-list"></i> 事项看板</h3></div><div class="card-bd"><div class="fb-empty">暂无在途事项的反馈内容。</div></div></div></div>';
  const g = fbGroups(items), keys = Object.keys(g);
  return '<div class="fb-board"><div class="card"><div class="card-hd"><h3><i class="fas fa-table-list"></i> 事项看板</h3>'+
    '<span class="hint">按条线汇总 · 口径：事项名称 / 落实人 / 时间要求 / 本期落实情况 / 下期工作计划 / 进展总结（汇报版式）</span></div>'+

/* ---------- 行编辑：上移 / 下移 / 修改 / 移出 / 恢复 / 增加 ---------- */
function fbMove(id, dir){
  if(ROLE!=='admin'){ toast('仅督办管理人可调整汇报顺序'); return; }
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  const arr = fbSorted((fbGroups(fbActiveList())[it.lead])||[]);
  const idx = arr.findIndex(x=>x.id===id);
  const to = idx + dir;
  if(idx<0 || to<0 || to>=arr.length){ toast(dir<0?'已经是本条线第一条':'已经是本条线最后一条'); return; }
  arr.forEach((x,i)=>{ x.fbRank = i; });
  const tmp = arr[idx]; arr[idx] = arr[to]; arr[to] = tmp;
  arr.forEach((x,i)=>{ x.fbRank = i; });
  route();
}
function fbEditRow(id){
  if(ROLE!=='admin'){ toast('仅督办管理人可修改汇报内容'); return; }
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  const fb = fbFeedback(it), sum = fbAiSummary(it);
  openModal(`
    <div class="hd"><b><i class="fas fa-pen" style="color:var(--accent)"></i> 修改汇报内容 · ${esc(it.name)}</b><button class="x" onclick="closeModal()">✕</button></div>
    <div class="bd">
      <div class="fcell full" style="margin-bottom:10px"><label>本期落实情况</label>
        <textarea id="fbEdCur" rows="5" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;outline:none;line-height:1.7">${esc(fb.cur||'')}</textarea></div>
      <div class="fcell full" style="margin-bottom:10px"><label>下期工作计划</label>
        <textarea id="fbEdNxt" rows="4" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;outline:none;line-height:1.7">${esc(fb.nxt||'')}</textarea></div>
      <div class="fcell full"><label>进展总结</label>
        <textarea id="fbEdSum" rows="6" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;outline:none;line-height:1.7">${esc(sum||'')}</textarea>
        <div class="hint">留空则回退显示待办详情页「AI 总结」中已确认的内容</div></div>
      <div class="ft" style="margin-top:14px">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn primary" onclick="fbSaveRow('${it.id}')"><i class="fas fa-check"></i> 保存</button>
      </div>
    </div>`);
}
function fbSaveRow(id){
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  const cur = ($('#fbEdCur')&&$('#fbEdCur').value||'').trim();
  const nxt = ($('#fbEdNxt')&&$('#fbEdNxt').value||'').trim();
  const sum = ($('#fbEdSum')&&$('#fbEdSum').value||'').trim();
  it.fbReport = Object.assign({}, it.fbReport||{}, {current:cur, txt:cur, next:nxt, np:nxt});
  it.fbSummary = sum;
  if(cur) it.lastReport = cur;
  closeModal(); route();
  toast('汇报内容已更新');
}
function fbRemoveRow(id){
  if(ROLE!=='admin'){ toast('仅督办管理人可调整汇报内容'); return; }
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  it.fbOff = true; route();
  toast('已移出汇报表，可在页面底部「已移出事项」中恢复');
}
function fbRestoreRow(id){
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  it.fbOff = false; route(); toast('已恢复至汇报表');
}
/* ---------- 事项看板：从「事项明细」逐条 / 多选添加事项 ---------- */
let FB_ADD_DEPT = '';
let FB_PICK = new Set();
function fbAddCands(){
  /* 候选 = 事项明细中未完成、且不在本条线汇报表内的事项（其他条线可调入，已移出的可恢复） */
  return visibleItems().filter(i=>i.status!=='已完成' && (i.fbOff || i.lead!==FB_ADD_DEPT));
}
function fbAddRow(dept){
  if(ROLE!=='admin'){ toast('仅督办管理人可增加事项'); return; }
  FB_ADD_DEPT = dept; FB_PICK = new Set();
  fbRenderAddModal();
}
function fbRenderAddModal(){
  const dept = FB_ADD_DEPT, cands = fbAddCands();
  if(!cands.length){ toast('事项明细中没有可加入的事项'); return; }
  const rows = cands.map(it=>{
    const on = FB_PICK.has(it.id), cross = it.lead !== dept;
    return '<div class="fb-pick'+(on?' on':'')+'" onclick="fbTogglePick(\''+it.id+'\')">'+
      '<span class="ck">'+(on?'<i class="fas fa-check"></i>':'')+'</span>'+
      '<div class="pk-m"><b>'+esc(it.name)+'</b>'+
      '<span>'+esc(it.lead||'—')+' · 落实人 '+esc(who(actualExec(it)||it.exec)||'—')+
      (it.fbOff?' · 已移出汇报表':'')+(cross?' · 加入后由本条线牵头':'')+'</span></div></div>';
  }).join('');
  openModal(`
    <div class="hd"><b><i class="fas fa-plus" style="color:var(--accent)"></i> 从「事项明细」添加事项 · ${esc(dept)}条线</b><button class="x" onclick="closeModal()">✕</button></div>
    <div class="bd">
      <div class="fb-pick-bar">
        <span>可逐条勾选，也可一次多选后批量加入；当前共 ${cands.length} 项可选</span>
        <div style="flex:1"></div>
        <button class="btn sm ghost" onclick="fbPickAll(true)">全选</button>
        <button class="btn sm ghost" onclick="fbPickAll(false)">清空</button>
      </div>
      <div class="fb-pick-list">${rows}</div>
      <div class="fb-pick-ft">
        <span>已选 <b>${FB_PICK.size}</b> 项</span>
        <div style="flex:1"></div>
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn primary" onclick="fbAddPicked()"><i class="fas fa-plus"></i> 加入选中项</button>
      </div>
    </div>`);
}
function fbTogglePick(id){ if(FB_PICK.has(id)) FB_PICK.delete(id); else FB_PICK.add(id); fbRenderAddModal(); }
function fbPickAll(on){ FB_PICK = on ? new Set(fbAddCands().map(x=>x.id)) : new Set(); fbRenderAddModal(); }
function fbAddPicked(){
  const dept = FB_ADD_DEPT, n0 = FB_PICK.size;
  if(!n0){ toast('请先勾选要加入的事项'); return; }
  FB_PICK.forEach(id=>{
    const x = ITEMS.find(v=>v.id===id); if(!x) return;
    if(x.lead !== dept) x.lead = dept;
    x.fbOff = false;
  });
  const arr = fbSorted((fbGroups(fbActiveList())[dept])||[]);
  let max = arr.length ? Math.max.apply(null, arr.map(x=>x.fbRank||0)) : -1;
  FB_PICK.forEach(id=>{ const x=ITEMS.find(v=>v.id===id); if(x) x.fbRank = ++max; });
  fbSorted((fbGroups(fbActiveList())[dept])||[]).forEach((x,i)=>{ x.fbRank = i; });
  closeModal(); route();
  toast('已加入 '+n0+' 项到「'+dept+'条线」');
}

function saveEditItem(id){
  const it = ITEMS.find(x=>x.id===id); if(!it) return;

  it.name = name;
  if($('#edLead')) it.lead = $('#edLead').value;
  if($('#edExec')) it.exec = $('#edExec').value;
  if($('#edDeadline') && $('#edDeadline').value) it.deadline = $('#edDeadline').value;
  if($('#edCycle')) it.cycle = $('#edCycle').value;
  if($('#edImp')) it.importance = $('#edImp').value;
  if($('#edAssists')) it.assists = ($('#edAssists').value||'').split(/[、,，]/).map(x=>x.trim()).filter(Boolean);

function doDeleteItem(id){
  const i = ITEMS.findIndex(x=>x.id===id); if(i<0) return;
  DELETED_ITEMS.unshift({it:ITEMS[i], at:nowRecordTime(), by:who(CUR)});
  ITEMS.splice(i,1);
  AI.reports = (AI.reports||[]).filter(r=>r.item!==id);
  closeModal();
  if(PAGE==='detail' && DETAIL_ID===id){ DETAIL_ID=null; location.hash='#list'; }
  route();
  toast('事项已删除，可在「回收站」中找回');
}

function cycleStep(cyc){
  const c = String(cyc||'');
  if(/双周|两周|隔周/.test(c)) return 14;
  if(/周/.test(c)) return 7;
  if(/每月|月度|月/.test(c)) return 30;
  if(/季度|每季/.test(c)) return 90;
  if(/半年/.test(c)) return 182;
  if(/年度|每年/.test(c)) return 365;
  const m = c.match(/(\d+)\s*(天|日)/);
  if(m) return Math.max(1, parseInt(m[1],10));
  return 30;
}
function cyclePreview(){
  const cyc = $('#f_cycle') ? $('#f_cycle').value : '';
  const step = cycleStep(cyc);
  const first = $('#f_first') ? ($('#f_first').value||todayDateOnly()) : todayDateOnly();
  const dueRaw = $('#f_deadline') ? ($('#f_deadline').value||'') : '';
  const isDate = /^\d{4}-\d{2}-\d{2}$/.test(dueRaw);
  const dates = []; let cur = new Date(first);
  if(isDate){
    const end = new Date(dueRaw);
    while(cur <= end && dates.length < 200){ dates.push(cur.toISOString().slice(0,10)); cur = new Date(cur.getTime()+step*86400000); }
    $('#cyclePrev').innerHTML = '<b>汇报节点预览：</b>共 '+dates.length+' 个周期 · '+dates.slice(0,6).join('、')+(dates.length>6?' 等':'')+'。临近节点自动亮灯提醒（黄灯剩7天 / 红灯当天及超期）。';
  }else{
    for(let i=0;i<6;i++){ dates.push(new Date(cur.getTime()+i*step*86400000).toISOString().slice(0,10)); }
    $('#cyclePrev').innerHTML = '<b>汇报节点预览：</b>计划完成时间为「'+esc(dueRaw||'—')+'」（阶段性描述），不设终止日期，按反馈周期滚动推送 · 前 6 期：'+dates.join('、')+'。';
  }
}
function submitNew(){
  if(ROLE!=='admin'){ toast('仅督办管理人可以新增督办'); return; }
  const nameEl = $('#f_name'), contentEl = $('#f_content');
  const name = nameEl ? nameEl.value.trim() : '';
  const content = contentEl ? contentEl.value.trim() : '';
  const launchEl = $('#f_launch');
  const launch = (launchEl ? launchEl.value.trim() : '') || content;
  if(!name||!content){ toast('请填写事项名称与待办事项内容'); return; }

  const leadEl = $('#f_lead');
  const lead = leadEl ? leadEl.value : '';
  const leadPerson = leadOf(lead);
  if(!lead || !leadPerson){ toast('当前牵头部门未配置部门负责人，暂无法派发'); return; }
  const leadMgr = $('#f_leadMgr') ? $('#f_leadMgr').value : '';
  const leadMgrPerson = person(leadMgr);
  if(leadMgr && (!leadMgrPerson || leadMgrPerson.r!=='mgr')){ toast('分管高管选择有误，可留空暂不指定'); return; }

  const assists = $$('#f_assists .chip.on').map(c=>c.textContent);
  const relatedMgrs = $$('#f_mgrs .chip.on').map(c=>c.textContent.replace(/（.*）/,''));
  const mgrs = Array.from(new Set([leadMgr,...(relatedMgrs.length?relatedMgrs:['YZ'])].filter(Boolean)));
  const impNode = $('#f_imp .chip.on')[0];
  const imp = impNode ? impNode.dataset.v : '常规';
  const tags = $$('#f_tags .chip.on[data-v]').map(c=>c.dataset.v);
  const deadline = String(($('#f_deadline') ? $('#f_deadline').value : '') || '').trim();
  const cycle = String(($('#f_cycle') ? $('#f_cycle').value : '') || '').trim();
  if(!deadline){ toast('请填写计划完成时间（日期或阶段性描述，如：常态化推进）'); return; }
  if(!cycle){ toast('请填写反馈周期（如：每周一反馈 / 每季度反馈）'); return; }
  const id = 'DB-2026-' + String(31 + ITEMS.length).padStart(3,'0');
  const firstDue = $('#f_first').value||todayDateOnly();
  const source = $('#f_source') ? $('#f_source').value : '其他';
  const raisedAt = $('#f_raised') ? ($('#f_raised').value||todayDateOnly()) : todayDateOnly();
  const execInput = $('#f_exec') ? $('#f_exec').value.trim().toUpperCase() : '';
  let execPerson = null;
  if(!execInput){ toast('请指定落实人：须为牵头部门内的部门负责人或员工'); return; }
  execPerson = person(execInput);
  if(!execPerson || execPerson.dept!==lead || (execPerson.r!=='person'&&execPerson.r!=='exec')){
    toast('落实人须为牵头部门内的部门负责人或员工');
    return;
  }
  const directAssigned = !!execPerson;
  const dispatchType = directAssigned ? (execPerson.r==='exec'?'dept':'person') : 'dept';
  const dispatchName = directAssigned ? execPerson.c : leadPerson;
  const dispatchRole = directAssigned ? (execPerson.r==='exec'?'部门负责人兼落实人':'落实人（员工）') : '部门负责人';

  const item = {
    id,name,content,importance:imp,tags:tags.length?tags:['例行'],lead,assists,leadMgr,
    /* TY 可选填落实人：填了则直接指定；不填则由部门负责人或牵头高管后续分配 */
    exec:directAssigned ? execPerson.c : '待分配',
    directExec:directAssigned,
    deadline,cycle,nextDue:firstDue,source,raisedAt,
    mgrs,fav:false,
    status:'在途',feedback:'未反馈',lastReport:'—',lastReportAt:'',flowStep:0,
    periodNo:1,lastPlan:'',firstRound:true,launch:launch,workDept:lead,currentExec:dispatchName,closeStage:'',closeRequest:null,
    dispatchTo:{type:dispatchType,name:dispatchName},
    dispatchLog:[{t:nowRecordTime(),from:CUR,fromRole:ROLES[ROLE].label,toType:dispatchType,to:dispatchName,toRole:dispatchRole,txt:launch}],
    feedbackHistory:[],fbApprovalLog:[],userTags:{},
    /* 即使 TY 直接指定具体落实人，部门负责人仍保留在事项链路中，便于知情和后续审核 */
    chain:Array.from(new Set([CUR,leadPerson,dispatchName])),
    logs:[
      {t:nowRecordTime(),who:CUR,act:'创建督办',txt:launch+'　〔牵头部门〕'+lead+'；〔牵头高管〕'+leadMgr+(assists.length?'；配合部门信息标签：'+assists.join('、'):'')},
      {t:nowRecordTime(),who:CUR+'（督办管理人）',act:'首次派发',txt:directAssigned
        ? '已下发至'+lead+'并直接指定落实人（'+execPerson.c+'）；牵头高管（'+leadMgr+'）与部门负责人（'+leadPerson+'）同步知情。'
        : '已自动派发至'+lead+'负责人（'+leadPerson+'）；未指定具体落实人，牵头高管（'+leadMgr+'）可继续派发。'}
    ],
    comments:[]
  };

  ITEMS.unshift(item);
  F.status='在途'; F.kw=''; F.dept='全部';
  toast(directAssigned
    ? '督办已创建并直接指定落实人（'+execPerson.c+'）'
    : '督办已创建并自动派发至'+lead+'负责人（'+leadPerson+'）');
  go('list');
}

function auditPass(i){
  if(ROLE!=='admin'){ toast('仅督办管理人可以审核结项'); return; }
  const a = AUDITS.splice(i,1)[0]; if(!a) return;
  const it = ITEMS.find(x=>x.id===(a.itemId||a.id));
  if(it){
    it.status = '已完成'; it.flowStep = 4; it.closeStage = 'done';
    it.closeRequest = Object.assign({},it.closeRequest||{},{status:'已办结'});
    it.logs.push({t:nowRecordTime(),who:ROLES[ROLE].name+'（督办管理人）',act:'结项审核通过',txt:'督办管理人审核通过，事项办结，并同步部门负责人及分管高管。'});
    notifyCloseCompleted(it);
  }
  toast('已同意「'+a.name+'」结项，同步抄送部门负责人、'+a.mgr+'及公司领导');
  route();
}
function openLegacyCloseReject(i){

function confirmLegacyCloseReject(i){

function auditReject(i,reason){
  if(ROLE!=='admin'){ toast('仅督办管理人可以退回结项'); return; }
  const a = AUDITS.splice(i,1)[0]; if(!a) return;
  const it = ITEMS.find(x=>x.id===(a.itemId||a.id));
  if(it){
    const stamp=nowRecordTime();
    const note=String(reason||'结项申请退回落实人补充完善后重新提交。').trim()||'结项申请退回落实人补充完善后重新提交。';
    it.closeStage = ''; it.flowStep = 0;
    it.closeRequest = Object.assign({},it.closeRequest||{},{status:'已退回',returnedAt:stamp,returnedBy:ROLES[ROLE].name,returnedReason:note});
    it.logs.push({t:stamp,who:ROLES[ROLE].name+'（督办管理人）',act:'退回结项申请',txt:'结项申请退回落实人补充完善后重新提交。退回意见：'+note});
    notifyCloseReturned(it,'督办管理人',note);
  }
  toast('已退回「'+a.name+'」结项申请，退回意见将同步落实人');
  route();
}

function feedbackRecordStatus(it,h){
  if(h.reassignStatus) return h.reassignStatus;
  if(Number(h.periodNo||0)===Number(it.periodNo||0) && h.rejectedCurrent){
    return String(h.rejectedTo||'').indexOf('部门负责人')>=0 ? '进展反馈已退回 · 待部门负责人重新审核' : '进展反馈已退回 · 待落实人修改';
  }
  if(latestFeedback(it)!==h) return '历史版本';
  if(FB_STAGE_LABEL[it.fbStage]) return FB_STAGE_LABEL[it.fbStage];
  return it.feedback==='已反馈' ? '进展反馈待审核' : '进展反馈待处理';
}
function detailRecordHtml(it,scope){
  const records=[];
  (it.logs||[]).forEach(g=>records.push({t:g.t,who:g.who,act:g.act,txt:g.txt,kind:'log'}));
  (it.feedbackHistory||[]).forEach(h=>records.push({
    t:h.submittedAt||'—',who:h.actualReporter||'—',act:'第'+(h.periodNo||'—')+'期反馈 · V'+(h.version||'—'),
    txt:'本期落实情况：'+(wfRecordContent(h)||'—')+'；下期工作计划：'+(wfRecordPlan(h)||'—')+'。'+(typeof h.taskProgress==='number'?'任务总进度：'+h.taskProgress+'%；':'')+feedbackRecordStatus(it,h)+'。'+((h.approvalRecords||[]).length?'审批记录：'+h.approvalRecords.map(a=>(a.role||'审批人')+' '+(a.action||'')+'（'+(a.by||'—')+'）').join('；')+'。':''),kind:'feedback'
  }));
  const keyWords=['提交反馈','修改反馈','审核同意','退回反馈','申请结项','结项审核','申请专题会','专题会结论','周期轮动','派发'];
  const filtered=scope==='all'?records:records.filter(g=>g.kind==='feedback'||keyWords.some(k=>String(g.act||'').includes(k)));
  return filtered.sort((a,b)=>recordTimeValue(b.t)-recordTimeValue(a.t)||String(b.t).localeCompare(String(a.t))).map(g=>
    '<div class="tl-item '+(String(g.act).includes('预警')?'warn':((String(g.act).includes('通过')||String(g.act).includes('同意')||g.act==='评价')?'ok':(g.who==='系统'?'sys':'')))+'">'+
    '<div class="d">'+esc(formatRecordTime(g.t))+'</div><div class="hd"><b>'+esc(g.who)+'</b><span class="op">'+esc(g.act)+'</span></div><div class="txt">'+esc(g.txt)+'</div></div>'
  ).join('')||'<div class="empty"><i class="fas fa-clock-rotate-left"></i><p>暂无可展示的记录</p></div>';
}
function feedbackHistoryHtml(it){
  /* 历史区只展示已经结束的反馈周期，并且每个周期只保留最新版本；本期提交、退回和重提均留在进展反馈区。改派后没有新的当前反馈时，保留“改派前版本”供追溯。 */
  const currentPeriod=Number(it.periodNo||0);
  const keepReassignVersion=!!it.reassignFeedbackReset && !it.feedbackReturn && !it.fbReport && it.feedback!=='已反馈' && !it.fbStage;
  const byPeriod={};
  (it.feedbackHistory||[]).forEach(h=>{
    const p=Number(h.periodNo||0);
    if(currentPeriod && p===currentPeriod && !keepReassignVersion) return;
    const key=String(p||h.periodStart||h.submittedAt||'');
    const old=byPeriod[key];
    if(!old || recordTimeValue(h.submittedAt)>recordTimeValue(old.submittedAt) || (Number(h.version||0)>Number(old.version||0))) byPeriod[key]=h;
  });
  const hs=Object.values(byPeriod).sort((a,b)=>recordTimeValue(b.submittedAt)-recordTimeValue(a.submittedAt)||Number(b.version||0)-Number(a.version||0));
  const emptyHint=it.feedbackReturn?'进展反馈已退回，原内容已带入上方填写区':'暂无历史反馈 · 进展反馈已在上方展示';
  if(!hs.length) return '<div class="card history-card history-empty" style="margin-bottom:14px"><div class="card-hd"><h3><i class="fas fa-layer-group"></i> 历史反馈</h3><span class="hint">'+emptyHint+'</span></div></div>';
  const rows=hs.map((h,i)=>{
    const approvals=(h.approvalRecords||[]).map(a=>esc((a.role||'审批人')+'：'+(a.action||'')+'（'+(a.by||'—')+'）')).join('；');
    return '<details class="history-row" '+(i===0?'open':'')+'><summary><b>第'+esc(h.periodNo||'—')+'期 · V'+esc(h.version||'—')+'</b><span>'+esc(formatRecordTime(h.submittedAt||'—'))+' · '+esc(h.actualReporter||'—')+'</span><em>'+esc(feedbackRecordStatus(it,h))+'</em></summary><div class="history-body">'+(h.lastPlan&&h.lastPlan!=='—'?'<div><b>上期工作计划：</b>'+esc(h.lastPlan)+'</div>':'')+(typeof h.taskProgress==='number'?'<div><b>任务总进度：</b>'+h.taskProgress+'%'+(h.progressReason?' · '+esc(h.progressReason):'')+'</div>':'')+'<div><b>本期落实情况：</b>'+esc(h.current||h.txt||'—')+'</div><div><b>下期工作计划：</b>'+esc(h.next||h.np||'—')+'</div>'+(h.attachments&&h.attachments.length?'<div style="margin-top:2px"><b>附件：</b></div>'+attViewHtml(h.attachments):'')+(h.summary?.text?'<div><b>进展总结：</b>'+esc(h.summary.text)+'</div>':'')+(approvals?'<div class="history-approval"><b>审批记录：</b>'+approvals+'</div>':'')+'</div></details>';
  }).join('');
  return '<details class="card history-card fold-card" style="margin-bottom:14px"><summary class="fold-summary"><span class="ar">▶</span><h3><i class="fas fa-layer-group"></i>历史反馈</h3><span class="hint">共 '+hs.length+' 个历史反馈周期 · 进展反馈已在上方展示 · 点击展开追溯</span></summary><div class="card-bd history-list">'+rows+'</div></details>';
}
function renderDetail(){
  const it = ITEMS.find(x=>x.id===DETAIL_ID);
  if(!it){ go('list'); return; }
  if(!visibleItems().some(x=>x.id===it.id)){ toast('当前身份无权查看该事项'); go('list'); return; }
  const l = statusLight(it);
  const cellHtml = p => '<div class="cell'+(p[2]&&ROLE==='admin'?' cell-edit':'')+'"'+(p[2]&&ROLE==='admin'?' title="点击手工修改" onclick="metaCellEdit(\''+it.id+'\',\''+p[2]+'\')"':'')+'><div class="k">'+p[0]+(p[2]&&ROLE==='admin'?'<i class="fas fa-pen"></i>':'')+'</div><div class="v">'+esc(p[1])+'</div></div>';
  const firstRound = isFirstRound(it);   /* 首期（新增 / 首次派发）：上期工作计划处不套用三段对照 */
  const returnedFeedback = it.feedbackReturn||null;
  const latestFb = it.fbReport || latestFeedback(it);   /* 下级（或本人）最近一次提交 */
  const feedbackDraftText = fbDraft('fb') || (returnedFeedback&&returnedFeedback.txt) || (latestFb&&[latestFb.current,latestFb.txt].find(v=>v&&v!=='—')) || '';
  const nextPlanDraftText = fbDraft('np') || (returnedFeedback&&returnedFeedback.np) || (latestFb&&[latestFb.next,latestFb.np].find(v=>v&&v!=='—')) || '';

  /* 顶部要素条：默认仅展示核心 6 项，其余要素收进「▶ 更多要素」折叠区（讨论会第二场定） */
  const coreCells = [
    ['首派对象',r6FirstAssignmentLabel(it),''],
    ['承办部门',actualDept(it)||'待派发',''],
    ['部门负责人', deptHeadOf(it), 'deptHead'],
    ['当前落实人', actualExec(it)||'—', 'exec'],
    ['配合部门（信息标签）', it.assists.length?it.assists.join('、'):'—', 'assists'],
    ['计划完成时间', it.deadline, 'deadline'],
    ['第'+(it.periodNo||1)+'期反馈截止',it.nextDue||'—',''],
    ['最近已反馈', (it.lastReportAt||'—')+(returnedFeedback?'（'+feedbackStatusLabel(it)+'）':(it.feedback==='已反馈'?'（'+feedbackStatusLabel(it)+'）':'（本期未反馈）')), 'lastReportAt']
  ];
  const moreCells = [
    ['反馈周期', it.cycle+' · 第 '+(it.periodNo||'—')+' 期', 'cycle'],
    ['最近汇报', it.lastReportAt||'—', 'lastReportAt'],
    ['来源', it.source, 'source'],
    ['提出时间', it.raisedAt, 'raisedAt'],
    ['职务分管高管', who(mgrReviewer(it))||'—', 'leadMgr'],
    ['项目牵头高管',who(it.projectLead)||'—',''],
    ['关联高管', it.mgrs.map(who).join('、'), 'mgrs']
  ];

  /* 流程操作：详情页优先承接本人办理动作；审核、派发等管理动作进入统一流程待办。 */
  const flowOps = [];
  if(ROLE==='exec'||ROLE==='person'){
    if(canRequestClose(it)) flowOps.push('<button class="btn" onclick="openClose(\''+it.id+'\')"><i class="fas fa-flag-checkered"></i> '+closeActionLabel(it)+'</button>');
    if(meetingCanApply(it)) flowOps.push('<button class="btn" onclick="openMeeting(\''+it.id+'\')"><i class="fas fa-calendar-plus"></i> '+meetingActionLabel(it)+'</button>');
  }
   if(ROLE==='admin'){
    flowOps.push('<button class="btn" onclick="copyRemind(\''+it.id+'\')"><i class="fas fa-bullhorn"></i> 一键催办</button>');
  }
  if(canDispatch(it)) flowOps.push('<button class="btn" onclick="openDispatch(\''+it.id+'\')"><i class="fas fa-share-nodes"></i> '+(hasBeenDispatched(it)?'继续派发':'首次派发')+'</button>');

function adminClose(id){
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  if(!closeAdminTodoMe(it)){ toast('该事项尚未流转到督办管理人结项审核环节'); return; }
  it.status = '已完成'; it.flowStep = 4; it.closeStage = 'done';
  const ai = AUDITS.findIndex(a=>a.id===id && a._dynamic); if(ai>=0) AUDITS.splice(ai,1);
  it.closeRequest = Object.assign({},it.closeRequest||{},{status:'已办结'});
  it.logs.push({t:nowRecordTime(), who:ROLES[ROLE].name, act:'结项审核通过', txt:'督办管理人审核通过，事项办结，同步抄送部门负责人及分管高管。'});
  notifyCloseCompleted(it);
  toast('已确认办结「'+it.name+'」，同步抄送相关高管');
  route();
}
function openCloseReject(id,kind){
  const it=ITEMS.find(x=>x.id===id); if(!it) return;
  const allowed=kind==='dept'?closeTodoMe(it):closeAdminTodoMe(it);
  if(!allowed){ toast('当前身份不是本事项的结项审核人'); return; }
  const roleLabel=kind==='dept'?'部门负责人':'督办管理人';
  openModal(`
    <div class="hd"><b><i class="fas fa-rotate-left" style="color:var(--red)"></i> 退回结项申请 · ${esc(it.name)}</b><button class="x" onclick="closeModal()">✕</button></div>
    <div class="bd">
      <div class="role-note" style="margin-bottom:10px">当前由<b>${roleLabel}</b>审核。请填写退回意见和修改要求，落实人修改后可重新提交结项申请。</div>
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">退回意见 <span style="color:var(--red)">*</span></div>
      <textarea id="closeRejectTxt" placeholder="请写明需要补充或修改的内容……" style="width:100%;min-height:100px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;outline:none;line-height:1.7;box-sizing:border-box"></textarea>
    </div>
    <div class="ft"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="confirmCloseReject('${it.id}','${kind}')"><i class="fas fa-rotate-left"></i> 确认退回</button></div>`);
}
function confirmCloseReject(id,kind){
  const reason=$('#closeRejectTxt')?$('#closeRejectTxt').value.trim():'';
  if(!reason){ toast('请填写退回意见'); return; }
  closeModal();
  if(kind==='dept') closeDeptReject(id,reason); else adminCloseReject(id,reason);
}
function adminCloseReject(id,reason){
  const it=ITEMS.find(x=>x.id===id); if(!it) return;
  if(ROLE!=='admin'){ toast('仅督办管理人可以退回结项'); return; }
  if(!closeAdminTodoMe(it)){ toast('该事项尚未流转到督办管理人结项审核环节'); return; }
  const stamp=nowRecordTime();
  const note=String(reason||'结项申请退回落实人补充完善后重新提交。').trim()||'结项申请退回落实人补充完善后重新提交。';
  it.closeStage=''; it.flowStep=0;
  it.closeRequest=Object.assign({},it.closeRequest||{},{status:'已退回',returnedAt:stamp,returnedBy:ROLES[ROLE].name,returnedReason:note});
  const ai=AUDITS.findIndex(a=>a.id===id&&a._dynamic); if(ai>=0) AUDITS.splice(ai,1);
  it.logs.push({t:stamp,who:ROLES[ROLE].name+'（督办管理人）',act:'退回结项申请',txt:'结项申请退回落实人补充完善后重新提交。退回意见：'+note});
  notifyCloseReturned(it,'督办管理人',note);
  toast('已退回「'+it.name+'」结项申请，退回意见将同步落实人');
  route();
}

/* ---------- 评论 / 评价 ---------- */
function canComment(it){
  const p=person(CUR);
  if(!p || !['admin','boss','mgr','exec','person'].includes(p.r)) return false;
  /* 能打开事项详情的关联人都可以评论；保留管理员/公司领导的全局评论权限。 */
  return !it || p.r==='admin' || p.r==='boss' || visibleItems().some(x=>x.id===it.id);
}
function commentThreadHtml(it){
  return (it.comments||[]).map((c,ci)=>{
    const role=String(c.role||''), avatar=(role.includes('高管')||role.includes('领导'))?'#E0568A':'#5A6F9E';
    const replies=(c.replies||[]).map(r=>{
      const rr=String(r.role||''), rc=(rr.includes('高管')||rr.includes('领导'))?'#E0568A':'#5A6F9E';

/* 派发说明自动同步：数据同源 dispatchLog（含首次派发 / 逐级继续派发 / 撤回重派），
   按下级视角合并进「评价与评论」，避免重复落库与不同步 */
function dspNoteRecords(it){
  return ((it && it.dispatchLog) || []).map(function(d, i){
    const t = String(d.txt || '');
    return {
      seq: i + 1,
      who: d.from || '—',
      role: d.fromRole || '督办管理人',
      time: d.t || '',
      to: d.to || '',
      toRole: d.toRole || '',
      txt: t,
      reassign: /^撤回当前承接关系后重新派发/.test(t)
    };
  });
}
function dspNoteHtml(it){
  const list = dspNoteRecords(it);
  if(!list.length) return '';
  return list.map(function(c){
    const label = c.reassign ? '撤回并重新派发说明' : (c.seq === 1 ? '首次派发说明' : '第 ' + c.seq + ' 级派发说明');
    const clean = c.reassign ? String(c.txt).replace(/^撤回当前承接关系后重新派发：/, '') : c.txt;
    return '<div class="cmt dsp-cmt">'
      + '<div class="cmt-ava">' + esc(String(c.who || '').slice(-1)) + '</div>'
      + '<div class="cmt-main">'
        + '<span class="who">' + esc(c.who || '—') + '</span>'
        + '<span class="role-lbl">' + esc(c.role || '') + '</span>'
        + '<span class="dsp-tag"><i class="fas fa-share-nodes"></i> ' + esc(label) + '</span>'
        + '<div class="txt">' + esc(clean || '—') + '</div>'
        + (c.to ? '<div class="cmt-to"><i class="fas fa-arrow-turn-down"></i> 派发对象：' + esc(c.to) + (c.toRole ? '（' + esc(c.toRole) + '）' : '') + '</div>' : '')
        + '<div class="ft"><span>' + esc(formatRecordTime(c.time || '—')) + '</span></div>'
      + '</div></div>';
  }).join('');
}
function toggleReply(id,index){

function submitReply(id,index){

function addComment(id){

function submitFeedback(id){
  const el = document.getElementById('mfbTxt') || document.getElementById('fbTxt');
  const txt = el ? el.value.trim() : fbDraft('fb').trim();
  if(!txt){ toast('请描述当前周期该项工作推进进展'); return; }
  const npEl = document.getElementById('mnpTxt') || document.getElementById('npTxt');
  const np = npEl ? npEl.value.trim() : fbDraft('np').trim();
  if(!np){ toast('请填写「下期工作计划」，提交后将于下期自动带入「上期工作计划」'); return; }
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  if(!canSubmitFeedback(it)){
    if(it.status==='已完成'){ toast('该事项已办结，无需再提交反馈'); return; }
    if(CUR===actualExec(it)){
      toast('本期（第 '+(it.periodNo||1)+' 期）反馈已提交，当前：'+fbStageName(it)+'；同一周期不能重复提交'+(it.fbStage==='done'?'，可点击「模拟周期轮动」进入下一期':'，如被退回将回到此处重新填写'));
    }else{
      toast('当前事项尚未流转到您办理，不能代替落实人提交反馈');
    }
    return;
  }
  const progress=xReadProgress(it); if(!progress)return;
  if(!r3ValidateSummary(it,false,{txt,np,progress}))return;
  fbSync('fb',txt); fbSync('np',np);
  FB_PENDING = {id:id, txt:txt, np:np, progress};
  openFbSubmitConfirm(id,txt,np);
}

function fbDoSubmit(id, txt, np, progress){
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  if(!canSubmitFeedback(it)){ toast('进展反馈已提交或当前不可提交，请刷新后查看最新状态'); closeModal(); route(); return; }
  if(!progress||!Number.isInteger(progress.value)||progress.value<0||progress.value>100)return;
  if(!txt?.trim()||!np?.trim()){toast('请填写本期落实情况和下期计划');return;}
  if(xActualProgress(it)!==null&&progress.value<xActualProgress(it)&&!progress.reason?.trim()){toast('请说明进度调低原因');return;}
  if(!person(r5FeedbackReviewer(it))){toast('尚未配置有效的反馈审核高管，请联系管理人');return;}
  const summary=r3ValidateSummary(it,false,{txt,np,progress});if(!summary)return;
  const r = ROLES[ROLE];
  const stamp=nowRecordTime(), version=feedbackVersion(it);
  const ex = actualExec(it), dept = (person(ex)&&person(ex).dept) || it.workDept || it.lead;
  wfFreezeCurrent(it);
  it.workDept = dept; it.exec = ex;
  it.lastReport = txt; it.lastReportAt = stamp; it.feedback = '已反馈';
  it.feedbackReturn = null;
  it.reassignFeedbackReset = false;
  it.nextPlan = np;
  it.fbReport = {txt:txt, np:np, actualReporter:r.name, submittedAt:stamp, version:version, attachments:FB_ATTACH.slice()};

/* 周期轮动（演示功能）：时间轮动到下一反馈周期——本期填报的「下期工作计划」带入下期「上期工作计划」，期数+1，反馈状态重置 */
function rollPeriod(id){
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  if(!it.nextPlan){ toast('请先在进展反馈中填写并提交「下期工作计划」，再模拟周期轮动'); return; }
  if(ROLE!=='admin' && !canCurrentExecutorAct(it)){ toast('当前身份不能执行周期轮动'); return; }
  const base=(it.nextDue&&it.nextDue!=='—')?new Date(it.nextDue+'T00:00:00'):new Date(TODAY);
  let next=rvNextFeedbackDue(it,base);
  while(next<=TODAY) next=rvNextFeedbackDue(it,next);
  it.nextDue=next.getFullYear()+'-'+pad2(next.getMonth()+1)+'-'+pad2(next.getDate());
  wfFreezeCurrent(it);
  it.lastPlan = it.nextPlan;
  it.nextPlan = '';
  it.periodNo = (it.periodNo||12)+1;
  it.feedback = '未反馈';
  it.fbStage = ''; it.fbReport = null; it.feedbackReturn = null; it.reassignFeedbackReset = false; it.firstRound = false;
  it.logs.push({t:nowRecordTime(), who:'系统', act:'周期轮动', txt:'进入第 '+it.periodNo+' 期反馈周期：下一次应反馈日期已更新为 '+it.nextDue+'；上期填报的「下期工作计划」已自动带入本期「上期工作计划」，请对照填写本期落地执行情况。'});

}

const FB_STAGE_LABEL = {dept:'部门负责人审核中', mgr:'分管高管审核中', admin:'督办管理人审核中', sync:'待公司领导审阅', done:'进展反馈已审核'};
function fbStageName(it){ return FB_STAGE_LABEL[it&&it.fbStage]||'未提交'; }

function bossOf(){ const p=PEOPLE.find(x=>x.r==='boss'); return p?p.c:'YZ'; }
function adminOf(){ const p=PEOPLE.find(x=>x.r==='admin'); return p?p.c:'TY'; }
/* 督办管理人环节：由督办管理人本人处理 */
function fbAdminMe(it){ return !!it && ROLE==='admin' && it.fbStage==='admin'; }
/* 公司领导环节：仅做已阅与评论，不退回 */

/* 当前身份可否在本环节执行「同意 / 修改 / 退回」 */
function fbCanAct(it,lvl){
  if(!it||it.status==='已完成') return false;
  if(lvl==='dept') return fbDeptMe(it);

}
function fbCanEdit(it){

/* 退回对象：部门负责人只能退落实人；分管领导可退落实人/部门负责人；督办管理人可退落实人/部门负责人/分管领导 */

function fbBackTargetPerson(it,to){

function fbChainText(it){

/* =========================================================
   任务派发规则（自上而下）：督办管理人首派至分管高管/部门负责人；分管高管可继续选择任意角色+人；部门负责人只可向本部门落实人下派一层；落实人为链路末端。首次派发、继续派发、撤回并重新派发分开处理。
   ========================================================= */
function hasBeenDispatched(it){
  /* 兼容旧演示数据：已直接指定落实人的事项虽没有 dispatchTo/dispatchLog，也已经处于已派发状态。 */
  return !!(it && (it.dispatchTo || (it.dispatchLog||[]).length || (it.directExec && actualExec(it) && actualExec(it)!=='待分配')));
}
function canDispatch(it){
  if(!it || it.status==='已完成') return false;
  if(ROLE==='person'||ROLE==='boss') return false;
  /* 督办管理人只在尚未派发时走“首次派发”；已有承接关系时走“重新派发”。 */
  if(ROLE==='admin') return !hasBeenDispatched(it);
  /* 未指定具体落实人时，牵头高管也可收到派发待办并继续选择承接人。 */
  if(ROLE==='mgr' && it.leadMgr===CUR && !it.directExec && it.dispatchTo && it.dispatchTo.type==='dept') return true;
  return currentHandler(it)===CUR;
}
function dispatchReassignBlocked(it){
  if(it && it.closeStage) return '当前事项处于结项流程中，暂不能重新派发';
  const mr=meetingLatest(it);
  if(mr && !['已完成','已退回'].includes(mr.status)) return '当前事项处于专题会流程中，暂不能重新派发';
  return '';
}
function canReassign(it){
  if(!it || it.status==='已完成' || !hasBeenDispatched(it) || dispatchReassignBlocked(it)) return false;
  if(ROLE==='admin') return true;
  const last=(it.dispatchLog||[]).slice(-1)[0];
  /* 只有最近一次派发人可以撤回并改派；落实人为链路末端，不提供改派入口。 */
  return !!last && last.from===CUR && (ROLE==='mgr'||ROLE==='exec');
}
function dispatchActionLabel(it){ return hasBeenDispatched(it)?'继续派发':'首次派发'; }
/* 任务是否派发到当前角色（进入其待办列表） */
function dispatchedToMe(it){
  const d = it.dispatchTo; if(!d) return false;
  if(ROLE==='mgr') return d.type==='mgr' && d.name===CUR;
  if(ROLE==='exec') return (d.type==='dept'||d.type==='person') && d.name===CUR;
  if(ROLE==='person') return d.type==='person' && d.name===CUR;
  return false;
}
function dispatchTodoMe(it){
  if(!(it && dispatchedToMe(it) && it.status!=='已完成' && it.feedback==='未反馈' && !it.fbStage)) return false;
  /* 落实人：点开阅读（进入详情）即完成接收，该事项不再停留在「我的任务」 */
  if(ROLE==='person' && isItemRead(it.id)) return false;
  return true;
}
/* 尚未进入事项清单的待办：只在「我的任务」处理
   分管高管 / 部门负责人 → 待其派发；落实人 → 待其点开阅读 */
function pendingAcceptMe(it){
  if(!it || it.status==='已完成') return false;
  if(ROLE==='person') return !!(dispatchedToMe(it) && !isItemRead(it.id));
  if(ROLE==='mgr' || ROLE==='exec') return !!dispatchTodoMe(it);
  return false;
}
/* 派发对象可选项（按当前角色权限收敛） */
function dispatchTargets(it){
  const me = person(CUR);
  if(ROLE==='admin'){
    return [{g:'分管高管', list:PEOPLE.filter(p=>p.r==='mgr').map(p=>({v:'mgr|'+p.c, label:p.title}))},
            {g:'部门负责人', list:PEOPLE.filter(p=>p.r==='exec').map(p=>({v:'dept|'+p.c, label:p.title}))}];
  }
  if(ROLE==='mgr'){
    return [{g:'分管高管', list:PEOPLE.filter(p=>p.r==='mgr'&&p.c!==CUR).map(p=>({v:'mgr|'+p.c, label:p.title}))},
            {g:'部门负责人', list:PEOPLE.filter(p=>p.r==='exec').map(p=>({v:'dept|'+p.c, label:p.title}))},
            {g:'落实人（派发后直接办理）', list:PEOPLE.filter(p=>p.r==='person').map(p=>({v:'person|'+p.c, label:p.dept+' · '+p.title}))}];
  }
  if(ROLE==='exec'){
    return [{g:'落实人（本部门，仅可派发一人）', list:PEOPLE.filter(p=>p.r==='person'&&p.dept===me.dept).map(p=>({v:'person|'+p.c, label:p.dept+' · '+p.title}))}];
  }
  return [];
}

/* ---------- 收藏 ---------- */
function myFav(it){ return !!(it && it.favBy && it.favBy[CUR]); }
function anyoneFav(it){ return !!(it && it.favBy && Object.keys(it.favBy).length); }
/* 关注可见性：公司领导收藏→全员可见「高管关注中」；分管高管→同步分管的部门负责人/落实人；部门负责人→同步该事项落实人；落实人/督办管理人的收藏不同步 */
function watchTagInfo(it){
  if(!it || !it.favBy) return null;
  var codes = Object.keys(it.favBy);
  for(var i=0;i<codes.length;i++){
    var p = person(codes[i]); if(!p) continue;
    if(p.r==='boss') return {label:'高管关注中'};
    if(p.r==='mgr' && codes[i]!==CUR && (p.depts||[]).indexOf(it.lead)>=0 &&
       ((ROLE==='exec' && deptReviewer(it)===CUR) || (ROLE==='person' && actualExec(it)===CUR))) return {label:'分管高管关注中'};
    if(p.r==='exec' && codes[i]!==CUR && ROLE==='person' && actualExec(it)===CUR) return {label:'部门负责人关注中'};
  }
  return null;
}
function watchSyncText(it){
  if(!it || !it.favBy) return '';
  var codes = Object.keys(it.favBy);
  for(var i=0;i<codes.length;i++){
    var p = person(codes[i]); if(!p) continue;
    if(p.r==='boss') return '，已向全员展示「高管关注中」';
    if(p.r==='mgr') return '，已同步给分管的部门负责人与落实人';
    if(p.r==='exec') return '，已同步给该事项落实人';
  }
  return '';
}
function toggleFav(id){
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  it.favBy = it.favBy || {};
  if(it.favBy[CUR]) delete it.favBy[CUR]; else it.favBy[CUR] = nowText();
  it.fav = Object.keys(it.favBy).length > 0;
  const syncing = it.favBy[CUR] ? watchSyncText(it) : '';
  toast((it.favBy[CUR]?'已收藏「'+it.name+'」':'已取消收藏「'+it.name+'」') + syncing + '；收藏事项在列表自动置顶');
  route();
}

async function aiReadFile(input){
  const file=input.files[0];if(!file)return;
  const status=$('#aiFileStatus'),button=$('#aiImportSubmit');
  if(!/\.(txt|md)$/i.test(file.name)||file.size>2*1024*1024){status.textContent='请选择不超过 2 MB 的 TXT / Markdown 文本。';input.value='';return;}
  button.disabled=true;status.textContent='正在读取…';
  try{const text=await file.text();if(text.includes('\u0000')||text.includes('\uFFFD'))throw Error('encoding');if(text.length>60000)throw Error('size');$('#aiImportText').value=text;if(!$('#aiImportTitle').value)$('#aiImportTitle').value=file.name.replace(/\.[^.]+$/,'');status.textContent='已读取：'+file.name;}
  catch(e){status.textContent=e.message==='size'?'正文超过 60,000 字，请分段导入。':'读取失败，请使用 UTF-8 文本，或直接粘贴正文。';input.value='';}
  finally{button.disabled=false;}
}
function aiSubmitImport(){
  if(!aiAdmin())return;
  const title=$('#aiImportTitle').value.trim(),date=$('#aiImportDate').value,source=$('#aiImportSource').value,text=$('#aiImportText').value.trim();
  if(!title||!date||!text){toast('请填写会议名称、日期和纪要正文');return;}
  if(text.length>60000){toast('正文超过 60,000 字，请分段导入');return;}
  if(AI.meetings.some(m=>m.date===date&&m.text===text)){toast('相同日期的这份纪要已导入，请在会议工作台查看');return;}
  const id=aiId('meet');AI.meetings.unshift({id,title,date,source,text,createdBy:CUR,status:'待提炼',extracted:false,importedAt:new Date().toLocaleString('zh-CN'),fileName:$('#aiImportFile').files[0]?.name||'粘贴纪要'});aiSave();closeModal();aiGoMeeting(id);toast('会议纪要已导入，可开始提炼');
}

function aiValidDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const d=new Date(value+'T12:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===value;}
function aiExtractRows(m){
  const rows=m.text.split(/\n|(?<=[。；;])/).map(s=>s.trim()).filter(Boolean);
  return rows.filter(s=>/完成|负责|提交|推进|落实|制定|梳理|建立|开展|形成|跟进|配合/.test(s)&&!(/仅讨论|暂不立项|暂不执行|不纳入督办|无需跟进|不需要跟进/.test(s))).map((quote,index)=>{
    const lead=Object.keys(COLORS).find(dept=>quote.includes(dept))||'';
    const owner=PEOPLE.find(p=>['exec','person'].includes(p.r)&&new RegExp('(?:^|[^A-Za-z])'+p.c+'(?:$|[^A-Za-z])').test(quote))?.c||'';
    const dm=quote.match(/(20\d{2})[-年\/.](\d{1,2})[-月\/.](\d{1,2})日?/);
    const deadline=dm?`${dm[1]}-${dm[2].padStart(2,'0')}-${dm[3].padStart(2,'0')}`:'';
    let title=quote.replace(/^\d+[.、．)）]\s*/,'');const task=title.match(/(?:完成|提交|推进|落实|制定|梳理|建立|开展|跟进)(.+)/);if(task)title=task[0];title=title.split(/[，,。；]/)[0].slice(0,70);
    return {id:aiId('draft'),meetingId:m.id,name:title,content:quote.replace(/^\d+[.、．)）]\s*/,''),lead,owner,deadline:aiValidDate(deadline)?deadline:'',cycle:'每周一反馈',firstDue:'',importance:'常规',quote,quoteIndex:index+1,status:'pending',selected:false,createdAt:new Date().toISOString()};
  });
}
function aiExtract(id){
  if(!aiAdmin())return;const m=AI.meetings.find(m=>m.id===id);if(!m)return;
  if(m.extracted){aiOpenDrafts(id);return;}
  const drafts=aiExtractRows(m);AI.drafts.push(...drafts);m.extracted=true;aiSave();aiOpenDrafts(id);toast(drafts.length?'演示提炼完成：'+drafts.length+' 条草稿，请逐条核对':'未识别到明确行动项，可查看原文并手动新增草稿');
}
function aiDraftErrors(d){
  const errors=[];if(!d.name.trim())errors.push('缺少事项名称');if(!d.content.trim())errors.push('缺少工作要求');if(!d.lead||!COLORS[d.lead])errors.push('牵头部门待确认');
  const p=person(d.owner);if(!p||!['person','exec'].includes(p.r)||p.dept!==d.lead)errors.push('落实人待确认');
  if(!aiValidDate(d.deadline))errors.push('完成时间待确认');
  const m=AI.meetings.find(m=>m.id===d.meetingId);if(m&&aiValidDate(d.deadline)&&d.deadline<m.date)errors.push('完成时间早于会议日期');
  if(!AI_CYCLES.includes(d.cycle))errors.push('反馈周期待确认');
  if(!aiValidDate(d.firstDue))errors.push('首次反馈日期待确认');else if(aiValidDate(d.deadline)&&d.firstDue>d.deadline)errors.push('首次反馈晚于完成时间');else if(m&&d.firstDue<m.date)errors.push('首次反馈早于会议日期');
  return errors;
}

utton>')}

function aiFeedbackRecords(){
  const records=[];
  visibleItems().forEach(it=>{
    const logs=(it.logs||[]).filter(l=>/提交反馈|关联部门反馈|补充反馈/.test(l.act||'')&&aiValidDate((l.t||'').slice(0,10))&&String(l.txt||'').trim());
    logs.forEach((l,i)=>{const parts=l.txt.split('〔下期工作计划〕');records.push({id:it.id+'-fb-'+i,itemId:it.id,itemName:it.name,dept:it.lead,date:l.t.slice(0,10),author:l.who,kind:l.act,text:parts[0].trim(),plan:(parts[1]||'').trim(),fullText:l.txt});});
    if(it.lastReport&&it.lastReport!=='—'&&aiValidDate(it.lastReportAt)&&!logs.some(l=>l.t.slice(0,10)===it.lastReportAt&&/提交反馈|补充反馈/.test(l.act||''))){records.push({id:it.id+'-latest',itemId:it.id,itemName:it.name,dept:it.lead,date:it.lastReportAt,author:it.exec,kind:'最近一次反馈',text:it.lastReport,plan:it.nextPlan||'',fullText:it.lastReport+(it.nextPlan?'\n〔下期工作计划〕'+it.nextPlan:'')});}
  });
  return records.sort((a,b)=>a.date.localeCompare(b.date)||a.itemId.localeCompare(b.itemId));
}

function aiBuildReport(records,items){
  const refs=records.map((r,i)=>({...r,ref:i+1})),covered=new Set(refs.map(r=>r.itemId));
  const groups=[...covered].map(id=>{const rs=refs.filter(r=>r.itemId===id),latestDate=rs[rs.length-1].date;return {id,name:rs[0].itemName,dept:rs[0].dept,records:rs,latest:rs.filter(r=>r.date===latestDate)};});
  const risk=refs.flatMap(r=>r.text.split(/(?<=[。；;\n])/).filter(s=>/延期|延迟|滞后|未完成|待确认|待明确|待解决|阻塞|(?:存在|面临|发生|潜在).{0,8}风险|风险[:：]|风险较|不足|尚未|卡点/.test(s)&&!/^\s*(无风险|暂无风险|未发现风险|无延期|未发生延期)/.test(s)).map(t=>({text:t.trim(),ref:r.ref,itemName:r.itemName})));
  const plans=groups.flatMap(g=>g.latest.flatMap(r=>{
    if(r.plan)return [{text:r.plan,ref:r.ref,itemName:r.itemName}];
    return r.text.split(/[，,。；;\n]/).filter(s=>/预计|计划|下一步|拟于|将于/.test(s)).map(s=>({text:s.trim(),ref:r.ref,itemName:r.itemName}));
  }));
  const gaps=items.filter(it=>!covered.has(it.id)).map(it=>({id:it.id,name:it.name}));
  return {id:aiId('report'),title:(AIM.dept==='全部'?'督办事项':AIM.dept)+'阶段总结',createdBy:CUR,createdAt:new Date().toLocaleString('zh-CN'),from:AIM.from,to:AIM.to,dept:AIM.dept,item:AIM.item,itemIds:items.map(it=>it.id),records:refs,groups,risk,plans,gaps,editedText:null,saved:false};
}

}
function aiReportText(r){

    '<thead><tr><th>事项名称</th><th>进展总结</th><th>落实人</th><th>时间要求</th><th>本期落实情况</th><th>下期工作计划</th>'+(canEdit?'<th class="fb-th-ops">操作</th>':'')+'</tr></thead>'+

function fbNormLine(n){
  n = String(n||'').trim();

}
function fbAddLine(){
  if(ROLE!=='admin'){ toast('仅督办管理人可新增条线'); return; }
  fbLineModal('新增条线', '', '', '', 'fbSaveLine()',
    '新增后条线出现在汇报表末尾，可点条线内的「增加事项」从事项明细调入事项。');
}
function fbSaveLine(){
  const name = fbNormLine(($('#fbLnName')||{}).value);
  if(!name){ toast('请填写条线名称'); return; }
  if(FB_LINES.indexOf(name)>=0){ toast('该条线已存在'); return; }
  FB_LINES.push(name);
  FB_LINE_META[name] = {owner:(($('#fbLnOwner')||{}).value||''), mgr:(($('#fbLnMgr')||{}).value||'')};
  fbLinesSave(); closeModal(); route();
  toast('条线已新增：'+name+'，可点「增加事项」调入事项');
}
function fbEditLine(key){
  if(ROLE!=='admin'){ toast('仅督办管理人可修改条线'); return; }
  const meta = FB_LINE_META[key]||{};
  FB_EDIT_KEY = key;
  fbLineModal('修改条线 · '+key, key, meta.owner||'', meta.mgr||'', 'fbSaveLineEdit()',
    '修改条线名称后，该条线下全部事项的牵头部门同步更新；责任人与分管仅影响汇报表展示。');
}
let FB_EDIT_KEY = '';
function fbSaveLineEdit(){
  const oldKey = FB_EDIT_KEY;
  const name = fbNormLine(($('#fbLnName')||{}).value);
  if(!name){ toast('请填写条线名称'); return; }
  const owner = (($('#fbLnOwner')||{}).value||''), mgr = (($('#fbLnMgr')||{}).value||'');
  if(name!==oldKey){
    ITEMS.forEach(i=>{ if((i.lead||'其他')===oldKey) i.lead = name; });
    const idx = FB_LINES.indexOf(oldKey);
    if(idx>=0) FB_LINES[idx] = name; else FB_LINES.push(name);
    const meta = FB_LINE_META[oldKey]; delete FB_LINE_META[oldKey];
    FB_LINE_META[name] = meta||{};
  }
  FB_LINE_META[name] = Object.assign({}, FB_LINE_META[name]||{}, {owner:owner, mgr:mgr});
  FB_EDIT_KEY = '';
  fbLinesSave(); closeModal(); route();
  toast('条线已更新：'+name);
}
function fbDeleteLine(key){
  if(ROLE!=='admin'){ toast('仅督办管理人可删除条线'); return; }
  FB_DEL_KEY = key;
  const items = ITEMS.filter(i=>(i.lead||'其他')===key && i.status!=='已完成' && !i.fbOff);
  openModal(
    '<div class="hd"><b><i class="fas fa-triangle-exclamation" style="color:#D93F3F"></i> 删除条线 · '+esc(key)+'</b><button class="x" onclick="closeModal()">✕</button></div>'+
    '<div class="bd">'+
      '<div class="del-warn"><i class="fas fa-triangle-exclamation"></i> 删除后该条线模块从汇报表移除'+
      (items.length?('，条线内 <b>'+items.length+'</b> 项事项一并移出汇报表（不会删除事项本身，可在页面底部「已移出事项」中恢复）'):'（该条线暂无事项）')+'。</div>'+
      '<div class="ft" style="margin-top:14px">'+
        '<button class="btn" onclick="closeModal()">取消</button>'+
        '<button class="btn danger" onclick="fbDoDeleteLine()"><i class="fas fa-trash-can"></i> 确认删除</button>'+
      '</div>'+
    '</div>');
}
let FB_DEL_KEY = '';
function fbDoDeleteLine(){
  const key = FB_DEL_KEY; if(!key) return;
  ITEMS.forEach(i=>{ if((i.lead||'其他')===key) i.fbOff = true; });
  const idx = FB_LINES.indexOf(key); if(idx>=0) FB_LINES.splice(idx,1);
  delete FB_LINE_META[key];
  FB_DEL_KEY = '';
  fbLinesSave(); closeModal(); route();
  toast('条线「'+key+'」已删除，相关事项可在底部「已移出事项」恢复');
}

<script>
/* =========================================================
   V5.2  事项看板统计卡（与驾驶舱 KPI 同款 · 支持下钻到事项）
         新增条线按钮并入「导入 / 导出」按钮组
         新增 / 修改条线弹窗美化
         所有下拉框支持手工输入（combobox）
         修改事项：全部内容可手工修改
   ========================================================= */

/* ---------------- 1. 统计卡下钻 ---------------- */
function fbBoardList(){ return visibleItems().filter(i => i.status !== '已完成' && !i.fbOff); }

function fbDrill(kind){
  const all = fbBoardList();
  const g = fbGroups(all), keys = Object.keys(g);
  const nofb = all.filter(rvNeedsFeedback);
  const hasSum = all.filter(i => fbAiSummary(i));
  let title, sub, body, icon;
  if(kind === 'line'){
    icon = 'fa-sitemap'; title = '汇报条线';
    sub = keys.length + ' 个条线 · 共 ' + all.length + ' 项在途事项 · 点击条线可定位，点击事项可进入详情';
    body = keys.length ? keys.map(k=>{
      const arr = fbSorted(g[k] || []);
      const owner = who(DEPT_LEAD[k]) || (arr[0] && arr[0].mgrs && arr[0].mgrs.length ? who(arr[0].mgrs[0]) : '') || '—';
      return '<div class="drill-grp"><div class="dg-hd" onclick="fbDrillJump(\'' + esc(k) + '\')">'
        + '<i class="fas fa-layer-group"></i><b>' + esc(k) + '条线</b>'
        + '<span>责任人：' + esc(owner) + ' · ' + arr.length + ' 项</span>'
        + '<span class="go">定位到该条线 <i class="fas fa-arrow-right"></i></span></div>'
        + arr.map(fbDrillRow).join('') + '</div>';
    }).join('') : '<div class="drill-empty">暂无条线内容，可点「新增条线」创建。</div>';
  } else {
    const arr = kind === 'nofb' ? nofb : (kind === 'sum' ? hasSum : fbSorted(all));
    title = kind === 'nofb' ? '本期未反馈' : (kind === 'sum' ? '已有进展总结' : '在途事项');
    icon  = kind === 'nofb' ? 'fa-clock' : (kind === 'sum' ? 'fa-wand-magic-sparkles' : 'fa-folder-open');
    sub   = '共 ' + arr.length + ' 项事项 · 点击任意一项直接进入事项详情';
    body  = arr.length ? arr.map(fbDrillRow).join('') : '<div class="drill-empty">暂无相关事项</div>';
  }
  openModal(
    '<div class="hd"><b><i class="fas ' + icon + '" style="color:var(--accent)"></i> ' + esc(title) + ' · 明细下钻</b><button class="x" onclick="closeModal()">✕</button></div>' +
    '<div class="bd">' +
      '<div class="drill-top"><span class="hint">' + esc(sub) + '</span>' +
        '<div class="drill-search"><i class="fas fa-magnifying-glass"></i><input id="drillKw" placeholder="搜索事项名称 / 落实人 / 部门…" oninput="fbDrillFilter()"></div></div>' +
      '<div class="drill-list">' + body + '</div>' +
      '<div class="ft" style="margin-top:14px">' +
        '<button class="btn" onclick="closeModal()">关闭</button>' +
        '<button class="btn" onclick="closeModal();go(\'list\')"><i class="fas fa-table-list"></i> 在事项明细中查看</button>' +
      '</div>' +
    '</div>');
}

/* ---------------- 2. 可手工输入的下拉框 ---------------- */
var COMBO_OPEN = null;
function comboInit(root){
  const scope = root || document;
  if(!scope.querySelectorAll) return;
  Array.prototype.forEach.call(scope.querySelectorAll('select'), function(sel){
    if(sel.getAttribute('data-combo') === '1') return;
    if(sel.closest('.x-group-form, .x-filters')) return;
    if(sel.closest && sel.closest('.ai-form')) return;              /* AI 草稿弹窗保持原生联动 */
    if(sel.closest && sel.closest('.toolbar') && !sel.closest('#modalMask')) return; /* 列表筛选器保持原生 */
    comboMake(sel);
  });
}
function comboFlat(opts){
  const out = [];
  opts.forEach(function(x){ if(x.items) x.items.forEach(function(o){ out.push(o); }); else out.push(x); });
  return out;
}
function comboMake(sel){
  if(sel.closest('.ntv')) return;
  sel.setAttribute('data-combo', '1');
  const opts = [];
  Array.prototype.forEach.call(sel.children, function(ch){
    if(ch.tagName === 'OPTGROUP'){
      const g = {group: ch.getAttribute('label') || '', items: []};
      Array.prototype.forEach.call(ch.children, function(o){ if(o.tagName === 'OPTION') g.items.push({v:o.value, t:o.textContent}); });
      opts.push(g);
    } else if(ch.tagName === 'OPTION'){
      opts.push({v: ch.value, t: ch.textContent});
    }
  });
  const flat = comboFlat(opts);
  const selOpt = sel.options[sel.selectedIndex];
  const curOpt = selOpt ? {v: selOpt.value, t: selOpt.textContent} : (flat[0] || {v:'', t:''});

  const wrap = document.createElement('div');
  wrap.className = 'combo';
  if(sel.getAttribute('style')) wrap.setAttribute('style', sel.getAttribute('style'));
  if(sel.className) wrap.className += ' ' + sel.className;

  const vis = document.createElement('input');
  vis.type = 'text'; vis.className = 'combo-in'; vis.autocomplete = 'off';
  vis.value = curOpt.t || ''; vis.placeholder = '可下拉选择，也可直接输入';

  const hid = document.createElement('input');
  hid.type = 'hidden';
  if(sel.id) hid.id = sel.id;
  if(sel.name) hid.name = sel.name;
  hid.value = (curOpt.v === undefined || curOpt.v === null) ? (curOpt.t || '') : curOpt.v;
  hid.setAttribute('data-combo', '1');
  if(typeof sel.onchange === 'function') hid.onchange = sel.onchange;
  const oc = sel.getAttribute('onchange');
  if(oc) hid.setAttribute('onchange', oc);

  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'combo-btn';
  btn.innerHTML = '<i class="fas fa-chevron-down"></i>';

  const list = document.createElement('div');
  list.className = 'combo-list';

  wrap.appendChild(vis); wrap.appendChild(btn); wrap.appendChild(hid); wrap.appendChild(list);

  const syncFree = function(){
    const txt = (vis.value || '').trim();
    if(!txt){ hid.value = ''; return; }
    const hit = flat.filter(o => o.t === txt)[0];
    hid.value = hit ? hit.v : txt;             /* 未命中即视为手工输入的自定义值 */
  };
  const open = function(kw){
    if(COMBO_OPEN && COMBO_OPEN !== list) COMBO_OPEN.classList.remove('open');
    comboRender(list, opts, kw || '', hid.value, function(o){
      vis.value = o.t; hid.value = o.v; list.classList.remove('open'); COMBO_OPEN = null;
      if(typeof hid.onchange === 'function'){ try{ hid.onchange.call(hid); }catch(e){} }
    });
    list.classList.add('open'); COMBO_OPEN = list;
  };
  btn.addEventListener('click', function(e){ e.stopPropagation(); list.classList.contains('open') ? (list.classList.remove('open'), COMBO_OPEN = null) : open(''); });
  vis.addEventListener('focus', function(){ open(''); });
  vis.addEventListener('input', function(){ syncFree(); open(vis.value.trim()); });
  vis.addEventListener('change', function(){ syncFree(); });
  vis.addEventListener('blur', function(){ setTimeout(function(){ list.classList.remove('open'); if(COMBO_OPEN === list) COMBO_OPEN = null; }, 160); });
  vis.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); syncFree(); list.classList.remove('open'); COMBO_OPEN = null; }
    if(e.key === 'Escape'){ list.classList.remove('open'); COMBO_OPEN = null; }
  });
  if(sel.parentNode) sel.parentNode.replaceChild(wrap, sel);
}
function comboRender(list, opts, kw, curV, onPick){
  let html = '';
  opts.forEach(function(x){
    if(x.group){
      const items = x.items.filter(o => !kw || o.t.indexOf(kw) >= 0 || String(o.v).indexOf(kw) >= 0);
      if(!items.length) return;
      html += '<div class="cl-group">' + esc(x.group) + '</div>';
      items.forEach(function(o){ html += comboItemHtml(o, curV); });
    } else {
      if(kw && x.t.indexOf(kw) < 0 && String(x.v).indexOf(kw) < 0) return;
      html += comboItemHtml(x, curV);
    }
  });
  if(!html) html = '<div class="cl-none">无匹配项 —— 可直接输入自定义内容</div>';
  list.innerHTML = html;
  Array.prototype.forEach.call(list.querySelectorAll('.cl-item'), function(el){
    el.addEventListener('mousedown', function(e){ e.preventDefault(); });
    el.addEventListener('click', function(){ onPick({v: el.getAttribute('data-v'), t: el.getAttribute('data-t')}); });
  });
}
function comboItemHtml(o, curV){
  const q = x => esc(x).replace(/"/g, '&quot;');
  return '<div class="cl-item' + (String(curV) === String(o.v) ? ' on' : '') + '" data-v="' + q(o.v) + '" data-t="' + q(o.t) + '">' + esc(o.t) + '</div>';
}
document.addEventListener('click', function(e){
  if(COMBO_OPEN){
    var w = COMBO_OPEN.closest ? COMBO_OPEN.closest('.combo') : null;
    if(w && e.target && w.contains(e.target)) return;   /* 点击输入框/箭头本身不关闭 */
    COMBO_OPEN.classList.remove('open'); COMBO_OPEN = null;
  }
});

/* 打开弹窗 / 渲染表单后自动把 select 升级为可输入下拉 */
(function(){
  const _om = openModal;
  openModal = function(html){
    _om(html);
    const m = document.getElementById('modalMask');
    if(m) comboInit(m);
  };
  const _rc = renderCreate;

    _rc.apply(this, arguments);
    const c = document.getElementById('content');
    if(c) comboInit(c.querySelectorAll('.fcell select, .form select').length ? c : c);
    else comboInit(document.getElementById('ntPane'));
  };
  const _rt = route;
  route = function(){
    _rt.apply(this, arguments);
    const c = document.getElementById('content');
    if(c) Array.prototype.forEach.call(c.querySelectorAll('.fcell select, .form select'), function(s){
      if(s.getAttribute('data-combo') !== '1') comboMake(s);
    });
  };
})();

function emAddChip(wrapSel, inputId){
  const w = document.querySelector(wrapSel), inp = document.getElementById(inputId);
  if(!w || !inp) return;
  const v = String(inp.value || '').trim();
  if(!v){ toast('请输入内容后再添加'); return; }
  const existed = Array.prototype.slice.call(w.querySelectorAll('.chip[data-v]')).filter(c => c.getAttribute('data-v') === v)[0];
  if(existed){
    existed.classList.add('on');            /* 已存在则直接勾选 */
  } else {
    const s = document.createElement('span');
    s.className = 'chip on'; s.setAttribute('data-v', v);
    s.innerHTML = esc(v) + ' <i class="fas fa-xmark" style="margin-left:3px;opacity:.6"></i>';
    s.onclick = function(){ s.remove(); };
    w.insertBefore(s, inp);
  }
  inp.value = ''; inp.focus();
}

saveEditItem = function(id){
  const it = ITEMS.find(x => x.id === id); if(!it) return;
  const val = function(k){ const e = document.getElementById(k); return e ? String(e.value || '').trim() : ''; };
  const name = val('edName');
  if(!name){ toast('事项名称不能为空'); return; }
  const contentEl = document.getElementById('edContent');
  const content = contentEl ? String(contentEl.value || '').trim() : '';
  if(!content){ toast('请填写「督办事项内容」'); if(contentEl){ contentEl.classList.add('req-miss'); contentEl.focus(); } return; }
  it.name = name; it.content = content;

  mgrs:{label:'关联高管', type:'list', get:it=>it.mgrs.map(who).join('、'), apply:(it,v)=>{
    it.mgrs=v.split(/[、,，;；]/).map(s=>s.trim()).filter(Boolean).map(n=>{ const p=PEOPLE.find(x=>x.nm===n||x.c===n); return p?p.c:n; });

function metaCellEdit(id,key){

/* ---- AI 一键生成总结：跨角色共享 ----
   落实人确认后，同一事项的 部门负责人 / 分管高管 / 督办管理人 打开详情
   即自动载入最新已确认总结，且均可编辑后重新确认（按报告 id 覆盖更新）。 */
const __v53ReportAllowed = aiReportAllowed;
aiReportAllowed = function(report){
  if(__v53ReportAllowed(report)) return true;
  if(report && report.scope==='item-detail'){
    const it=ITEMS.find(x=>x.id===report.item);
    if(it){
      if(ROLE==='admin') return true;                    /* 督办管理人 */
      if(DEPT_LEAD[actualDept(it)]===CUR) return true;   /* 部门负责人 */
      if(mgrReviewer(it)===CUR) return true;             /* 分管高管 */
    }
  }
  return false;
};
const __v53RenderADS = renderAiDetailSummary;
renderAiDetailSummary = function(keep){
  aiInitDetailSummary();
  if(!AID.report){
    const arr=AI.reports.filter(x=>x.scope==='item-detail'&&x.item===DETAIL_ID&&x.saved&&aiReportAllowed(x));
    const shared=arr[arr.length-1];
    if(shared){ AID.report=JSON.parse(JSON.stringify(shared)); AID.stale=false; AID.editMode=false; }
  }else if(AID.report.saved && !AID.editMode){
    const stored=AI.reports.find(x=>x.id===AID.report.id&&aiReportAllowed(x));
    if(stored) AID.report=JSON.parse(JSON.stringify(stored));
  }
  __v53RenderADS(keep);
};

<script>
/* ============================================================
   V5.4  反馈周期可改 + AI 按钮防截断 + 统计区重排（临期/结项审批/结项）
   ============================================================ */

/* ---------------- 1. 工作日工具 ---------------- */
function fbWdBetween(d1, d2){
  var day = function(x){ var d = new Date(x); if(isNaN(d)) return null; d.setHours(0,0,0,0); return d; };
  var a = day(d1), b = day(d2);
  if(!a || !b) return 999;
  var sign = a <= b ? 1 : -1;
  if(sign < 0){ var t = a; a = b; b = t; }
  var n = 0, d = new Date(a);
  d.setDate(d.getDate() + 1);
  while(d <= b){ var w = d.getDay(); if(w !== 0 && w !== 6) n++; d.setDate(d.getDate() + 1); }
  return sign * n;
}
function fbWdUntil(deadline){ return days(deadline) > 900 ? 999 : fbWdBetween(new Date(), deadline); }
function fbWdLabel(it){
  var n = fbWdUntil(it.deadline);
  return n < 0 ? '已逾期 ' + (-n) + ' 个工作日' : (n > 900 ? '未设截止' : '距截止 ' + n + ' 个工作日');
}

/* ---------------- 2. 结项归集：拟申请 / 已结项 ---------------- */
function fbClosePending(it){
  if(!it || it.status === '已完成') return false;
  var st = it.closeRequest && it.closeRequest.status;
  if(it.closeStage === 'dept' || it.closeStage === 'admin') return true;
  if(st === '待审核' || st === '督办管理人审核中') return true;
  var fb = fbFeedback(it);
  var txt = [fb.cur, fb.nxt, fbAiSummary(it)].join(' ');
  return /申请结项|提请结项|建议结项|结项申请/.test(txt);
}
function fbClosedDone(it){
  return !!it && it.status === '已完成' && (it.closeStage === 'done' || (it.closeRequest && it.closeRequest.status === '已办结'));
}
function fbCloseSource(it){
  if(it.closeStage === 'dept') return '审批中 · 待部门负责人确认';
  if(it.closeStage === 'admin') return '审批中 · 待督办管理人审核';
  var st = it.closeRequest && it.closeRequest.status;
  if(st === '待审核' || st === '督办管理人审核中') return '结项审批中';
  return '反馈内容识别「申请结项」';
}
/* 结项审批满 10 个工作日自动转为结项事项 */
function fbCloseAutoSweep(){
  var changed = false;
  ITEMS.forEach(function(it){
    if(it.status === '已完成') return;
    if(it.closeStage !== 'dept' && it.closeStage !== 'admin') return;
    var st = it.closeRequest && it.closeRequest.status;
    var t = it.closeRequest && it.closeRequest.time;
    if((st === '待审核' || st === '督办管理人审核中') && t && fbWdBetween(t, new Date()) >= 10){
      if(it.closeStage === 'dept'){
        /* 部门负责人确认超时：结项申请流转督办管理人审批，不再直接办结 */
        it.closeStage = 'admin'; it.flowStep = 2;
        it.closeRequest.status = '督办管理人审核中';
        it.logs.push({t:nowRecordTime(), who:'系统', act:'结项流程流转', txt:'部门负责人确认已超 10 个工作日未处理，结项申请自动流转督办管理人审批。'});
        pushCloseAudit(it);
        changed = true;
        return;
      }
      it.status = '已完成'; it.flowStep = 4; it.closeStage = 'done';
      it.closeRequest.status = '已办结'; it.closeRequest.autoDoneAt = nowRecordTime();
      it.logs.push({t:nowRecordTime(), who:'系统', act:'结项自动生效', txt:'结项申请在督办管理人环节已满 10 个工作日，系统自动转为结项事项并同步相关角色。'});
      notifyCloseCompleted(it);
      changed = true;
    }
  });
  return changed;
}
/* 督办管理人在事项看板页手动确认结项 */
function fbConfirmClose(id){
  if(ROLE !== 'admin'){ toast('仅督办管理人可确认结项'); return; }
  var it = ITEMS.find(function(x){ return x.id === id; });
  if(!it || it.status === '已完成') return;
  it.status = '已完成'; it.flowStep = 4; it.closeStage = 'done';
  it.closeRequest = Object.assign({}, it.closeRequest || {}, {status:'已办结', time:(it.closeRequest && it.closeRequest.time) || nowRecordTime()});
  var ai = AUDITS.findIndex(function(a){ return a.id === id && a._dynamic; });
  if(ai >= 0) AUDITS.splice(ai, 1);
  it.logs.push({t:nowRecordTime(), who:ROLES[ROLE].name, act:'结项确认', txt:'督办管理人在事项看板页确认结项，事项办结并同步部门负责人与分管高管。'});
  notifyCloseCompleted(it);
  toast('已确认结项「' + it.name + '」');
  route();
}

/* ---------------- 3. 下钻：临期 / 结项审批 / 结项 ---------------- */
function fbCloseRow(it, kind){
  var fb = fbFeedback(it);
  var tail = '';
  if(kind === 'due'){
    var n = fbWdUntil(it.deadline);
    tail = '<span class="tag ' + (n < 0 ? 'red' : 'yellow') + '">' + esc(fbWdLabel(it)) + '</span>';
  }else if(kind === 'closereq'){
    tail = '<span class="tag purple">' + esc(fbCloseSource(it)) + '</span>';
  }else{
    tail = '<span class="tag green">已结项</span>' + (it.closeRequest && it.closeRequest.time ? '<span class="tag gray">' + esc(String(it.closeRequest.time).slice(0, 10)) + '</span>' : '');
  }
  var btn = (kind === 'closereq' && ROLE === 'admin' && it.status !== '已完成' && it.closeStage === 'admin')
    ? '<button class="btn sm primary" onclick="event.stopPropagation();fbConfirmClose(\'' + it.id + '\')"><i class="fas fa-flag-checkered"></i> 确认结项</button>' : '';
  return '<div class="drill-row" data-kw="' + esc((it.name + ' ' + who(actualExec(it) || it.exec) + ' ' + (it.lead || '') + ' ' + it.id).toLowerCase()) + '" onclick="fbDrillGo(\'' + it.id + '\')">' +
    '<div class="dr-row-main"><div class="dr-nm">' + rdDot(it.id) + esc(it.name) + '</div>' +
    '<div class="dr-meta">' + esc(it.id) + ' · ' + esc(it.lead || '—') + ' · 落实人：' + esc(who(actualExec(it) || it.exec)) + ' · 截止：' + esc(it.deadline || '—') + (kind === 'closereq' ? ' · ' + esc(fbWdLabel(it)) : '') + '</div></div>' +
    '<div class="dr-tail">' + tail + btn + '<i class="fas fa-chevron-right"></i></div></div>';
}
(function(){
  var orig = fbDrill;
  window.fbDrill = function(kind){
    if(kind !== 'due' && kind !== 'closereq' && kind !== 'closed' && kind !== 'overdue') return orig(kind);
    var arr, title, icon, sub;
    if(kind === 'overdue'){
      arr = fbSorted(fbBoardList().filter(function(it){ return rvIsOverdue(it); }));
      icon = 'fa-triangle-exclamation'; title = '逾期事项';
      sub = '已超过计划完成时间 · 共 ' + arr.length + ' 项 · 点击事项进入详情';
    }else if(kind === 'due'){
      arr = fbSorted(fbBoardList().filter(function(it){ return rvIsDue(it); }));
      icon = 'fa-hourglass-half'; title = '临期事项';
      sub = '距截止 10 个工作日内（不含已逾期）· 共 ' + arr.length + ' 项 · 点击事项进入详情';
    }else if(kind === 'closereq'){
      arr = fbSorted(fbBoardList().filter(fbClosePending));
      icon = 'fa-flag-checkered'; title = '结项审批';
      sub = '仅展示已正式提交的结项申请 · 共 ' + arr.length + ' 项 · 各审核环节满 10 个工作日按规则流转' + (ROLE === 'admin' ? '，也可点「确认结项」立即办结' : '');
    }else{
      arr = fbSorted(visibleItems().filter(fbClosedDone));
      icon = 'fa-circle-check'; title = '结项事项';
      sub = '已办结事项 · 共 ' + arr.length + ' 项 · 点击事项查看归档与结项结论';
    }
    openModal(
      '<div class="hd"><b><i class="fas ' + icon + '" style="color:var(--accent)"></i> ' + esc(title) + ' · 明细下钻</b><button class="x" onclick="closeModal()">✕</button></div>' +
      '<div class="bd">' +
        '<div class="drill-top"><span class="hint">' + esc(sub) + '</span>' +
          '<div class="drill-search"><i class="fas fa-magnifying-glass"></i><input id="drillKw" placeholder="搜索事项名称 / 落实人 / 部门…" oninput="fbDrillFilter()"></div></div>' +
        '<div class="drill-list">' + (arr.length ? arr.map(function(it){ return fbCloseRow(it, kind); }).join('') : '<div class="drill-empty">暂无相关事项</div>') + '</div>' +
        '<div class="ft" style="margin-top:14px">' +
          '<button class="btn" onclick="closeModal()">关闭</button>' +
          '<button class="btn" onclick="closeModal();go(\'list\')"><i class="fas fa-table-list"></i> 在事项明细中查看</button>' +
        '</div>' +
      '</div>');
  };
})();

/* ---------------- 4. 事项看板渲染前先跑自动结项 ---------------- */

/* ---------------- 5. 修改事项弹窗：顶部「反馈周期」支持就地修改 ---------------- */
(function(){
  var origOpen = openEditItem, origSave = saveEditItem;
  window.openEditItem = function(id){

      var top = document.getElementById('edCycleTop'), hid = document.getElementById('edCycle');

          var vis = cmb.querySelector('.combo-in');

        var vis = cmb.querySelector('.combo-in');
        if(vis) vis.addEventListener('change', function(){ top.value = vis.value; });
      }
    }, 40);
  };
  window.saveEditItem = function(id){
    var top = document.getElementById('edCycleTop'), hid = document.getElementById('edCycle');
    if(top && hid && !hid.value) hid.value = top.value;
    return origSave(id);
  };
})();

<script>
/* ============================================================
   V5.5 已读/未读：按角色记录每个事项是否被当前用户查看过
   ============================================================ */
var RD_KEY = 'db-item-read-v1';
function rdLoad(){ try{ var v = JSON.parse(localStorage.getItem(RD_KEY) || '{}'); return v && typeof v === 'object' ? v : {}; }catch(e){ return {}; } }
function rdSave(s){ try{ localStorage.setItem(RD_KEY, JSON.stringify(s)); }catch(e){} }
function rdMap(){ var s = rdLoad(); if(!s[ROLE]) s[ROLE] = {}; return s[ROLE]; }
function isItemRead(id){ return !!rdMap()[id]; }
function rdDot(id){ return isItemRead(id) ? '' : '<span class="rd-txt">未读</span>'; }

.ai-parse-ok{display:flex;align-items:flex-start;gap:8px;background:#F2FAF5;border:1px solid #CBE9D6;border-radius:10px;padding:10px 13px;font-size:12.5px;color:#1D7A46;line-height:1.7}

.todo-card .t-meta .process-pills .tag{font-size:10.5px;padding:1.5px 7px}
