<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盯盯喵 · 督办管理</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
/* ============================================================
   设计令牌
   ============================================================ */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF;
  --ink:#1B2433; --ink-2:#4C5668; --ink-3:#8A94A6;
  --line:#E6EAF2;
  --navy:#0D1B30; --navy-2:#16294A;
  --accent:#2F5AF3; --accent-deep:#1F3FBF; --accent-weak:#EDF1FF;
  --red:#E5484D; --red-weak:#FDECEC;
  --amber:#E8910E; --amber-weak:#FCF1DE;
  --green:#16A05A; --green-weak:#E7F6EE;
  --purple:#7A3DD0; --purple-weak:#F3E8FF;
  --radius:12px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#CBD3E1;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   外壳：侧边栏 + 顶栏
   ============================================================ */
.app{--sidebar-width:228px;display:flex;min-height:100vh;min-height:100dvh;min-width:1180px;align-items:stretch;background:linear-gradient(to right,var(--navy) 0 var(--sidebar-width),var(--bg) var(--sidebar-width) 100%)}
.sidebar{width:228px;flex:0 0 228px;background:var(--navy);color:#D6DEEC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;align-self:flex-start;overflow:hidden}
.brand{display:flex;align-items:center;gap:11px;padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07);position:relative}
.brand-copy{min-width:0}
.brand .mark{width:36px;height:36px;border-radius:10px;flex:0 0 36px;background:linear-gradient(150deg,var(--accent),#5B7BFF);display:flex;align-items:center;justify-content:center;color:#fff}
.brand .mark i{font-size:16px}
.brand .t{font-weight:700;font-size:16px;color:#fff;letter-spacing:.5px}
.brand .s{font-size:10.5px;color:#7E8FB0;margin-top:1px}
.sidebar-toggle{margin-left:auto;width:30px;height:30px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.05);color:#B9C5DC;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.sidebar-toggle:hover{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.28)}
.nav{padding:12px 12px 220px;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden}
.sidebar .nav::-webkit-scrollbar{width:6px}
.sidebar .nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px}
.nav .grp{font-size:11px;color:#6E7FA3;letter-spacing:1px;padding:14px 10px 6px;font-weight:500}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#B9C5DC;font-weight:500;font-size:13.5px;margin-bottom:2px;transition:background .15s,color .15s;cursor:pointer}
.nav a i{width:18px;text-align:center;font-size:15px;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(47,90,243,.35)}
.nav a .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:600;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.rolebox{flex:0 0 auto;margin:12px;padding:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px}
.sidebar-bottom{position:fixed;left:0;bottom:0;width:228px;z-index:30;background:var(--navy)}
.rolebox .lb{font-size:11px;color:#7E8FB0;margin-bottom:8px}
.rolebox .roles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rolebox .roles button{font-size:12px;padding:7px 4px;border-radius:7px;color:#AAB7CF;border:1px solid rgba(255,255,255,.09);transition:all .15s}
.rolebox .roles button:hover{background:rgba(255,255,255,.08);color:#fff}
.rolebox .roles button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rolebox .roles .cur-id{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.rolebox .roles .cur-id b{font-size:13px;color:#fff;letter-spacing:.5px}
.rolebox .roles .cur-id span{font-size:11px;color:#8FA0BE;line-height:1.4}
.logout-btn{width:100%;margin-top:10px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#AAB7CF;font-size:12px;cursor:pointer;transition:.15s}
.logout-btn:hover{color:#fff;border-color:rgba(255,255,255,.32)}
/* ---------- 登录页（参照「伯乐系统」登录模式：深色底 + 居中白卡 + 错误提示 + 胶囊演示账号） ---------- */
body.logged-out .app{display:none}
#loginMask{position:fixed;inset:0;z-index:300;display:none;overflow:auto;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%)}
#loginMask.show{display:flex;align-items:center;justify-content:center;padding:36px 20px}
.login-card{background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.45);width:400px;max-width:92vw;padding:30px 32px 26px;position:relative}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.login-logo{display:flex;align-items:flex-end;gap:3px;width:22px;height:24px;padding:2px 1px}
.login-logo i{display:block;width:6px;border-radius:1px 1px 0 0}
.login-logo i:nth-child(1){height:15px;background:#18A84A}.login-logo i:nth-child(2){height:22px;background:#2F5AF3}.login-logo i:nth-child(3){height:11px;background:#E5484D}
.login-card .lg-t{font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px;margin:0;color:#171E38}
.login-card .lg-t .accent{color:var(--accent)}
.login-card .lg-s{font-size:12.5px;color:#86909c;line-height:1.65;margin:6px 0 20px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:13px;font-weight:600;color:#4B5668;margin-bottom:6px}
.login-field input{width:100%;padding:10px 14px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;outline:none;transition:.15s;box-sizing:border-box;background:#fff;color:#1B2433}
.login-field input::placeholder{font-size:12.5px;color:#A7B0BE}
.login-field input:focus{border-color:#2F5AF3;box-shadow:0 0 0 3px rgba(47,90,243,.12)}
.btn-login{width:100%;padding:11px;border:none;border-radius:8px;background:#2F5AF3;color:#fff;font-size:14px;font-weight:700;letter-spacing:6px;cursor:pointer;margin-top:6px;transition:.15s}
.btn-login:hover{background:#2452D9}
#loginError{display:none;background:#fde3e3;color:#c0392b;font-size:12.5px;padding:8px 12px;border-radius:8px;margin-bottom:12px;line-height:1.6}
#loginError.show{display:block}
.login-demo{margin-top:18px;padding-top:14px;border-top:1px dashed #e4e7ed}
.login-demo .demo-title{font-size:12px;color:#86909c;margin-bottom:8px}
.login-chips{display:block}
.login-chips button{display:inline-block;margin:0 6px 6px 0;padding:6px 13px;border:1px solid #d9d9d9;border-radius:16px;background:#f7f8fa;font-size:12.5px;font-weight:600;color:#263142;cursor:pointer;transition:.15s;font-family:inherit}
.login-chips button:hover{border-color:#2F5AF3;color:#1a3c8a;background:#e8f0fe}
.login-footnote{margin-top:10px;font-size:11.5px;color:#A0A9B6;line-height:1.6}
.user{display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid rgba(255,255,255,.07)}
.user .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#2F5AF3,#5B7BFF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.user .nm{font-size:13px;color:#EAF0FB;font-weight:500}
.user .rl{font-size:11px;color:#7E8FB0}
@media(min-width:821px){
  .app.nav-collapsed .sidebar{width:74px;flex-basis:74px}
  .app.nav-collapsed{--sidebar-width:74px}
  .app.nav-collapsed .sidebar-bottom{width:74px}
  .app.nav-collapsed .brand{justify-content:center;padding:18px 8px}
  .app.nav-collapsed .brand-copy{display:none}
  .app.nav-collapsed .sidebar-toggle{position:absolute;right:6px;top:6px;width:22px;height:22px;font-size:10px}
  .app.nav-collapsed .nav{padding:12px 8px 150px}
  .app.nav-collapsed .nav .grp{display:none}
  .app.nav-collapsed .nav a{justify-content:center;gap:0;padding:11px 8px}
  .app.nav-collapsed .nav a i{width:auto}
  .app.nav-collapsed .nav-label,.app.nav-collapsed .nav a .badge{display:none}
  .app.nav-collapsed .rolebox{margin:10px 8px;padding:10px 8px}
  .app.nav-collapsed .rolebox .lb,.app.nav-collapsed .rolebox .cur-id span,.app.nav-collapsed .logout-btn span{display:none}
  .app.nav-collapsed .rolebox .roles{display:block}
  .app.nav-collapsed .rolebox .roles .cur-id{justify-content:center;padding:7px 4px}
  .app.nav-collapsed .logout-btn{margin-top:8px;padding:8px;font-size:0}
  .app.nav-collapsed .logout-btn i{font-size:13px}
  .app.nav-collapsed .user{justify-content:center;padding:14px 8px}
  .app.nav-collapsed .user>div:last-child{display:none}
}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 26px;height:60px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.topbar .page-title{font-size:17px;font-weight:700}
.topbar .page-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.topbar .spacer{flex:1}
.searchbox{position:relative}
.searchbox i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-3)}
.searchbox input{height:36px;width:260px;border:1px solid var(--line);border-radius:9px;padding:0 12px 0 34px;background:var(--bg);outline:none;transition:border .15s,box-shadow .15s;font-size:13px}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,90,243,.12);background:#fff}
.bell{position:relative;width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:background .15s;cursor:pointer}
.bell:hover{background:var(--bg)}
.bell i{font-size:17px}
.bell .dot{position:absolute;top:7px;right:8px;min-width:16px;height:16px;background:var(--red);color:#fff;border-radius:9px;border:2px solid #fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
.tuser{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 6px;border-radius:9px}
.tuser .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#2F5AF3,#5B7BFF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.tuser .nm{font-size:13px;font-weight:500}
.content{padding:22px 26px 40px;flex:1}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============================================================
   通用组件
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-hd{display:flex;align-items:center;gap:10px;padding:15px 18px 0}
.card-hd h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-hd h3 i{color:var(--accent);font-size:14px}
.card-hd .hint{font-size:12px;color:var(--ink-3);margin-left:auto}
.card-bd{padding:12px 18px 18px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;line-height:1.7;white-space:nowrap}
.tag.key{background:#FDF1E3;color:#B45309}
.tag.reg{background:#EEF2F7;color:#52617A}
.tag.biz{background:var(--accent-weak);color:var(--accent-deep)}
.tag.purple{background:var(--purple-weak);color:var(--purple)}
.tag.green{background:var(--green-weak);color:#0E7A4B}
.tag.red{background:var(--red-weak);color:#C23234}
.tag.blue{background:var(--accent-weak);color:var(--accent-deep)}
.tag.gray{background:#EEF2F7;color:#52617A}
.tag.yellow{background:var(--amber-weak);color:#A75E06}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:20px;line-height:1.8;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.green{background:var(--green-weak);color:#0E7A4B}.pill.green .dot{background:var(--green)}
.pill.amber{background:var(--amber-weak);color:#A75E06}.pill.amber .dot{background:var(--amber)}
.pill.red{background:var(--red-weak);color:#C23234}.pill.red .dot{background:var(--red)}
.pill.blue{background:var(--accent-weak);color:var(--accent-deep)}.pill.blue .dot{background:var(--accent)}
.pill.purple{background:var(--purple-weak);color:#6D45B7}.pill.purple .dot{background:var(--purple)}
.pill.gray{background:#EEF2F7;color:#52617A}.pill.gray .dot{background:var(--ink-3)}
.process-pills{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 15px;border-radius:9px;font-size:13px;font-weight:600;transition:all .15s;border:1px solid var(--line);background:#fff;color:var(--ink-2)}
.btn i{font-size:13px}
.btn:hover{border-color:#C7D0E0;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(47,90,243,.28)}
.btn.primary:hover{background:var(--accent-deep)}
.btn.danger{background:#fff;border-color:#F3C1C3;color:#C23234}
.btn.danger:hover{background:var(--red-weak)}
.btn.sm{height:28px;padding:0 11px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg)}
/* ---------- 修改事项弹窗（分区表单） ---------- */
.em-sec{font-size:12px;font-weight:700;color:var(--ink-3);margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.em-sec:first-child{margin-top:2px}
.em-sec::after{content:'';flex:1;height:1px;background:var(--line)}
.em-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.em-field{display:flex;flex-direction:column;gap:6px}
.em-field>label{font-size:12px;font-weight:600;color:var(--ink-2)}
.em-field input,.em-field select{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font-size:13px;background:#fff;outline:none;transition:border .15s,box-shadow .15s;color:var(--ink)}
.em-field input:focus,.em-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,90,243,.12)}
.em-req{color:var(--red)}
.em-area{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;outline:none;line-height:1.7;width:100%;resize:vertical;background:#fff}
.em-area:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,90,243,.12)}
/* ---------- 附件 chips ---------- */
.att-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.att-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;color:var(--ink-2)}
.att-chip .x{cursor:pointer;color:var(--ink-3);margin-left:2px;border:none;background:none;font-size:12px;line-height:1}
.att-chip .x:hover{color:var(--red)}
/* ---------- AI 总结已确认只读展示 ---------- */
.ai-view{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-size:12.5px;line-height:1.9;color:var(--ink);white-space:pre-wrap}
.mono{font-variant-numeric:tabular-nums}

/* 红黄绿灯点 */
.light{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px;flex:0 0 11px}
.light.g{background:var(--green);box-shadow:0 0 0 3.5px rgba(22,160,90,.16)}
.light.y{background:var(--amber);box-shadow:0 0 0 3.5px rgba(232,145,14,.18)}
.light.r{background:var(--red);box-shadow:0 0 0 3.5px rgba(229,72,77,.16)}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--ink-3)}

/* 角色提示条 & 警告条 */
.role-note{background:linear-gradient(90deg,var(--accent-weak),#F3EEFF);border:1px solid #D6E0FF;border-radius:var(--radius);padding:10px 18px;font-size:12.5px;color:#3D5175;margin-bottom:16px;line-height:1.7}
.role-note b{color:var(--accent-deep)}
.fill-note{background:#FFF8E3;border:1px solid #F0DEAE;border-left:3px solid #E8910E;border-radius:9px;padding:10px 13px;font-size:12px;color:#6E5B22;line-height:1.8;margin:6px 2px 14px}
.fill-note b{color:#8F6400}
.fill-note .x1{color:#B0392C;font-weight:600}
.fill-note .exs{margin:0}
.fill-note .ex+.ex{margin-top:8px}
.fill-note .eh{display:flex;align-items:center;gap:8px;margin-bottom:1px}
.fill-note .tag{font-size:11px;border-radius:5px;padding:1px 8px;font-weight:500}
.fill-note .tag.bad{background:#FCEBEB;color:#B0392C}
.fill-note .tag.good{background:#E2F3EA;color:#0F7A4D}
.fill-note .why{font-size:11px;color:#8A7A4A}
.fill-note .ex p{margin:2px 0 0;font-size:12px;line-height:1.75;color:#5A4A18}
.fill-note .ex p.wrong{color:#8A3A2E}
/* 上期工作计划 只读框：系统带入上期填报的「下期工作计划」，浅蓝底标识不可修改 */
.plan-frame{display:block;width:100%;min-height:150px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.7;color:inherit;outline:none;resize:none;box-sizing:border-box}
.plan-frame.ro{background:#F6F9FF;border-color:#C7D8F4;color:#33415C}
textarea::placeholder{white-space:pre-wrap;line-height:1.7;font-size:11px;letter-spacing:.2px;color:#A3ADBF}
.warn-ticker{background:linear-gradient(90deg,var(--red-weak),#FCF1DE);border:1px solid #F3C9C2;border-radius:var(--radius);padding:9px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:#B03A35}
.warn-ticker .fa-bell{animation:swing 1.2s ease-in-out infinite;display:inline-block}
@keyframes swing{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}

/* KPI（整卡按模块主题色填满） */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{border-radius:var(--radius);padding:16px 18px 20px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;color:#fff}
.kpi:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(16,24,40,.16)}
.kpi .ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:11px;font-size:16px;background:rgba(255,255,255,.24)}
.kpi .num{font-size:30px;font-weight:900;line-height:1;letter-spacing:-.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpi .lbl{font-size:12px;color:rgba(255,255,255,.94);margin-top:6px;font-weight:500}
.kpi .extra{font-size:11px;color:rgba(255,255,255,.78);margin-top:3px}
.kpi .bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.34);border-radius:0 0 var(--radius) var(--radius)}
.kpi.ink{background:linear-gradient(160deg,#5D81FF 0%,#2F5AF3 62%,#1F3FBF 100%);box-shadow:0 8px 20px rgba(47,90,243,.28)}
.kpi.ink .bar{background:rgba(255,255,255,.4)}
.kpi.green{background:linear-gradient(160deg,#2EC285 0%,#16A05A 62%,#0E7E46 100%);box-shadow:0 8px 20px rgba(22,160,90,.26)}
.kpi.green .bar{background:rgba(255,255,255,.4)}
.kpi.amber{background:linear-gradient(160deg,#F5A62E 0%,#E8910E 62%,#C27408 100%);box-shadow:0 8px 20px rgba(232,145,14,.26)}
.kpi.amber .bar{background:rgba(255,255,255,.4)}
.kpi.red{background:linear-gradient(160deg,#EE6A6E 0%,#E5484D 62%,#C9363B 100%);box-shadow:0 8px 20px rgba(229,72,77,.26)}
.kpi.red .bar{background:rgba(255,255,255,.4)}

/* 红黄绿灯卡片 */
.light-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.light-card{border:1px solid var(--line);border-radius:11px;background:#fff;padding:13px 15px;box-shadow:var(--shadow)}
.light-card .top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.light-card .top .bulb{width:11px;height:11px;border-radius:50%}
.light-card .top .nm{font-weight:700;font-size:13px}
.light-card .top .cnt{font-size:22px;font-weight:900;margin-left:auto;line-height:1}
.light-card .items{display:flex;flex-direction:column;gap:7px}
.light-card .item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);padding:6px 9px;border-radius:7px;background:var(--bg);cursor:pointer;transition:background .15s}
.light-card .item:hover{background:var(--accent-weak)}
.light-card .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.light-card .item .d{margin-left:auto;color:var(--ink-3);flex:0 0 auto;font-size:11px}
.light-card .none{font-size:12px;color:var(--ink-3);padding:6px 2px}

/* 驾驶舱网格 */
.dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.col-4{grid-column:span 4}
.col-5{grid-column:span 5}
.col-3{grid-column:span 3}
.col-12{grid-column:span 12}
.feed .row{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.feed .row:last-child{border-bottom:none}
.feed .av{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.feed .bd{flex:1;min-width:0}
.feed .t{font-size:13px;color:var(--ink)}
.feed .t b{font-weight:600}
.feed .m{font-size:12px;color:var(--ink-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed .d{font-size:11px;color:var(--ink-3);margin-top:3px}
.feed .type{font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;margin-right:6px}
.feed .type.reg{background:var(--green-weak);color:#0E7A4B}
.feed .type.mile{background:var(--accent-weak);color:var(--accent-deep)}
.feed .type.comment{background:var(--amber-weak);color:#A75E06}
.dept-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.dept-row:last-child{border-bottom:none}
.dept-row .nm{width:96px;flex:0 0 96px;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dept-row .track{flex:1;height:8px;border-radius:5px;background:var(--bg);overflow:hidden}
.dept-row .track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),#7A3DD0)}
.dept-row .dnum{width:130px;flex:0 0 130px;font-size:12px;color:var(--ink-3);text-align:right}
.comment{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.comment:last-child{border-bottom:none}
.comment .av{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.comment .bd{flex:1;min-width:0}
.comment .hd{display:flex;align-items:center;gap:8px}
.comment .hd b{font-size:13px}
.comment .hd .role{font-size:11px;color:var(--accent-deep);background:var(--accent-weak);padding:1px 7px;border-radius:9px;font-weight:500}
.comment .hd .d{margin-left:auto;font-size:11px;color:var(--ink-3)}
.comment .txt{font-size:12.5px;color:var(--ink);margin-top:4px;line-height:1.6}

/* 工具栏 & 表格 */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .fsearch{position:relative}
.toolbar .fsearch i{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-3)}
.toolbar .fsearch input{height:34px;width:210px;border:1px solid var(--line);border-radius:9px;padding:0 12px 0 32px;background:#fff;outline:none;font-size:13px}
.toolbar .fsearch input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,90,243,.12)}
.toolbar select{height:34px;border:1px solid var(--line);border-radius:9px;padding:0 28px 0 12px;background:#fff;outline:none;color:var(--ink-2);font-weight:500;font-size:13px;cursor:pointer}
.toolbar .spacer{flex:1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);margin-bottom:14px}
table.tbl{width:100%;border-collapse:collapse;min-width:1080px}
.tbl th{font-size:12px;color:var(--ink-3);font-weight:600;text-align:left;padding:12px 13px;background:#FAFBFD;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 13px;border-bottom:1px solid #EFF2F7;font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr.item-row{transition:background .12s;cursor:pointer}
.tbl tbody tr.item-row:hover{background:#F7F9FD}
.tbl tbody tr.item-row.delayed{background:#FDF7F5}
.tbl tbody tr.item-row.delayed:hover{background:#FBEFED}
.tname{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;max-width:280px;position:relative}
.tname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname:hover .nm{color:var(--accent)}
.tname .tip{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:#26354F;color:#E7EDF7;font-size:12px;font-weight:400;padding:9px 13px;border-radius:10px;width:360px;box-shadow:0 10px 26px rgba(0,0,0,.25);line-height:1.65;white-space:normal;cursor:default}
.tname:hover .tip{display:block}
.tname .tip b{color:#fff;display:block;margin-bottom:3px;font-size:11.5px;font-weight:400;opacity:.65}
.sub{font-size:12px;color:var(--ink-3)}
.star{color:#C7D0E0;cursor:pointer;transition:all .15s;font-size:14px}
.star.on{color:#F59E0B}
.star:hover{color:#F59E0B}
tr.expand-row td{background:#FAFCFE;padding:10px 16px 16px;border-bottom:1px solid var(--line)}
.expand-grid{display:grid;grid-template-columns:repeat(5,auto);gap:8px 34px;font-size:12.5px}
.expand-grid .lbl{color:var(--ink-3);margin-right:6px}
.due .over{color:var(--red);font-weight:600}
.tbl-foot{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line)}
.tbl-foot .spacer{flex:1}

/* 待办/审核卡片 */
.todo-card{display:flex;align-items:center;gap:14px;padding:15px 20px;margin-bottom:11px}
.todo-card .t-body{flex:1;min-width:0}
.todo-card .t-title{font-weight:600;font-size:13.5px;cursor:pointer}
.todo-card .t-title:hover{color:var(--accent)}
.todo-card .t-meta{font-size:12px;color:var(--ink-2);margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}
.todo-card .t-ops{flex-shrink:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.audit-card{display:flex;align-items:flex-start;gap:16px;padding:17px 20px;margin-bottom:12px}
.audit-card .a-body{flex:1}
.audit-card .a-title{font-weight:600;font-size:14px;margin-bottom:5px}
.audit-card .a-meta{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.audit-card .a-reason{margin-top:9px;background:#F8FAFD;border-left:3px solid var(--accent);border-radius:8px;padding:9px 13px;font-size:12.5px;color:#3D5175;line-height:1.65}
.audit-card .a-ops{display:flex;gap:8px;flex-shrink:0}

/* 流程步骤条 */
.flow-steps{display:flex;align-items:center;padding:6px 2px;overflow-x:auto}
.fstep{display:flex;flex-direction:column;align-items:center;min-width:86px;flex:1;text-align:center}
.fstep .fnode{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;z-index:1;background:#E9EDF5;color:var(--ink-3);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.fstep.done .fnode{background:var(--green);color:#fff;box-shadow:0 0 0 1px var(--green)}
.fstep.now .fnode{background:var(--accent);color:#fff;box-shadow:0 0 0 1px var(--accent)}
.fstep .fname{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:7px}
.fstep.done .fname,.fstep.now .fname{color:var(--ink);font-weight:600}
.fline{height:2px;flex:1;background:#E9EDF5;margin-top:-46px;position:relative;top:13px}
.fline.done{background:var(--green)}

/* 表单 */
.form{max-width:940px}
.form .frow{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin-bottom:6px}
.form .fcell{display:flex;flex-direction:column;gap:6px}
.form .fcell.full{grid-column:span 2}
.form label{font-size:12px;font-weight:600;color:var(--ink-2)}
.form label .req{color:var(--red);margin-left:2px}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;outline:none;transition:border .15s,box-shadow .15s;width:100%}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,90,243,.12)}
.form textarea{resize:vertical;min-height:80px;line-height:1.7}
.form .hint{font-size:11px;color:var(--ink-3);line-height:1.6}
.radio-group{display:flex;gap:16px;padding-top:8px;flex-wrap:wrap}
.radio-group label{display:flex;align-items:center;gap:6px;cursor:pointer;padding:0;font-size:13px;color:var(--ink)}
.fold-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);font-weight:500;cursor:pointer;padding:8px 0}
.fold-btn i{transition:transform .2s;font-size:11px}
.fold-btn.open i{transform:rotate(180deg)}
.fold-body{display:none;border-top:1px dashed var(--line);margin-top:12px;padding-top:14px}
.fold-body.open{display:block}
.cycle-preview{background:var(--accent-weak);border:1px solid #D6E0FF;border-radius:10px;padding:12px 14px;margin-top:10px;font-size:12px;color:var(--accent-deep);line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none;transition:all .12s;background:#fff}
.chips .chip:hover{border-color:var(--accent);color:var(--accent)}
.chips .chip.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent-deep);font-weight:600}
.form-actions{display:flex;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.form-sec{background:#FAFBFD;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.form-sec h3{font-size:14px;margin-bottom:15px;display:flex;align-items:center;gap:9px}
.form-sec h3 .step{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11.5px;display:flex;align-items:center;justify-content:center}

/* 详情页 */
.detail{max-width:1180px}
.detail-hd{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.detail-hd h2{font-size:21px;font-weight:700;line-height:1.35}
.detail-hd .tags{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center}
.detail-hd .rt{display:flex;gap:8px;margin-left:auto;flex:0 0 auto;align-items:center}
.info-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.info-strip .cell{background:#fff;padding:11px 14px}
.info-strip .k{font-size:11px;color:var(--ink-3)}
.info-strip .v{font-size:13px;font-weight:600;margin-top:2px;line-height:1.5}
.info-strip details{grid-column:1/-1;background:#fff}
.info-strip details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:11.5px;color:var(--ink-3)}
.info-strip details>summary::-webkit-details-marker{display:none}
.info-more-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.ar{display:inline-block;transition:transform .15s;font-size:10px;color:var(--accent)}
details[open]>summary .ar{transform:rotate(90deg)}
.fold-card{cursor:default}
.fold-card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:14px 16px}
.fold-card>summary::-webkit-details-marker{display:none}
.fold-card>summary .ar{color:var(--ink-3);font-size:11px}
.fold-card .card-bd{border-top:1px solid var(--line)}
.fold-card>summary.fold-summary{gap:10px;padding:15px 18px;min-height:52px;box-sizing:border-box}
.fold-card>summary.fold-summary h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.fold-card>summary.fold-summary h3 i{color:var(--accent);font-size:14px}
.fold-card>summary.fold-summary .ar{order:-1;color:var(--ink-3);font-size:11px}
.fold-card>summary.fold-summary .hint{margin-left:auto;font-size:12px;color:var(--ink-3)}
.fold-card[open]>summary.fold-summary{border-bottom:1px solid var(--line)}
.fold-card[open]>.card-bd{border-top:0}
.detail .card>.card-hd,
.detail .fold-card>summary.fold-summary{min-height:52px;padding:15px 18px;box-sizing:border-box}
.detail-grid{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
/* 右栏：AI 总结 → 评价与评论 → 流程操作，与左栏同宽独立列，不整行 */
.detail-grid>.side-stack{position:static}

.side-stack>.side-card{border-radius:12px;box-shadow:0 2px 8px rgba(30,50,90,.05);overflow:hidden;background:#fff}
.side-stack .card-hd h3 i{color:var(--accent)}
.side-stack .card-hd h3{font-size:13.5px}
.flow-ops{display:flex;flex-wrap:wrap;gap:8px}
.flow-ops .btn{flex:0 1 auto}
.side-empty{font-size:12px;color:var(--ink-3);padding:2px 0}
.cmt.dsp-cmt .cmt-main{background:#F6F3FE;border:1px solid #E4DDFA}
.cmt.dsp-cmt .cmt-ava{background:#8A6BB0}
.dsp-tag{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:1px 7px;border-radius:999px;background:#EFE9FC;color:#6B4CA8;font-size:11px;font-weight:600;vertical-align:middle}
.cmt.dsp-cmt .cmt-to{margin-top:6px;padding-top:6px;border-top:1px dashed #E0D8F5;font-size:11.5px;color:var(--ink-3)}
.cmt.dsp-cmt .cmt-main .ft span{cursor:default}
.em-area.req-miss{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,86,138,.14)}
.side-tip{font-size:11px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:9px;margin-top:8px}
/* AI 总结（详情页右栏 · 精简版） */
.ai-box{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(30,50,90,.05)}
.ai-bar{display:flex;align-items:center;gap:8px}
.ai-meta{font-size:11.5px;color:var(--ink-3)}
.ai-meta b{color:var(--ink);font-size:12.5px}
.ai-out{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ai-out-hd{display:flex;align-items:center;gap:8px;padding:8px 11px;background:#FAFBFD;border-bottom:1px solid var(--line);font-size:12.5px}
.ai-out textarea{width:100%;border:0;outline:none;padding:11px 12px;font-size:12.5px;line-height:1.75;resize:vertical;min-height:118px;box-sizing:border-box;font-family:inherit;color:var(--ink);background:#fff}
.ai-out textarea:focus{background:#F8FBFF}
.ai-empty{font-size:12px;color:var(--ink-3);background:#FAFBFD;border:1px dashed var(--line);border-radius:10px;padding:13px;text-align:center}
.ai-hist{border:1px solid var(--line);border-radius:10px;background:#fff}
.ai-hist>summary{cursor:pointer;list-style:none;padding:8px 12px;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.ai-hist>summary::-webkit-details-marker{display:none}
.ai-hist>summary::before{content:'\25B6';font-size:9px;color:var(--ink-3)}
.ai-hist[open]>summary::before{transform:rotate(90deg)}
.ai-hist button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;cursor:pointer;color:var(--ink);font-family:inherit}
.ai-hist button:hover{background:#F5F8FF}.side-stack>.ai-detail-summary{margin-bottom:0!important}
/* 详情页排版：左栏各卡片自上而下占第 1 列；右栏（评价与评论 / 流程操作）从 AI 总结所在行开始，避免顶部空白与错位 */
.timeline{position:relative;padding-left:24px}
.timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:before{content:"";position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--accent)}
.tl-item.sys:before{border-color:#B6BFCF}
.tl-item.ok:before{border-color:var(--green)}
.tl-item.warn:before{border-color:var(--red)}
.tl-item .d{font-size:12px;color:var(--ink-3);font-weight:500}
.tl-item .hd{display:flex;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap}
.tl-item .hd b{font-size:13px}
.tl-item .op{color:var(--purple);font-weight:600;font-size:12px}
.tl-item .txt{font-size:12.5px;color:var(--ink);margin-top:5px;background:var(--bg);border-radius:9px;padding:10px 12px;line-height:1.7}
.report-box{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:14px}
.report-box .hd{display:flex;align-items:center;gap:9px;padding:12px 14px;background:#FAFBFD;border-bottom:1px solid var(--line)}
.report-box .hd b{font-size:13px}
.report-box .bd{padding:14px}
.report-box .bd textarea{min-height:150px}
.history-card .card-bd{padding-top:4px}
.history-row{border-bottom:1px solid var(--line)}
.history-row:last-child{border-bottom:0}
.history-row>summary{display:flex;align-items:center;gap:10px;list-style:none;cursor:pointer;padding:10px 2px;font-size:12px}
.history-row>summary::-webkit-details-marker{display:none}
.history-row>summary:before{content:'▶';font-size:9px;color:var(--ink-3);transition:transform .15s}
.history-row[open]>summary:before{transform:rotate(90deg)}
.history-row>summary span{color:var(--ink-2)}
.history-row>summary em{margin-left:auto;color:var(--accent);font-style:normal;font-size:11px}
.history-body{padding:0 12px 12px 20px;color:var(--ink-2);font-size:12.5px;line-height:1.8}
.history-approval{color:var(--ink-3);margin-top:4px}
.flow-overview{margin-bottom:16px}
.flow-counts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.empty-line{font-size:12px;color:var(--ink-3);padding:4px 0}
.flow-preview{border-top:1px solid var(--line)}
.flow-preview-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.flow-preview-row:last-child{border-bottom:0}
.flow-preview-row:hover .flow-preview-name{color:var(--accent)}
.flow-preview-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.launch-meta{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.launch-body{font-size:13px;line-height:1.8;background:#FAFBFD;border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.plan-new{display:flex;align-items:center;justify-content:center;gap:7px;min-height:76px;border:1px dashed var(--line);border-radius:9px;background:#FAFBFD;color:var(--ink-3);font-size:12.5px;margin-bottom:2px}

<script>
"use strict";
/* =========================================================
   盯盯喵交互原型 V5.0 —— 全流程督办管理版
   骨架：侧边栏系统外壳 / 红黄绿灯卡片 / 整页详情路由 /
         CSV真实导出 / 周期节点预览 / 全景双模式
   业务：四角色权限 / 多部门信息关联 / 结项审核链 / 评论体系 /
         一键催办 / 收藏置顶（均按三份需求会议结论）
   ========================================================= */

 /* ---------- 基础 ---------- */
 const TODAY = new Date();
 const days = d => !d || d==='—' ? 999 : Math.round((new Date(d) - TODAY) / 86400000);
const COLORS = {'综合部':'#2F5AF3','技术部':'#7A3DD0','资管部':'#0EA5A0','人力资源部':'#F59E0B','国际业务部':'#E0568A','财务部':'#5A6F9E','合规部':'#8A94A6','战略客户部':'#16A05A','研究发展部':'#B45309'};
const avColor = n => COLORS[n] || '#5A6F9E';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
 const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const AV = (n,c,sz) => '<div class="av" style="width:'+(sz||30)+'px;height:'+(sz||30)+'px;border-radius:50%;flex:0 0 '+(sz||30)+'px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:'+(c||avColor(n))+'">'+esc(String(n).slice(-1))+'</div>';
 function pad2(n){ return String(n).padStart(2,'0'); }
  function nowRecordTime(){
   const d=new Date();
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());
  }
  function todayDateOnly(){ return nowRecordTime().slice(0,10); }
 function recordTimeValue(value){
   const s=String(value||'').trim();
   const m=s.match(/^(\d{4}-\d{2}-\d{2})(?:\s+(\d{2}:\d{2}(?::\d{2})?))?$/);
   if(!m) return 0;
   const tm=m[2] ? (m[2].length===5 ? m[2]+':00' : m[2]) : '00:00:00';
   const t=Date.parse(m[1]+'T'+tm);
   return Number.isNaN(t) ? 0 : t;
 }
 function formatRecordTime(value){
   const s=String(value||'').trim();
   if(!s || s==='—') return '—';
   const m=s.match(/^(\d{4}-\d{2}-\d{2})(?:\s+(\d{2}:\d{2}(?::\d{2})?))?$/);
   if(!m) return s;
   const tm=m[2] ? (m[2].length===5 ? m[2]+':00' : m[2]) : '00:00:00';
   return m[1]+' '+tm;
 }
 function normalizeRecordTime(value, fallback='00:00:00'){
   const s=String(value||'').trim();
   if(!s || s==='—') return s||'—';
   const m=s.match(/^(\d{4}-\d{2}-\d{2})(?:\s+(\d{2}:\d{2}(?::\d{2})?))?$/);
   if(!m) return s;
   return m[1]+' '+(m[2] ? (m[2].length===5 ? m[2]+':00' : m[2]) : fallback);
 }

function toast(msg){
  const w = $('#toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<i class="fas fa-circle-check"></i><span>'+esc(msg)+'</span>';
  w.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function copyText(txt, tip){
  const done = () => toast(tip || '已复制催办信息，可粘贴至企业微信发送');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动复制'); }
  ta.remove();
}

/* ---------- 角色 ---------- */
/* ---------- 人员与组织（演示代号体系 · 管理链路嵌入） ----------
   r 权限类型：admin 督办管理人 / boss 公司领导 / mgr 分管高管 / exec 部门负责人 / person 员工（落实人）
   dept 所属部门；depts 分管高管所辖条线；up 直属上级（管理链路：员工→部门负责人→分管高管→公司领导） */
const PEOPLE = [
  {c:'TY',  r:'admin',  dept:'综合部',     nm:'TY',  lg:'TY · 督办管理人',      title:'督办管理人',                        up:null},
  {c:'YZ',  r:'boss',   dept:'公司领导',   nm:'YZ',  lg:'YZ · 公司领导',        title:'公司领导',                          up:null},
  {c:'DY',  r:'mgr',    dept:'分管条线',   nm:'王总', lg:'王总 · 分管领导（人力、战客）', title:'分管领导 王总（人力资源部、战略客户部）', depts:['人力资源部','战略客户部','国际业务部','研究发展部'], up:'YZ'},
  {c:'程总',  r:'exec',   dept:'人力资源部', nm:'程总', lg:'程总 · 人力部负责人',  title:'人力部负责人 程总',                      up:'DY'},
  {c:'任总',  r:'exec',   dept:'战略客户部', nm:'任总', lg:'任总 · 战客部负责人',  title:'战客部负责人 任总',                      up:'DY'},
  {c:'李四',  r:'person', dept:'人力资源部', nm:'李四', lg:'李四 · 人力部员工',    title:'人力部 李四',                            up:'程总'},
  {c:'张三',  r:'person', dept:'战略客户部', nm:'张三', lg:'张三 · 战客部员工',    title:'战客部 张三',                            up:'任总'}
];
function person(c){ return PEOPLE.find(p=>p.c===c); }
/* 显示名：人员代号 → 中文称呼（内部逻辑与存储仍使用代号） */
function who(c){ const p = person(c); return p ? (p.nm||p.c) : (c||'—'); }
let CUR = 'TY';   /* 当前登录人物代号 */
/* 管理链路映射：部门 → 部门负责人 / 分管高管（资管部等部门暂无负责人，由分管高管代管） */
const DEPT_LEAD = {'综合部':null,'人力资源部':'程总','战略客户部':'任总'};
const DEPT_MGR  = {'综合部':'YZ','人力资源部':'DY','战略客户部':'DY','财务部':'DY','合规部':'DY','国际业务部':'DY','研究发展部':'DY'};
function leadOf(dept){ const code=DEPT_LEAD[dept];return person(code)?.r==='exec'?code:null; }
function mgrOf(dept){ return DEPT_MGR[dept]||null; }
/* 切换/登录人员：把该人员的代号、部门、职务注入对应权限模板，使全站按当前登录人渲染 */
function setPerson(c){
  const p = person(c); if(!p) return;
  CUR = c; ROLE = p.r;
  const R = ROLES[p.r];
  R.name = p.c; R.dept = p.dept; R.label = p.title;
  R.full = (p.nm && p.nm===p.c) ? p.title : (p.c + ' · ' + p.title);
  R.hint = p.r==='admin' ? '您是督办管理人：可新增督办、任务派发（至分管高管 / 部门负责人）、审核结项；反馈审核链由部门负责人、分管高管依次审核。'
    : p.r==='boss' ? '您是公司领导（统管全部条线，两位分管高管的汇报对象）：反馈审核链完成后可审阅或评论。'
    : p.r==='mgr' ? '您是'+p.title+'：负责反馈审核（同意 / 退回 / 修改）；可在分管高管、部门负责人、落实人中任意选择派发对象。'
    : p.r==='exec' ? '您是'+p.title+'：本部门落实人提交的反馈由您审核（同意 / 退回 / 修改）；只能直接派给本部门一名落实人，不能继续转包。'
    : '您是'+p.dept+'·'+p.title+'：名下事项按周期提交反馈，提交后经部门负责人 → 分管高管审核；您是派发链路末端，不能再派发。';
}

const ROLES = {
  admin:{name:'TY', dept:'综合部', label:'督办管理人', full:'督办管理人 · 全域权限',

/* 上期工作计划 演示文案（占位引导与框内内容共用一套）：✗ 错误写法 / ✓ 优秀写法（营业部摸排口径） */
const PLAN_LINES = [
  '✗ 错误写法（仅方向性表态：无思路方案、无明确目标，不可执行、无法核验）',
  '　　下周把营业部情况摸排这项工作做细致、扎实推进，确保取得更好成效。',
  '',
  '✓ 优秀写法（有思路方案 · 目标明确 · 步骤可执行 · 结果易判断）',
  '　　对 28 家营业部摸排底稿逐条复核：按「业务类型—客户资源—对接人」口径逐份比对，统一不一致表述并形成最终模板；9 月 10 日前完成 3 家重点机构留痕方式与合规部的书面确认。'
];
const PLAN_PH = PLAN_LINES.join('&#10;');   /* 只读框空态占位引导 */
const PLAN_DEMO = PLAN_LINES.join('\n');    /* 框内演示内容（当前期显示） */

/* 周期状态初始化：反馈记录统一保留版本、实际填报人和审批记录；普通数据仍为前端演示内存。 */
ITEMS.forEach(it=>{
  if(it.periodNo===undefined) it.periodNo = 12;
  if(it.lastPlan===undefined) it.lastPlan = PLAN_DEMO;
  if(it.nextPlan===undefined) it.nextPlan = '';
  if(it.fbStage===undefined) it.fbStage = '';
  /* V5.0 四级审核链：dept 部门负责人 → mgr 分管领导 → admin 督办管理人 → sync 公司领导（已阅/评论） → done */
  /* 旧初始化数据只标了“已反馈”但没有审核节点；已提交必须进入待审核，不再显示成已完成。 */
  if(it.feedback==='已反馈' && !it.fbStage) it.fbStage = it.status==='已完成' ? 'done' : 'dept';
  if(it.fbReport===undefined) it.fbReport = null;
  if(it.feedbackReturn===undefined) it.feedbackReturn = null;
  if(it.dispatchLog===undefined) it.dispatchLog = [];
  if(it.dispatchTo===undefined) it.dispatchTo = null;
  /* V5.0 演示数据补齐：把历史「下发待办」留痕还原成派发链，使各级派发说明可按同样规则同步到下级「评价与评论」 */
  if(!(it.dispatchLog||[]).length){
    const downLogs=(it.logs||[]).filter(g=>String(g.act||'')==='下发待办');
    if(downLogs.length){
      const tgt=(it.exec&&it.exec!=='待分配')?it.exec:(leadOf(it.lead)||'');
      it.dispatchLog=downLogs.map((g,i)=>{
        const tp=person(tgt);
        return {t:g.t, from:(String(g.who||'TY').split('（')[0].split('(')[0].trim()||'TY'),
          fromRole:i===0?'督办管理人':'部门负责人', to:tgt,
          toRole:!tp?'承接人':(tp.r==='mgr'?'分管高管':(tp.r==='exec'?'部门负责人':'落实人')),
          txt:String(g.txt||'')};
      });
    }
  }
  if(it.currentExec===undefined) it.currentExec = it.exec;
  if(it.leadMgr===undefined) it.leadMgr = mgrOf(it.lead)||'';
  if(it.directExec===undefined) it.directExec = !!(it.exec && it.exec!=='待分配');
  if(!Array.isArray(it.mgrs)) it.mgrs=[];
  if(it.leadMgr && !it.mgrs.includes(it.leadMgr)) it.mgrs.unshift(it.leadMgr);
  if(it.chain===undefined) it.chain = [];      /* 派发链路参与人：任务派发后仍保留在各级待办事项清单中 */
  if(it.reassignLog===undefined) it.reassignLog = []; /* 撤回并重新派发记录 */
  if(it.reassignFeedbackReset===undefined) it.reassignFeedbackReset = false;
  if(it.workDept===undefined) it.workDept = it.lead; /* 实际办理部门：派发到具体人员后按人员所属部门确定，仅用于流程审核，不改变原牵头部门展示 */
  if(it.closeStage===undefined) it.closeStage = '';  /* 结项：'' → dept → admin → done */
  if(it.closeRequest===undefined) it.closeRequest = null;
  if(it.meetingRequests===undefined) it.meetingRequests = [];
  if(it.userTags===undefined) it.userTags = {};
  it.logs=(it.logs||[]).map(g=>Object.assign({},g,{t:normalizeRecordTime(g.t,/提交反馈|评价|审核|派发|结项|专题会/.test(String(g.act||''))?'10:00:00':'00:00:00')}));
  it.dispatchLog=(it.dispatchLog||[]).map(g=>Object.assign({},g,{t:normalizeRecordTime(g.t,'10:00:00')}));
  it.comments=(it.comments||[]).map(c=>Object.assign({},c,{time:normalizeRecordTime(c.time,'10:00:00'),replies:(c.replies||[]).map(r=>Object.assign({},r,{time:normalizeRecordTime(r.time,'10:00:00')}))}));
  if(it.lastReportAt) it.lastReportAt=normalizeRecordTime(it.lastReportAt,'10:00:00');
  if(it.launch===undefined){ const lg=(it.logs||[]).find(g=>g.act==='下发待办'); it.launch = lg ? lg.txt : ''; }
  if(it.fbRank===undefined) it.fbRank = 0;      /* 事项看板：条线内排序 */
  if(it.fbOff===undefined) it.fbOff = false;    /* 事项看板：是否已移出汇报表（软删除，可恢复） */
  if(it.fbSummary===undefined) it.fbSummary = '';/* 事项看板：进展总结手工覆盖值 */
  if(it.feedbackHistory===undefined){
    const oldLog=(it.logs||[]).find(g=>String(g.act||'').indexOf('提交反馈')>=0);
    /* 未反馈事项的 lastReport 是上一周期的历史汇报；当前 periodNo 留给下一次提交。 */
    const historyPeriod=it.feedback==='未反馈'&&it.lastReportAt?Math.max(1,(it.periodNo||1)-1):(it.periodNo||1);
    it.feedbackHistory=(it.lastReportAt&&it.lastReport&&it.lastReport!=='—')?[{
      recordId:it.id+'-P'+historyPeriod+'-V1',periodNo:historyPeriod,dimension:it.cycle,
      periodStart:feedbackWindow(it).start,periodEnd:feedbackWindow(it).end,cutoff:feedbackWindow(it).cutoff,
      lastPlan:it.lastPlan||'—',current:it.lastReport,next:it.nextPlan||'—',actualReporter:oldLog?String(oldLog.who).split('（')[0].split('(')[0]:actualExec(it),
      submittedAt:normalizeRecordTime(it.lastReportAt,'10:00:00'),version:1,approvalRecords:[],deptAudit:'历史记录',mgrAudit:'历史记录'

function feedbackDays(it){
  const c=String(it&&it.cycle||'');
  if(c.indexOf('月')>=0) return 30;
  if(c.indexOf('双周')>=0 || c.indexOf('两周')>=0) return 14;
  return 7;
}
function feedbackWindow(it){
  const end=it&&it.nextDue&&it.nextDue!=='—' ? it.nextDue : '—';
  if(end==='—') return {start:'—',end:'—',cutoff:'—',label:'—'};
  const e=new Date(end+'T00:00:00');
  const d=feedbackDays(it)-1;
  const s=String(it.cycle||'').indexOf('月')>=0 ? new Date(e.getFullYear(),e.getMonth(),1) : new Date(e.getTime()-d*86400000);
  const fmt=x=>x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate());
  return {start:fmt(s),end,cutoff:end+' 12:00:00',label:fmt(s)+' 至 '+end+' · 截止 '+end+' 12:00:00'};
}
function feedbackClosed(it){
  const w=feedbackWindow(it);
  return w.cutoff!=='—' && TODAY > new Date(w.cutoff.replace(' ','T'));
}
function feedbackVersion(it){
  const period=it&&it.periodNo||1;
  return (it&&it.feedbackHistory||[]).filter(h=>Number(h.periodNo||period)===Number(period)).length+1;
}
function latestFeedback(it){ const h=it&&it.feedbackHistory||[]; return h.length?h[h.length-1]:null; }
function feedbackReturnStatusLabel(it){ return it&&it.feedbackReturn?.to==='dept' ? '进展反馈已退回 · 待部门负责人重新审核' : '进展反馈已退回 · 待落实人修改'; }
function feedbackReturnLabel(it){ return it&&it.feedbackReturn ? feedbackReturnStatusLabel(it) : '待填写进展反馈'; }
function feedbackPrimaryLabel(it){ return it&&it.feedbackReturn ? feedbackReturnStatusLabel(it) : '待您填写 · 进展反馈'; }
function feedbackStatusLabel(it){
  if(it&&it.feedbackReturn) return feedbackReturnStatusLabel(it);
  if(it&&it.feedback==='已反馈') return (FB_STAGE_LABEL[it.fbStage]||'进展反馈待审核');
  return it&&feedbackClosed(it) ? '进展反馈已逾期' : '本期未反馈';
}
function feedbackNeedsAudit(it){ return !!(it && it.status!=='已完成' && it.feedback==='已反馈' && it.fbStage!=='done'); }
function feedbackFilterMatch(it,filter){
  if(!it || filter==='全部') return true;
  if(it.status==='已完成') return false;
  if(filter==='待审核') return feedbackNeedsAudit(it);
  if(filter==='已审核') return it.feedback==='已反馈' && it.fbStage==='done';
  if(filter==='已退回') return !!it.feedbackReturn;
  if(filter==='未反馈') return it.feedback==='未反馈' && !it.feedbackReturn;
  return false;
}
function actualExec(it){
  if(it && it.dispatchTo && (it.dispatchTo.type==='dept'||it.dispatchTo.type==='person')) return it.dispatchTo.name;
  return it && (it.currentExec || it.exec);
}
function actualDept(it){
  const p=person(actualExec(it));
  return it.workDept || (p&&p.dept) || it.lead;
}
function deptReviewer(it){ return leadOf(actualDept(it)); }
function mgrReviewer(it){ return (it&&it.leadMgr) || mgrOf(actualDept(it)); }
function currentHandler(it){
  if(it && it.dispatchTo && it.dispatchTo.name) return it.dispatchTo.name;
  return actualExec(it) || null;
}
function canSubmitFeedback(it){
  if(!it || it.status==='已完成') return false;
  if(it.feedback==='已反馈' || it.fbStage) return false;
  /* 分管高管持有事项期间，原落实人不能越过派发节点提交；部门负责人可选择直接办理。 */
  if(it.dispatchTo && it.dispatchTo.type==='mgr') return false;
  const ex=actualExec(it);
  return !!ex && CUR===ex && (ROLE==='person'||ROLE==='exec');
}
function canCurrentExecutorAct(it){
  if(!it || it.status==='已完成') return false;
  if(it.dispatchTo && it.dispatchTo.type==='mgr') return false;
  const ex=actualExec(it);
  return !!ex && CUR===ex && (ROLE==='person'||ROLE==='exec');
}
/* 流程类动作不应被反馈截止时间锁死：专题会已通过后，即使进展反馈逾期，仍要能推进会议状态和填写会议结论。 */
function canCurrentExecutorWorkflow(it){
  if(!it || it.status==='已完成') return false;
  if(it.dispatchTo && it.dispatchTo.type==='mgr') return false;
  const ex=actualExec(it);
  return !!ex && CUR===ex && (ROLE==='person'||ROLE==='exec');
}
function canRequestClose(it){ return canCurrentExecutorAct(it) && (!it.closeStage || it.closeRequest?.status==='已退回'); }
function meetingLatest(it){ return (it && it.meetingRequests||[]).slice(-1)[0]||null; }
function meetingStatusLabel(mr){
  return ({'待督办管理人审核':'待督办管理人审核专题会','待开专题会':'待开专题会','待落实人填写会议结论':'待落实人填写会议结论','已退回':'专题会申请已退回 · 待落实人修改','已完成':'专题会已完成'}[mr?.status]||mr?.status||'—');
}
function closeStatusLabel(it){
  if(!it || it.status==='已完成') return '';
  if(!it.closeStage && it.closeRequest?.status==='已退回') return '结项申请已退回 · 待落实人修改';
  if(it.closeStage==='dept') return '待部门负责人确认结项';
  if(it.closeStage==='admin') return '待督办管理人审核结项';
  return '';
}
function closeContentStatusLabel(it){
  if(!it || (!it.closeRequest && !it.closeStage)) return '';
  if(it.status==='已完成' || it.closeStage==='done' || it.closeRequest?.status==='已办结') return '已结项';
  return closeStatusLabel(it);
}
function closeContentStatusClass(it){
  const label=closeContentStatusLabel(it);
  return label.indexOf('退回')>=0 ? 'red' : (label==='已结项' ? 'green' : 'amber');
}
function meetingReviewTodoMe(it){ return !!(it && meetingLatest(it)?.status==='待督办管理人审核' && ROLE==='admin'); }
function meetingOpenTodoMe(it){ return !!(it && meetingLatest(it)?.status==='待开专题会' && (ROLE==='admin'||canCurrentExecutorWorkflow(it))); }
function meetingConclusionTodoMe(it){ return !!(it && meetingLatest(it)?.status==='待落实人填写会议结论' && canCurrentExecutorWorkflow(it)); }
function meetingCanApply(it){
  const mr=meetingLatest(it);
  return canCurrentExecutorAct(it) && (!mr || ['已完成','已退回'].includes(mr.status));
}
function closeActionLabel(it){
  return it && it.closeRequest?.status==='已退回' ? '修改结项申请' : '申请结项';
}
function meetingActionLabel(it){
  return meetingLatest(it)?.status==='已退回' ? '修改专题会申请' : '申请专题会';
}
function closeTodoMe(it){
  return !!(it && it.closeRequest?.status!=='已退回' && it.closeStage==='dept' && ROLE==='exec' && deptReviewer(it)===CUR);
}
function closeAdminTodoMe(it){
  return !!(it && it.status!=='已完成' && it.closeRequest?.status!=='已退回' && ROLE==='admin' && (it.closeStage==='admin' || (typeof AUDITS!=='undefined' && AUDITS.some(a=>a.id===it.id))));
}
function pushCloseAudit(it){
  if(!it || AUDITS.some(a=>a.id===it.id && a._dynamic)) return;
  const req = it.closeRequest || {};
  AUDITS.push({id:it.id,name:it.name,lead:it.lead,exec:actualExec(it),deadline:it.deadline,
    reason:req.reason||'—',mgr:mgrReviewer(it)||'—',time:req.time||'—',step:'管理员审核中',_dynamic:true});
}

function visibleItems(){
  const me = person(CUR);
  if(!me || me.r==='admin' || me.r==='boss') return ITEMS;
  /* 基础可见范围 ∨ 派发到我的任务（自上而下） ∨ 待我审核的反馈（自下而上） */
  return ITEMS.filter(it=>{
    let ok = false;
    if(me.r==='mgr') ok = it.mgrs.includes(CUR);
    if(me.r==='exec') ok = it.lead===me.dept || it.assists.includes(me.dept);
    if(me.r==='person') ok = actualExec(it)===CUR;
    /* 派发链路参与人（派发过 / 承接过）始终保留在本人待办事项清单中 */
    if((it.chain||[]).includes(CUR)) ok = true;
    return ok || dispatchedToMe(it) || fbTodoMe(it) || closeTodoMe(it) || meetingConclusionTodoMe(it) || meetingReviewTodoMe(it);
  });
}
function statusLight(it){
  if(it.status==='已完成') return 'g';
  if(it.status==='已延期') return 'r';
  const d = days(it.deadline);
  if(d<0) return 'r';
  if(d<=7) return 'y';
  return 'g';
}
function lightLabel(l){ return l==='g'?'正常推进':(l==='y'?'即将到期（≤7天）':'临期/延期'); }
function dueLabel(it){
  if(it.status==='已完成') return '—';
  return it.nextDue + '（' + it.cycle + '）';
}
function countStats(list){
  return {
    total:list.length,
    inWay:list.filter(i=>i.status==='在途').length,
    done:list.filter(i=>i.status==='已完成').length,
    delayed:list.filter(i=>i.status==='已延期').length,
    fb:list.filter(i=>feedbackNeedsAudit(i)).length,
    approved:list.filter(i=>i.status!=='已完成'&&i.feedback==='已反馈'&&i.fbStage==='done').length,
    returned:list.filter(i=>i.status!=='已完成'&&!!i.feedbackReturn).length,
    nofb:list.filter(i=>i.status!=='已完成'&&i.feedback==='未反馈').length
  };
}
function impTag(it){ return it.importance==='重点'?'<span class="tag key"><i class=\"fas fa-lightbulb\" style=\"color:#F1B04A;margin-right:2px\"></i>重点</span>':'<span class="tag reg">常规</span>'; }
function statusPill(it){
  if(it.status==='已完成') return '<span class="pill green"><span class="dot"></span>已结项</span>';
  if(it.status==='已延期') return '<span class="pill red"><span class="dot"></span>已延期</span>';
  return '<span class="pill blue"><span class="dot"></span>在途</span>';
}
function fbPill(it){
  if(it.status==='已完成') return '';
  const cls=(it.feedbackReturn||it.feedback!=='已反馈')?'red':(feedbackNeedsAudit(it)?'blue':'green');
  return '<span class="pill '+cls+'"><span class="dot"></span>'+esc(feedbackStatusLabel(it))+'</span>';
}
/* 同一事项允许多个状态并存：反馈、专题会、结项分别展示，避免一个状态覆盖另一个状态。 */
function workflowStates(it){
  if(!it) return [];
  const states=[];
  const add=(key,label,cls)=>{ if(!states.some(s=>s.key===key)) states.push({key,label,cls}); };
  if(it.status==='已完成') add('done','已结项','green');
  const wt = watchTagInfo(it); if(wt) add('watch', wt.label, 'gold');
  const closeLabel=closeStatusLabel(it);
  if(closeLabel) add('close',closeLabel,closeLabel.indexOf('退回')>=0?'red':'amber');
  const mr=meetingLatest(it);
  if(it.status!=='已完成' && mr){
    const meetingLabel=meetingStatusLabel(mr);
    if(mr.status) add('meeting',meetingLabel,mr.status==='已退回'?'red':'purple');
  }
  /* 审核链路口径：部门负责人同意后到分管高管且未审核 = 分管领导审核中；分管高管审核之后才算「本期已反馈」。
     反馈被退回时不再展示「本期已反馈」「分管领导审核中」，只展示退回状态。 */
  if(it.status!=='已完成'){
    if(it.feedbackReturn){
      add('fb-return',feedbackReturnStatusLabel(it),'red');
    }else{
      const st = it.fbStage;
      const afterMgr = (st==='admin'||st==='sync'||st==='done');
      if(it.feedback==='已反馈' && afterMgr) add('feedback-submitted',st==='done'?'进展反馈已审核':'本期已反馈','green');
      if(st==='dept') add('fb-dept',feedbackStatusLabel(it),'blue');
      if(st==='mgr') add('fb-mgr',feedbackStatusLabel(it),'blue');
      if(st==='admin') add('fb-admin',feedbackStatusLabel(it),'blue');
      if(st==='sync') add('fb-sync',feedbackStatusLabel(it),'purple');
      if(it.feedback==='未反馈') add('feedback',feedbackStatusLabel(it),'red');
    }
  }
  if(dispatchTodoMe(it) && !canSubmitFeedback(it)) add('dispatch','待我办理','amber');
  return states;
}
function processPills(it,skipKeys){
  const skip=Array.isArray(skipKeys)?skipKeys:[];
  return workflowStates(it).filter(s=>s.key!=='done'&&!skip.includes(s.key)).map(s=>'<span class="pill '+s.cls+'"><span class="dot"></span>'+esc(s.label)+'</span>').join(' ');
}
function dispatchStateLabel(it){
  const ex=actualExec(it);
  return hasBeenDispatched(it)||(ex&&ex!=='待分配') ? '已派发' : '待派发';
}
function todoPrimaryState(it){
  /* 主标签只表达事项是否已经建立派发关系；反馈、审核、退回、结项和专题会在并行状态中展示。 */
  const label=dispatchStateLabel(it);
  return {label,cls:label==='已派发'?'blue':'amber'};
}
function workflowTodoItems(){
  return visibleItems().filter(it=>{
    if(it.status==='已完成') return false;
    /* 流程待办只展示当前必须处理的动作；重新派发是事项明细中的管理操作，不形成工作台待办。 */
    return fbTodoMe(it)||closeTodoMe(it)||closeAdminTodoMe(it)||meetingReviewTodoMe(it)||meetingOpenTodoMe(it)||meetingConclusionTodoMe(it)||canSubmitFeedback(it)||canRequestClose(it)||meetingCanApply(it)||dispatchTodoMe(it)||canDispatch(it);
  });
}
function workflowAuditTodo(it){
  return !!(it && (fbTodoMe(it)||closeTodoMe(it)||closeAdminTodoMe(it)||meetingReviewTodoMe(it)||meetingOpenTodoMe(it)||meetingConclusionTodoMe(it)));
}
function workflowEntryRoute(){
  const flow=workflowTodoItems();
  TODO_TAB=flow.some(workflowAuditTodo)?'audit':'dispatch';
  return flow.length ? '#todo' : '#fb';
}
function nameCell(it){
  return '<div class="tname"><span class="star'+(it.favBy&&it.favBy[CUR]?' on':'')+'" onclick="event.stopPropagation();toggleFav(\''+it.id+'\')"><i class="'+(it.favBy&&it.favBy[CUR]?'fas':'far')+' fa-star"></i></span>'

    + '<div class="tip"><b>最新进展（'+(it.lastReportAt||'—')+' · '+esc(who(actualExec(it))||'—')+'）</b>'+esc(it.lastReport)+'</div></div>';
}

/* ---------- 顶栏消息中心 ---------- */
let BELL_TAB = 'unread';
const BELL_STORE_PREFIX = 'supervision_bell_v1_';

function bellStoreKey(){ return BELL_STORE_PREFIX + CUR; }
function loadBellStore(){
  try{
    const raw = localStorage.getItem(bellStoreKey());
    const obj = raw ? JSON.parse(raw) : {};
    return {read:obj.read||{}, history:obj.history||{}};
  }catch(e){ return {read:{}, history:{}}; }
}
function saveBellStore(store){
  try{ localStorage.setItem(bellStoreKey(), JSON.stringify(store)); }catch(e){}
}
function bellToken(m){
  const it = m.it;
  if(!it) return m.key+'|'+(m.sub||'');
  const dsp = it.dispatchTo ? (it.dispatchTo.type||'')+'-'+(it.dispatchTo.name||'') : '';
  const fbRet = it.feedbackReturn ? (it.feedbackReturn.returnedAt||'returned') : '';
  const closeRet = it.closeRequest ? (it.closeRequest.status||'')+'-'+(it.closeRequest.returnedAt||'') : '';
  return [m.key,it.id||'',it.periodNo||'',it.fbStage||'',it.closeStage||'',it.feedback||'',dsp,(it.dispatchLog||[]).length,fbRet,closeRet].join('|');
}
function bellEncodedToken(m){ return encodeURIComponent(bellToken(m)); }
function bellIsRead(m, store){ return !!store.read[bellToken(m)]; }
function bellSnapshot(m){
  return {
    token:bellToken(m), key:m.key, icon:m.icon, title:m.title, sub:m.sub||'',
    itemId:m.it ? m.it.id : '', action:m.action||'', readAt:new Date().toISOString()
  };
}
function markBellReadEncoded(encoded){
  const token = decodeURIComponent(encoded||'');
  const msgs = bellMessages();
  const m = msgs.find(x=>bellToken(x)===token);
  const store = loadBellStore();
  store.read[token] = Date.now();
  if(m) store.history[token] = bellSnapshot(m);
  saveBellStore(store);
  updateBellDot();
}
function markAllBellRead(){
  const msgs = bellMessages();
  const store = loadBellStore();
  const now = Date.now();
  msgs.forEach(m=>{
    const token = bellToken(m);
    store.read[token] = now;
    store.history[token] = bellSnapshot(m);
  });
  /* 控制本地历史体量，保留最近 100 条 */
  const hs = Object.entries(store.history).sort((a,b)=>String(b[1].readAt||'').localeCompare(String(a[1].readAt||'')));
  store.history = Object.fromEntries(hs.slice(0,100));
  saveBellStore(store);
  updateBellDot();
  openBellCenter('unread');
}
function addItemSystemMessage(it,title,sub,audience,icon){
  if(!it) return;
  if(!Array.isArray(it.systemMessages)) it.systemMessages=[];
  const stamp=nowRecordTime();
  it.systemMessages.push({id:'MSG-'+it.id+'-'+Date.now(),title,sub,audience:Array.from(new Set(audience||[])),icon:icon||'fa-bell',time:stamp});
}
function messageAudience(list,exclude){
  return Array.from(new Set((list||[]).filter(x=>x && x!=='—' && x!==exclude)));
}
function notifyCloseCompleted(it){
  const audience=Array.from(new Set([...(it.mgrs||[]),'YZ']));
  addItemSystemMessage(it,'督办已结项','「'+it.name+'」已完成结项，结项说明和结项结论已归档。',audience,'fa-flag-checkered');

function notifyCloseReturned(it,byRole,reason){

  const target=(it.closeRequest&&it.closeRequest.by)||actualExec(it);
  if(!target) return;
  addItemSystemMessage(it,'结项申请已退回','「'+it.name+'」的结项申请已被'+(byRole||'审核人')+'退回，请落实人修改做法说明和结项结论后重新提交。'+(reason?'退回意见：'+reason:'') ,messageAudience([target],CUR),'fa-rotate-left');
}
function bellMessages(){
  const msgs = [];
  const add = (key, icon, title, sub, it, action) => {
    if(msgs.some(m=>m.key===key)) return;
    msgs.push({key,icon,title,sub,it,action});
  };
  const list = visibleItems();
  list.forEach(it=>{
    (it.systemMessages||[]).filter(m=>!m.audience?.length || m.audience.includes(CUR) || m.audience.includes('*')).forEach(m=>{
      add(m.id||('system-'+it.id+'-'+m.time),m.icon||'fa-bell',m.title,m.sub,it,"closeModal();goDetail('"+it.id+"')");
    });
    if(it.status==='已完成') return;
    if(dispatchTodoMe(it) && !canSubmitFeedback(it)){

      add('fbaudit-'+it.id,'fa-user-check',fbTodoLabel(it),it.name,it,"TODO_TAB='audit';closeModal();go('todo')");
    }
    if(meetingReviewTodoMe(it)){

    }
    if(meetingOpenTodoMe(it)){

      add('closedept-'+it.id,'fa-flag-checkered','待确认结项申请',it.name,it,"closeModal();goDetail('"+it.id+"')");

      add('nofb-'+it.id,'fa-bell','本期未反馈',it.name,it,"closeModal();goDetail('"+it.id+"')");
    }
  });
  if(ROLE==='admin'){
    AUDITS.forEach(a=>{
      const it=ITEMS.find(x=>x.id===(a.itemId||a.id));
      if(it && it.status!=='已完成' && closeAdminTodoMe(it) && !msgs.some(m=>m.key==='closeadmin-'+a.id)){

    });
  }
  return msgs;
}
function bellUnreadCount(){
  const store = loadBellStore();
  return bellMessages().filter(m=>!bellIsRead(m,store)).length;
}
function updateBellDot(){
  const dot = $('#bellDot'); if(!dot) return;
  const n = bellUnreadCount();
  dot.style.display = n>0 ? 'flex' : 'none';
  dot.textContent = n;
}
function bellHistoryMessages(store, active){
  const activeTokens = new Set(active.map(m=>bellToken(m)));
  return Object.values(store.history||{})
    .filter(h=>h && h.token && !activeTokens.has(h.token))
    .sort((a,b)=>String(b.readAt||'').localeCompare(String(a.readAt||'')))
    .map(h=>({
      key:h.key||h.token, icon:h.icon||'fa-bell', title:h.title||'已读消息', sub:h.sub||'', it:null,
      action:h.action|| (h.itemId ? "closeModal();goDetail('"+h.itemId+"')" : "closeModal()"),
      _history:true, _token:h.token, _read:true, readAt:h.readAt||''
    }));
}
function openBellCenter(tab){
  BELL_TAB = tab || BELL_TAB || 'unread';
  const active = bellMessages();
  const store = loadBellStore();
  const history = bellHistoryMessages(store, active);
  const current = active.map(m=>Object.assign({},m,{_token:bellToken(m),_read:bellIsRead(m,store)}));
  const all = current.concat(history);
  const unread = current.filter(m=>!m._read);
  const read = all.filter(m=>m._read);
  const show = BELL_TAB==='all' ? all : (BELL_TAB==='read' ? read : unread);
  const tabBtn = (k,label,n) => `<button class="btn sm ${BELL_TAB===k?'primary':''}" onclick="openBellCenter('${k}')">${label}（${n}）</button>`;
  const rows = show.map(m=>{
    const encoded = encodeURIComponent(m._token || bellToken(m));
    const readTag = m._read ? '<span class="tag gray" style="margin-left:7px">已读</span>' : '<span class="tag red" style="margin-left:7px">未读</span>';
    const click = (m._read ? `${m.action}` : `markBellReadEncoded('${encoded}');${m.action}`).replace(/goDetail\(/g,'bellOpenDetail(');
    return `<div onclick="${click}" style="display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;${m._read?'opacity:.72':''}">
      <div style="width:34px;height:34px;border-radius:9px;background:var(--accent-weak);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 34px"><i class="fas ${m.icon}"></i></div>
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;color:var(--ink)">${esc(m.title)}${readTag}</div><div style="font-size:12px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.sub||'')}</div></div>
      <i class="fas fa-chevron-right" style="font-size:11px;color:var(--ink-3);margin-top:10px"></i>
    </div>`;
  }).join('');
  openModal(`<div class="hd"><b><i class="far fa-bell" style="color:var(--accent);margin-right:7px"></i>消息与待处理提醒</b><button class="x" onclick="closeModal()">✕</button></div>
    <div class="bd" style="padding-top:8px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 4px 10px">
        ${tabBtn('unread','未读',unread.length)}${tabBtn('all','全部',all.length)}${tabBtn('read','已读',read.length)}
        <div style="flex:1"></div>
        <button class="btn sm" onclick="markAllBellRead()" ${unread.length?'':'disabled style="opacity:.45;cursor:not-allowed"'}><i class="fas fa-check-double"></i> 全部已读</button>
      </div>
      <div style="font-size:12px;color:var(--ink-3);padding:0 4px 8px">当前身份：${esc(CUR)} · 未读 ${unread.length} 条。点击未读消息即标记已读并进入对应事项；任务本身仍会保留在对应工作台，直到真正处理完成。</div>
      ${rows || '<div class="empty" style="padding:34px 12px"><i class="far fa-bell-slash"></i><p>'+(BELL_TAB==='unread'?'当前暂无未读消息':(BELL_TAB==='read'?'当前暂无已读消息':'当前暂无消息'))+'</p></div>'}
    </div>
    <div class="ft"><button class="btn" onclick="closeModal()">关闭</button></div>`);
}

/* ---------- PPTX：ZIP(store) 打包 + 复用「案例.pptx」骨架 ---------- */
const PPT_CRC_TABLE = (function(){ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320^(c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
function pptCrc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = PPT_CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function pptBytes(str){ return new TextEncoder().encode(str); }
function pptB64(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function pptEsc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* 段落模板（与案例.pptx 单元格一致：微软雅黑 · 1200 即 12pt） */
const PPT_PARA_TPL = '<a:p><a:pPr algn="@@ALGN@@"/><a:r><a:rPr sz="1200" b="0"><a:latin typeface="\u5fae\u8f6f\u96c5\u9ed1" charset="-122"/><a:ea typeface="\u5fae\u8f6f\u96c5\u9ed1" charset="-122"/><a:cs typeface="\u5fae\u8f6f\u96c5\u9ed1" charset="-122"/></a:rPr><a:t>@@T@@</a:t></a:r><a:endParaRPr sz="1200" b="0"><a:latin typeface="\u5fae\u8f6f\u96c5\u9ed1" charset="-122"/><a:ea typeface="\u5fae\u8f6f\u96c5\u9ed1" charset="-122"/><a:cs typeface="\u5fae\u8f6f\u96c5\u9ed1" charset="-122"/></a:endParaRPr></a:p>';
/* 六列：事项名称 / 落实人 / 时间要求 / 本期落实情况 / 下期工作计划 / 进展总结 */
const PPT_COLS = [
  {t:'事项名称', w:1300000, a:'ctr'},
  {t:'落实人',   w:1100000, a:'ctr'},
  {t:'时间要求', w:1050000, a:'ctr'},
  {t:'本期落实情况', w:3000000, a:'l'},
  {t:'下期工作计划', w:2700000, a:'l'},
  {t:'进展总结', w:3125695, a:'l'}
];
function pptCell(text, align, bold){
  const b = bold ? '1' : '0';
  const lines = String(text==null?'':text).split(/\r?\n/).map(x=>x.trim()).filter(x=>x!=='');
  const paras = (lines.length?lines:['']).map(t=>PPT_PARA_TPL.replace('@@ALGN@@',align).replace('@@T@@',pptEsc(t)).split('b="0"').join('b="'+b+'"')).join('');
  return '<a:tc><a:txBody><a:bodyPr/><a:lstStyle/>'+paras+'</a:txBody><a:tcPr anchor="ctr"/></a:tc>';
}
function zipStore(files){
  const locals=[], centrals=[]; let offset=0;
  files.forEach(f=>{
    const nb=pptBytes(f.name), crc=pptCrc32(f.data), sz=f.data.length;
    const lh=new Uint8Array(30+nb.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,sz,true); dv.setUint32(22,sz,true);
    dv.setUint16(26,nb.length,true); dv.setUint16(28,0,true);
    lh.set(nb,30); locals.push(lh, f.data);
    const ch=new Uint8Array(46+nb.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0x0800,true);
    cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,sz,true); cv.setUint32(24,sz,true);
    cv.setUint16(28,nb.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true); cv.setUint32(42,offset,true);
    ch.set(nb,46); centrals.push(ch);
    offset += lh.length + sz;
  });
  let cdSize=0; centrals.forEach(c=>cdSize+=c.length);
  const end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(4,0,true); ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true); ev.setUint16(20,0,true);
  return new Blob(locals.concat(centrals).concat([end]),{type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
}
/* 条线简称（与案例.pptx「人力条线 / 综合条线」口径一致） */
const PPT_LINE_ALIAS = {'人力资源部':'人力条线','战略客户部':'战客条线','综合部':'综合条线','技术部':'技术条线','资管部':'资管条线'};
function pptLineName(dept){ return PPT_LINE_ALIAS[dept] || (dept+'条线'); }
/* 生成 .pptx：每页一个条线，标题「一、人力条线（责任人：程总） 1/2」，六列表格 */
function buildFeedbackPptx(list){
  const g = fbGroups(list.filter(i=>i.status!=='已完成')), keys = Object.keys(g);
  const cn = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
  const files = [];
  Object.keys(PPT_BASE).forEach(n=> files.push({name:n, data:pptB64(PPT_BASE[n])}));
  const grid = '<a:tblGrid>' + PPT_COLS.map(c=>'<a:gridCol w="'+c.w+'"/>').join('') + '</a:tblGrid>';
  const head = '<a:tr h="563880">' + PPT_COLS.map(c=>pptCell(c.t,'ctr',true)).join('') + '</a:tr>';
  const ctParts=[], relParts=[], sldIds=[];
  keys.forEach((dept, idx)=>{
    const items = g[dept];
    const no = idx+1, pageNo = no+'/'+keys.length;
    const owner = who(DEPT_LEAD[dept]) || (items[0]&&items[0].mgrs&&items[0].mgrs.length?who(items[0].mgrs[0]):'') || '—';
    const title = (cn[idx]||(no+'、'))+'、'+pptLineName(dept)+'（责任人：'+owner+'） '+pageNo;
    const rows = items.map(it=>{
      const fb = fbFeedback(it);
      const exec = who(actualExec(it)||it.exec)||'—';
      const due = it.cycle || '—';
      const cur = fb.cur || '本期未反馈', nxt = fb.nxt || '暂无下期计划';
      const sum = fbAiSummary(it) || '暂无进展总结';
      const maxLines = Math.max(String(cur).split(/\r?\n/).length, String(nxt).split(/\r?\n/).length, String(sum).split(/\r?\n/).length, 1);
      const h = Math.max(560000, 240000 + maxLines*230000);
      return '<a:tr h="'+h+'">'
        + pptCell(it.name,'ctr') + pptCell(exec,'ctr') + pptCell(due,'ctr')
        + pptCell(cur,'l') + pptCell(nxt,'l') + pptCell(sum,'l') + '</a:tr>';
    }).join('');
    const slide = PPT_SLIDE_TPL.replace('@@TITLE@@', pptEsc(title))
                               .replace('@@GRID@@', grid)
                               .replace('@@HEADROW@@', head)
                               .replace('@@ROWS@@', rows);
    files.push({name:'ppt/slides/slide'+no+'.xml', data:pptBytes(slide)});
    files.push({name:'ppt/slides/_rels/slide'+no+'.xml.rels', data:pptBytes(PPT_SLIDE_RELS_TPL)});
    ctParts.push('<Override PartName="/ppt/slides/slide'+no+'.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>');
    relParts.push('<Relationship Id="rId'+(10+idx)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide'+no+'.xml"/>');
    sldIds.push('<p:sldId id="'+(256+idx)+'" r:id="rId'+(10+idx)+'"/>');
  });
  files.push({name:'[Content_Types].xml', data:pptBytes(PPT_CT_TPL.replace('@@CT_SLIDES@@', ctParts.join('')))});
  files.push({name:'ppt/_rels/presentation.xml.rels', data:pptBytes(PPT_PRES_RELS_TPL.replace('@@REL_SLIDES@@', relParts.join('')))});
  files.push({name:'ppt/presentation.xml', data:pptBytes(PPT_PRESENTATION_TPL.replace('@@SLDIDS@@', '<p:sldIdLst>'+sldIds.join('')+'</p:sldIdLst>'))});
  return zipStore(files);
}
function exportFeedbackPpt(){
  if(ROLE!=='admin'){ toast('仅督办管理人可导出 PPT 汇报版式'); return; }
  const list = exportScope();
  if(!list.length){ toast('当前没有可导出的在途待办事项'); return; }

}
