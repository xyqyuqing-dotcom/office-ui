<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>事务中心 · 移动端预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#eef2f7;color:#25354a}header{max-width:1040px;margin:34px auto 25px;padding:0 24px;display:flex;gap:20px;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0 0 8px}p{font-size:13px;color:#8995a5;margin:0;line-height:1.8}.links{display:flex;gap:8px}.links a{padding:9px 13px;border-radius:8px;border:1px solid #d6e0ed;background:#fff;font-size:12px;text-decoration:none;color:#527197}.phones{display:flex;justify-content:center;gap:52px;padding:0 24px 40px}.column{min-width:0}h2{font-size:13px;font-weight:500;text-align:center;color:#75859a;margin:0 0 14px}.phone{width:390px;height:844px;overflow:hidden;border:7px solid #263241;border-radius:32px;background:white;box-shadow:0 14px 45px #1e38531a}.phone iframe{width:100%;height:100%;border:0;display:block}.hint{max-width:420px;margin:14px auto 0;text-align:center;font-size:12px;color:#91a0b1}@media(max-width:880px){.phones{gap:24px;flex-wrap:wrap}header{max-width:440px;display:block;margin-top:22px}.links{margin-top:16px}.phone{width:min(390px,calc(100vw - 32px));height:min(844px,calc(100dvh - 140px))}.phones{padding:0 16px 32px}}
  </style>
</head>
<body>
  <header><div><h1>事务中心 · 移动端</h1><p>左侧查看事务入口，右侧填写申请与查看流程记录。</p></div><div class="links"><a href="index.html">打开事务列表</a><a href="application.html">打开流程详情</a></div></header>
  <main class="phones">
    <section class="column"><h2>发起事务</h2><div class="phone"><iframe src="index.html" title="移动端事务列表"></iframe></div><p class="hint">点击 ⓘ 查看简介，点击星标收藏</p></section>
    <section class="column"><h2>申请内容与流程记录</h2><div class="phone"><iframe src="application.html" title="移动端流程详情"></iframe></div><p class="hint">右侧工具栏查看详情，流程记录在表单最下方</p></section>
  </main>
</body>
</html>
