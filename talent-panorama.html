<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人才全景｜生命周期原型</title>
  <style>
    :root{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:#1d2b3d;background:#f4f7fb;font-size:14px}
    *{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}a{color:#2169b2;text-decoration:none}
    .topbar{height:58px;background:#173b64;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
    .brand{font-size:18px;font-weight:700;letter-spacing:.02em}.topbar small{color:#c7d9ec;font-size:12px}
    .shell{max-width:1510px;margin:auto;padding:24px 28px 38px}
    .breadcrumb{font-size:12px;color:#69809a;margin-bottom:14px}.breadcrumb span{color:#253f5c}
    .person-card{background:#fff;border:1px solid #e1e8f0;border-radius:12px;box-shadow:0 4px 18px #1b43660a;padding:22px 26px;margin-bottom:18px}
    .person-top{display:flex;align-items:center;gap:15px}.avatar{height:51px;width:51px;border-radius:13px;display:grid;place-items:center;background:#e6f1fb;color:#2b6fad;font-size:21px;font-weight:700}.person-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.person-title h1{font-size:22px;margin:0;font-weight:700}.badge{border-radius:20px;padding:5px 10px;background:#e9f5ed;color:#187146;font-size:12px;font-weight:600}.badge.soft{background:#edf4fd;color:#2567aa}.person-sub{color:#71849a;font-size:12px;margin-top:5px}.person-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;margin-top:20px;padding-top:18px;border-top:1px solid #edf1f5}.summary-label{color:#788ba0;font-size:12px;margin-bottom:6px}.summary-value{font-weight:600;color:#243d58}
    .main-grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}.panel{background:#fff;border:1px solid #e1e8f0;border-radius:12px;box-shadow:0 4px 18px #1b436608;overflow:hidden}.panel-head{min-height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #e9eef4}.panel-title{font-size:17px;font-weight:700}.panel-note{font-size:12px;color:#8797a8}
    .timeline-panel{position:sticky;top:16px;max-height:calc(100vh - 335px);overflow:auto}.timeline-panel .panel-head{position:sticky;top:0;background:#fff;z-index:2}.timeline-group{padding:20px 18px 0}.group-title{font-weight:700;color:#253f5c;display:flex;align-items:center;justify-content:space-between;margin:0 6px 14px}.group-title small{font-size:11px;color:#8a99aa;font-weight:400}.group-body{position:relative;margin-left:13px;padding-left:24px;border-left:1px solid #d9e4ee}.timeline-node{position:relative;display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:11px 12px;margin:0 0 7px;color:inherit}.timeline-node:before{content:"";position:absolute;left:-31px;top:20px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #90adc8}.timeline-node:hover{background:#f4f8fc}.timeline-node.active{background:#eaf4ff;border-color:#cbe2f9}.timeline-node.active:before{background:#2d79c3;border-color:#2d79c3;box-shadow:0 0 0 4px #e6f2fe}.node-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.node-name{font-weight:600}.node-date{font-size:11px;color:#8192a4;white-space:nowrap}.node-note{font-size:12px;color:#73879b;margin-top:5px;line-height:1.5}.mini-tag{font-size:11px;background:#f0f3f7;color:#64798e;padding:2px 6px;border-radius:4px;white-space:nowrap}.mini-tag.green{background:#e7f5eb;color:#318154}.mini-tag.amber{background:#fff4df;color:#9a6d12}.mini-tag.blue{background:#e7f1fc;color:#3170ad}
    .detail-panel{min-height:640px}.detail-head{padding:24px 28px 19px;border-bottom:1px solid #e9eef4}.detail-kicker{font-size:12px;color:#6787a6;font-weight:700;margin-bottom:7px}.detail-title-row{display:flex;align-items:center;justify-content:space-between;gap:18px}.detail-title{margin:0;font-size:24px;line-height:1.35}.detail-sub{margin-top:8px;color:#71859a;font-size:13px}.tabs{display:flex;gap:26px;overflow-x:auto;padding:0 28px;border-bottom:1px solid #e9eef4}.tab{flex:none;border:0;border-bottom:3px solid transparent;background:none;color:#6f8297;padding:15px 2px 13px}.tab.active{color:#226db3;border-bottom-color:#2b7bc6;font-weight:700}.detail-body{padding:26px 28px 34px;min-height:470px}
    .section{margin-bottom:28px}.section:last-child{margin-bottom:0}.section h3{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px}.section h3:before{content:"";width:4px;height:16px;border-radius:3px;background:#3b84c9}.kv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid #e5edf4;border-radius:8px;overflow:hidden}.kv{padding:15px 17px;border-right:1px solid #e5edf4;border-bottom:1px solid #e5edf4;min-height:66px}.kv:nth-child(3n){border-right:0}.kv:nth-last-child(-n+3){border-bottom:0}.kv label{display:block;color:#8697a8;font-size:12px;margin-bottom:7px}.kv strong{font-weight:600;line-height:1.5}.muted{color:#8a99a8}.quiet{font-size:12px;color:#8b9bac;line-height:1.6}.callout{border-radius:8px;background:#f3f8fd;color:#426582;padding:14px 16px;line-height:1.7}.callout.amber{background:#fff8eb;color:#80642d}
    .file-list{display:grid;gap:10px}.file-row{display:flex;align-items:center;gap:13px;border:1px solid #e3ebf3;border-radius:8px;padding:13px 15px}.file-icon{width:35px;height:39px;border-radius:6px;display:grid;place-items:center;background:#eaf3fd;color:#2d75b7;font-weight:700;font-size:11px}.file-info{flex:1;min-width:0}.file-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-meta{font-size:12px;color:#8a99a8;margin-top:4px}.text-btn{border:0;background:none;color:#246fb5;padding:6px 4px;font-weight:600}.text-btn:hover{text-decoration:underline}.secondary-btn{border:1px solid #ccdaea;background:white;color:#326d9f;border-radius:6px;padding:8px 12px}.secondary-btn:hover{background:#f1f7fd}
    .review-list{display:grid;gap:12px}.review-card{border:1px solid #e3ebf3;border-radius:8px;padding:16px}.review-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.review-head strong{font-size:14px}.review-card p{color:#587087;line-height:1.7;margin:0}.score{font-weight:700;color:#266fae}.period-list{display:grid;gap:12px}.period{border:1px solid #e3ebf3;border-radius:8px;padding:15px 17px}.period-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px}.period h4{margin:0;font-size:14px}.period p{margin:6px 0 0;color:#637b91;line-height:1.6}.log-row{display:flex;align-items:center;justify-content:space-between;border:1px solid #e3ebf3;border-radius:7px;padding:12px 15px;margin-bottom:8px}.log-row small{color:#8293a5}.log-row button{border:0;background:none;color:#2775b8}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.result-card{border:1px solid #e3ebf3;border-radius:8px;padding:18px}.result-card label{font-size:12px;color:#8a99a8}.result-card strong{display:block;margin-top:8px;font-size:16px}.yearbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}.yearbar select{border:1px solid #d5e1eb;border-radius:6px;background:#fff;padding:9px 33px 9px 12px;color:#294158}.performance-card{border:1px solid #e2eaf2;border-radius:9px;padding:20px;margin-bottom:14px}.performance-card h3{margin:0 0 12px;font-size:14px}.performance-card p{margin:0;color:#61788f;line-height:1.7}.performance-card.empty{border-style:dashed;background:#fbfcfe}.rating-line{display:flex;align-items:center;gap:16px}.rating-big{font-size:32px;font-weight:700;color:#2470b4}.rating-text{color:#62788c}.empty-state{text-align:center;padding:65px 20px;color:#7d91a6}.empty-state strong{display:block;color:#435c73;font-size:16px;margin-bottom:8px}
    .modal-backdrop{position:fixed;inset:0;background:#0d213b9c;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-backdrop.open{display:flex}.modal{width:min(820px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:10px;box-shadow:0 20px 70px #07162854}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #e7edf3}.modal-head h2{font-size:17px;margin:0}.close{border:0;background:none;font-size:25px;color:#698199;line-height:1}.modal-body{padding:24px}.preview-paper{background:#fff;border:1px solid #d5e0eb;box-shadow:0 2px 12px #1b436612;max-width:640px;min-height:430px;margin:auto;padding:38px 42px}.preview-paper h3{text-align:center;font-size:19px;margin:0 0 30px}.preview-paper p{line-height:1.9;color:#4f657a}.preview-paper .quiet{text-align:center;margin-top:38px}
    @media(max-width:1000px){.person-summary{grid-template-columns:repeat(3,1fr)}.main-grid{grid-template-columns:280px minmax(0,1fr)}.kv-grid{grid-template-columns:repeat(2,1fr)}.kv:nth-child(3n){border-right:1px solid #e5edf4}.kv:nth-child(2n){border-right:0}.kv:nth-last-child(-n+3){border-bottom:1px solid #e5edf4}.kv:nth-last-child(-n+2){border-bottom:0}}
    @media(max-width:700px){.shell{padding:14px}.topbar{padding:0 16px}.person-summary{grid-template-columns:repeat(2,1fr)}.main-grid{display:block}.timeline-panel{position:static;max-height:380px;margin-bottom:14px}.detail-body{padding:20px 16px}.detail-head{padding:20px 16px}.tabs{padding:0 16px}.kv-grid,.result-grid{grid-template-columns:1fr}.kv,.kv:nth-child(2n),.kv:nth-child(3n){border-right:0;border-bottom:1px solid #e5edf4}.kv:last-child{border-bottom:0}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">国小君　/　人才全景</div><small>生命周期页面草图 · 示例数据</small></header>
  <main class="shell">
    <div class="breadcrumb"><a href="index.html">原型目录</a> / 人力 / 人才全景 / <span>林知遥</span></div>
    <section class="person-card" aria-label="人才概况">
      <div class="person-top"><div class="avatar">林</div><div><div class="person-title"><h1>林知遥</h1><span class="badge">在职 · 试用期</span><span class="badge soft">再次入职</span></div><div class="person-sub">演示人员 · 所有展示内容均为虚构数据</div></div></div>
      <div class="person-summary">
        <div><div class="summary-label">当前部门 / 岗位</div><div class="summary-value">信息技术部 / 产品经理</div></div>
        <div><div class="summary-label">本次入职</div><div class="summary-value">2026-06-03</div></div>
        <div><div class="summary-label">当前阶段</div><div class="summary-value">持续考察 · 第 4 期述职</div></div>
        <div><div class="summary-label">拟转正时间</div><div class="summary-value">2026-12-03</div></div>
        <div><div class="summary-label">历史经历</div><div class="summary-value">2 次入职 · 1 次转岗</div></div>
      </div>
    </section>
    <div class="main-grid">
      <aside class="panel timeline-panel" aria-label="人员时间线">
        <div class="panel-head"><span class="panel-title">时间线</span><span class="panel-note">选择周期查看内容</span></div>
        <div id="timeline"></div>
      </aside>
      <section class="panel detail-panel" aria-label="时间线节点详情">
        <div class="detail-head"><div class="detail-kicker" id="detailKicker"></div><div class="detail-title-row"><h2 class="detail-title" id="detailTitle"></h2><span id="detailTag"></span></div><div class="detail-sub" id="detailSub"></div></div>
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="detail-body" id="detailBody"></div>
      </section>
    </div>
  </main>
  <div class="modal-backdrop" id="modalBackdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="modalClose" aria-label="关闭">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
  <script>
    const groups = [
      { title:'2020 年入职', note:'已结束', nodes:[
        {id:'apply1',type:'apply',name:'应聘',date:'2020-03',note:'登记 · 简历 · 笔试',tag:'已完成'},
        {id:'hire1',type:'hire',name:'录用',date:'2020-05',note:'面试评价 · 入职材料',tag:'已完成'},
        {id:'assess1',type:'assessment',name:'持续考察',date:'2020-05—11',note:'述职 · 轮岗 · 转正报告',tag:'已转正',rotation:true},
        {id:'perf1',type:'performance',name:'绩效评估',date:'2020—2022',note:'原岗位年度绩效',tag:'已归档',years:['2022','2021','2020']},
        {id:'transfer',type:'transfer',name:'转岗',date:'2022-07',note:'转岗登记与面试',tag:'已完成'},
        {id:'perf2',type:'performance',name:'绩效评估',date:'2022—2024',note:'新岗位年度绩效',tag:'已归档',years:['2024','2023','2022']},
        {id:'leave1',type:'departure',name:'离职',date:'2025-01',note:'本次任职结束',tag:'已离职'}
      ]},
      { title:'第 2 次入职 · 2026 年', note:'进行中', nodes:[
        {id:'apply2',type:'apply',name:'应聘',date:'2026-04',note:'重新登记 · 笔试',tag:'已完成'},
        {id:'hire2',type:'hire',name:'录用',date:'2026-06',note:'面试评价 · 入职材料',tag:'已完成'},
        {id:'assess2',type:'assessment',name:'持续考察',date:'2026-06—至今',note:'第 4 期述职进行中',tag:'进行中',rotation:false}
      ]}
    ];
    const byId = Object.fromEntries(groups.flatMap(group => group.nodes.map(node => [node.id,{...node,group:group.title}])));
    let activeId = 'assess2';
    let activeTab = '';
    let activeYear = '';
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const tag = (text,kind='blue') => `<span class="mini-tag ${kind}">${escapeHtml(text)}</span>`;
    const kv = items => `<div class="kv-grid">${items.map(([label,value]) => `<div class="kv"><label>${escapeHtml(label)}</label><strong>${escapeHtml(value)}</strong></div>`).join('')}</div>`;
    const files = list => `<div class="file-list">${list.map(item => `<div class="file-row"><span class="file-icon">${escapeHtml(item.ext)}</span><div class="file-info"><div class="file-name">${escapeHtml(item.name)}</div><div class="file-meta">${escapeHtml(item.meta)}</div></div><button class="text-btn" data-preview-title="${escapeHtml(item.name)}" data-preview-note="示例材料预览。实际页面将打开对应原件。" type="button">预览</button></div>`).join('')}</div>`;
    const fileSets = {
      apply1:[{name:'应聘登记表',ext:'PDF',meta:'2020-03-12 · 本轮应聘'},{name:'原始简历',ext:'DOC',meta:'用户上传 · 自定义格式'},{name:'笔试成绩报告',ext:'PDF',meta:'2020-03-19 · 86 分'}],
      apply2:[{name:'应聘登记表',ext:'PDF',meta:'2026-04-18 · 再次应聘'},{name:'原始简历',ext:'PDF',meta:'用户上传 · 自定义格式'},{name:'笔试成绩报告',ext:'PDF',meta:'2026-04-23 · 91 分'}],
      hire1:[{name:'个人证明材料',ext:'材料',meta:'身份证明、学历证明等 · 本次入职'},{name:'其他入职材料',ext:'材料',meta:'员工信息登记及其他材料 · 本次入职'}],
      hire2:[{name:'个人证明材料',ext:'材料',meta:'身份证明、学历证明等 · 再次入职'},{name:'其他入职材料',ext:'材料',meta:'员工信息登记及其他材料 · 再次入职'}],
      transfer:[{name:'转岗应聘登记表',ext:'PDF',meta:'2022-06-16 · 含近三年绩效，不含目前薪资与期望薪资'}],
      assess1:[{name:'持续考察信息表',ext:'PDF',meta:'试用期内逐轮填充'},{name:'转正报告',ext:'PDF',meta:'2020-11-27 · 转正流程材料'}],
      assess2:[{name:'持续考察信息表',ext:'PDF',meta:'持续更新中 · 第 4 期'},{name:'转正报告',ext:'PDF',meta:'尚未形成'}]
    };
    function renderTimeline(){
      $('timeline').innerHTML = groups.map(group => `<div class="timeline-group"><div class="group-title">${escapeHtml(group.title)}<small>${escapeHtml(group.note)}</small></div><div class="group-body">${group.nodes.map(node => `<button class="timeline-node ${node.id===activeId?'active':''}" data-node="${node.id}" aria-current="${node.id===activeId?'step':'false'}"><span class="node-row"><span class="node-name">${escapeHtml(node.name)}</span><span class="node-date">${escapeHtml(node.date)}</span></span><span class="node-note">${escapeHtml(node.note)}</span></button>`).join('')}</div></div>`).join('');
    }
    function tabsFor(node){
      if(node.type==='apply')return ['应聘登记','原始简历','笔试成绩'];
      if(node.type==='hire')return ['面试成绩及评价','入职材料'];
      if(node.type==='assessment')return node.rotation?['阶段概况','轮岗培养','轮岗日志','转正报告']:['阶段概况','转正报告'];
      if(node.type==='performance')return ['年度绩效评估'];
      if(node.type==='transfer')return ['转岗登记','转岗面试'];
      return ['离职信息'];
    }
    function render(){
      const node=byId[activeId];const tabList=tabsFor(node);if(!tabList.includes(activeTab))activeTab=tabList[0];
      $('detailKicker').textContent=node.group+' / '+node.date;
      $('detailTitle').textContent=node.name;
      $('detailSub').textContent=node.note;
      $('detailTag').innerHTML=tag(node.tag,node.tag==='进行中'?'amber':node.tag==='已转正'?'green':'blue');
      $('tabs').innerHTML=tabList.map(tab=>`<button class="tab ${tab===activeTab?'active':''}" role="tab" aria-selected="${tab===activeTab}" data-tab="${escapeHtml(tab)}">${escapeHtml(tab)}</button>`).join('');
      $('detailBody').innerHTML=contentFor(node,activeTab);
      renderTimeline();
    }
    function contentFor(node,tab){
      if(node.type==='apply'){
        if(tab==='应聘登记')return `<div class="section"><h3>本轮应聘</h3>${kv([['登记时间',node.id==='apply2'?'2026-04-18':'2020-03-12'],['应聘部门','信息技术部'],['应聘岗位',node.id==='apply2'?'产品经理':'业务分析师'],['招聘来源','公开招聘'],['登记表状态','已提交'],['是否内部转岗','否']])}</div><div class="section"><h3>登记表原件</h3>${files([fileSets[node.id][0]])}</div>`;
        if(tab==='原始简历')return `<div class="callout">原始简历保持候选人上传的文件格式，按格式尝试在线预览。</div><div class="section" style="margin-top:22px"><h3>文件</h3>${files([fileSets[node.id][1]])}</div>`;
        return `<div class="section"><h3>笔试结果</h3>${kv([['笔试时间',node.id==='apply2'?'2026-04-23':'2020-03-19'],['笔试成绩',node.id==='apply2'?'91 分':'86 分'],['报告状态','已形成']])}</div><div class="section"><h3>成绩报告</h3>${files([fileSets[node.id][2]])}</div>`;
      }
      if(node.type==='hire'){
        if(tab==='面试成绩及评价')return `<div class="section"><h3>面试结论</h3>${kv([['面试类型','招聘面试'],['面试时间',node.id==='hire2'?'2026-05-12':'2020-04-09'],['汇总评分',node.id==='hire2'?'A':'B+'],['最终面试结果','通过'],['录用岗位',node.id==='hire2'?'产品经理':'业务分析师'],['实际入职',node.id==='hire2'?'2026-06-03':'2020-05-18']])}</div><div class="section"><h3>面试官评价</h3><div class="review-list"><div class="review-card"><div class="review-head"><strong>面试官甲</strong><span class="score">A</span></div><p>专业基础扎实，能清晰说明项目中的判断和协作过程。</p></div><div class="review-card"><div class="review-head"><strong>面试官乙</strong><span class="score">B+</span></div><p>沟通表达良好，建议在入职后继续加强跨团队推进能力。</p></div></div></div>`;
        return `<div class="callout">入职材料在实际入职后填写或上传。以下按截图中的“个人证明材料 / 其他入职材料”分组，点击可预览相应材料。</div><div class="section" style="margin-top:22px"><h3>个人证明材料</h3>${files([{name:'身份证明',ext:'图片',meta:'已上传 · 敏感材料'},{name:'工资卡信息',ext:'图片',meta:'已上传 · 敏感材料'},{name:'原单位离职证明',ext:'PDF',meta:'已上传'},{name:'体检报告',ext:'PDF',meta:'已上传'}])}</div><div class="section"><h3>其他入职材料</h3>${files([{name:'员工信息登记表',ext:'PDF',meta:'已上传'},{name:'知情同意书',ext:'PDF',meta:'已上传'}])}</div>`;
      }
      if(node.type==='assessment'){
        if(tab==='阶段概况')return `<div class="section"><h3>持续考察进度</h3>${kv([['入职时间',node.id==='assess2'?'2026-06-03':'2020-05-18'],['拟转正时间',node.id==='assess2'?'2026-12-03':'2020-11-18'],['新员工述职',node.id==='assess2'?'第 4 / 6 期进行中':'6 / 6 期已完成'],['轮岗培养',node.rotation?'已安排':'无'],['转正流程',node.id==='assess2'?'尚未发起':'已办结'],['实际转正时间',node.id==='assess2'?'—':'2020-11-27']])}</div><div class="section"><h3>述职与考察</h3><div class="period-list">${(node.id==='assess2'?[1,2,3,4]:[3,4,5,6]).map(n=>`<div class="period"><div class="period-head"><h4>第 ${n} 期新员工述职</h4>${tag(node.id==='assess2'&&n===4?'办理中':'已完成',node.id==='assess2'&&n===4?'amber':'green')}</div><p>员工报告、指导老师评价${[3,6].includes(n)?'、部门负责人评价':''}，以及该期的流程记录。</p><button class="text-btn" data-preview-title="第 ${n} 期新员工述职" data-preview-note="这里预览该期述职报告、评价和流程记录。">查看本期内容</button></div>`).join('')}</div></div><div class="section"><h3>持续考察信息表</h3>${files([fileSets[node.id][0]])}</div>`;
        if(tab==='轮岗培养')return `<div class="callout">轮岗属于本次试用期的培养任务，不改变入职时间、拟转正时间或述职期数。</div><div class="section" style="margin-top:22px"><h3>轮岗岗位与时间</h3><div class="period-list"><div class="period"><div class="period-head"><h4>信息技术部 · 业务分析岗</h4><span class="mini-tag">2020-05—07</span></div><p>熟悉原岗位工作与协作流程。</p></div><div class="period"><div class="period-head"><h4>运营中心 · 运营支持岗</h4><span class="mini-tag">2020-08—09</span></div><p>轮岗培养，记录岗位工作与学习情况。</p></div><div class="period"><div class="period-head"><h4>信息技术部 · 业务分析岗</h4><span class="mini-tag">2020-10—11</span></div><p>轮岗结束，回到原岗位继续试用期考察。</p></div></div></div>`;
        if(tab==='轮岗日志')return `<div class="section"><h3>轮岗日志</h3><div class="log-row"><div><strong>轮岗阶段工作内容与学习记录</strong><br><small>2020-08-28 · 运营中心</small></div><button data-preview-title="轮岗日志详情" data-preview-note="记录轮岗岗位的工作内容、学习情况与阶段收获。">查看</button></div><div class="log-row"><div><strong>阶段总结与岗位建议</strong><br><small>2020-09-25 · 运营中心</small></div><button data-preview-title="轮岗日志详情" data-preview-note="记录轮岗结束时的阶段总结与岗位建议。">查看</button></div></div>`;
        return node.id==='assess2'?`<div class="empty-state"><strong>转正报告尚未形成</strong>正式转正由转正流程产生。当前仍处于持续考察阶段。</div><div class="section"><h3>当前资料</h3>${files([fileSets[node.id][0]])}</div>`:`<div class="section"><h3>转正流程结果</h3>${kv([['流程状态','已办结'],['正式转正结论','通过'],['实际转正时间','2020-11-27']])}</div><div class="section"><h3>转正材料</h3>${files(fileSets[node.id])}</div>`;
      }
      if(node.type==='performance'){
        if(!node.years.includes(activeYear))activeYear=node.years[0];
        return `<div class="yearbar"><strong>查看年度</strong><select id="yearSelect" aria-label="切换绩效年度">${node.years.map(year=>`<option value="${year}" ${year===activeYear?'selected':''}>${year} 年</option>`).join('')}</select><span class="quiet">${node.id==='perf2'?'转岗后的岗位周期':'原岗位周期'}；年度评估内容待接入</span></div><div class="section"><h3>年度绩效评估</h3>${kv([['评估年度',activeYear+' 年'],['评估岗位',node.id==='perf2'?'产品运营岗':'业务分析岗'],['评估状态','待补充材料']])}</div><div class="performance-card empty"><h3>良好表现</h3><p>暂无材料，预留年度评价内容。</p></div><div class="performance-card empty"><h3>问题与不足</h3><p>暂无材料，预留年度评价内容。</p></div><div class="performance-card empty"><h3>改进计划</h3><p>暂无材料，预留年度评价内容。</p></div><div class="performance-card empty"><h3>绩效评分</h3><p>暂无评分</p></div>`;
      }
      if(node.type==='transfer'){
        if(tab==='转岗登记')return `<div class="section"><h3>转岗信息</h3>${kv([['原部门 / 岗位','信息技术部 / 业务分析岗'],['目标部门 / 岗位','产品中心 / 产品运营岗'],['转岗生效时间','2022-07-01'],['近三年绩效','随转岗登记表提交']])}</div><div class="section"><h3>转岗应聘登记表</h3>${files(fileSets.transfer)}</div><div class="callout">转岗不重算试用期，也不重算新员工述职。转岗后另起一个绩效评估时间周期。</div>`;
        return `<div class="section"><h3>转岗面试结果</h3>${kv([['面试时间','2022-06-24'],['面试岗位','产品运营岗'],['汇总评分','B+'],['最终面试结果','通过']])}</div><div class="section"><h3>面试官评价</h3><div class="review-card"><div class="review-head"><strong>面试官甲、面试官乙等</strong><span class="score">B+</span></div><p>对原岗位业务熟悉，具备转岗所需的协作经验；建议补充目标岗位的专项培训。</p></div></div>`;
      }
      return `<div class="section"><h3>离职记录</h3>${kv([['离职时间','2025-01-15'],['结束岗位','产品中心 / 产品运营岗'],['本次任职状态','已结束']])}</div><div class="callout amber">离职只结束本次任职记录。再次应聘后，新的时间线从“应聘”重新开始，原有材料和评价仍可回看。</div>`;
    }
    function openPreview(title,note){
      $('modalTitle').textContent=title;
      $('modalBody').innerHTML=`<div class="preview-paper"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(note)}</p><p class="quiet">这里是页面结构演示。接入时展示所选记录的实际文件或流程内容，并保留所属应聘、任职及生成时间。</p></div>`;
      $('modalBackdrop').classList.add('open');$('modalClose').focus();
    }
    function closePreview(){ $('modalBackdrop').classList.remove('open'); }
    document.addEventListener('click',event=>{
      const nodeButton=event.target.closest('[data-node]');if(nodeButton){activeId=nodeButton.dataset.node;activeTab='';activeYear='';render();return;}
      const tabButton=event.target.closest('[data-tab]');if(tabButton){activeTab=tabButton.dataset.tab;render();return;}
      const customButton=event.target.closest('[data-preview-title]');if(customButton){openPreview(customButton.dataset.previewTitle,customButton.dataset.previewNote);return;}
      if(event.target===$('modalBackdrop')||event.target===$('modalClose'))closePreview();
    });
    document.addEventListener('change',event=>{if(event.target.id==='yearSelect'){activeYear=event.target.value;render();}});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closePreview();});
    render();
    const currentNode = $('timeline').querySelector('.timeline-node.active');
    const timelinePanel = document.querySelector('.timeline-panel');
    if (currentNode && timelinePanel) {
      timelinePanel.scrollTop += currentNode.getBoundingClientRect().top - timelinePanel.getBoundingClientRect().top - 170;
    }
  </script>
</body>
</html>
