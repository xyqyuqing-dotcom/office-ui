<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面试进度｜人力资源管理</title>
  <style>
    :root {

    * { box-sizing: border-box; }

    .order-cell { display: flex; align-items: center; gap: 7px; }

    #scheduleBody td, .table-wrap > table th { padding-left: 9px; padding-right: 9px; }
    .table-wrap > table tr > :nth-child(-n+3) { position: sticky; z-index: 2; background: #fff; }
    .table-wrap > table thead tr > th { background: #fafbfd; z-index: 3; }
    .table-wrap > table tr > :nth-child(1) { left: 0; }
    .table-wrap > table tr > :nth-child(2) { left: 44px; }

    .planned-time-range { display: flex; align-items: center; gap: 2px; }

    #scheduleBody .order-cell { gap: 4px; }

    .table-tools { flex-wrap: wrap; justify-content: flex-end; }

    .reuse-menu { position: fixed; z-index: 90; top: 8px; right: auto; left: 8px; width: 246px; display: grid; gap: 8px; padding: 12px; border: 1px solid #e1e7ee; border-radius: 7px; background: #fff; box-shadow: 0 8px 24px rgba(30,48,70,.18); }

    const mockPositions = {'林若宁':'数据分析岗','陈书涵':'后端开发工程师','赵子墨':'系统开发岗','周闻溪':'业务分析岗','孙予安':'前端开发工程师','杨梓轩':'客户经理','胡思远':'风险分析岗','于海涛':'数据产品岗','王浩然':'产品运营岗','陈悦宁':'业务运营岗','赵安琪':'行业研究岗','林婉清':'招聘专员','顾清禾':'客户体验岗','何景明':'系统运维岗','沈知夏':'数据治理岗','叶承安':'合规管理岗','唐可心':'产品设计岗','方明远':'数据平台岗','季书瑶':'组织发展岗','陆子谦':'后端开发岗','高予辰':'平台开发岗'};
    sessions.forEach(session=>{

      session.interviewers = [...new Set(session.roster.flatMap(person=>person.interviewers))];
      session.evaluationTags=[]; session.note='';
      session.people=session.roster.map((person,index)=>({...person,sourceId:`roster-${session.id}-${index}`,date:session.date,position:person.position||mockPositions[person.name]||'业务专员',status:'waiting',durationMinutes:session.duration,evaluationTags:[],note:''}));

    const $ = id => document.getElementById(id);
    const tagLibrary = [
      {name:'专业过硬',category:'interviewer'},{name:'识人精准',category:'interviewer'},{name:'客观公正',category:'interviewer'},{name:'挖掘深入',category:'interviewer'},{name:'准备充分',category:'interviewer'},
      {name:'沟通清晰',category:'evaluation'},{name:'逻辑严谨',category:'evaluation'},{name:'经验匹配',category:'evaluation'},{name:'建议复试',category:'evaluation'},{name:'重点关注',category:'evaluation'}

    const allInterviewerNames = [...new Set(sessions.flatMap(session => session.interviewers))];
    const interviewerProfiles = allInterviewerNames.map((name,index) => ({name,department:['机构金融部','信息技术部','风险管理部','运营管理部'][index%4],position:['部门总经理','产品经理岗','部门副总经理','业务负责人'][index%4],count:sessions.reduce((sum,session)=>sum+session.people.filter(person=>person.interviewers.includes(name)).length,0),tags:[tagLibrary[index%5].name,index%3===0?tagLibrary[(index+2)%5].name:''].filter(Boolean),note:index%4===0?'提问角度清晰，判断客观。':''}));
    const upstreamCandidateList = [
      ...sessions.flatMap(session=>session.people.map(person=>({id:person.sourceId,name:person.name,position:person.position,type:person.type,date:person.date}))),

      {id:'roster-extra-03',name:'许知行',position:'数据治理岗',type:'持续考察',date:'2026-09-24'},

    const latestRosterDate=upstreamCandidateList.reduce((latest,candidate)=>candidate.date>latest?candidate.date:latest,'');
    const latestRosterCandidates=upstreamCandidateList.filter(candidate=>candidate.date===latestRosterDate);
    if (latestRosterCandidates.length) {
      sessions.push({
        id:`date-${latestRosterDate}`,date:latestRosterDate,start:'09:00',duration:30,type:'招聘/持续考察面试',interviewers:[],evaluationTags:[],note:'',
        people:latestRosterCandidates.map(candidate=>({sourceId:candidate.id,date:candidate.date,name:candidate.name,position:candidate.position,type:candidate.type,status:'waiting',durationMinutes:null,interviewers:[],interviewerDetails:[],evaluationTags:[],note:'',setupSample:true,setupPending:true,startConfigured:false,endConfigured:false,durationConfigured:false}))
      });

    sessions.forEach(session=>session.people.forEach(person=>{

    let activeSession = sessions[0];
    let toastTimer;

    function durationValue(session = activeSession) {
      return Math.max(5, Math.min(180, Math.round(Number(session.duration) || 30)));
    }
    function toMinutes(time) {
      const [hours, minutes] = (time || '09:00').split(':').map(Number);
      return hours * 60 + minutes;
    }
    function toTime(minutes) {
      const normalized = ((minutes % 1440) + 1440) % 1440;
      return `${String(Math.floor(normalized / 60)).padStart(2,'0')}:${String(normalized % 60).padStart(2,'0')}`;
    }
    function timeDifference(start, end) {
      let minutes = toMinutes(end) - toMinutes(start);
      if (minutes <= 0) minutes += 1440;
      return minutes;
    }
    function currentPendingIndex(session = activeSession) {
      return session.people.findIndex(person => person.status !== 'done');
    }
    function refreshSetupPending(person) {
      if (!person.setupSample) return;
      person.setupPending=!((person.interviewers||[]).length>0&&person.startConfigured&&person.endConfigured&&person.durationConfigured);
    }
    function previousPersonOnSameDate(session, index) {
      const orderedRows = sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).flatMap(item=>item.people.map((person,personIndex)=>({session:item,index:personIndex})));
      const currentIndex = orderedRows.findIndex(item=>item.session.id===session.id&&item.index===index);
      const previous = currentIndex > 0 ? orderedRows[currentIndex-1] : null;
      return previous?.session.date===session.date ? previous : null;
    }
    function clearManualTimesAfter(index, session = activeSession) {
      session.people.slice(index + 1).forEach(person => {
        if (person.status === 'done') return;
        delete person.manualStart;
        delete person.manualEnd;
      });
    }
    function recalculate(session = activeSession, shouldRender = true) {
      let cursor = toMinutes(session.start);
      session.people.forEach(person => {
        if (person.status === 'done') {
          person.startTime = person.actualStart;
          person.endTime = person.actualEnd;
          person.durationShown = timeDifference(person.actualStart, person.actualEnd);
          cursor = toMinutes(person.actualEnd);
        } else {
          const start = person.manualStart ? toMinutes(person.manualStart) : cursor;
          const end = person.manualEnd ? toMinutes(person.manualEnd) : start + (Number(person.durationMinutes) || durationValue(session));
          person.startTime = toTime(start);
          person.endTime = toTime(end);
          person.durationShown = timeDifference(person.startTime, person.endTime);
          cursor = end;
        }
      });
      if (shouldRender) renderTable();
    }
    function filteredSessions() {
      const from = $('filterDateFrom').value;
      const to = $('filterDateTo').value;
      return sessions.filter(session => (!from || session.date >= from) && (!to || session.date <= to)).sort((a,b)=>b.date.localeCompare(a.date));
    }
    function renderScheduleSummary() {
      const visible = filteredSessions().flatMap(session => session.people.map(person => ({session,person}))).filter(({person}) => !$('filterType').value || person.type === $('filterType').value);
      const dates = [...new Set(visible.map(item => item.session.date))];
      const sortedDates=[...dates].sort();
      $('scheduleSummary').textContent = `${sortedDates.length ? `${sortedDates[0]}${sortedDates.length > 1 ? ` 至 ${sortedDates[sortedDates.length-1]}` : ''} · ` : ''}筛选结果 ${visible.length} 位面试对象 · 共 ${dates.length} 场`;
    }
    const selectedPeople = new Set();
    sessions.forEach(session => session.people.forEach((person,index) => {
      if (!person.setupPending) person.scoreSummary = ['3A、2A-','1A、1B+、1B、1C+、1C','2A-、3B+'][index % 3];
    }));
    function updateScheduleSelection() {
      const boxes = [...$('scheduleBody').querySelectorAll('[data-select-person]')];

    });
    $('manageBody').addEventListener('click', event => {
      if (event.target.closest('[data-history-search]')) renderHistoryRows();
      if (event.target.closest('[data-history-reset]')) {
        ['historyName','historyDepartment','historyPosition','historyTag'].forEach(id=>$(id).value='');
        renderHistoryRows();
      }
    });
    let draggedTagIndex = null;
    $('manageBody').addEventListener('dragstart', event=>{
      const handle=event.target.closest('.tag-drag-handle');
      const row=handle&&handle.closest('[data-tag-index]');
      if(!row) return;
      draggedTagIndex=Number(row.dataset.tagIndex);
      event.dataTransfer.effectAllowed='move';
      event.dataTransfer.setData('text/plain',String(draggedTagIndex));
    });
    $('manageBody').addEventListener('dragover', event=>{
      const row=event.target.closest('#tagRows [data-tag-index]');
      if(row&&draggedTagIndex!==null) event.preventDefault();
    });
    $('manageBody').addEventListener('drop', event=>{
      const row=event.target.closest('#tagRows [data-tag-index]');
      if(!row||draggedTagIndex===null) return;
      event.preventDefault();
      const targetIndex=Number(row.dataset.tagIndex);
      const [tag]=tagLibrary.splice(draggedTagIndex,1);
      tagLibrary.splice(targetIndex,0,tag);
      draggedTagIndex=null;
      renderTagRows();
    });
    $('manageBody').addEventListener('dragend',()=>{draggedTagIndex=null;});
    let draggedInterviewerRow = null;
    let interviewerDragHandle = null;
    let interviewerDragPointerId = null;
    let interviewerSortPlaceholder = null;
    let interviewerSortGhost = null;
    let interviewerOriginalIndex = -1;
    function createSortGhost(label,clientX,clientY,width) {
      const ghost=document.createElement('div');
      ghost.className='sort-drag-ghost';
      ghost.textContent=label;
      ghost.style.width=`${Math.min(Math.max(width,150),360)}px`;
      ghost.style.left=`${clientX+12}px`;
      ghost.style.top=`${clientY+12}px`;
      document.body.appendChild(ghost);
      return ghost;
    }
    function moveSortGhost(ghost,event) {
      ghost.style.left=`${event.clientX+12}px`;
      ghost.style.top=`${event.clientY+12}px`;
    }
    function finishInterviewerReorder() {
      if (!draggedInterviewerRow) return;
      if (interviewerSortPlaceholder?.parentElement) {
        interviewerSortPlaceholder.parentElement.insertBefore(draggedInterviewerRow,interviewerSortPlaceholder);
        interviewerSortPlaceholder.remove();
      }
      const rows=[...$('manageBody').querySelectorAll('tr[data-interviewer-row]')];
      rows.forEach((row,index)=>{
        row.dataset.index=String(index);
        row.querySelector('[data-remove-interviewer]').dataset.removeInterviewer=String(index);
      });
      draggedInterviewerRow.classList.remove('dragging');
      if (interviewerDragHandle?.hasPointerCapture?.(interviewerDragPointerId)) interviewerDragHandle.releasePointerCapture(interviewerDragPointerId);
      interviewerSortGhost?.remove();
      const newIndex=rows.indexOf(draggedInterviewerRow);
      const changed=newIndex!==interviewerOriginalIndex;
      draggedInterviewerRow=null;
      interviewerDragHandle=null;
      interviewerDragPointerId=null;
      interviewerSortPlaceholder=null;
      interviewerSortGhost=null;
      interviewerOriginalIndex=-1;
      capturePersonDraft();
      if (changed) showToast('面试官顺序已调整');
    }
    $('manageBody').addEventListener('pointerdown',event=>{
      const handle=event.target.closest('.interviewer-drag-handle');
      const row=handle?.closest('tr[data-interviewer-row]');
      if (!handle||!row) return;
      event.preventDefault();
      capturePersonDraft();
      const rect=row.getBoundingClientRect();
      draggedInterviewerRow=row;
      interviewerDragHandle=handle;
      interviewerDragPointerId=event.pointerId;
      interviewerOriginalIndex=Number(row.dataset.index);
      interviewerSortPlaceholder=document.createElement('tr');
      interviewerSortPlaceholder.className='sort-placeholder interviewer-sort-placeholder';
      interviewerSortPlaceholder.innerHTML='<td colspan="5">放到此处</td>';
      interviewerSortPlaceholder.style.height=`${rect.height}px`;
      row.parentElement.insertBefore(interviewerSortPlaceholder,row);
      row.classList.add('dragging');
      handle.setPointerCapture?.(event.pointerId);
      row.remove();
      interviewerSortGhost=createSortGhost(`面试官：${row.dataset.interviewerName}`,event.clientX,event.clientY,rect.width*.45);
    });
    document.addEventListener('pointermove',event=>{
      if (!draggedInterviewerRow||event.pointerId!==interviewerDragPointerId) return;
      event.preventDefault();
      moveSortGhost(interviewerSortGhost,event);
      const target=document.elementFromPoint(event.clientX,event.clientY)?.closest('tr[data-interviewer-row]');
      if (!target||target.parentElement!==interviewerSortPlaceholder.parentElement) return;
      const bounds=target.getBoundingClientRect();
      const insertBefore=event.clientY<bounds.top+bounds.height/2;
      if (insertBefore&&interviewerSortPlaceholder.nextElementSibling!==target) target.parentElement.insertBefore(interviewerSortPlaceholder,target);
      else if (!insertBefore&&target.nextElementSibling!==interviewerSortPlaceholder) target.parentElement.insertBefore(interviewerSortPlaceholder,target.nextSibling);
    },{passive:false});
    document.addEventListener('pointerup',event=>{if(draggedInterviewerRow&&event.pointerId===interviewerDragPointerId)finishInterviewerReorder();});
    document.addEventListener('pointercancel',event=>{if(draggedInterviewerRow&&event.pointerId===interviewerDragPointerId)finishInterviewerReorder();});
    $('manageFoot').addEventListener('click',event=>{
      if (event.target.closest('[data-manage-cancel]')) { closeManage();return; }
      if (event.target.closest('[data-save-person]')) { savePersonEditor();return; }
    });
    $('manageClose').addEventListener('click', closeManage);
    $('manageBackdrop').addEventListener('click', event=>{ if(event.target===$('manageBackdrop')) closeManage(); });
    $('applyTimeEdit').addEventListener('click', applyTimeEditor);
    $('cancelTimeEdit').addEventListener('click', closeTimeEditor);
    $('closeTimePopover').addEventListener('click', closeTimeEditor);
    document.addEventListener('click', event => {
      if (!$('timePopover').hidden && !$('timePopover').contains(event.target) && !event.target.closest('[data-time-edit]')) closeTimeEditor();
      if (!event.target.closest('.reuse-control')) $('scheduleBody').querySelectorAll('[data-reuse-menu]').forEach(menu=>menu.hidden=true);
      if (!event.target.closest('.tag-select')) $('manageBody').querySelectorAll('[data-tag-panel]').forEach(panel=>panel.hidden=true);
      if (!event.target.closest('.interviewer-picker')) {
        $('manageBody').querySelectorAll('[data-interviewer-picker-panel]').forEach(panel=>panel.hidden=true);
        $('manageBody').querySelectorAll('[data-interviewer-picker-trigger]').forEach(trigger=>trigger.setAttribute('aria-expanded','false'));
      }
    });
    function repositionOpenReuseMenus() {
      $('scheduleBody').querySelectorAll('[data-reuse-menu]:not([hidden])').forEach(menu=>{
        if (menu._anchorTrigger?.isConnected) {
          positionReuseMenu(menu._anchorTrigger,menu);
          const sourceTrigger=menu.querySelector('[data-reuse-source-trigger]');
          const sourcePanel=menu.querySelector('[data-reuse-source-panel]');
          if (sourceTrigger&&!sourcePanel.hidden) positionReuseSourcePanel(sourceTrigger,sourcePanel);
        }
        else menu.hidden=true;
      });
    }
    document.addEventListener('scroll',repositionOpenReuseMenus,true);
    window.addEventListener('resize',repositionOpenReuseMenus);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeTimeEditor(); closeManage(); } });
    let scheduleDrag = null;
    function finishScheduleReorder() {
      if (!scheduleDrag) return;
      const drag=scheduleDrag;
      if (drag.placeholder.parentElement) {
        drag.placeholder.parentElement.insertBefore(drag.row,drag.placeholder);
        drag.placeholder.remove();
      }
      drag.row.classList.remove('dragging');
      drag.ghost.remove();
      if (drag.handle.hasPointerCapture?.(drag.pointerId)) drag.handle.releasePointerCapture(drag.pointerId);
      scheduleDrag=null;
      if (drag.targetIndex===null) return;
      const session=drag.session;
      const targetPerson=session.people[drag.targetIndex];
      if (!targetPerson||targetPerson===drag.person||targetPerson.status==='done') return;
      const insertionIndex=drag.insertBefore?drag.targetIndex:drag.targetIndex+1;
      const destination=drag.from<insertionIndex?insertionIndex-1:insertionIndex;
      if (destination===drag.from) return;
      session.people.splice(drag.from,1);
      session.people.splice(destination,0,drag.person);
      session.people.forEach(person=>{
        if (person.status!=='done') { delete person.manualStart;delete person.manualEnd; }
      });
      activateSession(session.id);
      recalculate(session);
      showToast('面试顺序已调整，后续时间已自动重排');
    }
    $('scheduleBody').addEventListener('pointerdown',event=>{
      const handle=event.target.closest('.drag-handle');
      const row=handle?.closest('tr[data-index][data-session-id]');
      const session=row&&sessions.find(item=>item.id===row.dataset.sessionId);
      const person=session?.people[Number(row?.dataset.index)];
      if (!handle||!row||!session||!person||person.status==='done') return;
      event.preventDefault();
      const rect=row.getBoundingClientRect();
      const placeholder=document.createElement('tr');
      placeholder.className='sort-placeholder schedule-sort-placeholder';
      placeholder.innerHTML='<td colspan="11">放到此处</td>';
      placeholder.style.height=`${rect.height}px`;
      row.parentElement.insertBefore(placeholder,row);
      handle.setPointerCapture?.(event.pointerId);
      row.classList.add('dragging');
      row.remove();
      const ghost=createSortGhost(`${Number(row.dataset.index)+1}. ${person.name} · ${person.type}`,event.clientX,event.clientY,Math.min(rect.width*.42,340));
      scheduleDrag={session,person,row,handle,placeholder,ghost,pointerId:event.pointerId,from:Number(row.dataset.index),targetIndex:null,insertBefore:true};
    });
    document.addEventListener('pointermove',event=>{
      const drag=scheduleDrag;
      if (!drag||event.pointerId!==drag.pointerId) return;
      event.preventDefault();
      moveSortGhost(drag.ghost,event);
      const target=document.elementFromPoint(event.clientX,event.clientY)?.closest('tr[data-index][data-session-id]');
      if (!target||target.dataset.sessionId!==drag.session.id) return;
      const targetIndex=Number(target.dataset.index);
      const targetPerson=drag.session.people[targetIndex];
      if (!targetPerson||targetPerson.status==='done') return;
      const bounds=target.getBoundingClientRect();
      const insertBefore=event.clientY<bounds.top+bounds.height/2;
      drag.targetIndex=targetIndex;
      drag.insertBefore=insertBefore;
      if (insertBefore&&drag.placeholder.nextElementSibling!==target) target.parentElement.insertBefore(drag.placeholder,target);
      else if (!insertBefore&&target.nextElementSibling!==drag.placeholder) target.parentElement.insertBefore(drag.placeholder,target.nextSibling);
    },{passive:false});
    document.addEventListener('pointerup',event=>{if(scheduleDrag&&event.pointerId===scheduleDrag.pointerId)finishScheduleReorder();});
    document.addEventListener('pointercancel',event=>{if(scheduleDrag&&event.pointerId===scheduleDrag.pointerId)finishScheduleReorder();});
    $('toggleMenu').addEventListener('click', () => {
      const collapsed = document.body.classList.toggle('menu-collapsed');
      $('toggleMenu').setAttribute('aria-label', collapsed ? '展开菜单' : '收起菜单');
      $('toggleMenu').setAttribute('title', collapsed ? '展开菜单' : '收起菜单');
    });

    sessions.forEach(session=>recalculate(session,false));
    const latestInterviewDate=sessions.reduce((latest,session)=>session.date>latest?session.date:latest,'');
    if (latestInterviewDate) { $('filterDateFrom').value=latestInterviewDate;$('filterDateTo').value=latestInterviewDate; }
    renderTable();
  </script>
</body>
</html>
