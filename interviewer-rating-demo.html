function openInterviewerMenu(){const menu=$('interviewerMenu');positionInterviewerMenu();if(typeof menu.showPopover==='function'){if(!menu.matches(':popover-open'))menu.showPopover();}else menu.hidden=false;$('interviewerTrigger').setAttribute('aria-expanded','true');}
$('interviewerMenu').addEventListener('beforetoggle',event=>{$('interviewerTrigger').setAttribute('aria-expanded',String(event.newState==='open'));if(event.newState==='open')positionInterviewerMenu();});
$('interviewerMenu').addEventListener('toggle',event=>$('interviewerTrigger').setAttribute('aria-expanded',String(interviewerMenuOpen())));
$('interviewerTrigger').addEventListener('click',event=>{if(typeof $('interviewerMenu').showPopover!=='function'){event.preventDefault();if(interviewerMenuOpen())closeInterviewerMenu();else openInterviewerMenu();}});
$('interviewerTrigger').addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();openInterviewerMenu();const options=[...$('interviewerMenu').querySelectorAll('[data-interviewer]')];const active=options.findIndex(option=>option.getAttribute('aria-selected')==='true');options[Math.max(0,active)]?.focus();}else if(event.key==='Escape'&&interviewerMenuOpen()){event.preventDefault();event.stopPropagation();closeInterviewerMenu();}});
$('interviewerMenu').addEventListener('keydown',event=>{const options=[...$('interviewerMenu').querySelectorAll('[data-interviewer]')],index=options.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();const target=event.key==='Home'?0:event.key==='End'?options.length-1:(index+(event.key==='ArrowDown'?1:-1)+options.length)%options.length;options[target]?.focus();}else if(event.key==='Escape'){event.preventDefault();event.stopPropagation();closeInterviewerMenu();$('interviewerTrigger').focus();}});
$('interviewerMenu').addEventListener('click',event=>{const option=event.target.closest('[data-interviewer]');if(!option)return;const select=$('interviewerSelect');select.value=option.dataset.interviewer;select.dispatchEvent(new Event('change',{bubbles:true}));closeInterviewerMenu();$('interviewerTrigger').focus();});
document.addEventListener('pointerdown',event=>{if(interviewerMenuOpen()&&!event.target.closest('.interviewer-picker'))closeInterviewerMenu();});window.addEventListener('resize',closeInterviewerMenu);$('settingsTools').addEventListener('scroll',closeInterviewerMenu);

init();
</script>
</body>
</html>
