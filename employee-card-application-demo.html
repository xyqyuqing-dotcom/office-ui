<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const watermark=`<svg xmlns="http://www.w3.org/2000/svg" width="270" height="220"><g transform="translate(88 108) rotate(-30)" fill="#f3f3f3" font-family="Microsoft YaHei,Arial"><text text-anchor="middle" font-size="21">谢雨晴</text><text y="20" text-anchor="middle" font-size="12">22187</text></g></svg>`;
document.documentElement.style.setProperty('--watermark',`url("data:image/svg+xml,${encodeURIComponent(watermark)}")`);
const steps=['【发起人】起草','主管审批','【工卡管理人】办理','【人像卡管理人】人像卡照片导出','【工卡执行人】办理','【工卡桌面运维组】办理','【电梯卡管理人】办理','申请人确认','【新员工入职协调人】办理入职','【工卡管理人】办理','【人像卡管理人】人像卡照片导出','【工卡执行人】办理','【工卡桌面运维组】办理','【电梯卡管理人】办理','【工位分配人】或签'];
steps.forEach(text=>{const li=document.createElement('li');li.textContent=text;$('#timeline').append(li)});
const state={type:'new',drafts:{},files:{new:[],temp:[],lost:[]},urls:[]};
const empty=`<div class="empty"><svg viewBox="0 0 80 70" aria-hidden="true"><defs><linearGradient id="boxgrad" x2="1" y2="1"><stop stop-color="#e9f5ff"/><stop offset="1" stop-color="#c8e6ff"/></linearGradient></defs><ellipse cx="40" cy="61" rx="22" ry="3" fill="#f7fafc"/><path d="m23 30 18 6 18-6-18-7z" fill="#e0f0fc"/><path d="m23 30 18 7v23l-18-9z" fill="url(#boxgrad)"/><path d="m41 37 18-7v23l-18 7z" fill="#edf7ff"/><path d="m23 30-9 9 19 7 8-9m0 0 10 9 17-10-9-6" fill="#a9d8ff"/><path d="m29 19 18-5-6 13-7-5-9 2 4-5" fill="#e5edf3"/><path d="m34 22 13-8-6 13" fill="#c9dbe7"/><circle cx="16" cy="23" r="4" fill="#9bd2ff"/><circle cx="68" cy="49" r="2" fill="#72bbff"/><path d="M25 53v9m6-5v7" stroke="#e3edf4" stroke-width="3"/></svg><span>暂无数据</span></div>`;
const printer=`<section class="section printer"><h2>激活打印机说明</h2><p>获得新工卡后，员工可以自行在打印机上激活打印权限：</p><p>用户ID：员工工号</p><p>初始密码：1234</p></section>`;
const attachment=type=>`<section class="section attachments"><h2>附件</h2><div class="attachment-intro">请上传以下材料:<br>${type==='lost'?'正装头像照<span style="color:#647bff">*</span>':'<a href="#" class="download-template">员工安全承诺书（点击下载）*</a>'}</div><div class="upload-line"><span>点击下载发起人上传的文件</span><button type="button" class="upload-button" id="upload"><svg class="icon"><use href="#upload-icon"/></svg>上传附件</button><input type="file" id="fileInput" multiple hidden></div><table class="file-table"><thead><tr><th>文件名</th><th>操作</th></tr></thead><tbody id="files"></tbody></table><div id="emptyFiles">${empty}</div></section>`;
const option=(name,value,text,extra='',type='radio')=>`<label class="option ${name==='newCard'?'circle-check':''}"><input type="${type}" name="${name}" value="${value}" ${extra}>${text}</label>`;
const area=(name,max)=>`<div class="text-area"><textarea name="${name}" maxlength="${max}" placeholder="请输入" aria-label="${name==='reason'?'办理原因':'备注'}"></textarea><span class="counter">0 / ${max}</span></div>`;
function receipt(){return `<div class="receipt-fields" id="receiptFields" hidden><div class="field-label required">收卡地点</div><div class="options-inline">${option('receiptPlace','bohua','博华')}${option('receiptPlace','liyuan','利园')}${option('receiptPlace','support','后援中心')}${option('receiptPlace','other','其他')}</div><label class="field receipt-other" id="receiptOther" hidden><span class="required">自定义收卡地点</span><input name="receiptOther" aria-label="自定义收卡地点" placeholder="请输入具体收卡地点" maxlength="100"></label><div class="error" id="receiptError" role="alert" hidden></div></div>`;}
function markup(type){
if(type==='new')return `<section class="section onboarding"><h2>办理内容</h2><div class="field-label">需办理的卡片（仅上海地区入职新员工办理）</div>${option('newCard','work','工卡（功能：打印、门禁）','checked disabled','checkbox')}${option('newCard','meal','餐饮积点卡','checked disabled','checkbox')}${option('newCard','portrait','人像卡','checked disabled','checkbox')}${option('newCard','bohua','博华电梯卡（电子门禁）','disabled','checkbox')}${option('newCard','liyuan','利园电梯卡','','checkbox')}<div class="desk"><div>是否需要安排工位?</div><div class="options-inline">${option('desk','yes','是')}${option('desk','no','否','checked')}</div></div>${receipt()}</section>${attachment(type)}`;
if(type==='lost')return `<section class="section replacement"><h2>办理内容</h2><div class="field-label required">需要办理的卡片</div>${option('lostCard','work','工卡 <span class="hint">功能：打印、门禁</span>','checked','checkbox')}${option('lostCard','meal','餐饮积点卡','','checkbox')}${option('lostCard','bohua','博华电梯卡 <span class="hint">需要支付50元卡费（代博华物业收），原卡将报备博华物业注销</span>','','checkbox')}${option('lostCard','liyuan','利园电梯卡 <span class="hint">需要支付60元卡费（代利园物业收），原卡将报备利园物业注销</span>','','checkbox')}${option('lostCard','portrait','人像卡','','checkbox')}${receipt()}</section><div id="portraitAttachment" hidden>${attachment(type)}</div>`;
if(type==='temp')return `<section class="section temporary-cards"><h2>办理内容</h2><div class="options-inline">${option('tempCard','bohua','博华电梯卡（押金100元）')}${option('tempCard','liyuan','利园电梯卡（押金100元）')}${option('tempCard','work','工卡（仅门禁和打印权限）')}</div>${receipt()}</section><section class="section staff-type"><h2>员工类型</h2><div class="field-label required">临时人员属性</div><div class="options-inline">${option('staff','intern','实习')}${option('staff','exchange','交流')}${option('staff','outsource','外包驻场员工')}</div></section><section class="section applicant"><h2>申请人信息</h2><div class="grid"><label class="field span3"><span class="required">申请部门</span><div class="select-wrap"><input name="department" aria-label="申请部门" placeholder="请输入" autocomplete="off" role="combobox" aria-expanded="false"><div class="department-menu" hidden><button type="button" data-department="信息技术部">信息技术部</button><div>可直接输入申请部门</div></div></div></label><label class="field"><span class="required">申请人姓名</span><input name="applicantName" placeholder="请输入"></label><label class="field"><span>申请人工号（如有）</span><input name="employeeId" placeholder="请输入"></label><label class="field"><span class="required">开始时间</span><div class="date-wrap"><input name="startDate" aria-label="开始时间" placeholder="请选择" type="text" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'"></div></label><label class="field"><span class="required">结束时间</span><div class="date-wrap"><input name="endDate" aria-label="结束时间" placeholder="请选择" type="text" disabled onfocus="this.type='date'" onblur="if(!this.value)this.type='text'"></div><span class="error" id="dateError" hidden>结束时间不能早于开始时间</span></label><label class="field"><span>时长（天）<i class="help" title="根据开始时间和结束时间自动计算，含首尾当天">?</i></span><input name="duration" disabled aria-label="时长（天）"></label><label class="field span3"><span>备注</span>${area('remark',100)}</label></div></section>${attachment(type)}`;
return `<section class="section special"><h2>办理内容</h2><div class="field-label required">需要办理的卡片</div>${option('specialCard','bohua','博华电梯卡（电子门禁可联系陈梅雯老师申请）','disabled')}${option('specialCard','liyuan','利园电梯卡','checked')}<div class="reason"><div class="field-label required">办理原因</div>${area('reason',200)}</div></section>`;
}
function saveDraft(){state.drafts[state.type]=$$('#dynamicFields input:not([type=file]),#dynamicFields textarea,#dynamicFields select').map(el=>({name:el.name,value:el.value,checked:el.checked,type:el.type}));}
function render(type){state.type=type;$('#dynamicFields').innerHTML=markup(type);const saved=state.drafts[type];if(saved)for(const item of saved){const el=$$('#dynamicFields input,#dynamicFields textarea,#dynamicFields select').find(el=>el.name===item.name&&(!['radio','checkbox'].includes(item.type)||el.value===item.value));if(el){if(['radio','checkbox'].includes(item.type))el.checked=item.checked;else el.value=item.value;}}if(type==='new')$$('[name=newCard][value=work],[name=newCard][value=meal]').forEach(el=>el.checked=true);$$('.text-area textarea').forEach(updateCounter);if(type==='temp')updateDates();if($('#files'))renderFiles();window.cardWorkflow?.onRender();}
function updateCounter(el){el.nextElementSibling.textContent=`${el.value.length} / ${el.maxLength}`;}
function updateDates(){const start=$('[name=startDate]'),end=$('[name=endDate]'),duration=$('[name=duration]');end.disabled=!start.value;end.min=start.value;duration.value='';const invalid=!!(start.value&&end.value&&end.value<start.value);$('#dateError').hidden=!invalid;if(start.value&&end.value&&!invalid)duration.value=Math.round((new Date(end.value+'T00:00:00')-new Date(start.value+'T00:00:00'))/86400000)+1;}
function renderFiles(){const list=state.files[state.type]||[];$('#files').replaceChildren();$('#emptyFiles').hidden=list.length>0;list.forEach((entry,index)=>{const tr=document.createElement('tr'),td=document.createElement('td'),ops=document.createElement('td'),link=document.createElement('a');link.href=entry.url;link.download=entry.file.name;link.textContent=entry.file.name;td.append(link);const remove=document.createElement('button');remove.type='button';remove.textContent='删除';remove.setAttribute('aria-label','删除 '+entry.file.name);remove.onclick=()=>{URL.revokeObjectURL(entry.url);list.splice(index,1);renderFiles()};ops.append(remove);tr.append(td,ops);$('#files').append(tr)})}
let toastTimer;function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2400)}
function showModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('open');$('#closeModal').focus()}
$('#application').addEventListener('change',e=>{if(e.target.name==='applicationType'){saveDraft();render(e.target.value)}if(['startDate','endDate'].includes(e.target.name))updateDates();if(e.target.id==='fileInput'){for(const file of e.target.files){const list=state.files[state.type];if(!list.some(entry=>entry.file.name===file.name&&entry.file.size===file.size)){list.push({file,url:URL.createObjectURL(file)})}}renderFiles();e.target.value='';}});
$('#application').addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA')updateCounter(e.target)});
$('#application').addEventListener('click',e=>{if(e.target.closest('#upload'))$('#fileInput').click();if(e.target.closest('.download-template')){e.preventDefault();toast('截图中未提供承诺书原文件，请使用正式模板。')}if(e.target.name==='department'){const menu=$('.department-menu');menu.hidden=!menu.hidden;e.target.setAttribute('aria-expanded',String(!menu.hidden));}if(e.target.dataset.department){$('[name=department]').value=e.target.dataset.department;$('.department-menu').hidden=true;$('[name=department]').setAttribute('aria-expanded','false');}});
document.addEventListener('click',e=>{if(!e.target.closest('.select-wrap')&&$('.department-menu')){$('.department-menu').hidden=true;$('[name=department]').setAttribute('aria-expanded','false')}});
$$('.segmented button').forEach(btn=>btn.onclick=()=>{$$('.segmented button').forEach(b=>{b.classList.toggle('active',b===btn);b.setAttribute('aria-pressed',String(b===btn))})});
$('#collapse').onclick=()=>{const collapsed=$('#workspace').classList.toggle('collapsed');$('#collapse').textContent=collapsed?'◂':'▸';$('#collapse').setAttribute('aria-label',collapsed?'展开流程记录':'收起流程记录');$('#collapse').setAttribute('aria-expanded',String(!collapsed))};
$('#flowDiagram').onclick=()=>showModal('流程图',`<div class="flow-chart">${steps.map((s,i)=>`${i?'<div class="flow-arrow">↓</div>':''}<div class="flow-node">${s}</div>`).join('')}</div><p style="color:#999;font-size:12px;text-align:center">按截图中可见的流程记录展示</p>`);
function closeModal(){$('#modal').classList.remove('open')}$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$$('[data-action]').forEach(btn=>btn.onclick=()=>{const action=btn.dataset.action;if(action==='top'){$('#mainScroll').scrollTop=0;window.scrollTo(0,0)}else if(action==='settings'){showModal('设置','<label class="settings-label"><input id="toggleWatermark" type="checkbox" checked>显示页面水印</label>');$('#toggleWatermark').checked=!document.body.classList.contains('no-watermark');$('#toggleWatermark').onchange=e=>{document.body.classList.toggle('no-watermark',!e.target.checked);$$('.watermarked').forEach(el=>el.style.setProperty('--watermark',e.target.checked?`url("data:image/svg+xml,${encodeURIComponent(watermark)}")`:'none'))};}else toast(action==='center'?'当前为本地页面原型':'暂无新消息')});
window.cardPrototype={state,saveDraft,render,toast,showModal,closeModal,printer};
render('new');
})();
</script>

<script>
(()=>{
'use strict';
const app=window.cardPrototype,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const model={stage:'applicant',terminal:'',assignee:'',cardNumber:'',synced:false,nodeOpinion:'',executorOpinion:'',elevatorCard:'',elevatorOpinion:'',bohuaFeePaid:false,liyuanFeePaid:false,events:[]};
const storageKey='employee-card-prototype-v2';
const names={applicant:'发起人',executor:'工卡执行人',desktop:'桌面运维组',elevator:'电梯卡管理人',next:'后续节点（演示终点）',void:'已作废'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const selected=value=>!!$(`#dynamicFields input[name$="Card"][value="${value}"]:checked`);
const hasLiyuan=()=>selected('liyuan');
const feeItems=()=>app.state.type==='lost'?[...(selected('bohua')?[{key:'bohuaFeePaid',text:'已收取50元博华电梯卡费'}]:[]),...(hasLiyuan()?[{key:'liyuanFeePaid',text:'已收取60元利园电梯卡费'}]:[])]:[];
const needsElevator=()=>hasLiyuan()||feeItems().length>0;
const elevatorCards=[{value:'LY-001',label:'利园电梯卡 LY-001（演示）'},{value:'LY-002',label:'利园电梯卡 LY-002（演示）'},{value:'LY-003',label:'利园电梯卡 LY-003（演示）'}];
const needsReceipt=()=>selected('work')||selected('meal');
const hasMeal=()=>['new','lost'].includes(app.state.type)&&selected('meal');
function updateReceipt(){const block=$('#receiptFields');if(!block)return;block.hidden=!needsReceipt();const other=$('[name=receiptPlace]:checked')?.value==='other';$('#receiptOther').hidden=!other;$$('[name=receiptPlace]').forEach(el=>el.required=needsReceipt());$('[name=receiptOther]').required=needsReceipt()&&other;}
function validateReceipt(){updateReceipt();if(!needsReceipt())return true;const choice=$('[name=receiptPlace]:checked'),text=$('[name=receiptOther]');const message=!choice?'请选择收卡地点':choice.value==='other'&&!text.value.trim()?'请输入具体收卡地点':'';$('#receiptError').textContent=message;$('#receiptError').hidden=!message;$('#receiptFields').classList.toggle('invalid',!!message);if(message){$('#receiptFields').scrollIntoView({block:'center',behavior:'instant'});(choice?.value==='other'?text:$('[name=receiptPlace]')).focus();app.toast(message)}return !message;}
function nodeDraft(){if($('#mealCardNumber'))model.cardNumber=$('#mealCardNumber').value;if($('#syncedSecurities'))model.synced=$('#syncedSecurities').checked;if($('#nodeOpinion'))model.nodeOpinion=$('#nodeOpinion').value;if($('#elevatorCardSelect'))model.elevatorCard=$('#elevatorCardSelect').value;for(const fee of feeItems()){const el=$('#'+fee.key);if(el)model[fee.key]=el.checked;}}
function validateMeal(){if(!hasMeal())return true;nodeDraft();const invalid=!model.cardNumber.trim();$('#cardNumberError').textContent=invalid?'请填写餐饮积点卡卡号':'';$('#mealCardNumber').classList.toggle('bad',invalid);$('#syncError').textContent=!model.synced?'请确认“已同步证券 - 是”':'';if(invalid||!model.synced){$('#desktopNode').scrollIntoView({block:'center',behavior:'instant'});(invalid?$('#mealCardNumber'):$('#syncedSecurities')).focus();app.toast(invalid?'请填写餐饮积点卡卡号':'请先确认已同步证券');return false}return true;}
function validateElevator(){if(!hasLiyuan())return true;nodeDraft();if(!elevatorCards.some(card=>card.value===model.elevatorCard)){$('#elevatorCardError').textContent='请选择电梯卡';$('#elevatorNode').scrollIntoView({block:'center',behavior:'instant'});$('#elevatorCardSelect').focus();app.toast('请选择要分配的电梯卡');return false}return true;}
function updateTimeline(){const mapping={applicant:0,executor:4,desktop:5,elevator:6};$$('#timeline>li:not(.demo-record)').forEach((li,i)=>li.classList.toggle('current',!model.terminal&&i===mapping[model.stage]));$$('.demo-record').forEach(el=>el.remove());for(const event of [...model.events].reverse()){const li=document.createElement('li');li.className='demo-record';const title=document.createElement('div'),tag=document.createElement('span');tag.className='record-tag';tag.textContent=event.action;title.append(tag,document.createTextNode(event.title));const detail=document.createElement('div');detail.className='record-detail';detail.textContent=event.detail;li.append(title,detail);$('#timeline').prepend(li);}}
function renderNode(){const editable=model.stage==='desktop'&&!model.terminal;let html='';
if((['desktop','elevator'].includes(model.stage)||model.terminal==='next')&&hasMeal())html=`<section class="section node-panel" id="desktopNode"><h2>餐饮积点卡</h2><div class="node-grid"><label class="field"><span class="required">餐饮积点卡卡号</span><input id="mealCardNumber" type="text" placeholder="请输入卡号" value="${esc(model.cardNumber)}" ${editable?'':'disabled'} aria-label="餐饮积点卡卡号"><small class="error" id="cardNumberError" role="alert"></small></label><div class="field"><span class="required">已同步证券</span><label class="option sync-line"><input type="checkbox" id="syncedSecurities" ${model.synced?'checked':''} ${editable?'':'disabled'}>是</label><small class="error" id="syncError" role="alert"></small></div></div></section>`;
if(model.stage==='elevator'&&needsElevator())html+=`<section class="section elevator-panel" id="elevatorNode"><h2>分配电梯卡</h2>${hasLiyuan()?`<label class="field"><span class="required">选择电梯卡</span><select id="elevatorCardSelect" aria-label="选择电梯卡" required ${model.terminal?'disabled':''}><option value="">请选择</option>${elevatorCards.map(card=>`<option value="${card.value}" ${model.elevatorCard===card.value?'selected':''}>${esc(card.label)}</option>`).join('')}</select><span class="error" id="elevatorCardError" role="alert"></span></label><a href="#" class="elevator-system-link" id="elevatorSystemLink">点击进入电梯卡管理系统</a>`:''}${feeItems().length?`<div class="elevator-fees">${feeItems().map(fee=>`<label class="option"><input type="checkbox" id="${fee.key}" ${model[fee.key]?'checked':''} ${model.terminal?'disabled':''}>${fee.text}</label>`).join('')}</div>`:''}</section>`;
if(model.terminal==='void')html='<div class="status-banner voided" role="status">本次演示申请已作废。可点击“重新演示”再次体验。</div>';
$('#nodeFields').innerHTML=html;}
function updatePrinter(){$('#printerSlot').innerHTML=selected('work')?app.printer:'';}
function updatePortraitAttachment(){const block=$('#portraitAttachment');if(block)block.hidden=!(app.state.type==='lost'&&selected('portrait'));}
function updateStage(){updatePortraitAttachment();const locked=model.stage!=='applicant'||!!model.terminal;$('#baseFields').disabled=locked;$$('.segmented button').forEach(el=>el.disabled=locked);const select=$('#demoStage');for(const value of ['next','void'])if(!select.querySelector(`option[value="${value}"]`)){const option=document.createElement('option');option.value=value;option.textContent=names[value];option.disabled=true;select.append(option)}select.value=model.terminal||model.stage;$('#stageHint').textContent=model.terminal==='next'?`${names[model.stage]}已完成审批，可重新演示其他申请场景`:model.terminal==='void'?'申请已作废':model.stage==='applicant'?'填写申请后，点击底部“提交”开始演示':model.stage==='executor'?'提交时必须选择桌面运维组处理人':model.stage==='elevator'?(feeItems().length?'办理电梯卡补办，并确认收款':hasLiyuan()?'请选择并分配利园电梯卡':'本次申请未选择利园电梯卡，无需分配'):hasMeal()?'填写餐饮积点卡卡号，并确认已同步证券':'本次申请不涉及餐饮积点卡';$('#submitFlow').disabled=!!model.terminal;$('#voidFlow').disabled=!!model.terminal;renderNode();updateTimeline();updatePrinter();}
window.cardWorkflow={onRender(){updateReceipt();updateStage();}};
function log(action,title,detail=''){const time=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});model.events.push({action,title,detail:detail?`${detail} · ${time}`:time});}
function changeStage(stage){nodeDraft();model.terminal='';model.stage=stage;updateStage();app.toast(`已切换到${names[stage]}节点`);if(stage!=='applicant')$('#nodeFields').scrollIntoView({block:'center',behavior:'instant'})}
function approvalModal(){nodeDraft();if(model.terminal)return;if(!validateReceipt())return;if(model.stage==='desktop'&&!validateMeal())return;if(model.stage==='elevator'&&!validateElevator())return;const executor=model.stage==='executor';const applicant=model.stage==='applicant';
const summary=applicant?'确认提交后，将进入工卡执行人节点（本地演示）。':executor?'':model.stage==='elevator'?(hasLiyuan()?`已分配电梯卡：${esc(model.elevatorCard)}`:'本次申请未选择利园电梯卡'):hasMeal()?`餐饮积点卡卡号：${esc(model.cardNumber)}　｜　已同步证券：是`:'本次申请不涉及餐饮积点卡';
app.showModal(applicant?'提交申请':'提交审批',`<div class="approval-fields">${summary?`<div class="approval-summary">${summary}</div>`:''}${executor?`<label class="field"><span class="required">桌面运维组处理人</span><select id="desktopAssignee" aria-label="桌面运维组处理人" required><option value="">请选择</option><option value="桌面运维人员A（演示）">桌面运维人员A（演示）</option><option value="桌面运维人员B（演示）">桌面运维人员B（演示）</option></select><span class="validation-message" id="assigneeError" role="alert"></span></label>`:''}<label class="field"><span>审核意见</span><textarea id="approvalOpinion" maxlength="500" placeholder="请输入">${esc(model.stage==='desktop'?model.nodeOpinion:model.stage==='executor'?model.executorOpinion:model.stage==='elevator'?model.elevatorOpinion:'')}</textarea></label><div class="validation-message" id="approvalError" role="alert"></div></div><div class="approval-footer"><button type="button" class="confirm-button" id="confirmApproval">${applicant?'确认提交':'确认同意'}</button></div>`);$('#modal').classList.add('approval-modal');if(executor)$('#desktopAssignee').value=model.assignee;
if(executor)$('#desktopAssignee').onchange=()=>{$('#assigneeError').textContent=''};
$('#confirmApproval').onclick=()=>{if(model.terminal)return;if(executor&&!$('#desktopAssignee').value){$('#assigneeError').textContent='请选择桌面运维组处理人';$('#desktopAssignee').focus();return}if(!validateReceipt()){app.closeModal();return}if(model.stage==='desktop'&&!validateMeal()){app.closeModal();return}if(model.stage==='elevator'&&!validateElevator()){app.closeModal();return}const opinion=$('#approvalOpinion').value.trim();if(applicant){log('提交','【发起人】提交申请',opinion||'进入工卡执行人节点');model.stage='executor'}else if(executor){model.assignee=$('#desktopAssignee').value;model.executorOpinion=opinion;log('同意','【工卡执行人】办理',`已选择${model.assignee}${opinion?'；'+opinion:''}`);model.stage='desktop'}else if(model.stage==='desktop'){model.nodeOpinion=opinion;log('同意','【工卡桌面运维组】办理',hasMeal()?`卡号 ${model.cardNumber}；已同步证券：是${opinion?'；'+opinion:''}`:opinion||'已完成办理');if(needsElevator())model.stage='elevator';else model.terminal='next'}else{model.elevatorOpinion=opinion;log('同意','【电梯卡管理人】办理',hasLiyuan()?`已分配电梯卡 ${model.elevatorCard}${opinion?'；'+opinion:''}`:opinion||'无需分配利园电梯卡');model.terminal='next'}app.closeModal();updateStage();app.toast(model.terminal?`${names[model.stage]}审批通过，已转交后续节点`:`已提交至${names[model.stage]}`);$('#nodeFields').scrollIntoView({block:'center',behavior:'instant'})};
}
$('#submitFlow').onclick=approvalModal;
$('#demoStage').onchange=e=>changeStage(e.target.value);
$('#application').addEventListener('change',e=>{if(['newCard','lostCard','tempCard','applicationType'].includes(e.target.name)){model.cardNumber='';model.synced=false;model.assignee='';model.nodeOpinion='';model.executorOpinion='';model.elevatorCard='';model.elevatorOpinion='';model.bohuaFeePaid=false;model.liyuanFeePaid=false;model.terminal='';model.events=[];updateReceipt();updateStage()}if(e.target.name==='receiptPlace'){updateReceipt();$('#receiptError').hidden=true;$('#receiptFields').classList.remove('invalid')}if(e.target.id==='syncedSecurities'){nodeDraft();$('#syncError').textContent=model.synced?'':'请确认“已同步证券 - 是”'}});
$('#application').addEventListener('change',e=>{if(['bohuaFeePaid','liyuanFeePaid'].includes(e.target.id))model[e.target.id]=e.target.checked;if(e.target.id==='elevatorCardSelect'){model.elevatorCard=e.target.value;$('#elevatorCardError').textContent=''}});
$('#application').addEventListener('click',e=>{if(e.target.closest('#elevatorSystemLink')){e.preventDefault();app.showModal('电梯卡管理系统',`<p style="color:#999">本地演示卡片列表</p><table class="file-table"><thead><tr><th>电梯卡</th><th>状态</th></tr></thead><tbody>${elevatorCards.map(card=>`<tr><td>${esc(card.label)}</td><td>${model.elevatorCard===card.value?'本次已选择':'可分配'}</td></tr>`).join('')}</tbody></table>`)}});
$('#application').addEventListener('input',e=>{if(e.target.id==='mealCardNumber'){model.cardNumber=e.target.value;$('#cardNumberError').textContent='';e.target.classList.remove('bad')}if(e.target.id==='nodeOpinion')model.nodeOpinion=e.target.value;if(e.target.name==='receiptOther'){$('#receiptError').hidden=true;$('#receiptFields').classList.remove('invalid')}});
$('#modal').addEventListener('transitionend',()=>{if(!$('#modal').classList.contains('open'))$('#modal').classList.remove('approval-modal')});
// Reset submission styling whenever another dialog opens.
const observer=new MutationObserver(()=>{if(!$('#modal').classList.contains('open')&&$('#modal').classList.contains('approval-modal'))$('#modal').classList.remove('approval-modal')});observer.observe($('#modal'),{attributes:true,attributeFilter:['class']});
$('#saveFlow').onclick=()=>{nodeDraft();app.saveDraft();const payload={version:2,type:app.state.type,drafts:app.state.drafts,model,priority:$('.segmented .active')?.textContent||'一般'};try{localStorage.setItem(storageKey,JSON.stringify(payload));app.toast('表单与节点已保存至本机；附件刷新后需重新选择')}catch{app.toast('浏览器未允许本地保存，当前填写内容仍保留在页面中')}};
$('#voidFlow').onclick=()=>{app.showModal('作废申请','<p>确认作废本次演示申请？</p><div class="approval-footer"><button class="confirm-button" id="confirmVoid" type="button">确认作废</button></div>');$('#confirmVoid').onclick=()=>{nodeDraft();log('作废',`【${names[model.stage]}】作废申请`);model.terminal='void';app.closeModal();updateStage();app.toast('本次演示申请已作废')}};
$('#restartDemo').onclick=()=>{app.showModal('重新演示','<p>清空本次演示的表单、节点记录与本机保存的草稿，回到新员工入职场景。</p><button class="confirm-button" id="confirmRestart" type="button">确认重新演示</button>');$('#confirmRestart').onclick=()=>{try{localStorage.removeItem(storageKey)}catch{}for(const lists of Object.values(app.state.files))for(const entry of lists)URL.revokeObjectURL(entry.url);app.state.drafts={};app.state.files={new:[],temp:[],lost:[]};Object.assign(model,{stage:'applicant',terminal:'',assignee:'',cardNumber:'',synced:false,nodeOpinion:'',executorOpinion:'',elevatorCard:'',elevatorOpinion:'',bohuaFeePaid:false,liyuanFeePaid:false,events:[]});$('[name=applicationType][value=new]').checked=true;app.render('new');app.closeModal();$('.segmented button').click();$('#mainScroll').scrollTop=0;app.toast('已回到新员工入职场景')}};
$('#reportError').onclick=()=>{app.showModal('错误报告','<label class="field"><span>问题描述</span><textarea id="errorDescription" placeholder="请描述遇到的问题" rows="4" style="border:1px solid #ddd;padding:10px;border-radius:4px"></textarea></label><button class="confirm-button" id="copyReport" type="button" style="margin-top:20px">生成本地问题记录</button>');$('#copyReport').onclick=()=>{const description=$('#errorDescription').value.trim();if(!description){app.toast('请先填写问题描述');return}const blob=new Blob([`工卡/电梯卡/人像卡申请原型\n节点：${names[model.stage]}\n申请类型：${$('[name=applicationType]:checked').parentElement.textContent}\n问题描述：${description}`],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='原型问题记录.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);app.closeModal();app.toast('问题记录已生成')}};
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved?.version===2&&['new','lost','temp','special'].includes(saved.type)){app.state.drafts=saved.drafts||{};const savedModel=saved.model||{};if(['applicant','executor','desktop','elevator'].includes(savedModel.stage))Object.assign(model,savedModel);$(`[name=applicationType][value="${saved.type}"]`).checked=true;app.render(saved.type);$$('.segmented button').forEach(b=>{b.classList.toggle('active',b.textContent===saved.priority);b.setAttribute('aria-pressed',String(b.textContent===saved.priority))});}}catch{}
updateReceipt();updateStage();
})();
</script>
</body>
</html>
