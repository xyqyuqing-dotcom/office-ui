function calcPage(){savedCostResults=readCostResults();$('#content').innerHTML='<section class="card filters"><div class="calcfilters">'+field('开始日期','cfrom','date','2026-11-01')+field('结束日期','cto','date','2026-11-30')+select('所属部门','cdept',departments().concat('未分配部门'))+'<div class="field"><label>展示方式</label><div class="segment"><button class="on" id="summary">汇总</button><button id="daily">按天</button></div></div><div class="actions cost-query-actions"><button class="btn primary" id="calculate">查询</button><button class="btn" id="recalculate" title="按最新数据重新计算所选日期内全部部门的分摊结果">重新计算</button></div></div></section><div class="info cost-explanation">ⓘ　查询只读取已生成结果；历史座位、系数或租金调整后，点击“重新计算”更新所选日期内全部部门的结果。<br>月租按自然日拆分，工位按有效日期及系数加权分摊；无部门费用单列“未分配部门”。</div><div id="coststatus" role="status"></div><div id="results"></div>';$('#calculate').onclick=runCalc;$('#recalculate').onclick=recalculateCost;$('#summary').onclick=()=>{displayMode='summary';$('#summary').classList.add('on');$('#daily').classList.remove('on');renderResults()};$('#daily').onclick=()=>{displayMode='daily';$('#daily').classList.add('on');$('#summary').classList.remove('on');renderResults()};$('#cdept').onchange=()=>{if(result)renderResults()};['cfrom','cto'].forEach(id=>$('#'+id).onchange=pendingCostQuery);if(!savedCostResults.initialized){try{saveCostRange('2026-11-01','2026-11-30')}catch(e){setCostStatus('error','尚无结果',e.message);$('#results').innerHTML='<section class="card nodata">补齐参数后，点击“重新计算”生成结果。</section>';return}}runCalc()}
function runCalc(){try{const {from,to}=costDateRange();savedCostResults=readCostResults();const missing=[];for(let day=from;day<=to;day=nextDay(day))if(!savedCostResults.days[day])missing.push(day);if(missing.length){result=null;setCostStatus('warning','尚未生成','所选日期中有 '+missing.length+' 天没有分摊结果，请点击“重新计算”生成。');$('#results').innerHTML='<section class="card nodata">未生成日期：'+missing[0]+(missing.length>1?' 至 '+missing.at(-1):'')+'。查询不会自动计算。</section>';return}let details=[],total=0,basisByDay={};for(let day=from;day<=to;day=nextDay(day)){const row=savedCostResults.days[day];details.push(...row.details);total+=row.total;basisByDay[day]=row.basis}result={from,to,details,total,basisByDay,staleDates:[]};renderResults()}catch(e){result=null;setCostStatus('error','查询未完成',e.message);$('#results').innerHTML='<section class="card nodata">请检查查询条件。</section>'}}
function assessCostResult(){if(!result)return;result.staleDates=[];for(let day=result.from;day<=result.to;day=nextDay(day))if(result.basisByDay[day]!==costDayBasis(day))result.staleDates.push(day)}
function renderResults(){if(!result)return;assessCostResult();drawCostResultTable();if(result.staleDates.length){setCostStatus('warning','待重算','所选区间有 '+result.staleDates.length+' 天的基础数据已调整。当前展示上次计算结果，请点击“重新计算”更新。');$('#recalculate')?.classList.add('needs-recalculation');if($('#exportResult'))$('#exportResult').title='导出上次已生成结果，文件名将标注“待重算”'}else{setCostStatus('good','已生成结果','当前结果与所选日期的座位、系数及租金一致。更换查询日期不会重新计算。');$('#recalculate')?.classList.remove('needs-recalculation')}}
function recalculateCost(){let range;try{range=costDateRange()}catch(e){setCostStatus('error','无法重新计算',e.message);return}const button=$('#recalculate');button.disabled=true;button.textContent='计算中…';setTimeout(()=>{try{saveCostRange(range.from,range.to);runCalc();toast('已重新计算 '+range.from+' 至 '+range.to+' 的全部部门结果')}catch(e){setCostStatus('error','重算未完成',e.message+'；原有结果保留。')}finally{button.disabled=false;button.textContent='重新计算'}},0)}
function refreshCostSource(){if(PAGE!==2||!$('#coststatus'))return;try{const text=localStorage.getItem(KEY);if(text&&text!==lastSaved){data=JSON.parse(text);lastSaved=text;reviewSourceToken=text;const old=$('#cdept').value,choices=[...new Set([...departments(),...(result?.details.map(r=>r.dept)||[]),'未分配部门'])];$('#cdept').innerHTML=options(choices,old);enhanceSelects();if(result)renderResults()}}catch(e){setCostStatus('error','数据读取未完成','请刷新页面重试。')}}
window.addEventListener('focus',refreshCostSource);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCostSource()});window.addEventListener('storage',e=>{if(PAGE!==2)return;if(e.key===KEY)refreshCostSource();else if(e.key===COST_RESULTS_KEY&&$('#coststatus')){savedCostResults=readCostResults();if(result)runCalc()}});


function deleteParameterRecord(record,coeff){if(!record)return;const list=coeff?data.coeff:data.rent,matching=list.filter(r=>(!coeff||r.type===record.type)&&r.id!==record.id),previous=matching.filter(r=>r.start<record.start).sort((a,b)=>b.start.localeCompare(a.start))[0],next=matching.filter(r=>r.start>record.start).sort((a,b)=>a.start.localeCompare(b.start))[0],value=r=>coeff?Number(r.value).toFixed(2):money(r.value),range=coeff?record.start+'（包含）至 '+(next?next.start+'（不包含）':'后续新记录生效前'):record.start+' 起，'+(next?'至 '+next.start+' 前':'持续至下一条记录生效'),fallback=previous?'删除后，此区间将继续沿用 '+previous.start+' 起的'+(coeff?'系数 '+value(previous):'月度租赁成本 '+value(previous))+'。':'删除后，该区间将'+(coeff?'缺少此工位类型的有效系数':'缺少有效的月度租赁成本')+'。';const title=coeff?'删除工位类型系数':'删除月度租赁成本';
modal(title,'<div class="parameter-delete-summary"><span>本次删除</span><strong>'+esc(coeff?record.type+' · 系数 '+value(record):record.start+' · '+value(record)+'/月')+'</strong><span>影响'+(coeff?'日期':'月份')+'</span><strong>'+esc(range)+'</strong></div><div class="info '+(previous?'':'orangebox')+' parameter-delete-effect">'+esc(fallback)+(previous?'':' 可以继续删除；补齐参数前，相关日期暂时无法重新计算。')+'</div><p class="parameter-delete-note">已生成报表不会自动改写。受影响日期将标记“待重算”，点击“重新计算”后更新。</p>',()=>{const active=coeff?data.coeff:data.rent;if(!active.some(r=>r.id===record.id))throw Error('记录已变更，请刷新后重试');const deletion={action:'delete',kind:coeff?'coefficient':'rent',record:{...record},affectedFrom:coeff?record.start:record.start+'-01',affectedTo:next?(coeff?next.start:next.start+'-01'):null,fallback:previous?{...previous}:null,deletedAt:new Date().toISOString()};data.parameterDeletionLog=data.parameterDeletionLog||[];data.parameterDeletionLog.push(deletion);if(coeff)data.coeff=active.filter(r=>r.id!==record.id);else data.rent=active.filter(r=>r.id!==record.id);save();renderParams();toast('已删除，受影响的分摊结果待重新计算')},'确认删除')}


let reviewSourceToken=localStorage.getItem(KEY);
if(!data.reviewDemoPeopleVersion){const fixes=[['r20','陈晨','杨帆','综合管理部','部门负责人办公室'],['r21','李欣','程明','人力资源部','L型'],['r22','王悦','胡悦','财务部','一字型']];for(const[id,oldName,name,dept,type]of fixes){const row=data.records.find(r=>r.id===id);if(row&&row.name===oldName&&row.dept===dept&&row.type===type&&row.start==='2026-01-01'&&!row.end&&row.floor==='39楼'&&row.location==='博华广场'){row.name=name;if(!data.directory.some(p=>p.name===name))data.directory.push({id:'DEMO-'+id,name,dept,nature:'正式员工'})}}data.reviewDemoPeopleVersion=1}
function personNewEnd(previous,start,showPrev){const future=data.records.filter(r=>!r.deleted&&r.seat===previous.seat&&r.id!==previous.id&&r.start>start).sort((a,b)=>a.start.localeCompare(b.start))[0];let end=future?.start||'';if(!showPrev&&previous.end&&previous.end>start&&(!end||previous.end<end))end=previous.end;return end}
function assertOnePersonOneSeat(record,excludeId=null){if(!record.name)return;const conflict=data.records.find(r=>{if(r.deleted||r.id===excludeId||r.seat===record.seat||r.name!==record.name)return false;const retired=data.retired.find(x=>x.seat===r.seat)?.date,end=retired&&retired<(r.end||'9999')?retired:r.end||'9999';return r.start<end&&r.start<(record.end||'9999')&&end>record.start});if(conflict)throw Error('人员“'+record.name+'”在座位 '+conflict.seat+' 的使用日期与本次重叠，请先结束原座位记录')}
function timelineIssues(from,to){const bySeat=new Map(),issues=[];for(const r of data.records){if(r.deleted)continue;const retired=data.retired.find(x=>x.seat===r.seat)?.date,start=r.start>from?r.start:from,end=[r.end||'9999',retired||'9999',to].sort()[0];if(start>=end)continue;if(!bySeat.has(r.seat))bySeat.set(r.seat,[]);bySeat.get(r.seat).push({start,end})}for(const[seat,rows]of bySeat){rows.sort((a,b)=>a.start.localeCompare(b.start));let end='';for(const row of rows){if(row.start<end){issues.push(seat+'@'+row.start);break}if(row.end>end)end=row.end}}return issues.sort()}
function personTimelineIssues(from,to){const people=new Map(),issues=[];for(const r of data.records){if(r.deleted||!r.name)continue;const retired=data.retired.find(x=>x.seat===r.seat)?.date,start=r.start>from?r.start:from,end=[r.end||'9999',retired||'9999',to].sort()[0];if(start>=end)continue;if(!people.has(r.name))people.set(r.name,[]);people.get(r.name).push({seat:r.seat,start,end})}for(const[name,rows]of people){rows.sort((a,b)=>a.start.localeCompare(b.start));for(let i=0;i<rows.length;i++)for(let j=i+1;j<rows.length&&rows[j].start<rows[i].end;j++)if(rows[i].seat!==rows[j].seat)issues.push({name,date:rows[j].start,seats:[rows[i].seat,rows[j].seat].sort()})}return issues}
function allocate(from,to){if(from&&to&&to>=from){const issues=timelineIssues(from,nextDay(to));if(issues.length)throw Error('座位 '+issues[0].split('@')[0]+' 存在重叠使用日期，请先在台账中核对，原分摊结果保留');const people=personTimelineIssues(from,nextDay(to));if(people.length)throw Error('人员“'+people[0].name+'”在多个座位上的使用日期重叠，请先在台账中核对，原分摊结果保留')}return computeSeatAllocation(from,to)}
