<style>

function chooseCandidate(id){if(!currentCandidates.some(person=>person.id===id))return;rememberReading();currentCandidateId=id;activeRotationDetail=null;renderSession();if(toolOpen&&!toolPinned)setToolOpen(false);}
function moveCandidate(direction){const index=currentCandidates.findIndex(person=>person.id===currentCandidateId);const target=currentCandidates[index+direction];if(target)chooseCandidate(target.id);}
function setToolTab(tab){toolTab=tab;$('peopleTools').hidden=tab!=='people';$('settingsTools').hidden=tab!=='settings';document.querySelectorAll('[data-tool-tab]').forEach(button=>{const active=button.dataset.toolTab===tab;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active));button.tabIndex=active?0:-1;});}
function syncToolPin(){const button=$('pinTools'),label=toolPinned?'取消固定人员栏':'固定人员栏';button.classList.toggle('on',toolPinned);button.setAttribute('aria-pressed',String(toolPinned));button.setAttribute('aria-label',label);button.title=label;}
function setToolOpen(open,tab=toolTab){toolOpen=open;if(!open)toolPinned=false;$('toolPanel').hidden=!open;$('workbenchShell').classList.toggle('pinned',open&&toolPinned);syncToolPin();$('toolOrb').setAttribute('aria-expanded',String(open));$('toolOrb').setAttribute('aria-label',open?'收起面试工具':'展开面试工具');setToolTab(tab);}
function resetResultsMode(){resultsMode=false;$('viewResults').setAttribute('aria-pressed','false');$('resultsLabel').textContent='查看结果';$('viewResults').setAttribute('aria-label','查看结果');$('viewResults').title='查看结果';$('resultModeHint').hidden=true;}
function changeContext(date,interviewer){rememberReading();$('interviewDate').value=date;$('interviewerSelect').value=interviewer;lastDate=date;lastInterviewer=interviewer;resetResultsMode();activeRotationDetail=null;renderSession();}
async function toggleFullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{showToast('当前浏览器无法进入全屏');}}
let lastDate=today,lastInterviewer=loggedInUser;
function init(){const interviewers=[...new Set(Object.values(sessionData).flatMap(list=>list.flatMap(person=>person.interviewers)))];$('interviewerSelect').innerHTML=interviewers.map(name=>`<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');$('interviewerSelect').value=loggedInUser;$('interviewDate').value=today;$('quickDates').innerHTML=`<button type="button" data-date="${today}">今天</button><button type="button" data-date="2026-09-28">2026-09-28</button><button type="button" data-date="2026-09-29">2026-09-29</button>`;$('readerGrades').innerHTML=gradeOptions.map(grade=>`<button class="grade-btn" type="button" data-reader-grade="${grade}" aria-pressed="false">${grade}</button>`).join('');readerCollapsed=matchMedia('(max-width:820px) and (orientation:portrait),(max-width:640px)').matches;renderSession();}
document.querySelectorAll('[data-reader-tab]').forEach(button=>button.addEventListener('click',()=>changeTab(button.dataset.readerTab)));
$('readerPrevious').addEventListener('click',()=>moveCandidate(-1));$('readerNext').addEventListener('click',()=>moveCandidate(1));$('readerCriteria').addEventListener('click',()=>changeTab('criteria'));$('readerToggle').addEventListener('click',()=>{readerCollapsed=true;syncScore();$('readerExpand').focus();});$('readerExpand').addEventListener('click',()=>{readerCollapsed=false;syncScore();$('readerToggle').focus();setToolOpen(false);});
$('readerGrades').addEventListener('click',event=>{const button=event.target.closest('[data-reader-grade]');if(button)updateRating({grade:ratingFor().grade===button.dataset.readerGrade?'':button.dataset.readerGrade});});$('readerComment').addEventListener('input',event=>updateRating({comment:event.target.value}));$('retrySave').addEventListener('click',()=>{if(persistRatings())showToast('评分与评语已保存');});
$('readerDocument').addEventListener('click',event=>{const resume=event.target.closest('[data-resume]');if(resume){changeTab(resume.dataset.resume);return;}if(event.target.closest('[data-score-report]')){changeTab('report');return;}if(event.target.closest('[data-empty-settings]')){setToolOpen(true,'settings');return;}const detail=event.target.closest('[data-rotation-detail]');if(detail){const person=currentPerson(),index=Number(detail.dataset.rotationDetail);selectRotation(index);return;}const log=event.target.closest('[data-rotation-log-index]');if(log&&activeRotationDetail){rememberReading();activeRotationDetail.logIndex=Number(log.dataset.rotationLogIndex);renderActiveTab();return;}const tab=event.target.closest('[data-rotation-tab]');if(tab&&activeRotationDetail){rememberReading();activeRotationDetail.tab=tab.dataset.rotationTab;renderActiveTab();return;}if(event.target.closest('[data-rotation-comment]')&&activeRotationDetail){const textarea=$('readerDocument').querySelector('.rotation-comment-entry textarea');const text=textarea.value.trim();if(!text){showToast('请输入评论内容');return;}activeRotationDetail.comments.push({text,date:currentDateKey()});rememberReading();renderActiveTab();showToast('评论已发布');}});

$('readerDocument').addEventListener('change',event=>{if(event.target.matches('[data-rotation-department]'))selectRotation(Number(event.target.value));});
$('candidateList').addEventListener('click',event=>{const button=event.target.closest('[data-candidate-id]');if(button)chooseCandidate(button.dataset.candidateId);});$('candidateSearch').addEventListener('input',renderPeople);
$('toolOrb').addEventListener('click',event=>{if(orbDragged){event.preventDefault();orbDragged=false;return;}setToolOpen(!toolOpen);});$('closeTools').addEventListener('click',()=>{setToolOpen(false);$('toolOrb').focus();});$('pinTools').addEventListener('click',()=>{toolPinned=!toolPinned;setToolOpen(true);});$('contextButton').addEventListener('click',()=>{setToolOpen(true,'settings');$('interviewerSelect').focus();});document.querySelectorAll('[data-tool-tab]').forEach(button=>button.addEventListener('click',()=>setToolTab(button.dataset.toolTab)));
$('interviewDate').addEventListener('change',()=>{const date=$('interviewDate').value;if(!date){$('interviewDate').value=lastDate;showToast('请选择面试时间');return;}$('interviewDate').value=lastDate;changeContext(date,lastInterviewer);});$('interviewerSelect').addEventListener('change',()=>{const interviewer=$('interviewerSelect').value;$('interviewerSelect').value=lastInterviewer;changeContext(lastDate,interviewer);});$('quickDates').addEventListener('click',event=>{const button=event.target.closest('[data-date]');if(button)changeContext(button.dataset.date,lastInterviewer);});$('resetDefaults').addEventListener('click',()=>changeContext(today,loggedInUser));
$('viewResults').addEventListener('click',()=>{resultsMode=!resultsMode;$('viewResults').setAttribute('aria-pressed',String(resultsMode));$('resultsLabel').textContent=resultsMode?'我的评分':'查看结果';$('viewResults').setAttribute('aria-label',$('resultsLabel').textContent);$('viewResults').title=$('resultsLabel').textContent;$('resultModeHint').hidden=!resultsMode;setToolOpen(true,'people');renderPeople();});$('fullscreenBtn').addEventListener('click',toggleFullscreen);document.addEventListener('fullscreenchange',()=>{const label=document.fullscreenElement?'退出全屏':'全屏';$('fullscreenLabel').textContent=label;$('fullscreenBtn').setAttribute('aria-label',label);$('fullscreenBtn').title=label;});
document.addEventListener('pointerdown',event=>{if(toolOpen&&!toolPinned&&!event.target.closest('#toolPanel,.tool-orb-wrap,#contextButton'))setToolOpen(false);});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&toolOpen){setToolOpen(false);$('toolOrb').focus();return;}const tab=event.target.closest('[data-reader-tab]');if(tab&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();const tabs=[...document.querySelectorAll('[data-reader-tab]')].filter(button=>!button.hidden);const index=tabs.indexOf(tab);const next=tabs[(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];changeTab(next.dataset.readerTab);next.focus();}if(event.altKey&&['ArrowLeft','ArrowRight'].includes(event.key)&&!event.target.matches('input,textarea,select')){event.preventDefault();moveCandidate(event.key==='ArrowRight'?1:-1);}});window.addEventListener('resize',syncScore);
let orbUserPosition=false,orbDragged=false,orbDragStart=null;
function workbenchBounds(){const node=$('workbenchShell'),rect=node.getBoundingClientRect();const scale=rect.width/(parseFloat(getComputedStyle(node).width)||node.offsetWidth)||1;return {left:rect.left,top:rect.top,width:rect.width/scale,height:rect.height/scale,scale};}
function positionOrb(){
  const wrap=document.querySelector('.tool-orb-wrap'),root=workbenchBounds();
  if(orbUserPosition){const bounds=wrap.getBoundingClientRect();wrap.style.left=Math.max(6,Math.min(root.width-bounds.width/root.scale-6,(bounds.left-root.left)/root.scale))+'px';wrap.style.top=Math.max(6,Math.min(root.height-bounds.height/root.scale-6,(bounds.top-root.top)/root.scale))+'px';return;}
  const mobile=matchMedia('(max-width:820px) and (orientation:portrait),(max-width:640px)').matches;wrap.style.left='12px';if(mobile&&!readerCollapsed){const score=$('readerScore').getBoundingClientRect();wrap.style.top=Math.max(6,(score.top-root.top)/root.scale-wrap.offsetHeight-12)+'px';wrap.style.bottom='auto';}else{wrap.style.top='auto';wrap.style.bottom='12px';}
}
$('toolOrb').addEventListener('pointerdown',event=>{if(event.button!==0)return;const wrap=document.querySelector('.tool-orb-wrap').getBoundingClientRect(),root=workbenchBounds();orbDragStart={x:event.clientX,y:event.clientY,left:(wrap.left-root.left)/root.scale,top:(wrap.top-root.top)/root.scale};orbDragged=false;$('toolOrb').setPointerCapture(event.pointerId);});
$('toolOrb').addEventListener('pointermove',event=>{if(!orbDragStart)return;const physicalDx=event.clientX-orbDragStart.x,physicalDy=event.clientY-orbDragStart.y;if(Math.hypot(physicalDx,physicalDy)<5&&!orbDragged)return;orbDragged=true;orbUserPosition=true;const root=workbenchBounds(),wrap=document.querySelector('.tool-orb-wrap');wrap.style.left=Math.max(6,Math.min(root.width-wrap.offsetWidth-6,orbDragStart.left+physicalDx/root.scale))+'px';wrap.style.top=Math.max(6,Math.min(root.height-wrap.offsetHeight-6,orbDragStart.top+physicalDy/root.scale))+'px';wrap.style.bottom='auto';});
$('toolOrb').addEventListener('pointerup',()=>{orbDragStart=null;if(orbDragged)setTimeout(()=>orbDragged=false,0);});$('toolOrb').addEventListener('pointercancel',()=>{orbDragStart=null;orbDragged=false;});

init();
</script>
</body>
