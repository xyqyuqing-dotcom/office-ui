    function syncTransferRecords(){let stored=[];try{stored=JSON.parse(localStorage.getItem('rotation-records-multi-mentor-v1')||'[]')}catch{}if(!Array.isArray(stored))return;const matched=stored.filter(record=>record.name===$('name').value&&!String(record.id).startsWith('draft-'));if(!matched.length)return;let comments={};try{comments=JSON.parse(localStorage.getItem('rotation-log-comments-v2')||'{}')}catch{}

    const transferLogCommentStorageKey='probation-rotation-log-comments-v1';

    function getTransferLogComments(record,log){const key=transferLogCommentKey(record,log);if(Array.isArray(transferLogCommentStore[key]))log.comments=transferLogCommentStore[key];if(!Array.isArray(log.comments))log.comments=[];return log.comments}
    function saveTransferLogComments(record,log){transferLogCommentStore[transferLogCommentKey(record,log)]=log.comments||[];try{localStorage.setItem(transferLogCommentStorageKey,JSON.stringify(transferLogCommentStore))}catch{}}
    function transferTodayDate(){const now=new Date();return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`}

    function appendTransferText(parent,tag,className,text){const node=document.createElement(tag);if(className)node.className=className;node.textContent=text;parent.append(node);return node}
    function renderTransferLog(recordIndex,logIndex){
      const record=transferRecords[recordIndex];const log=record.logs[logIndex];if(!log){$('transferLogNav').replaceChildren();const empty=$('transferLogContent');empty.replaceChildren();appendTransferText(empty,'p','transfer-log-empty','暂无轮岗日志');return}

        const card=document.createElement('article');card.className='transfer-log-comment';
        const byline=document.createElement('div');byline.className='transfer-log-comment-byline';appendTransferText(byline,'strong','',comment.author);const date=appendTransferText(byline,'span','',comment.date);if(comment.edited)appendTransferText(date,'span','transfer-log-comment-edited','已编辑');card.append(byline);
        if(transferEditingMessage&&transferEditingMessage.commentIndex===commentIndex&&transferEditingMessage.replyIndex===null)card.append(createTransferLogEditForm(record,log,commentIndex,null,comment,recordIndex,logIndex));

          if(transferEditingMessage&&transferEditingMessage.commentIndex===commentIndex&&transferEditingMessage.replyIndex===replyIndex)answer.append(createTransferLogEditForm(record,log,commentIndex,replyIndex,reply,recordIndex,logIndex));

          const sendReply=document.createElement('button');sendReply.type='button';sendReply.textContent='发送回复';sendReply.addEventListener('click',()=>{
            const text=replyInput.value.trim();if(!text){replyInput.focus();return}
            const target=getTransferLogComments(record,log)[commentIndex];target.replies=target.replies||[];target.replies.push({author:'当前用户',date:transferTodayDate(),text});log.updatedAt=transferTodayDate();saveTransferLogComments(record,log);transferReplyingToIndex=null;transferEditingMessage=null;renderTransferLog(recordIndex,logIndex);showToast('回复已发表');
          });replyForm.append(replyInput,sendReply);card.append(replyForm);

        comments.append(card);
      });
      comments.append(composer);
      content.append(comments);
    }
    function appendTransferLogMessageActions(parent,record,log,commentIndex,replyIndex,message,allowActions,recordIndex,logIndex){
      if(!allowActions||message.author!=='当前用户')return;
      const actions=document.createElement('div');actions.className='transfer-log-message-actions';
      const edit=document.createElement('button');edit.type='button';edit.textContent='编辑';edit.addEventListener('click',()=>{transferReplyingToIndex=null;transferEditingMessage={commentIndex,replyIndex};renderTransferLog(recordIndex,logIndex)});

      const first=mentor===(record.mentors||[record.mentor])[0],evaluation=record.mentorEvaluations?.[mentor];const source=evaluation?{mentor:evaluation.ratings?.mentor,employee:evaluation.ratings?.employee,mentorComment:evaluation.evaluationNotes?.mentor,employeeComment:evaluation.evaluationNotes?.employee}:first?record.ratings||{}:{};
      let stored=null;if(!record.sourceRecordId){try{stored=JSON.parse(localStorage.getItem(transferEvaluationStoragePrefix+':'+record.department+':'+mentor)||'null');if(!stored&&first)stored=JSON.parse(localStorage.getItem(transferEvaluationStoragePrefix+':'+record.department)||'null')}catch{}}
      const values=stored||source,normalize=list=>Array.from({length:3},(_,index)=>{const value=Number(list?.[index]||0);return Number.isFinite(value)&&value>=0&&value<=5?Math.round(value*2)/2:0});return {mentor:normalize(values.mentor),employee:normalize(values.employee),mentorComment:String(values.mentorComment||''),employeeComment:String(values.employeeComment||'')};
    }
    function setTransferDetailTab(name){
      const showLogs=name==='logs';
      $('transferLogsTab').classList.toggle('active',showLogs);$('transferRatingsTab').classList.toggle('active',!showLogs);
      $('transferLogsTab').setAttribute('aria-selected',String(showLogs));$('transferRatingsTab').setAttribute('aria-selected',String(!showLogs));
      $('transferLogsPane').hidden=!showLogs;$('transferRatingsPane').hidden=showLogs;
    }
    function renderTransferRatings(){const container=$('transferRatingDirections');container.replaceChildren();if(!activeTransferRecord)return;(activeTransferRecord.mentors||[activeTransferRecord.mentor]).forEach((mentor,index)=>{const group=document.createElement('details');group.className='review-mentor-group';group.open=index===0;const head=document.createElement('summary');appendTransferText(head,'strong','',mentor);const body=document.createElement('div');body.className='review-mentor-body';appendTransferRatingCards(body,loadTransferEvaluation(activeTransferRecord,mentor));group.append(head,body);container.append(group)})}
    function appendTransferRatingCards(container,draft){
      const directions=[
        {key:'mentor',title:'老师对员工的评价',dimensions:['专业胜任力','工作积极性','文化认同感']},
        {key:'employee',title:'员工对老师的评价',dimensions:['带教投入','带教方法','带教成效']}
      ];
      directions.forEach(direction=>{
        const values=draft[direction.key]||[];const scores=values.filter(value=>value>0);const average=scores.length?scores.reduce((sum,value)=>sum+value,0)/scores.length:null;
        const card=document.createElement('section');card.className='transfer-rating-card';
        const head=document.createElement('div');head.className='transfer-rating-head';const label=document.createElement('div');
        appendTransferText(label,'strong','transfer-rating-title',direction.title);
        const averageBox=document.createElement('div');averageBox.className='transfer-rating-average';averageBox.append('评价均分 ');appendTransferText(averageBox,'strong','',average==null?'—':average.toFixed(1));averageBox.append(' / 5 分');head.append(label,averageBox);card.append(head);
        const items=document.createElement('div');items.className='transfer-rating-items';
        direction.dimensions.forEach((dimension,index)=>{
          const item=document.createElement('div');item.className='transfer-rating-item';appendTransferText(item,'strong','',dimension);
          const rating=Number(values[index]||0);const stars=document.createElement('span');stars.className='transfer-rating-stars';stars.setAttribute('role','img');stars.setAttribute('aria-label',`${dimension} ${rating.toFixed(1)} 分，共 5 分`);
          for(let starIndex=0;starIndex<5;starIndex+=1){const star=document.createElement('span');star.textContent='★';if(rating>=starIndex+1)star.classList.add('filled');else if(rating>=starIndex+.5)star.classList.add('half');stars.append(star)}
          const value=appendTransferText(item,'span','transfer-rating-value',rating?rating.toFixed(1):'未评');item.append(stars);item.append(value);items.append(item);
        });
        card.append(items);appendTransferText(card,'label','transfer-rating-comment','文字评价');
        const comment=draft[`${direction.key}Comment`]||'';const note=document.createElement('div');note.className=`transfer-rating-note${comment?'':' empty'}`;note.setAttribute('aria-label',`${direction.title}文字评价`);note.textContent=comment||'暂未填写文字评价';card.append(note);container.append(card);
      });
    }
    let activeTransferRecord=null;
    function openTransferDetail(recordIndex,logIndex){
      const record=transferRecords[recordIndex];
      transferReplyingToIndex=null;transferEditingMessage=null;
      activeTransferRecord=record;transferEvaluationDraft=loadTransferEvaluation(record);
      $('transferDetailTitle').textContent=`章岸琪 · ${record.department} 轮岗记录`;
      $('transferDetailName').value='章岸琪';$('transferDetailPosition').value=$('position').value||'新员工';$('transferDetailEntryDepartment').value=$('department').value;
      $('transferDetailDepartment').value=record.department;$('transferDetailMentor').value=(record.mentors||[record.mentor]).join('、');$('transferDetailStart').value=record.start;$('transferDetailEnd').value=record.end;
      renderTransferLog(recordIndex,logIndex);renderTransferRatings();setTransferDetailTab('logs');$('transferDetailBackdrop').hidden=false;
    }
    function closeTransferDetail(){$('transferDetailBackdrop').hidden=true}
    syncTransferRecords();renderTransferRows();
    document.querySelectorAll('[data-close-transfer]').forEach(button=>button.addEventListener('click',closeTransferDetail));
    $('transferLogsTab').addEventListener('click',()=>setTransferDetailTab('logs'));
    $('transferRatingsTab').addEventListener('click',()=>setTransferDetailTab('ratings'));
    $('transferDetailBackdrop').addEventListener('click',event=>{if(event.target===$('transferDetailBackdrop'))closeTransferDetail()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('transferDetailBackdrop').hidden)closeTransferDetail()});
    document.querySelectorAll('[data-order]').forEach(btn=>btn.addEventListener('click',()=>{order=btn.dataset.order;document.querySelectorAll('[data-order]').forEach(b=>{b.classList.toggle('active',b===btn);b.setAttribute('aria-selected',String(b===btn))});renderTimeline()}));
    $('approvalCheck').addEventListener('change',renderTimeline);$('commentCheck').addEventListener('change',()=>showToast($('commentCheck').checked?'已显示评论':'已隐藏评论'));
    $('collapseBtn').addEventListener('click',()=>{const hidden=$('workspace').classList.toggle('hide-process');$('collapseBtn').textContent=hidden?'◀':'▶';$('collapseBtn').setAttribute('aria-label',hidden?'展开流程记录':'收起流程记录')});
    $('summaryBtn').addEventListener('click',()=>{const detail=$('summaryDetail');detail.hidden=!detail.hidden;$('summaryBtn').setAttribute('aria-expanded',String(!detail.hidden))});
    document.querySelectorAll('textarea[maxlength]').forEach(el=>el.addEventListener('input',()=>{document.querySelector(`[data-count="${el.id}"]`).textContent=`${el.value.length} / 950`}));document.querySelectorAll('[data-clear]').forEach(btn=>btn.addEventListener('click',()=>{const el=$(btn.dataset.clear);el.value='';el.dispatchEvent(new Event('input'));el.focus()}));
    const messages={事务中心:'事务中心导航仅作页面展示。',设置:'设置入口仅作页面展示。',首页:'首页入口仅作页面展示。',消息:'消息入口仅作页面展示。',更多操作:'当前流程：章岸琪的转正评价。',附件预览:'附件原文件未提供，这里展示附件名称。',流程图:'起草 → 指导老师填写 → 政委填写 → 指导老师填写 → 管理员确认',更多工具:'更多工具入口仅作页面展示。',错误报告:'可在此反馈页面问题；此原型暂未连接提交服务。'};
    let modalKind='';function openModal(kind){modalKind=kind;$('modalTitle').textContent=kind;$('modalBody').innerHTML=['评论','转交','退回'].includes(kind)?`<textarea id="actionNote" placeholder="请输入${kind}内容"></textarea>`:kind==='同意'?'确认同意当前转正评价流程吗？':messages[kind]||'此操作仅在原型中展示。';$('modalConfirm').textContent=['评论','转交','退回','同意'].includes(kind)?'确认':'关闭';$('modalCancel').hidden=!['评论','转交','退回','同意'].includes(kind);$('modalCover').classList.add('open');if($('actionNote'))$('actionNote').focus()}
    function closeModal(){$('modalCover').classList.remove('open');modalKind=''}
    document.querySelectorAll('[data-modal]').forEach(btn=>btn.addEventListener('click',()=>openModal(btn.dataset.modal)));$('modalClose').addEventListener('click',closeModal);$('modalCancel').addEventListener('click',closeModal);$('modalCover').addEventListener('click',e=>{if(e.target===$('modalCover'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    $('modalConfirm').addEventListener('click',()=>{if(['评论','转交','退回'].includes(modalKind)&&!$('actionNote').value.trim()){showToast(`请输入${modalKind}内容`);return}const kind=modalKind;closeModal();if(['评论','转交','退回','同意'].includes(kind))showToast(`${kind}操作已在原型中演示，未提交到真实系统`)});
    $('downloadBtn').addEventListener('click',()=>showToast('未提供附件原文件，暂无法下载'));
    document.querySelector('[data-action="print"]').addEventListener('click',()=>window.print());
    let toastTimer;function showToast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}

    if(savedMentorRating?.meta?.teacher?.name)$('evaluationGuideTeacher').value=savedMentorRating.meta.teacher.name;
    window.personEvaluationSnapshot=()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem(mentorRatingStorageKey)||'null')}catch{}return {kind:'probation',saved,employee:{name:$('name').value,department:$('department').value,position:$('position').value},date:$('regular-date').value}};
    if(new URLSearchParams(location.search).get('focus')==='mentor')document.querySelector('.assessment').scrollIntoView({block:'start'});
  </script>
