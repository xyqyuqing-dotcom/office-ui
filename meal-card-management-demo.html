<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),key='meal-card-management-demo-v1';
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const watermark=`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="210"><g transform="translate(110 110) rotate(-30)" fill="#ececec" fill-opacity=".65" font-family="Microsoft YaHei,Arial"><text text-anchor="middle" font-size="19">演示数据</text></g></svg>`;
document.documentElement.style.setProperty('--watermark',`url("data:image/svg+xml,${encodeURIComponent(watermark)}")`);
const names=['陈晓','林悦','周明远','沈宁','许知夏','陆晨','王雨桐','赵思源','顾欣','韩子墨','徐嘉宁','宋一帆','叶清','方可欣','程宇','苏念','梁文静','吴泽','唐思齐','郑亦辰','白若溪','何景行','孟舒','秦朗','邵可','温言','马逸飞','罗嘉','田恬','蒋修远','杜晨曦','任星','江澄','潘书宁','袁安','冯羽','邓佳','傅知行','李初','谢怀瑾','陈沐','高远','张书瑶','胡泽宇','刘清和','孙欣然'];
const orgs=[['信息技术部','系统开发岗'],['运营管理部','运营支持岗'],['人力资源部','人才发展岗'],['综合管理部','综合行政岗'],['机构业务部','机构业务岗'],['风险管理部','风险监控岗'],['财务部','财务管理岗'],['研究所','研究分析岗']];
const places=['博华','利园','后援中心','博华','利园','博华','后援中心','其他：南区服务台'];
const seed=names.map((name,i)=>{const [department,position]=orgs[i%orgs.length];const day=29-Math.floor(i/4),hour=9+i%8;return{id:i+1,employee:String(210301+i),department,position,name,card:String(8100000000+i*173+237),location:places[i%places.length],flow:i===0?'a5ne8rgp8':'a5n'+(173219000+i*8917).toString(36).padStart(6,'0'),created:`2026-10-${String(day).padStart(2,'0')} ${String(hour).padStart(2,'0')}:${String((i*7+12)%60).padStart(2,'0')}:08`}});
let rows=seed.map(row=>({...row}));try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(saved)&&saved.length===seed.length&&saved.every((r,i)=>r.id===seed[i].id&&typeof r.card==='string'))rows=seed.map((row,i)=>({...row,card:saved[i].card}));}catch{}
const state={query:{name:'',employee:'',card:''},global:'',page:1,size:20,editId:null};let toastTimer;
const values=row=>[row.employee,row.department,row.position,row.name,row.card,row.location,row.flow,row.created];
function matches(row){const q=state.query;return row.name.toLowerCase().includes(q.name)&&row.employee.toLowerCase().includes(q.employee)&&row.card.toLowerCase().includes(q.card)&&values(row).some(v=>v.toLowerCase().includes(state.global));}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2400);}
function render(){const filtered=rows.filter(matches);const pages=Math.max(1,Math.ceil(filtered.length/state.size));state.page=Math.min(state.page,pages);$('#resultCount').textContent=filtered.length;$('#totalLabel').textContent=`共 ${filtered.length} 条`;$('#pageNumber').textContent=`${state.page} / ${pages}`;$('#prevPage').disabled=state.page===1;$('#nextPage').disabled=state.page>=pages;$('#clearGlobal').hidden=!state.global;const slice=filtered.slice((state.page-1)*state.size,state.page*state.size);$('#tableBody').innerHTML=slice.length?slice.map(row=>`<tr data-id="${row.id}" class="${state.editId===row.id?'editing':''}"><td>${row.employee}</td><td title="${esc(row.department)}">${esc(row.department)}</td><td title="${esc(row.position)}">${esc(row.position)}</td><td>${esc(row.name)}</td><td>${esc(row.card)}</td><td title="${esc(row.location)}">${esc(row.location)}</td><td><a class="flow-link" href="#flow-${esc(row.flow)}" data-flow="${row.id}">${esc(row.flow)}</a></td><td>${row.created}</td><td><button class="row-button" type="button" data-edit="${row.id}" aria-label="编辑${esc(row.name)}">编辑</button></td></tr>`).join(''):'<tr class="empty-row"><td colspan="9">暂无符合条件的数据</td></tr>';$('#tableScroll').scrollTop=0;}
function guarded(action){action();}
function beginEdit(id){const row=rows.find(r=>r.id===id);if(!row)return;state.editId=id;openModal(`<h2 id="modalTitle">修改餐饮积点卡卡号</h2><dl class="detail-grid edit-context"><div><dt>工号</dt><dd>${esc(row.employee)}</dd></div><div><dt>姓名</dt><dd>${esc(row.name)}</dd></div><div><dt>部门</dt><dd>${esc(row.department)}</dd></div><div><dt>收卡地点</dt><dd>${esc(row.location)}</dd></div></dl><form id="editCardForm" novalidate><label class="edit-card-label" for="editCard"><span>*</span>餐饮积点卡卡号</label><input class="cell-editor" id="editCard" aria-label="餐饮积点卡卡号" value="${esc(row.card)}" autocomplete="off" required><div class="inline-error" id="cardError" role="alert"></div><div class="edit-buttons"><button class="dialog-button" type="button" id="cancelEdit">取消</button><button class="dialog-button primary" type="submit">保存</button></div></form>`,'edit-card-dialog');$('#editCardForm').onsubmit=e=>{e.preventDefault();saveEdit()};$('#cancelEdit').onclick=closeModal;$('#editCard').oninput=()=>$('#cardError').textContent='';$('#editCard').focus();}
function saveEdit(){const card=$('#editCard')?.value.trim();if(!card){$('#cardError').textContent='请填写卡号';$('#editCard').focus();return}const row=rows.find(r=>r.id===state.editId);if(!row)return;row.card=card;let persisted=true;try{localStorage.setItem(key,JSON.stringify(rows.map(r=>({id:r.id,card:r.card}))));}catch{persisted=false}closeModal();render();toast(persisted?'修改已保存':'修改已在当前页面保留；浏览器未允许本机保存');}
function openModal(html,extra=''){$('#modalContent').innerHTML=html;$('#modal').className='modal open'+(extra?' '+extra:'');$('#closeModal').focus();}function closeModal(){$('#modal').className='modal';state.editId=null;}
function showFlow(id){const row=rows.find(r=>r.id===id);openModal(`<h2 id="modalTitle">工卡/电梯卡/人像卡申请</h2><div class="flow-id">流程编号：${esc(row.flow)}</div><dl class="detail-grid">${[['工号',row.employee],['姓名',row.name],['部门',row.department],['岗位',row.position],['餐饮积点卡卡号',row.card],['收卡地点',row.location],['创建时间',row.created],['申请类型','新员工入职（演示）']].map(([label,value])=>`<div><dt>${label}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl><div class="modal-note">此处展示该条演示记录关联的流程信息。</div><a class="open-form" target="_blank" rel="noopener" href="employee-card-application-demo.html?flow=${encodeURIComponent(row.flow)}">打开申请流程原型 ↗</a>`);}
$('#tableBody').onclick=e=>{const edit=e.target.closest('[data-edit]'),flow=e.target.closest('[data-flow]');if(edit)beginEdit(Number(edit.dataset.edit));if(flow){e.preventDefault();showFlow(Number(flow.dataset.flow));}};
$('#filters').onsubmit=e=>{e.preventDefault();guarded(()=>{state.query={name:$('#nameFilter').value.trim().toLowerCase(),employee:$('#employeeFilter').value.trim().toLowerCase(),card:$('#cardFilter').value.trim().toLowerCase()};state.page=1;render()})};
$('#resetFilters').onclick=()=>guarded(()=>{$('#filters').reset();$('#globalSearch').value='';state.query={name:'',employee:'',card:''};state.global='';state.page=1;render()});
$('#globalSearch').oninput=()=>{const query=$('#globalSearch').value.trim().toLowerCase();guarded(()=>{state.global=query;state.page=1;render()})};$('#clearGlobal').onclick=()=>guarded(()=>{$('#globalSearch').value='';state.global='';state.page=1;render()});
$('#pageSize').onchange=()=>guarded(()=>{state.size=Number($('#pageSize').value);state.page=1;render()});$('#prevPage').onclick=()=>guarded(()=>{state.page=Math.max(1,state.page-1);render()});$('#nextPage').onclick=()=>guarded(()=>{state.page++;render()});
$('#collapseFilters').onclick=()=>{const collapsed=$('#filterPanel').classList.toggle('collapsed');$('#collapseFilters').textContent=collapsed?'⌄':'⌃';$('#collapseFilters').setAttribute('aria-expanded',String(!collapsed));$('#collapseFilters').setAttribute('aria-label',collapsed?'展开筛选':'收起筛选')};
$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
})();
</script>
</body>
</html>
